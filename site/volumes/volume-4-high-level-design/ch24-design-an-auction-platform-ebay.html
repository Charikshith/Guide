"&gt;fan-out&lt;/text&gt;\n      &lt;rect class=\"sk\" x=\"530\" y=\"220\" width=\"120\" height=\"46\" rx=\"12\"/&gt;\n      &lt;text class=\"lbl b\" x=\"590\" y=\"249\" text-anchor=\"middle\"&gt;watchers&lt;/text&gt;\n      &lt;rect class=\"sk\" x=\"390\" y=\"215\" width=\"105\" height=\"46\" rx=\"12\"/&gt;\n      &lt;text class=\"lbl b\" x=\"442\" y=\"244\" text-anchor=\"middle\"&gt;scheduler&lt;/text&gt;\n      &lt;path class=\"sk blue\" d=\"M105 128 L 128 128\" style=\"color:var(--ink)\" marker-end=\"url(#arr)\"/&gt;\n      &lt;path class=\"sk blue\" d=\"M235 128 L 260 128\" style=\"color:var(--ink)\" marker-end=\"url(#arr)\"/&gt;\n      &lt;path class=\"sk blue\" d=\"M362 128 L 388 128\" style=\"color:var(--ink)\" marker-end=\"url(#arr)\"/&gt;\n      &lt;path class=\"sk green\" d=\"M495 112 C 510 90, 515 60, 528 40\" style=\"color:var(--green)\" marker-end=\"url(#arr)\"/&gt;\n      &lt;path class=\"sk green\" d=\"M495 124 C 508 118, 515 110, 528 106\" style=\"color:var(--green)\" marker-end=\"url(#arr)\"/&gt;\n      &lt;path class=\"sk green\" d=\"M590 126 L 590 148\" style=\"color:var(--green)\" marker-end=\"url(#arr)\"/&gt;\n      &lt;path class=\"sk green\" d=\"M590 196 L 590 218\" style=\"color:var(--green)\" marker-end=\"url(#arr)\"/&gt;\n      &lt;path class=\"sk red\" d=\"M442 215 L 442 158\" style=\"color:var(--red)\" marker-end=\"url(#arr)\"/&gt;\n      &lt;text class=\"lbl r\" x=\"458\" y=\"195\" style=\"font-size:13px\"&gt;close&lt;/text&gt;\n    &lt;/svg&gt;\n    &lt;figcaption&gt;Fig 1: one owner per auction orders bids; watchers are served by a separate fan-out tier.&lt;/figcaption&gt;\n  &lt;/figure&gt;", "&lt;figure&gt;\n    &lt;svg viewBox=\"0 0 660 320\" role=\"img\" aria-label=\"Two bids at once: Ann and Bob both read version 1; Bob writes if version is 1 and succeeds making version 2; Ann's write if version 1 is refused; Ann re-reads version 2, recomputes and writes if version is 2, making version 3.\"&gt;\n      &lt;rect class=\"sk\" x=\"15\" y=\"10\" width=\"130\" height=\"40\" rx=\"10\"/&gt;\n      &lt;text class=\"lbl b\" x=\"80\" y=\"36\" text-anchor=\"middle\"&gt;Ann (max 50)&lt;/text&gt;\n      &lt;rect class=\"sk\" x=\"265\" y=\"10\" width=\"130\" height=\"40\" rx=\"10\"/&gt;\n      &lt;text class=\"lbl b\" x=\"330\" y=\"36\" text-anchor=\"middle\"&gt;State&lt;/text&gt;\n      &lt;rect class=\"sk\" x=\"515\" y=\"10\" width=\"130\" height=\"40\" rx=\"10\"/&gt;\n      &lt;text class=\"lbl b\" x=\"580\" y=\"36\" text-anchor=\"middle\"&gt;Bob (max 90)&lt;/text&gt;\n      &lt;path class=\"sk\" d=\"M80 52 L 80 315\" style=\"color:var(--ink);stroke-dasharray:5 6\"/&gt;\n      &lt;path class=\"sk\" d=\"M330 52 L 330 315\" style=\"color:var(--ink);stroke-dasharray:5 6\"/&gt;\n      &lt;path class=\"sk\" d=\"M580 52 L 580 315\" style=\"color:var(--ink);stroke-dasharray:5 6\"/&gt;\n      &lt;path class=\"sk blue\" d=\"M84 88 L 326 88\" style=\"color:var(--ink)\" marker-end=\"url(#arr)\"/&gt;\n      &lt;text class=\"lbl\" x=\"205\" y=\"80\" text-anchor=\"middle\" style=\"font-size:14px\"&gt;read (v1)&lt;/text&gt;\n      &lt;path class=\"sk blue\" d=\"M576 116 L 334 116\" style=\"color:var(--ink)\" marker-end=\"url(#arr)\"/&gt;\n      &lt;text class=\"lbl\" x=\"455\" y=\"108\" text-anchor=\"middle\" style=\"font-size:14px\"&gt;read (v1)&lt;/text&gt;\n      &lt;path class=\"sk blue\" d=\"M576 146 L 334 146\" style=\"color:var(--ink)\" marker-end=\"url(#arr)\"/&gt;\n      &lt;text class=\"lbl r\" x=\"455\" y=\"138\" text-anchor=\"middle\" style=\"font-size:14px\"&gt;write if v = 1&lt;/text&gt;\n      &lt;path class=\"sk green\" d=\"M334 174 L 576 174\" style=\"color:var(--green)\" marker-end=\"url(#arr)\"/&gt;\n      &lt;text class=\"lbl g\" x=\"455\" y=\"166\" text-anchor=\"middle\" style=\"font-size:14px\"&gt;ok \u2192 v2 (Bob leads)&lt;/text&gt;\n      &lt;path class=\"sk blue\" d=\"M84 206 L 326 206\" style=\"color:var(--ink)\" marker-end=\"url(#arr)\"/&gt;\n      &lt;text class=\"lbl r\" x=\"205\" y=\"198\" text-anchor=\"middle\" style=\"font-size:14px\"&gt;write if v = 1&lt;/text&gt;\n      &lt;path class=\"sk red\" d=\"M326 234 L 84 234\" style=\"color:var(--red)\" marker-end=\"url(#arr)\"/&gt;\n      &lt;text class=\"lbl r\" x=\"205\" y=\"226\" text-anchor=\"middle\" style=\"font-size:14px\"&gt;refused (v is 2)&lt;/text&gt;\n      &lt;path class=\"sk blue\" d=\"M84 266 L 326 266\" style=\"color:var(--ink)\" marker-end=\"url(#arr)\"/&gt;\n      &lt;text class=\"lbl\" x=\"205\" y=\"258\" text-anchor=\"middle\" style=\"font-size:13px\"&gt;re-read, write if v = 2&lt;/text&gt;\n      &lt;path class=\"sk green\" d=\"M326 294 L 84 294\" style=\"color:var(--green)\" marker-end=\"url(#arr)\"/&gt;\n      &lt;text class=\"lbl g\" x=\"205\" y=\"286\" text-anchor=\"middle\" style=\"font-size:14px\"&gt;ok \u2192 v3&lt;/text&gt;\n    &lt;/svg&gt;\n    &lt;figcaption&gt;Fig 2: the conditional update refuses the stale write; Ann retries on fresh state. Bob's higher bid survives.&lt;/figcaption&gt;\n  &lt;/figure&gt;", null, null]</textarea>
<textarea id="codes" hidden>{"\"\"\"Timed auction with proxy (\"maximum\") bidding, optional soft close, duplicate-safe bids,\noptimistic concurrency, and a closing scheduler. Money is integer cents; time is seconds.\"\"\"\nimport heapq\nimport threading\nfrom dataclasses import dataclass, replace\n\n# eBay's published increment table: from this price (cents) up, the increment (cents) is ...\nINCREMENTS = [(0, 5), (100, 25), (500, 50), (2500, 100), (10000, 250), (25000, 500),\n              (50000, 1000), (100000, 2500), (250000, 5000), (500000, 10000)]\n\n\ndef increment(price):\n    step = INCREMENTS[0][1]\n    for floor, s in INCREMENTS:\n        if price &gt;= floor:\n            step = s\n    return step\n\n\n@dataclass(frozen=True)\nclass Auction:\n    start: int                      # starting price\n    end: int                        # closing time\n    window: int = 0                 # soft close: a bid this close to the end ...\n    extend: int = 0                 # ... moves the end to (bid time + extend), if that is later ...\n    max_ext: int = 0                # ... at most this many times\n    ext_used: int = 0\n    leader: str = None\n    top: int = 0                    # the leader's secret maximum\n    price: int = 0                  # the price everyone sees\n    bids: tuple = ()                # accepted bids: (bid_id, bidder, max, time)\n    seen: frozenset = frozenset()   # every (bidder, bid_id) already handled (accepted or rejected)\n    closed: bool = False\n    version: int = 0                # bumped on every change; used for compare-and-set\n\n\ndef place_bid(a, bidder, mx, now, bid_id):\n    \"\"\"Pure function: (auction, bid) -&gt; (new auction, status). `now` must come from the server's clock.\"\"\"\n    key = (bidder, bid_id)\n    if key in a.seen:\n        return a, \"duplicate\"                              # a retry of a request already handled\n    if a.closed or now &gt;= a.end:\n        return a, \"closed\"\n    seen = a.seen | {key}\n    if a.leader is None:\n        if mx &lt; a.start:\n            return replace(a, seen=seen, version=a.version + 1), \"too_low\"\n        leader, top, price = bidder, mx, a.start\n    elif bidder == a.leader:                               # the leader raises their own maximum\n        if mx &lt;= a.top:\n            return replace(a, seen=seen, version=a.version + 1), \"too_low\"\n        leader, top, price = bidder, mx, a.price\n    elif mx &lt; a.price + increment(a.price):                # must beat the visible price by one increment\n        return replace(a, seen=seen, version=a.version + 1), \"too_low\"\n    elif mx &gt; a.top:                                       # new leader pays one increment over the old maximum\n        leader, top, price = bidder, mx, max(a.price, min(mx, a.top + increment(a.top)))\n    elif mx == a.top:                                      # tie: the earlier bid keeps the lead\n        leader, top, price = a.leader, a.top, a.top\n    else:                                                  # leader stays; price rises toward the challenger's maximum\n        leader, top, price = a.leader, a.top, max(a.price, min(a.top, mx + increment(mx)))\n    end, used = a.end, a.ext_used\n    if (a.extend and bidder != a.leader                   # a leader raising their own maximum never extends\n            and now &gt;= a.end - a.window and used &lt; a.max_ext\n            and now + a.extend &gt; a.end):                   # only count an extension that really moves the end\n        end, used = now + a.extend, used + 1               # soft close (\"reset\" mode: end = bid time + extend)\n    return replace(a, leader=leader, top=top, price=price, end=end, ext_used=used,\n                   bids=a.bids + ((bid_id, bidder, mx, now),), seen=seen, version=a.version + 1), \"ok\"\n\n\nclass Store:\n    \"\"\"Stands in for a database row with a conditional update (compare-and-set on version).\"\"\"\n    def __init__(self, auction):\n        self._a, self._lock = auction, threading.Lock()\n\n    def get(self):\n        return self._a\n\n    def cas(self, expected_version, new):\n        with self._lock:\n            if self._a.version != expected_version:\n                return False\n            self._a = new\n            return True\n\n\ndef bid(store, bidder, mx, now, bid_id, hook=None):\n    \"\"\"`now` is a number (tests) or a function returning the server's clock (production): it is read again\n    on every retry, so a bid that loses a race and retries after the end time is correctly refused.\"\"\"\n    while True:                                            # optimistic concurrency: retry on conflict\n        a = store.get()\n        new, status = place_bid(a, bidder, mx, now() if callable(now) else now, bid_id)\n        if hook:\n            hook()                                         # tests use this to force an interleaving\n        if new is a or store.cas(a.version, new):\n            return status\n\n\nclass Scheduler:\n    \"\"\"Closes auctions when due. Extended auctions are re-queued; closing is idempotent.\"\"\"\n    def __init__(self):\n        self.heap = []\n\n    def schedule(self, end, auction_id):\n        heapq.heappush(self.heap, (end, auction_id))\n\n    def due(self, now, stores):\n        closed = []\n        while self.heap and self.heap[0][0] &lt;= now:\n            _, aid = heapq.heappop(self.heap)\n            while True:\n                a = stores[aid].get()\n                if a.closed:\n                    break\n                if a.end &gt; now:                            # a late bid pushed the end out: look again later\n                    heapq.heappush(self.heap, (a.end, aid))\n                    break\n                if stores[aid].cas(a.version, replace(a, closed=True, version=a.version + 1)):\n                    closed.append(aid)\n                    break\n        return closed": "&lt;span class=\"st\"&gt;\"\"\"Timed auction with proxy (\"maximum\") bidding, optional soft close, duplicate-safe bids,\noptimistic concurrency, and a closing scheduler. Money is integer cents; time is seconds.\"\"\"&lt;/span&gt;\n&lt;span class=\"kw\"&gt;import&lt;/span&gt; heapq\n&lt;span class=\"kw\"&gt;import&lt;/span&gt; threading\n&lt;span class=\"kw\"&gt;from&lt;/span&gt; dataclasses &lt;span class=\"kw\"&gt;import&lt;/span&gt; dataclass, replace\n\n&lt;span class=\"cm\"&gt;# eBay's published increment table: from this price (cents) up, the increment (cents) is ...&lt;/span&gt;\nINCREMENTS = [(&lt;span class=\"nu\"&gt;0&lt;/span&gt;, &lt;span class=\"nu\"&gt;5&lt;/span&gt;), (&lt;span class=\"nu\"&gt;100&lt;/span&gt;, &lt;span class=\"nu\"&gt;25&lt;/span&gt;), (&lt;span class=\"nu\"&gt;500&lt;/span&gt;, &lt;span class=\"nu\"&gt;50&lt;/span&gt;), (&lt;span class=\"nu\"&gt;2500&lt;/span&gt;, &lt;span class=\"nu\"&gt;100&lt;/span&gt;), (&lt;span class=\"nu\"&gt;10000&lt;/span&gt;, &lt;span class=\"nu\"&gt;250&lt;/span&gt;), (&lt;span class=\"nu\"&gt;25000&lt;/span&gt;, &lt;span class=\"nu\"&gt;500&lt;/span&gt;),\n              (&lt;span class=\"nu\"&gt;50000&lt;/span&gt;, &lt;span class=\"nu\"&gt;1000&lt;/span&gt;), (&lt;span class=\"nu\"&gt;100000&lt;/span&gt;, &lt;span class=\"nu\"&gt;2500&lt;/span&gt;), (&lt;span class=\"nu\"&gt;250000&lt;/span&gt;, &lt;span class=\"nu\"&gt;5000&lt;/span&gt;), (&lt;span class=\"nu\"&gt;500000&lt;/span&gt;, &lt;span class=\"nu\"&gt;10000&lt;/span&gt;)]\n\n\n&lt;span class=\"kw\"&gt;def&lt;/span&gt; &lt;span class=\"fn\"&gt;increment&lt;/span&gt;(price):\n    step = INCREMENTS[&lt;span class=\"nu\"&gt;0&lt;/span&gt;][&lt;span class=\"nu\"&gt;1&lt;/span&gt;]\n    &lt;span class=\"kw\"&gt;for&lt;/span&gt; floor, s &lt;span class=\"kw\"&gt;in&lt;/span&gt; INCREMENTS:\n        &lt;span class=\"kw\"&gt;if&lt;/span&gt; price &amp;gt;= floor:\n            step = s\n    &lt;span class=\"kw\"&gt;return&lt;/span&gt; step\n\n\n&lt;span class=\"bi\"&gt;@dataclass&lt;/span&gt;(frozen=&lt;span class=\"kw\"&gt;True&lt;/span&gt;)\n&lt;span class=\"kw\"&gt;class&lt;/span&gt; Auction:\n    start: &lt;span class=\"bi\"&gt;int&lt;/span&gt;                      &lt;span class=\"cm\"&gt;# starting price&lt;/span&gt;\n    end: &lt;span class=\"bi\"&gt;int&lt;/span&gt;                        &lt;span class=\"cm\"&gt;# closing time&lt;/span&gt;\n    window: &lt;span class=\"bi\"&gt;int&lt;/span&gt; = &lt;span class=\"nu\"&gt;0&lt;/span&gt;                 &lt;span class=\"cm\"&gt;# soft close: a bid this close to the end ...&lt;/span&gt;\n    extend: &lt;span class=\"bi\"&gt;int&lt;/span&gt; = &lt;span class=\"nu\"&gt;0&lt;/span&gt;                 &lt;span class=\"cm\"&gt;# ... moves the end to (bid time + extend), if that is later ...&lt;/span&gt;\n    max_ext: &lt;span class=\"bi\"&gt;int&lt;/span&gt; = &lt;span class=\"nu\"&gt;0&lt;/span&gt;                &lt;span class=\"cm\"&gt;# ... at most this many times&lt;/span&gt;\n    ext_used: &lt;span class=\"bi\"&gt;int&lt;/span&gt; = &lt;span class=\"nu\"&gt;0&lt;/span&gt;\n    leader: &lt;span class=\"bi\"&gt;str&lt;/span&gt; = &lt;span class=\"kw\"&gt;None&lt;/span&gt;\n    top: &lt;span class=\"bi\"&gt;int&lt;/span&gt; = &lt;span class=\"nu\"&gt;0&lt;/span&gt;                    &lt;span class=\"cm\"&gt;# the leader's secret maximum&lt;/span&gt;\n    price: &lt;span class=\"bi\"&gt;int&lt;/span&gt; = &lt;span class=\"nu\"&gt;0&lt;/span&gt;                  &lt;span class=\"cm\"&gt;# the price everyone sees&lt;/span&gt;\n    bids: &lt;span class=\"bi\"&gt;tuple&lt;/span&gt; = ()                &lt;span class=\"cm\"&gt;# accepted bids: (bid_id, bidder, max, time)&lt;/span&gt;\n    seen: &lt;span class=\"bi\"&gt;frozenset&lt;/span&gt; = &lt;span class=\"bi\"&gt;frozenset&lt;/span&gt;()   &lt;span class=\"cm\"&gt;# every (bidder, bid_id) already handled (accepted or rejected)&lt;/span&gt;\n    closed: &lt;span class=\"bi\"&gt;bool&lt;/span&gt; = &lt;span class=\"kw\"&gt;False&lt;/span&gt;\n    version: &lt;span class=\"bi\"&gt;int&lt;/span&gt; = &lt;span class=\"nu\"&gt;0&lt;/span&gt;                &lt;span class=\"cm\"&gt;# bumped on every change; used for compare-and-set&lt;/span&gt;\n\n\n&lt;span class=\"kw\"&gt;def&lt;/span&gt; &lt;span class=\"fn\"&gt;place_bid&lt;/span&gt;(a, bidder, mx, now, bid_id):\n    &lt;span class=\"st\"&gt;\"\"\"Pure function: (auction, bid) -&amp;gt; (new auction, status). `now` must come from the server's clock.\"\"\"&lt;/span&gt;\n    key = (bidder, bid_id)\n    &lt;span class=\"kw\"&gt;if&lt;/span&gt; key &lt;span class=\"kw\"&gt;in&lt;/span&gt; a.seen:\n        &lt;span class=\"kw\"&gt;return&lt;/span&gt; a, &lt;span class=\"st\"&gt;\"duplicate\"&lt;/span&gt;                              &lt;span class=\"cm\"&gt;# a retry of a request already handled&lt;/span&gt;\n    &lt;span class=\"kw\"&gt;if&lt;/span&gt; a.closed &lt;span class=\"kw\"&gt;or&lt;/span&gt; now &amp;gt;= a.end:\n        &lt;span class=\"kw\"&gt;return&lt;/span&gt; a, &lt;span class=\"st\"&gt;\"closed\"&lt;/span&gt;\n    seen = a.seen | {key}\n    &lt;span class=\"kw\"&gt;if&lt;/span&gt; a.leader &lt;span class=\"kw\"&gt;is&lt;/span&gt; &lt;span class=\"kw\"&gt;None&lt;/span&gt;:\n        &lt;span class=\"kw\"&gt;if&lt;/span&gt; mx &amp;lt; a.start:\n            &lt;span class=\"kw\"&gt;return&lt;/span&gt; &lt;span class=\"fn\"&gt;replace&lt;/span&gt;(a, seen=seen, version=a.version + &lt;span class=\"nu\"&gt;1&lt;/span&gt;), &lt;span class=\"st\"&gt;\"too_low\"&lt;/span&gt;\n        leader, top, price = bidder, mx, a.start\n    &lt;span class=\"kw\"&gt;elif&lt;/span&gt; bidder == a.leader:                               &lt;span class=\"cm\"&gt;# the leader raises their own maximum&lt;/span&gt;\n        &lt;span class=\"kw\"&gt;if&lt;/span&gt; mx &amp;lt;= a.top:\n            &lt;span class=\"kw\"&gt;return&lt;/span&gt; &lt;span class=\"fn\"&gt;replace&lt;/span&gt;(a, seen=seen, version=a.version + &lt;span class=\"nu\"&gt;1&lt;/span&gt;), &lt;span class=\"st\"&gt;\"too_low\"&lt;/span&gt;\n        leader, top, price = bidder, mx, a.price\n    &lt;span class=\"kw\"&gt;elif&lt;/span&gt; mx &amp;lt; a.price + &lt;span class=\"fn\"&gt;increment&lt;/span&gt;(a.price):                &lt;span class=\"cm\"&gt;# must beat the visible price by one increment&lt;/span&gt;\n        &lt;span class=\"kw\"&gt;return&lt;/span&gt; &lt;span class=\"fn\"&gt;replace&lt;/span&gt;(a, seen=seen, version=a.version + &lt;span class=\"nu\"&gt;1&lt;/span&gt;), &lt;span class=\"st\"&gt;\"too_low\"&lt;/span&gt;\n    &lt;span class=\"kw\"&gt;elif&lt;/span&gt; mx &amp;gt; a.top:                                       &lt;span class=\"cm\"&gt;# new leader pays one increment over the old maximum&lt;/span&gt;\n        leader, top, price = bidder, mx, &lt;span class=\"bi\"&gt;max&lt;/span&gt;(a.price, &lt;span class=\"bi\"&gt;min&lt;/span&gt;(mx, a.top + &lt;span class=\"fn\"&gt;increment&lt;/span&gt;(a.top)))\n    &lt;span class=\"kw\"&gt;elif&lt;/span&gt; mx == a.top:                                      &lt;span class=\"cm\"&gt;# tie: the earlier bid keeps the lead&lt;/span&gt;\n        leader, top, price = a.leader, a.top, a.top\n    &lt;span class=\"kw\"&gt;else&lt;/span&gt;:                                                  &lt;span class=\"cm\"&gt;# leader stays; price rises toward the challenger's maximum&lt;/span&gt;\n        leader, top, price = a.leader, a.top, &lt;span class=\"bi\"&gt;max&lt;/span&gt;(a.price, &lt;span class=\"bi\"&gt;min&lt;/span&gt;(a.top, mx + &lt;span class=\"fn\"&gt;increment&lt;/span&gt;(mx)))\n    end, used = a.end, a.ext_used\n    &lt;span class=\"kw\"&gt;if&lt;/span&gt; (a.extend &lt;span class=\"kw\"&gt;and&lt;/span&gt; bidder != a.leader                   &lt;span class=\"cm\"&gt;# a leader raising their own maximum never extends&lt;/span&gt;\n            &lt;span class=\"kw\"&gt;and&lt;/span&gt; now &amp;gt;= a.end - a.window &lt;span class=\"kw\"&gt;and&lt;/span&gt; used &amp;lt; a.max_ext\n            &lt;span class=\"kw\"&gt;and&lt;/span&gt; now + a.extend &amp;gt; a.end):                   &lt;span class=\"cm\"&gt;# only count an extension that really moves the end&lt;/span&gt;\n        end, used = now + a.extend, used + &lt;span class=\"nu\"&gt;1&lt;/span&gt;               &lt;span class=\"cm\"&gt;# soft close (\"reset\" mode: end = bid time + extend)&lt;/span&gt;\n    &lt;span class=\"kw\"&gt;return&lt;/span&gt; &lt;span class=\"fn\"&gt;replace&lt;/span&gt;(a, leader=leader, top=top, price=price, end=end, ext_used=used,\n                   bids=a.bids + ((bid_id, bidder, mx, now),), seen=seen, version=a.version + &lt;span class=\"nu\"&gt;1&lt;/span&gt;), &lt;span class=\"st\"&gt;\"ok\"&lt;/span&gt;\n\n\n&lt;span class=\"kw\"&gt;class&lt;/span&gt; Store:\n    &lt;span class=\"st\"&gt;\"\"\"Stands in for a database row with a conditional update (compare-and-set on version).\"\"\"&lt;/span&gt;\n    &lt;span class=\"kw\"&gt;def&lt;/span&gt; &lt;span class=\"fn\"&gt;__init__&lt;/span&gt;(&lt;span class=\"bi\"&gt;self&lt;/span&gt;, auction):\n        &lt;span class=\"bi\"&gt;self&lt;/span&gt;._a, &lt;span class=\"bi\"&gt;self&lt;/span&gt;._lock = auction, threading.&lt;span class=\"fn\"&gt;Lock&lt;/span&gt;()\n\n    &lt;span class=\"kw\"&gt;def&lt;/span&gt; &lt;span class=\"fn\"&gt;get&lt;/span&gt;(&lt;span class=\"bi\"&gt;self&lt;/span&gt;):\n        &lt;span class=\"kw\"&gt;return&lt;/span&gt; &lt;span class=\"bi\"&gt;self&lt;/span&gt;._a\n\n    &lt;span class=\"kw\"&gt;def&lt;/span&gt; &lt;span class=\"fn\"&gt;cas&lt;/span&gt;(&lt;span class=\"bi\"&gt;self&lt;/span&gt;, expected_version, new):\n        &lt;span class=\"kw\"&gt;with&lt;/span&gt; &lt;span class=\"bi\"&gt;self&lt;/span&gt;._lock:\n            &lt;span class=\"kw\"&gt;if&lt;/span&gt; &lt;span class=\"bi\"&gt;self&lt;/span&gt;._a.version != expected_version:\n                &lt;span class=\"kw\"&gt;return&lt;/span&gt; &lt;span class=\"kw\"&gt;False&lt;/span&gt;\n            &lt;span class=\"bi\"&gt;self&lt;/span&gt;._a = new\n            &lt;span class=\"kw\"&gt;return&lt;/span&gt; &lt;span class=\"kw\"&gt;True&lt;/span&gt;\n\n\n&lt;span class=\"kw\"&gt;def&lt;/span&gt; &lt;span class=\"fn\"&gt;bid&lt;/span&gt;(store, bidder, mx, now, bid_id, hook=&lt;span class=\"kw\"&gt;None&lt;/span&gt;):\n    &lt;span class=\"st\"&gt;\"\"\"`now` is a number (tests) or a function returning the server's clock (production): it is read again\n    on every retry, so a bid that loses a race and retries after the end time is correctly refused.\"\"\"&lt;/span&gt;\n    &lt;span class=\"kw\"&gt;while&lt;/span&gt; &lt;span class=\"kw\"&gt;True&lt;/span&gt;:                                            &lt;span class=\"cm\"&gt;# optimistic concurrency: retry on conflict&lt;/span&gt;\n        a = store.&lt;span class=\"fn\"&gt;get&lt;/span&gt;()\n        new, status = &lt;span class=\"fn\"&gt;place_bid&lt;/span&gt;(a, bidder, mx, &lt;span class=\"fn\"&gt;now&lt;/span&gt;() &lt;span class=\"kw\"&gt;if&lt;/span&gt; &lt;span class=\"bi\"&gt;callable&lt;/span&gt;(now) &lt;span class=\"kw\"&gt;else&lt;/span&gt; now, bid_id)\n        &lt;span class=\"kw\"&gt;if&lt;/span&gt; hook:\n            &lt;span class=\"fn\"&gt;hook&lt;/span&gt;()                                         &lt;span class=\"cm\"&gt;# tests use this to force an interleaving&lt;/span&gt;\n        &lt;span class=\"kw\"&gt;if&lt;/span&gt; new &lt;span class=\"kw\"&gt;is&lt;/span&gt; a &lt;span class=\"kw\"&gt;or&lt;/span&gt; store.&lt;span class=\"fn\"&gt;cas&lt;/span&gt;(a.version, new):\n            &lt;span class=\"kw\"&gt;return&lt;/span&gt; status\n\n\n&lt;span class=\"kw\"&gt;class&lt;/span&gt; Scheduler:\n    &lt;span class=\"st\"&gt;\"\"\"Closes auctions when due. Extended auctions are re-queued; closing is idempotent.\"\"\"&lt;/span&gt;\n    &lt;span class=\"kw\"&gt;def&lt;/span&gt; &lt;span class=\"fn\"&gt;__init__&lt;/span&gt;(&lt;span class=\"bi\"&gt;self&lt;/span&gt;):\n        &lt;span class=\"bi\"&gt;self&lt;/span&gt;.heap = []\n\n    &lt;span class=\"kw\"&gt;def&lt;/span&gt; &lt;span class=\"fn\"&gt;schedule&lt;/span&gt;(&lt;span class=\"bi\"&gt;self&lt;/span&gt;, end, auction_id):\n        heapq.&lt;span class=\"fn\"&gt;heappush&lt;/span&gt;(&lt;span class=\"bi\"&gt;self&lt;/span&gt;.heap, (end, auction_id))\n\n    &lt;span class=\"kw\"&gt;def&lt;/span&gt; &lt;span class=\"fn\"&gt;due&lt;/span&gt;(&lt;span class=\"bi\"&gt;self&lt;/span&gt;, now, stores):\n        closed = []\n        &lt;span class=\"kw\"&gt;while&lt;/span&gt; &lt;span class=\"bi\"&gt;self&lt;/span&gt;.heap &lt;span class=\"kw\"&gt;and&lt;/span&gt; &lt;span class=\"bi\"&gt;self&lt;/span&gt;.heap[&lt;span class=\"nu\"&gt;0&lt;/span&gt;][&lt;span class=\"nu\"&gt;0&lt;/span&gt;] &amp;lt;= now:\n            _, aid = heapq.&lt;span class=\"fn\"&gt;heappop&lt;/span&gt;(&lt;span class=\"bi\"&gt;self&lt;/span&gt;.heap)\n            &lt;span class=\"kw\"&gt;while&lt;/span&gt; &lt;span class=\"kw\"&gt;True&lt;/span&gt;:\n                a = stores[aid].&lt;span class=\"fn\"&gt;get&lt;/span&gt;()\n                &lt;span class=\"kw\"&gt;if&lt;/span&gt; a.closed:\n                    &lt;span class=\"kw\"&gt;break&lt;/span&gt;\n                &lt;span class=\"kw\"&gt;if&lt;/span&gt; a.end &amp;gt; now:                            &lt;span class=\"cm\"&gt;# a late bid pushed the end out: look again later&lt;/span&gt;\n                    heapq.&lt;span class=\"fn\"&gt;heappush&lt;/span&gt;(&lt;span class=\"bi\"&gt;self&lt;/span&gt;.heap, (a.end, aid))\n                    &lt;span class=\"kw\"&gt;break&lt;/span&gt;\n                &lt;span class=\"kw\"&gt;if&lt;/span&gt; stores[aid].&lt;span class=\"fn\"&gt;cas&lt;/span&gt;(a.version, &lt;span class=\"fn\"&gt;replace&lt;/span&gt;(a, closed=&lt;span class=\"kw\"&gt;True&lt;/span&gt;, version=a.version + &lt;span class=\"nu\"&gt;1&lt;/span&gt;)):\n                    closed.&lt;span class=\"fn\"&gt;append&lt;/span&gt;(aid)\n                    &lt;span class=\"kw\"&gt;break&lt;/span&gt;\n        &lt;span class=\"kw\"&gt;return&lt;/span&gt; closed", "import random\nimport threading\nimport time\nfrom dataclasses import replace\n\nfrom auction_core import Auction, Scheduler, Store, bid, increment, place_bid\n\n\ndef test_increment_table_boundaries():\n    # eBay's table: $0.01-0.99 -&gt; 0.05, 1.00-4.99 -&gt; 0.25, 5.00-24.99 -&gt; 0.50, 25.00-99.99 -&gt; 1.00, ...\n    cases = {1: 5, 99: 5, 100: 25, 499: 25, 500: 50, 2499: 50, 2500: 100, 9999: 100, 10000: 250,\n             24999: 250, 25000: 500, 49999: 500, 50000: 1000, 99999: 1000, 100000: 2500,\n             249999: 2500, 250000: 5000, 499999: 5000, 500000: 10000, 9_000_000: 10000}\n    for price, step in cases.items():\n        assert increment(price) == step, (price, step)\n\n\ndef test_ebay_style_example():\n    # $12.00 maximum, then a $15.00 maximum: the price becomes $12.50 (one $0.50 step over the loser)\n    a = Auction(start=100, end=1000)\n    a, s1 = place_bid(a, \"ann\", 1200, 1, \"b1\")\n    a, s2 = place_bid(a, \"bob\", 1500, 2, \"b2\")\n    assert (s1, s2) == (\"ok\", \"ok\") and a.leader == \"bob\" and a.price == 1250 and a.top == 1500\n\n\ndef oracle(a):\n    \"\"\"Closed-form expectation from the accepted bids only.\n    The leader is the earliest bid with the highest maximum. The price is set by the last bid that was\n    NOT the leader raising their own maximum (a raise never changes the visible price):\n    price = min(leader's max, second-highest max + its increment), but never below the start price.\"\"\"\n    if not a.bids:\n        return None, 0\n    leader, top, last_forcing = None, -1, 0\n    for k, (_, bidder, mx, _) in enumerate(a.bids, 1):\n        if bidder != leader:\n            last_forcing = k\n        if mx &gt; top:                                       # strictly greater: the earlier bid wins ties\n            leader, top = bidder, mx\n    prefix = a.bids[:last_forcing]\n    best = max(b[2] for b in prefix)\n    lead = next(b[1] for b in prefix if b[2] == best)\n    others = [b[2] for b in prefix if b[1] != lead]\n    price = a.start if not others else max(a.start, min(best, max(others) + increment(max(others))))\n    return leader, price\n\n\ndef check(a):\n    leader, price = oracle(a)\n    assert a.leader == leader, (a.leader, leader)\n    assert a.price == price, (a.price, price)\n    if a.leader:\n        assert a.start &lt;= a.price &lt;= a.top\n    assert a.ext_used &lt;= a.max_ext\n    keys = [(b[1], b[0]) for b in a.bids]\n    assert len(keys) == len(set(keys)), \"a bid was accepted twice\"\n\n\ndef test_random_sequential(trials=3000):\n    for seed in range(trials):\n        rnd = random.Random(seed)\n        a = Auction(start=rnd.choice([100, 500, 2500]), end=1000, window=30, extend=30, max_ext=3)\n        now, last_price, moves = 0, 0, 0\n        for i in range(rnd.randint(1, 25)):\n            now += rnd.randint(0, 60)\n            bidder = rnd.choice([\"a\", \"b\", \"c\", \"d\"])\n            mx = rnd.randint(50, 30000)\n            before = a\n            a, status = place_bid(a, bidder, mx, now, f\"id{seed}-{i}\")\n            if status == \"ok\":\n                assert now &lt; a.end                                 # never accepted after the end\n            else:\n                assert a.bids == before.bids and a.leader == before.leader and a.price == before.price\n            assert a.price &gt;= last_price                           # the visible price never goes down\n            last_price = a.price\n            assert a.end &gt;= before.end                             # the end never moves earlier\n            moves += a.end &gt; before.end\n            assert a.ext_used == moves                             # an extension is counted only when the end moves\n            check(a)\n\n\ndef test_duplicate_is_ignored():\n    a = Auction(start=100, end=1000)\n    a, _ = place_bid(a, \"ann\", 500, 1, \"same\")\n    again, status = place_bid(a, \"ann\", 500, 2, \"same\")\n    assert status == \"duplicate\" and again is a\n    other, status = place_bid(a, \"bob\", 900, 3, \"same\")             # same id from a different bidder is a new bid\n    assert status == \"ok\" and other.leader == \"bob\"\n\n\ndef test_extension_is_counted_only_when_the_end_moves():\n    a = Auction(start=100, end=100, window=30, extend=10, max_ext=1)\n    a, _ = place_bid(a, \"ann\", 500, 75, \"1\")                       # inside the window, but 75 + 10 &lt; 100\n    assert a.end == 100 and a.ext_used == 0\n    a, _ = place_bid(a, \"bob\", 900, 95, \"2\")                       # 95 + 10 &gt; 100: the end moves\n    assert a.end == 105 and a.ext_used == 1\n\n\ndef test_leader_raising_their_own_maximum_does_not_extend():\n    a = Auction(start=100, end=100, window=10, extend=10, max_ext=3)\n    a, _ = place_bid(a, \"ann\", 500, 50, \"1\")\n    a, _ = place_bid(a, \"ann\", 900, 95, \"2\")                       # ann leads and only raises her ceiling\n    assert a.end == 100 and a.ext_used == 0 and a.price == 100\n    a, _ = place_bid(a, \"bob\", 700, 96, \"3\")                       # a real challenger does extend\n    assert a.end == 106 and a.ext_used == 1\n\n\ndef test_soft_close_and_cap():\n    a = Auction(start=100, end=100, window=10, extend=10, max_ext=2)\n    a, _ = place_bid(a, \"ann\", 500, 50, \"1\")\n    assert a.end == 100                                            # early bid: no extension\n    a, _ = place_bid(a, \"bob\", 900, 95, \"2\")\n    assert a.end == 105 and a.ext_used == 1\n    a, _ = place_bid(a, \"ann\", 1500, 104, \"3\")\n    assert a.end == 114 and a.ext_used == 2\n    a, _ = place_bid(a, \"bob\", 2500, 113, \"4\")\n    assert a.end == 114 and a.ext_used == 2                        # cap reached: end no longer moves\n    a, status = place_bid(a, \"ann\", 4000, 114, \"5\")\n    assert status == \"closed\"\n\n\n# ---- concurrency: a broken \"blind write\" version versus compare-and-set ----\ndef naive_bid(store, bidder, mx, now, bid_id, hook):\n    a = store.get()\n    new, status = place_bid(a, bidder, mx, now, bid_id)\n    hook()\n    store._a = new                                                 # blind write: overwrites whatever is there now\n    return status\n\n\ndef force_race(bid_fn):\n    \"\"\"Two bidders read the same state; bob (the higher bid) commits first, ann (lower) commits last.\"\"\"\n    store = Store(replace(Auction(start=100, end=1000), leader=\"cat\", top=1000, price=100,\n                          bids=((\"c0\", \"cat\", 1000, 0),), seen=frozenset({\"c0\"}), version=1))\n    both_read = threading.Barrier(2)\n    bob_done = threading.Event()\n    calls = {\"bob\": 0, \"ann\": 0}\n\n    def bob_hook():\n        calls[\"bob\"] += 1\n        if calls[\"bob\"] == 1:                                      # only the first read is synchronised\n            both_read.wait(timeout=5)\n\n    def ann_hook():\n        calls[\"ann\"] += 1\n        if calls[\"ann\"] == 1:\n            both_read.wait(timeout=5)\n            bob_done.wait(timeout=5)                               # ann commits after bob\n\n    def run_bob():\n        bid_fn(store, \"bob\", 9000, 5, \"bob-1\", bob_hook)\n        bob_done.set()\n\n    t1 = threading.Thread(target=run_bob)\n    t2 = threading.Thread(target=lambda: bid_fn(store, \"ann\", 5000, 6, \"ann-1\", ann_hook))\n    t1.start(); t2.start(); t1.join(); t2.join()\n    return store.get()\n\n\ndef test_blind_write_loses_the_highest_bid():\n    final = force_race(naive_bid)\n    assert final.leader == \"ann\"                                   # the bug: bob's 9000 was overwritten\n\n\ndef test_compare_and_set_keeps_the_highest_bid():\n    final = force_race(bid)\n    assert final.leader == \"bob\" and final.top == 9000 and final.price == 5100\n    check(final)\n\n\ndef test_threaded_stress():\n    rnd = random.Random(7)\n    store = Store(Auction(start=100, end=10**9))\n    jitter = lambda: time.sleep(rnd.random() * 0.0005)\n    results, lock = [], threading.Lock()\n\n    def worker(w):\n        local = random.Random(w)\n        for i in range(150):\n            st = bid(store, f\"u{w}\", local.randint(100, 50000), i, f\"w{w}-{i}\", jitter)\n            with lock:\n                results.append(st)\n\n    threads = [threading.Thread(target=worker, args=(w,)) for w in range(8)]\n    [t.start() for t in threads]; [t.join() for t in threads]\n    final = store.get()\n    assert len(results) == 1200 and results.count(\"ok\") == len(final.bids)\n    assert len(final.seen) == 1200                                 # every request was recorded exactly once\n    check(final)\n\n\ndef test_retry_after_a_lost_race_uses_a_fresh_clock():\n    store = Store(Auction(start=100, end=100))\n    clock = [99]\n\n    def interfere():                                               # during bob's first attempt, someone else commits\n        if clock[0] == 99:\n            a = store.get()\n            new, _ = place_bid(a, \"ann\", 500, 99, \"ann-1\")\n            assert store.cas(a.version, new)\n            clock[0] = 101                                         # and the clock passes the end time\n\n    assert bid(store, \"bob\", 900, lambda: clock[0], \"bob-1\", interfere) == \"closed\"\n    assert store.get().leader == \"ann\"\n\n\ndef test_scheduler_closes_once_and_requeues_extended():\n    stores = {\"x\": Store(Auction(start=100, end=100, window=10, extend=10, max_ext=2))}\n    sched = Scheduler()\n    sched.schedule(100, \"x\")\n    bid(stores[\"x\"], \"ann\", 500, 95, \"1\")                          # extends the end to 105\n    assert sched.due(101, stores) == [] and not stores[\"x\"].get().closed\n    assert sched.due(105, stores) == [\"x\"] and stores[\"x\"].get().closed\n    sched.schedule(105, \"x\")                                       # a stale duplicate entry\n    assert sched.due(200, stores) == []                            # already closed: nothing happens\n    assert bid(stores[\"x\"], \"bob\", 9000, 106, \"2\") == \"closed\"\n\n\nif __name__ == \"__main__\":\n    test_increment_table_boundaries(); print(\"increment table matches eBay's published tiers: ok\")\n    test_ebay_style_example(); print(\"$12 max vs $15 max -&gt; $12.50: ok\")\n    test_random_sequential(); print(\"3,000 random bid sequences match the closed-form oracle: ok\")\n    test_duplicate_is_ignored(); test_soft_close_and_cap(); print(\"duplicates ignored; soft close + cap: ok\")\n    test_extension_is_counted_only_when_the_end_moves(); test_leader_raising_their_own_maximum_does_not_extend()\n    print(\"extension counted only when the end moves; a leader's own raise does not extend: ok\")\n    test_retry_after_a_lost_race_uses_a_fresh_clock(); print(\"a retry after a lost race re-reads the clock: ok\")\n    test_blind_write_loses_the_highest_bid(); print(\"blind write version loses the higher bid (the bug is real): ok\")\n    test_compare_and_set_keeps_the_highest_bid(); print(\"compare-and-set keeps the higher bid: ok\")\n    for _ in range(5):\n        test_threaded_stress()\n    print(\"5 threaded stress runs (8 threads x 150 bids): ok\")\n    test_scheduler_closes_once_and_requeues_extended(); print(\"scheduler: closes once, re-queues extended: ok\")": "&lt;span class=\"kw\"&gt;import&lt;/span&gt; random\n&lt;span class=\"kw\"&gt;import&lt;/span&gt; threading\n&lt;span class=\"kw\"&gt;import&lt;/span&gt; time\n&lt;span class=\"kw\"&gt;from&lt;/span&gt; dataclasses &lt;span class=\"kw\"&gt;import&lt;/span&gt; replace\n\n&lt;span class=\"kw\"&gt;from&lt;/span&gt; auction_core &lt;span class=\"kw\"&gt;import&lt;/span&gt; Auction, Scheduler, Store, bid, increment, place_bid\n\n\n&lt;span class=\"kw\"&gt;def&lt;/span&gt; &lt;span class=\"fn\"&gt;test_increment_table_boundaries&lt;/span&gt;():\n    &lt;span class=\"cm\"&gt;# eBay's table: $0.01-0.99 -&amp;gt; 0.05, 1.00-4.99 -&amp;gt; 0.25, 5.00-24.99 -&amp;gt; 0.50, 25.00-99.99 -&amp;gt; 1.00, ...&lt;/span&gt;\n    cases = {&lt;span class=\"nu\"&gt;1&lt;/span&gt;: &lt;span class=\"nu\"&gt;5&lt;/span&gt;, &lt;span class=\"nu\"&gt;99&lt;/span&gt;: &lt;span class=\"nu\"&gt;5&lt;/span&gt;, &lt;span class=\"nu\"&gt;100&lt;/span&gt;: &lt;span class=\"nu\"&gt;25&lt;/span&gt;, &lt;span class=\"nu\"&gt;499&lt;/span&gt;: &lt;span class=\"nu\"&gt;25&lt;/span&gt;, &lt;span class=\"nu\"&gt;500&lt;/span&gt;: &lt;span class=\"nu\"&gt;50&lt;/span&gt;, &lt;span class=\"nu\"&gt;2499&lt;/span&gt;: &lt;span class=\"nu\"&gt;50&lt;/span&gt;, &lt;span class=\"nu\"&gt;2500&lt;/span&gt;: &lt;span class=\"nu\"&gt;100&lt;/span&gt;, &lt;span class=\"nu\"&gt;9999&lt;/span&gt;: &lt;span class=\"nu\"&gt;100&lt;/span&gt;, &lt;span class=\"nu\"&gt;10000&lt;/span&gt;: &lt;span class=\"nu\"&gt;250&lt;/span&gt;,\n             &lt;span class=\"nu\"&gt;24999&lt;/span&gt;: &lt;span class=\"nu\"&gt;250&lt;/span&gt;, &lt;span class=\"nu\"&gt;25000&lt;/span&gt;: &lt;span class=\"nu\"&gt;500&lt;/span&gt;, &lt;span class=\"nu\"&gt;49999&lt;/span&gt;: &lt;span class=\"nu\"&gt;500&lt;/span&gt;, &lt;span class=\"nu\"&gt;50000&lt;/span&gt;: &lt;span class=\"nu\"&gt;1000&lt;/span&gt;, &lt;span class=\"nu\"&gt;99999&lt;/span&gt;: &lt;span class=\"nu\"&gt;1000&lt;/span&gt;, &lt;span class=\"nu\"&gt;100000&lt;/span&gt;: &lt;span class=\"nu\"&gt;2500&lt;/span&gt;,\n             &lt;span class=\"nu\"&gt;249999&lt;/span&gt;: &lt;span class=\"nu\"&gt;2500&lt;/span&gt;, &lt;span class=\"nu\"&gt;250000&lt;/span&gt;: &lt;span class=\"nu\"&gt;5000&lt;/span&gt;, &lt;span class=\"nu\"&gt;499999&lt;/span&gt;: &lt;span class=\"nu\"&gt;5000&lt;/span&gt;, &lt;span class=\"nu\"&gt;500000&lt;/span&gt;: &lt;span class=\"nu\"&gt;10000&lt;/span&gt;, &lt;span class=\"nu\"&gt;9_000_000&lt;/span&gt;: &lt;span class=\"nu\"&gt;10000&lt;/span&gt;}\n    &lt;span class=\"kw\"&gt;for&lt;/span&gt; price, step &lt;span class=\"kw\"&gt;in&lt;/span&gt; cases.&lt;span class=\"fn\"&gt;items&lt;/span&gt;():\n        &lt;span class=\"kw\"&gt;assert&lt;/span&gt; &lt;span class=\"fn\"&gt;increment&lt;/span&gt;(price) == step, (price, step)\n\n\n&lt;span class=\"kw\"&gt;def&lt;/span&gt; &lt;span class=\"fn\"&gt;test_ebay_style_example&lt;/span&gt;():\n    &lt;span class=\"cm\"&gt;# $12.00 maximum, then a $15.00 maximum: the price becomes $12.50 (one $0.50 step over the loser)&lt;/span&gt;\n    a = &lt;span class=\"fn\"&gt;Auction&lt;/span&gt;(start=&lt;span class=\"nu\"&gt;100&lt;/span&gt;, end=&lt;span class=\"nu\"&gt;1000&lt;/span&gt;)\n    a, s1 = &lt;span class=\"fn\"&gt;place_bid&lt;/span&gt;(a, &lt;span class=\"st\"&gt;\"ann\"&lt;/span&gt;, &lt;span class=\"nu\"&gt;1200&lt;/span&gt;, &lt;span class=\"nu\"&gt;1&lt;/span&gt;, &lt;span class=\"st\"&gt;\"b1\"&lt;/span&gt;)\n    a, s2 = &lt;span class=\"fn\"&gt;place_bid&lt;/span&gt;(a, &lt;span class=\"st\"&gt;\"bob\"&lt;/span&gt;, &lt;span class=\"nu\"&gt;1500&lt;/span&gt;, &lt;span class=\"nu\"&gt;2&lt;/span&gt;, &lt;span class=\"st\"&gt;\"b2\"&lt;/span&gt;)\n    &lt;span class=\"kw\"&gt;assert&lt;/span&gt; (s1, s2) == (&lt;span class=\"st\"&gt;\"ok\"&lt;/span&gt;, &lt;span class=\"st\"&gt;\"ok\"&lt;/span&gt;) &lt;span class=\"kw\"&gt;and&lt;/span&gt; a.leader == &lt;span class=\"st\"&gt;\"bob\"&lt;/span&gt; &lt;span class=\"kw\"&gt;and&lt;/span&gt; a.price == &lt;span class=\"nu\"&gt;1250&lt;/span&gt; &lt;span class=\"kw\"&gt;and&lt;/span&gt; a.top == &lt;span class=\"nu\"&gt;1500&lt;/span&gt;\n\n\n&lt;span class=\"kw\"&gt;def&lt;/span&gt; &lt;span class=\"fn\"&gt;oracle&lt;/span&gt;(a):\n    &lt;span class=\"st\"&gt;\"\"\"Closed-form expectation from the accepted bids only.\n    The leader is the earliest bid with the highest maximum. The price is set by the last bid that was\n    NOT the leader raising their own maximum (a raise never changes the visible price):\n    price = min(leader's max, second-highest max + its increment), but never below the start price.\"\"\"&lt;/span&gt;\n    &lt;span class=\"kw\"&gt;if&lt;/span&gt; &lt;span class=\"kw\"&gt;not&lt;/span&gt; a.bids:\n        &lt;span class=\"kw\"&gt;return&lt;/span&gt; &lt;span class=\"kw\"&gt;None&lt;/span&gt;, &lt;span class=\"nu\"&gt;0&lt;/span&gt;\n    leader, top, last_forcing = &lt;span class=\"kw\"&gt;None&lt;/span&gt;, -&lt;span class=\"nu\"&gt;1&lt;/span&gt;, &lt;span class=\"nu\"&gt;0&lt;/span&gt;\n    &lt;span class=\"kw\"&gt;for&lt;/span&gt; k, (_, bidder, mx, _) &lt;span class=\"kw\"&gt;in&lt;/span&gt; &lt;span class=\"bi\"&gt;enumerate&lt;/span&gt;(a.bids, &lt;span class=\"nu\"&gt;1&lt;/span&gt;):\n        &lt;span class=\"kw\"&gt;if&lt;/span&gt; bidder != leader:\n            last_forcing = k\n        &lt;span class=\"kw\"&gt;if&lt;/span&gt; mx &amp;gt; top:                                       &lt;span class=\"cm\"&gt;# strictly greater: the earlier bid wins ties&lt;/span&gt;\n            leader, top = bidder, mx\n    prefix = a.bids[:last_forcing]\n    best = &lt;span class=\"bi\"&gt;max&lt;/span&gt;(b[&lt;span class=\"nu\"&gt;2&lt;/span&gt;] &lt;span class=\"kw\"&gt;for&lt;/span&gt; b &lt;span class=\"kw\"&gt;in&lt;/span&gt; prefix)\n    lead = &lt;span class=\"bi\"&gt;next&lt;/span&gt;(b[&lt;span class=\"nu\"&gt;1&lt;/span&gt;] &lt;span class=\"kw\"&gt;for&lt;/span&gt; b &lt;span class=\"kw\"&gt;in&lt;/span&gt; prefix &lt;span class=\"kw\"&gt;if&lt;/span&gt; b[&lt;span class=\"nu\"&gt;2&lt;/span&gt;] == best)\n    others = [b[&lt;span class=\"nu\"&gt;2&lt;/span&gt;] &lt;span class=\"kw\"&gt;for&lt;/span&gt; b &lt;span class=\"kw\"&gt;in&lt;/span&gt; prefix &lt;span class=\"kw\"&gt;if&lt;/span&gt; b[&lt;span class=\"nu\"&gt;1&lt;/span&gt;] != lead]\n    price = a.start &lt;span class=\"kw\"&gt;if&lt;/span&gt; &lt;span class=\"kw\"&gt;not&lt;/span&gt; others &lt;span class=\"kw\"&gt;else&lt;/span&gt; &lt;span class=\"bi\"&gt;max&lt;/span&gt;(a.start, &lt;span class=\"bi\"&gt;min&lt;/span&gt;(best, &lt;span class=\"bi\"&gt;max&lt;/span&gt;(others) + &lt;span class=\"fn\"&gt;increment&lt;/span&gt;(&lt;span class=\"bi\"&gt;max&lt;/span&gt;(others))))\n    &lt;span class=\"kw\"&gt;return&lt;/span&gt; leader, price\n\n\n&lt;span class=\"kw\"&gt;def&lt;/span&gt; &lt;span class=\"fn\"&gt;check&lt;/span&gt;(a):\n    leader, price = &lt;span class=\"fn\"&gt;oracle&lt;/span&gt;(a)\n    &lt;span class=\"kw\"&gt;assert&lt;/span&gt; a.leader == leader, (a.leader, leader)\n    &lt;span class=\"kw\"&gt;assert&lt;/span&gt; a.price == price, (a.price, price)\n    &lt;span class=\"kw\"&gt;if&lt;/span&gt; a.leader:\n        &lt;span class=\"kw\"&gt;assert&lt;/span&gt; a.start &amp;lt;= a.price &amp;lt;= a.top\n    &lt;span class=\"kw\"&gt;assert&lt;/span&gt; a.ext_used &amp;lt;= a.max_ext\n    keys = [(b[&lt;span class=\"nu\"&gt;1&lt;/span&gt;], b[&lt;span class=\"nu\"&gt;0&lt;/span&gt;]) &lt;span class=\"kw\"&gt;for&lt;/span&gt; b &lt;span class=\"kw\"&gt;in&lt;/span&gt; a.bids]\n    &lt;span class=\"kw\"&gt;assert&lt;/span&gt; &lt;span class=\"bi\"&gt;len&lt;/span&gt;(keys) == &lt;span class=\"bi\"&gt;len&lt;/span&gt;(&lt;span class=\"bi\"&gt;set&lt;/span&gt;(keys)), &lt;span class=\"st\"&gt;\"a bid was accepted twice\"&lt;/span&gt;\n\n\n&lt;span class=\"kw\"&gt;def&lt;/span&gt; &lt;span class=\"fn\"&gt;test_random_sequential&lt;/span&gt;(trials=&lt;span class=\"nu\"&gt;3000&lt;/span&gt;):\n    &lt;span class=\"kw\"&gt;for&lt;/span&gt; seed &lt;span class=\"kw\"&gt;in&lt;/span&gt; &lt;span class=\"bi\"&gt;range&lt;/span&gt;(trials):\n        rnd = random.&lt;span class=\"fn\"&gt;Random&lt;/span&gt;(seed)\n        a = &lt;span class=\"fn\"&gt;Auction&lt;/span&gt;(start=rnd.&lt;span class=\"fn\"&gt;choice&lt;/span&gt;([&lt;span class=\"nu\"&gt;100&lt;/span&gt;, &lt;span class=\"nu\"&gt;500&lt;/span&gt;, &lt;span class=\"nu\"&gt;2500&lt;/span&gt;]), end=&lt;span class=\"nu\"&gt;1000&lt;/span&gt;, window=&lt;span class=\"nu\"&gt;30&lt;/span&gt;, extend=&lt;span class=\"nu\"&gt;30&lt;/span&gt;, max_ext=&lt;span class=\"nu\"&gt;3&lt;/span&gt;)\n        now, last_price, moves = &lt;span class=\"nu\"&gt;0&lt;/span&gt;, &lt;span class=\"nu\"&gt;0&lt;/span&gt;, &lt;span class=\"nu\"&gt;0&lt;/span&gt;\n        &lt;span class=\"kw\"&gt;for&lt;/span&gt; i &lt;span class=\"kw\"&gt;in&lt;/span&gt; &lt;span class=\"bi\"&gt;range&lt;/span&gt;(rnd.&lt;span class=\"fn\"&gt;randint&lt;/span&gt;(&lt;span class=\"nu\"&gt;1&lt;/span&gt;, &lt;span class=\"nu\"&gt;25&lt;/span&gt;)):\n            now += rnd.&lt;span class=\"fn\"&gt;randint&lt;/span&gt;(&lt;span class=\"nu\"&gt;0&lt;/span&gt;, &lt;span class=\"nu\"&gt;60&lt;/span&gt;)\n            bidder = rnd.&lt;span class=\"fn\"&gt;choice&lt;/span&gt;([&lt;span class=\"st\"&gt;\"a\"&lt;/span&gt;, &lt;span class=\"st\"&gt;\"b\"&lt;/span&gt;, &lt;span class=\"st\"&gt;\"c\"&lt;/span&gt;, &lt;span class=\"st\"&gt;\"d\"&lt;/span&gt;])\n            mx = rnd.&lt;span class=\"fn\"&gt;randint&lt;/span&gt;(&lt;span class=\"nu\"&gt;50&lt;/span&gt;, &lt;span class=\"nu\"&gt;30000&lt;/span&gt;)\n            before = a\n            a, status = &lt;span class=\"fn\"&gt;place_bid&lt;/span&gt;(a, bidder, mx, now, &lt;span class=\"st\"&gt;f\"id{seed}-{i}\"&lt;/span&gt;)\n            &lt;span class=\"kw\"&gt;if&lt;/span&gt; status == &lt;span class=\"st\"&gt;\"ok\"&lt;/span&gt;:\n                &lt;span class=\"kw\"&gt;assert&lt;/span&gt; now &amp;lt; a.end                                 &lt;span class=\"cm\"&gt;# never accepted after the end&lt;/span&gt;\n            &lt;span class=\"kw\"&gt;else&lt;/span&gt;:\n                &lt;span class=\"kw\"&gt;assert&lt;/span&gt; a.bids == before.bids &lt;span class=\"kw\"&gt;and&lt;/span&gt; a.leader == before.leader &lt;span class=\"kw\"&gt;and&lt;/span&gt; a.price == before.price\n            &lt;span class=\"kw\"&gt;assert&lt;/span&gt; a.price &amp;gt;= last_price                           &lt;span class=\"cm\"&gt;# the visible price never goes down&lt;/span&gt;\n            last_price = a.price\n            &lt;span class=\"kw\"&gt;assert&lt;/span&gt; a.end &amp;gt;= before.end                             &lt;span class=\"cm\"&gt;# the end never moves earlier&lt;/span&gt;\n            moves += a.end &amp;gt; before.end\n            &lt;span class=\"kw\"&gt;assert&lt;/span&gt; a.ext_used == moves                             &lt;span class=\"cm\"&gt;# an extension is counted only when the end moves&lt;/span&gt;\n            &lt;span class=\"fn\"&gt;check&lt;/span&gt;(a)\n\n\n&lt;span class=\"kw\"&gt;def&lt;/span&gt; &lt;span class=\"fn\"&gt;test_duplicate_is_ignored&lt;/span&gt;():\n    a = &lt;span class=\"fn\"&gt;Auction&lt;/span&gt;(start=&lt;span class=\"nu\"&gt;100&lt;/span&gt;, end=&lt;span class=\"nu\"&gt;1000&lt;/span&gt;)\n    a, _ = &lt;span class=\"fn\"&gt;place_bid&lt;/span&gt;(a, &lt;span class=\"st\"&gt;\"ann\"&lt;/span&gt;, &lt;span class=\"nu\"&gt;500&lt;/span&gt;, &lt;span class=\"nu\"&gt;1&lt;/span&gt;, &lt;span class=\"st\"&gt;\"same\"&lt;/span&gt;)\n    again, status = &lt;span class=\"fn\"&gt;place_bid&lt;/span&gt;(a, &lt;span class=\"st\"&gt;\"ann\"&lt;/span&gt;, &lt;span class=\"nu\"&gt;500&lt;/span&gt;, &lt;span class=\"nu\"&gt;2&lt;/span&gt;, &lt;span class=\"st\"&gt;\"same\"&lt;/span&gt;)\n    &lt;span class=\"kw\"&gt;assert&lt;/span&gt; status == &lt;span class=\"st\"&gt;\"duplicate\"&lt;/span&gt; &lt;span class=\"kw\"&gt;and&lt;/span&gt; again &lt;span class=\"kw\"&gt;is&lt;/span&gt; a\n    other, status = &lt;span class=\"fn\"&gt;place_bid&lt;/span&gt;(a, &lt;span class=\"st\"&gt;\"bob\"&lt;/span&gt;, &lt;span class=\"nu\"&gt;900&lt;/span&gt;, &lt;span class=\"nu\"&gt;3&lt;/span&gt;, &lt;span class=\"st\"&gt;\"same\"&lt;/span&gt;)             &lt;span class=\"cm\"&gt;# same id from a different bidder is a new bid&lt;/span&gt;\n    &lt;span class=\"kw\"&gt;assert&lt;/span&gt; status == &lt;span class=\"st\"&gt;\"ok\"&lt;/span&gt; &lt;span class=\"kw\"&gt;and&lt;/span&gt; other.leader == &lt;span class=\"st\"&gt;\"bob\"&lt;/span&gt;\n\n\n&lt;span class=\"kw\"&gt;def&lt;/span&gt; &lt;span class=\"fn\"&gt;test_extension_is_counted_only_when_the_end_moves&lt;/span&gt;():\n    a = &lt;span class=\"fn\"&gt;Auction&lt;/span&gt;(start=&lt;span class=\"nu\"&gt;100&lt;/span&gt;, end=&lt;span class=\"nu\"&gt;100&lt;/span&gt;, window=&lt;span class=\"nu\"&gt;30&lt;/span&gt;, extend=&lt;span class=\"nu\"&gt;10&lt;/span&gt;, max_ext=&lt;span class=\"nu\"&gt;1&lt;/span&gt;)\n    a, _ = &lt;span class=\"fn\"&gt;place_bid&lt;/span&gt;(a, &lt;span class=\"st\"&gt;\"ann\"&lt;/span&gt;, &lt;span class=\"nu\"&gt;500&lt;/span&gt;, &lt;span class=\"nu\"&gt;75&lt;/span&gt;, &lt;span class=\"st\"&gt;\"1\"&lt;/span&gt;)                       &lt;span class=\"cm\"&gt;# inside the window, but 75 + 10 &amp;lt; 100&lt;/span&gt;\n    &lt;span class=\"kw\"&gt;assert&lt;/span&gt; a.end == &lt;span class=\"nu\"&gt;100&lt;/span&gt; &lt;span class=\"kw\"&gt;and&lt;/span&gt; a.ext_used == &lt;span class=\"nu\"&gt;0&lt;/span&gt;\n    a, _ = &lt;span class=\"fn\"&gt;place_bid&lt;/span&gt;(a, &lt;span class=\"st\"&gt;\"bob\"&lt;/span&gt;, &lt;span class=\"nu\"&gt;900&lt;/span&gt;, &lt;span class=\"nu\"&gt;95&lt;/span&gt;, &lt;span class=\"st\"&gt;\"2\"&lt;/span&gt;)                       &lt;span class=\"cm\"&gt;# 95 + 10 &amp;gt; 100: the end moves&lt;/span&gt;\n    &lt;span class=\"kw\"&gt;assert&lt;/span&gt; a.end == &lt;span class=\"nu\"&gt;105&lt;/span&gt; &lt;span class=\"kw\"&gt;and&lt;/span&gt; a.ext_used == &lt;span class=\"nu\"&gt;1&lt;/span&gt;\n\n\n&lt;span class=\"kw\"&gt;def&lt;/span&gt; &lt;span class=\"fn\"&gt;test_leader_raising_their_own_maximum_does_not_extend&lt;/span&gt;():\n    a = &lt;span class=\"fn\"&gt;Auction&lt;/span&gt;(start=&lt;span class=\"nu\"&gt;100&lt;/span&gt;, end=&lt;span class=\"nu\"&gt;100&lt;/span&gt;, window=&lt;span class=\"nu\"&gt;10&lt;/span&gt;, extend=&lt;span class=\"nu\"&gt;10&lt;/span&gt;, max_ext=&lt;span class=\"nu\"&gt;3&lt;/span&gt;)\n    a, _ = &lt;span class=\"fn\"&gt;place_bid&lt;/span&gt;(a, &lt;span class=\"st\"&gt;\"ann\"&lt;/span&gt;, &lt;span class=\"nu\"&gt;500&lt;/span&gt;, &lt;span class=\"nu\"&gt;50&lt;/span&gt;, &lt;span class=\"st\"&gt;\"1\"&lt;/span&gt;)\n    a, _ = &lt;span class=\"fn\"&gt;place_bid&lt;/span&gt;(a, &lt;span class=\"st\"&gt;\"ann\"&lt;/span&gt;, &lt;span class=\"nu\"&gt;900&lt;/span&gt;, &lt;span class=\"nu\"&gt;95&lt;/span&gt;, &lt;span class=\"st\"&gt;\"2\"&lt;/span&gt;)                       &lt;span class=\"cm\"&gt;# ann leads and only raises her ceiling&lt;/span&gt;\n    &lt;span class=\"kw\"&gt;assert&lt;/span&gt; a.end == &lt;span class=\"nu\"&gt;100&lt;/span&gt; &lt;span class=\"kw\"&gt;and&lt;/span&gt; a.ext_used == &lt;span class=\"nu\"&gt;0&lt;/span&gt; &lt;span class=\"kw\"&gt;and&lt;/span&gt; a.price == &lt;span class=\"nu\"&gt;100&lt;/span&gt;\n    a, _ = &lt;span class=\"fn\"&gt;place_bid&lt;/span&gt;(a, &lt;span class=\"st\"&gt;\"bob\"&lt;/span&gt;, &lt;span class=\"nu\"&gt;700&lt;/span&gt;, &lt;span class=\"nu\"&gt;96&lt;/span&gt;, &lt;span class=\"st\"&gt;\"3\"&lt;/span&gt;)                       &lt;span class=\"cm\"&gt;# a real challenger does extend&lt;/span&gt;\n    &lt;span class=\"kw\"&gt;assert&lt;/span&gt; a.end == &lt;span class=\"nu\"&gt;106&lt;/span&gt; &lt;span class=\"kw\"&gt;and&lt;/span&gt; a.ext_used == &lt;span class=\"nu\"&gt;1&lt;/span&gt;\n\n\n&lt;span class=\"kw\"&gt;def&lt;/span&gt; &lt;span class=\"fn\"&gt;test_soft_close_and_cap&lt;/span&gt;():\n    a = &lt;span class=\"fn\"&gt;Auction&lt;/span&gt;(start=&lt;span class=\"nu\"&gt;100&lt;/span&gt;, end=&lt;span class=\"nu\"&gt;100&lt;/span&gt;, window=&lt;span class=\"nu\"&gt;10&lt;/span&gt;, extend=&lt;span class=\"nu\"&gt;10&lt;/span&gt;, max_ext=&lt;span class=\"nu\"&gt;2&lt;/span&gt;)\n    a, _ = &lt;span class=\"fn\"&gt;place_bid&lt;/span&gt;(a, &lt;span class=\"st\"&gt;\"ann\"&lt;/span&gt;, &lt;span class=\"nu\"&gt;500&lt;/span&gt;, &lt;span class=\"nu\"&gt;50&lt;/span&gt;, &lt;span class=\"st\"&gt;\"1\"&lt;/span&gt;)\n    &lt;span class=\"kw\"&gt;assert&lt;/span&gt; a.end == &lt;span class=\"nu\"&gt;100&lt;/span&gt;                                            &lt;span class=\"cm\"&gt;# early bid: no extension&lt;/span&gt;\n    a, _ = &lt;span class=\"fn\"&gt;place_bid&lt;/span&gt;(a, &lt;span class=\"st\"&gt;\"bob\"&lt;/span&gt;, &lt;span class=\"nu\"&gt;900&lt;/span&gt;, &lt;span class=\"nu\"&gt;95&lt;/span&gt;, &lt;span class=\"st\"&gt;\"2\"&lt;/span&gt;)\n    &lt;span class=\"kw\"&gt;assert&lt;/span&gt; a.end == &lt;span class=\"nu\"&gt;105&lt;/span&gt; &lt;span class=\"kw\"&gt;and&lt;/span&gt; a.ext_used == &lt;span class=\"nu\"&gt;1&lt;/span&gt;\n    a, _ = &lt;span class=\"fn\"&gt;place_bid&lt;/span&gt;(a, &lt;span class=\"st\"&gt;\"ann\"&lt;/span&gt;, &lt;span class=\"nu\"&gt;1500&lt;/span&gt;, &lt;span class=\"nu\"&gt;104&lt;/span&gt;, &lt;span class=\"st\"&gt;\"3\"&lt;/span&gt;)\n    &lt;span class=\"kw\"&gt;assert&lt;/span&gt; a.end == &lt;span class=\"nu\"&gt;114&lt;/span&gt; &lt;span class=\"kw\"&gt;and&lt;/span&gt; a.ext_used == &lt;span class=\"nu\"&gt;2&lt;/span&gt;\n    a, _ = &lt;span class=\"fn\"&gt;place_bid&lt;/span&gt;(a, &lt;span class=\"st\"&gt;\"bob\"&lt;/span&gt;, &lt;span class=\"nu\"&gt;2500&lt;/span&gt;, &lt;span class=\"nu\"&gt;113&lt;/span&gt;, &lt;span class=\"st\"&gt;\"4\"&lt;/span&gt;)\n    &lt;span class=\"kw\"&gt;assert&lt;/span&gt; a.end == &lt;span class=\"nu\"&gt;114&lt;/span&gt; &lt;span class=\"kw\"&gt;and&lt;/span&gt; a.ext_used == &lt;span class=\"nu\"&gt;2&lt;/span&gt;                        &lt;span class=\"cm\"&gt;# cap reached: end no longer moves&lt;/span&gt;\n    a, status = &lt;span class=\"fn\"&gt;place_bid&lt;/span&gt;(a, &lt;span class=\"st\"&gt;\"ann\"&lt;/span&gt;, &lt;span class=\"nu\"&gt;4000&lt;/span&gt;, &lt;span class=\"nu\"&gt;114&lt;/span&gt;, &lt;span class=\"st\"&gt;\"5\"&lt;/span&gt;)\n    &lt;span class=\"kw\"&gt;assert&lt;/span&gt; status == &lt;span class=\"st\"&gt;\"closed\"&lt;/span&gt;\n\n\n&lt;span class=\"cm\"&gt;# ---- concurrency: a broken \"blind write\" version versus compare-and-set ----&lt;/span&gt;\n&lt;span class=\"kw\"&gt;def&lt;/span&gt; &lt;span class=\"fn\"&gt;naive_bid&lt;/span&gt;(store, bidder, mx, now, bid_id, hook):\n    a = store.&lt;span class=\"fn\"&gt;get&lt;/span&gt;()\n    new, status = &lt;span class=\"fn\"&gt;place_bid&lt;/span&gt;(a, bidder, mx, now, bid_id)\n    &lt;span class=\"fn\"&gt;hook&lt;/span&gt;()\n    store._a = new                                                 &lt;span class=\"cm\"&gt;# blind write: overwrites whatever is there now&lt;/span&gt;\n    &lt;span class=\"kw\"&gt;return&lt;/span&gt; status\n\n\n&lt;span class=\"kw\"&gt;def&lt;/span&gt; &lt;span class=\"fn\"&gt;force_race&lt;/span&gt;(bid_fn):\n    &lt;span class=\"st\"&gt;\"\"\"Two bidders read the same state; bob (the higher bid) commits first, ann (lower) commits last.\"\"\"&lt;/span&gt;\n    store = &lt;span class=\"fn\"&gt;Store&lt;/span&gt;(&lt;span class=\"fn\"&gt;replace&lt;/span&gt;(&lt;span class=\"fn\"&gt;Auction&lt;/span&gt;(start=&lt;span class=\"nu\"&gt;100&lt;/span&gt;, end=&lt;span class=\"nu\"&gt;1000&lt;/span&gt;), leader=&lt;span class=\"st\"&gt;\"cat\"&lt;/span&gt;, top=&lt;span class=\"nu\"&gt;1000&lt;/span&gt;, price=&lt;span class=\"nu\"&gt;100&lt;/span&gt;,\n                          bids=((&lt;span class=\"st\"&gt;\"c0\"&lt;/span&gt;, &lt;span class=\"st\"&gt;\"cat\"&lt;/span&gt;, &lt;span class=\"nu\"&gt;1000&lt;/span&gt;, &lt;span class=\"nu\"&gt;0&lt;/span&gt;),), seen=&lt;span class=\"bi\"&gt;frozenset&lt;/span&gt;({&lt;span class=\"st\"&gt;\"c0\"&lt;/span&gt;}), version=&lt;span class=\"nu\"&gt;1&lt;/span&gt;))\n    both_read = threading.&lt;span class=\"fn\"&gt;Barrier&lt;/span&gt;(&lt;span class=\"nu\"&gt;2&lt;/span&gt;)\n    bob_done = threading.&lt;span class=\"fn\"&gt;Event&lt;/span&gt;()\n    calls = {&lt;span class=\"st\"&gt;\"bob\"&lt;/span&gt;: &lt;span class=\"nu\"&gt;0&lt;/span&gt;, &lt;span class=\"st\"&gt;\"ann\"&lt;/span&gt;: &lt;span class=\"nu\"&gt;0&lt;/span&gt;}\n\n    &lt;span class=\"kw\"&gt;def&lt;/span&gt; &lt;span class=\"fn\"&gt;bob_hook&lt;/span&gt;():\n        calls[&lt;span class=\"st\"&gt;\"bob\"&lt;/span&gt;] += &lt;span class=\"nu\"&gt;1&lt;/span&gt;\n        & ;/span&gt;(final)\n\n\n&lt;span class=\"kw\"&gt;def&lt;/span&gt; &lt;span class=\"fn\"&gt;test_retry_after_a_lost_race_uses_a_fresh_clock&lt;/span&gt;():\n    store = &lt;span class=\"fn\"&gt;Store&lt;/span&gt;(&lt;span class=\"fn\"&gt;Auction&lt;/span&gt;(start=&lt;span class=\"nu\"&gt;100&lt;/span&gt;, end=&lt;span class=\"nu\"&gt;100&lt;/span&gt;))\n    clock = [&lt;span class=\"nu\"&gt;99&lt;/span&gt;]\n\n    &lt;span class=\"kw\"&gt;def&lt;/span&gt; &lt;span class=\"fn\"&gt;interfere&lt;/span&gt;():                                               &lt;span class=\"cm\"&gt;# during bob's first attempt, someone else commits&lt;/span&gt;\n        &lt;span class=\"kw\"&gt;if&lt;/span&gt; clock[&lt;span class=\"nu\"&gt;0&lt;/span&gt;] == &lt;span class=\"nu\"&gt;99&lt;/span&gt;:\n            a = store.&lt;span class=\"fn\"&gt;get&lt;/span&gt;()\n            new, _ = &lt;span class=\"fn\"&gt;place_bid&lt;/span&gt;(a, &lt;span class=\"st\"&gt;\"ann\"&lt;/span&gt;, &lt;span class=\"nu\"&gt;500&lt;/span&gt;, &lt;span class=\"nu\"&gt;99&lt;/span&gt;, &lt;span class=\"st\"&gt;\"ann-1\"&lt;/span&gt;)\n            &lt;span class=\"kw\"&gt;assert&lt;/span&gt; store.&lt;span class=\"fn\"&gt;cas&lt;/span&gt;(a.version, new)\n            clock[&lt;span class=\"nu\"&gt;0&lt;/span&gt;] = &lt;span class=\"nu\"&gt;101&lt;/span&gt;                                         &lt;span class=\"cm\"&gt;# and the clock passes the end time&lt;/span&gt;\n\n    &lt;span class=\"kw\"&gt;assert&lt;/span&gt; &lt;span class=\"fn\"&gt;bid&lt;/span&gt;(store, &lt;span class=\"st\"&gt;\"bob\"&lt;/span&gt;, &lt;span class=\"nu\"&gt;900&lt;/span&gt;, &lt;span class=\"kw\"&gt;lambda&lt;/span&gt;: clock[&lt;span class=\"nu\"&gt;0&lt;/span&gt;], &lt;span class=\"st\"&gt;\"bob-1\"&lt;/span&gt;, interfere) == &lt;span class=\"st\"&gt;\"closed\"&lt;/span&gt;\n    &lt;span class=\"kw\"&gt;assert&lt;/span&gt; store.&lt;span class=\"fn\"&gt;get&lt;/span&gt;().leader == &lt;span class=\"st\"&gt;\"ann\"&lt;/span&gt;\n\n\n&lt;span class=\"kw\"&gt;def&lt;/span&gt; &lt;span class=\"fn\"&gt;test_scheduler_closes_once_and_requeues_extended&lt;/span&gt;():\n    stores = {&lt;span class=\"st\"&gt;\"x\"&lt;/span&gt;: &lt;span class=\"fn\"&gt;Store&lt;/span&gt;(&lt;span class=\"fn\"&gt;Auction&lt;/span&gt;(start=&lt;span class=\"nu\"&gt;100&lt;/span&gt;, end=&lt;span class=\"nu\"&gt;100&lt;/span&gt;, window=&lt;span class=\"nu\"&gt;10&lt;/span&gt;, extend=&lt;span class=\"nu\"&gt;10&lt;/span&gt;, max_ext=&lt;span class=\"nu\"&gt;2&lt;/span&gt;))}\n    sched = &lt;span class=\"fn\"&gt;Scheduler&lt;/span&gt;()\n    sched.&lt;span class=\"fn\"&gt;schedule&lt;/span&gt;(&lt;span class=\"nu\"&gt;100&lt;/span&gt;, &lt;span class=\"st\"&gt;\"x\"&lt;/span&gt;)\n    &lt;span class=\"fn\"&gt;bid&lt;/span&gt;(stores[&lt;span class=\"st\"&gt;\"x\"&lt;/span&gt;], &lt;span class=\"st\"&gt;\"ann\"&lt;/span&gt;, &lt;span class=\"nu\"&gt;500&lt;/span&gt;, &lt;span class=\"nu\"&gt;95&lt;/span&gt;, &lt;span class=\"st\"&gt;\"1\"&lt;/span&gt;)                          &lt;span class=\"cm\"&gt;# extends the end to 105&lt;/span&gt;\n    &lt;span class=\"kw\"&gt;assert&lt;/span&gt; sched.&lt;span class=\"fn\"&gt;due&lt;/span&gt;(&lt;span class=\"nu\"&gt;101&lt;/span&gt;, stores) == [] &lt;span class=\"kw\"&gt;and&lt;/span&gt; &lt;span class=\"kw\"&gt;not&lt;/span&gt; stores[&lt;span class=\"st\"&gt;\"x\"&lt;/span&gt;].&lt;span class=\"fn\"&gt;get&lt;/span&gt;().closed\n    &lt;span class=\"kw\"&gt;assert&lt;/span&gt; sched.&lt;span class=\"fn\"&gt;due&lt;/span&gt;(&lt;span class=\"nu\"&gt;105&lt;/span&gt;, stores) == [&lt;span class=\"st\"&gt;\"x\"&lt;/span&gt;] &lt;span class=\"kw\"&gt;and&lt;/span&gt; stores[&lt;span class=\"st\"&gt;\"x\"&lt;/span&gt;].&lt;span class=\"fn\"&gt;get&lt;/span&gt;().closed\n    sched.&lt;span class=\"fn\"&gt;schedule&lt;/span&gt;(&lt;span class=\"nu\"&gt;105&lt;/span&gt;, &lt;span class=\"st\"&gt;\"x\"&lt;/span&gt;)                                       &lt;span class=\"cm\"&gt;# a stale duplicate entry&lt;/span&gt;\n    &lt;span class=\"kw\"&gt;assert&lt;/span&gt; sched.&lt;span class=\"fn\"&gt;due&lt;/span&gt;(&lt;span class=\"nu\"&gt;200&lt;/span&gt;, stores) == []                            &lt;span class=\"cm\"&gt;# already closed: nothing happens&lt;/span&gt;\n    &lt;span class=\"kw\"&gt;assert&lt;/span&gt; &lt;span class=\"fn\"&gt;bid&lt;/span&gt;(stores[&lt;span class=\"st\"&gt;\"x\"&lt;/span&gt;], &lt;span class=\"st\"&gt;\"bob\"&lt;/span&gt;, &lt;span class=\"nu\"&gt;9000&lt;/span&gt;, &lt;span class=\"nu\"&gt;106&lt;/span&gt;, &lt;span class=\"st\"&gt;\"2\"&lt;/span&gt;) == &lt;span class=\"st\"&gt;\"closed\"&lt;/span&gt;\n\n\n&lt;span class=\"kw\"&gt;if&lt;/span&gt; __name__ == &lt;span class=\"st\"&gt;\"__main__\"&lt;/span&gt;:\n    &lt;span class=\"fn\"&gt;test_increment_table_boundaries&lt;/span&gt;(); &lt;span class=\"bi\"&gt;print&lt;/span&gt;(&lt;span class=\"st\"&gt;\"increment table matches eBay's published tiers: ok\"&lt;/span&gt;)\n    &lt;span class=\"fn\"&gt;test_ebay_style_example&lt;/span&gt;(); &lt;span class=\"bi\"&gt;print&lt;/span&gt;(&lt;span class=\"st\"&gt;\"$12 max vs $15 max -&amp;gt; $12.50: ok\"&lt;/span&gt;)\n    &lt;span class=\"fn\"&gt;test_random_sequential&lt;/span&gt;(); &lt;span class=\"bi\"&gt;print&lt;/span&gt;(&lt;span class=\"st\"&gt;\"3,000 random bid sequences match the closed-form oracle: ok\"&lt;/span&gt;)\n    &lt;span class=\"fn\"&gt;test_duplicate_is_ignored&lt;/span&gt;(); &lt;span class=\"fn\"&gt;test_soft_close_and_cap&lt;/span&gt;(); &lt;span class=\"bi\"&gt;print&lt;/span&gt;(&lt;span class=\"st\"&gt;\"duplicates ignored; soft close + cap: ok\"&lt;/span&gt;)\n    &lt;span class=\"fn\"&gt;test_extension_is_counted_only_when_the_end_moves&lt;/span&gt;(); &lt;span class=\"fn\"&gt;test_leader_raising_their_own_maximum_does_not_extend&lt;/span&gt;()\n    &lt;span class=\"bi\"&gt;print&lt;/span&gt;(&lt;span class=\"st\"&gt;\"extension counted only when the end moves; a leader's own raise does not extend: ok\"&lt;/span&gt;)\n    &lt;span class=\"fn\"&gt;test_retry_after_a_lost_race_uses_a_fresh_clock&lt;/span&gt;(); &lt;span class=\"bi\"&gt;print&lt;/span&gt;(&lt;span class=\"st\"&gt;\"a retry after a lost race re-reads the clock: ok\"&lt;/span&gt;)\n    &lt;span class=\"fn\"&gt;test_blind_write_loses_the_highest_bid&lt;/span&gt;(); &lt;span class=\"bi\"&gt;print&lt;/span&gt;(&lt;span class=\"st\"&gt;\"blind write version loses the higher bid (the bug is real): ok\"&lt;/span&gt;)\n    &lt;span class=\"fn\"&gt;test_compare_and_set_keeps_the_highest_bid&lt;/span&gt;(); &lt;span class=\"bi\"&gt;print&lt;/span&gt;(&lt;span class=\"st\"&gt;\"compare-and-set keeps the higher bid: ok\"&lt;/span&gt;)\n    &lt;span class=\"kw\"&gt;for&lt;/span&gt; _ &lt;span class=\"kw\"&gt;in&lt;/span&gt; &lt;span class=\"bi\"&gt;range&lt;/span&gt;(&lt;span class=\"nu\"&gt;5&lt;/span&gt;):\n        &lt;span class=\"fn\"&gt;test_threaded_stress&lt;/span&gt;()\n    &lt;span class=\"bi\"&gt;print&lt;/span&gt;(&lt;span class=\"st\"&gt;\"5 threaded stress runs (8 threads x 150 bids): ok\"&lt;/span&gt;)\n    &lt;span class=\"fn\"&gt;test_scheduler_closes_once_and_requeues_extended&lt;/span&gt;(); &lt;span class=\"bi\"&gt;print&lt;/span&gt;(&lt;span class=\"st\"&gt;\"scheduler: closes once, re-queues extended: ok\"&lt;/span&gt;)", "POST /auctions/8841/bids\n{\"bidId\": \"9d3f-...-c1\", \"maxAmount\": 1500}\n\n200 {\"status\": \"ok\", \"youLead\": true, \"price\": 1250, \"endsAt\": \"2026-10-20T18:05:00Z\"}\n200 {\"status\": \"too_low\", \"minimumBid\": 1300}\n409 {\"status\": \"closed\"}": "POST /auctions/&lt;span class=\"nu\"&gt;8841&lt;/span&gt;/bids\n{&lt;span class=\"bi\"&gt;\"bidId\"&lt;/span&gt;: &lt;span class=\"st\"&gt;\"9d3f-...-c1\"&lt;/span&gt;, &lt;span class=\"bi\"&gt;\"maxAmount\"&lt;/span&gt;: &lt;span class=\"nu\"&gt;1500&lt;/span&gt;}\n\n&lt;span class=\"nu\"&gt;200&lt;/span&gt; {&lt;span class=\"bi\"&gt;\"status\"&lt;/span&gt;: &lt;span class=\"st\"&gt;\"ok\"&lt;/span&gt;, &lt;span class=\"bi\"&gt;\"youLead\"&lt;/span&gt;: &lt;span class=\"kw\"&gt;true&lt;/span&gt;, &lt;span class=\"bi\"&gt;\"price\"&lt;/span&gt;: &lt;span class=\"nu\"&gt;1250&lt;/span&gt;, &lt;span class=\"bi\"&gt;\"endsAt\"&lt;/span&gt;: &lt;span class=\"st\"&gt;\"2026-10-20T18:05:00Z\"&lt;/span&gt;}\n&lt;span class=\"nu\"&gt;200&lt;/span&gt; {&lt;span class=\"bi\"&gt;\"status\"&lt;/span&gt;: &lt;span class=\"st\"&gt;\"too_low\"&lt;/span&gt;, &lt;span class=\"bi\"&gt;\"minimumBid\"&lt;/span&gt;: &lt;span class=\"nu\"&gt;1300&lt;/span&gt;}\n&lt;span class=\"nu\"&gt;409&lt;/span&gt; {&lt;span class=\"bi\"&gt;\"status\"&lt;/span&gt;: &lt;span class=\"st\"&gt;\"closed\"&lt;/span&gt;}"}</textarea>
