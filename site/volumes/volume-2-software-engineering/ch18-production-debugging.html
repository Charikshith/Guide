## Concept

Debugging live systems safely — read-only access, replicating in staging, graceful degradation, and forensics.

**In one sentence:** production is where the real bug lives but also where mistakes hurt customers, so you debug it the way a doctor examines a patient — observe first, touch carefully, change one thing at a time, reproduce risky experiments somewhere safe, and keep switches ready to turn off whatever is failing.

**Mental model — a surgeon vs a mechanic in a garage.** A mechanic can take the engine apart on the bench (local debugging). A surgeon works on a live patient: first scans and tests (read-only observation), then a plan, then the smallest possible incision, with monitors on the whole time and a way to stop. You also practice difficult procedures on a simulator first (staging).

**Rules of engagement in production**

| Rule | Why |
|------|-----|
| **Observe before you touch**: metrics, traces, logs, recent changes | most bugs reveal themselves without any intervention |
| **Read-only by default** | read replicas, `SELECT` only, `kubectl get/logs/describe`, profilers attached in sampling mode |
| Announce what you're doing (the incident channel) | others need to know which changes are yours |
| **One change at a time**, reversible, with a noted time | otherwise you can't tell cause from effect |
| Never mutate prod data by hand without a reviewed script, a transaction, and a backup | a typo in `UPDATE` without `WHERE` is its own incident |
| Capture evidence *before* restarting (heap dump, thread dump, core dump, logs) | a restart destroys the crime scene |
| Reproduce in staging with prod-like data and traffic | experiment freely there |
| Leave instrumentation behind | the next person debugs faster |

**The toolkit (least to most invasive)**

| Tool | Shows | Risk |
|------|-------|------|
| Dashboards, traces, logs | what, where, when | none |
| `kubectl logs/describe/top`, `kubectl get events` | pod state, restarts, OOMKills, probe failures | none |
| Dynamic log level / debug flag for one tenant | extra detail | low (volume) |
| Sampling profiler: `py-spy dump`/`top`, async-profiler, `perf` | hot code, stuck threads | very low |
| Thread dump / `py-spy dump` | what every thread is doing *now* (deadlocks) | very low |
| `strace -p` / `ltrace` | syscalls: stuck on which file, socket, or lock? | medium (slows the process) |
| Heap dump / `memray attach` / `gcore` | memory leaks, object counts | medium (pauses, big files, contains PII) |
| `kubectl debug` ephemeral container | tools inside the pod's namespaces | low |
| Attaching a debugger with breakpoints | full control | **high** — pauses the process; almost never in prod |

**Graceful degradation** — design the system to lose non-essential features instead of failing entirely: serve cached or default recommendations, hide a broken widget, queue work for later, show "prices may be delayed". Built with **feature flags / kill switches** ([Ch 7](ch07-packaging-and-release-engineering.md)), **timeouts**, **bulkheads** (separate pools per dependency), and **circuit breakers**.

**Circuit breaker** — wraps calls to a dependency. After too many failures it *opens*: calls fail fast (or use a fallback) without waiting on the broken dependency, so threads aren't exhausted and the dependency can recover. After a cool-down it goes *half-open* and lets a trial request through; success closes it again. Details in [Vol 3 Ch 14](../volume-3-low-level-design/ch14-resilience-patterns-idempotency-retries-backoff-circuit-breakers.md).

**Forensics** — preserve evidence (logs, dumps, the exact artifact version, configs, recent changes), write the timeline as you go, and record what you checked and ruled out. That becomes the postmortem ([Ch 17](ch17-incident-response-and-postmortems.md)).

## Diagram

**A decision flow: observe → hypothesize → reproduce in staging → fix → verify**

```mermaid
flowchart TD
    O["observe (read-only):&lt;br/&gt;SLO panels, traces, logs,&lt;br/&gt;recent deploys / flags / config"] --&gt; IMP{"users hurt right now?"}
    IMP -- yes --&gt; MIT["mitigate first:&lt;br/&gt;roll back / flag off / degrade"] --&gt; O
    IMP -- no --&gt; H["hypothesis: one specific, testable claim"]
    H --&gt; EV["gather evidence in prod, read-only:&lt;br/&gt;profiler, thread dump, specific queries"]
    EV --&gt; OK{"supports it?"}
    OK -- no --&gt; H
    OK -- yes --&gt; REP["reproduce in staging&lt;br/&gt;(prod-like data + traffic replay)"]
    REP --&gt; FIX["fix + a regression test"]
    FIX --&gt; CAN["canary deploy"] --&gt; VER["verify with the same metrics&lt;br/&gt;that showed the problem"]
    VER --&gt; DOC["forensic notes → postmortem"]
```

**Circuit breaker states**

```mermaid
stateDiagram-v2
    [*] --&gt; Closed
    Closed --&gt; Open: failures ≥ 5 in 10 s
    Open --&gt; HalfOpen: after 30 s cool-down
    HalfOpen --&gt; Closed: trial call succeeds
    HalfOpen --&gt; Open: trial call fails
    note right of Open
      calls fail fast → fallback
      (cached data, default, or 503)
    end note
```

**Graceful degradation on a product page**

```
 ┌───────────────────────────── product page ───────────────────────────────┐
 │ title, price, buy button      ← critical: must work (strict timeouts)    │
 │ reviews                       ← degrade: cached copy, 10 min old          │
 │ "customers also bought"       ← degrade: static bestsellers (breaker open)│
 │ personalized banner           ← degrade: hidden (kill switch recs=off)    │
 └──────────────────────────────────────────────────────────────────────────┘
   the recommendations service is down, but customers can still buy
```

## Example

```bash
# Observe (read-only)
kubectl -n shop get pods -o wide                   # restarts? which nodes?
kubectl -n shop describe pod api-7d9f-abc | tail -20   # OOMKilled? probe failures? events
kubectl -n shop logs deploy/api --since=15m | jq -c 'select(.level=="error")' | head
kubectl -n shop top pods
kubectl -n shop rollout history deploy/api         # what changed recently?

# Capture evidence before restarting anything
kubectl -n shop debug -it api-7d9f-abc --image=python:3.12 --target=api -- bash
#   inside: pip install py-spy &amp;&amp; py-spy dump --pid 1      # where is every thread stuck?
#   memray attach 1 --duration 30 -o /tmp/leak.bin         # memory growth
strace -f -p &lt;pid&gt; -e trace=network,read,write -T 2&gt;&amp;1 | head   # blocked on which socket?
```

```python
# A circuit breaker with a fallback (minimal version; use pybreaker/resilience4j in real code)
import time

class CircuitBreaker:
    def __init__(self, max_failures=5, reset_after=30.0, clock=time.monotonic):
        self.max_failures, self.reset_after, self.clock = max_failures, reset_after, clock
        self.failures, self.opened_at = 0, None

    def call(self, fn, fallback):
        if self.opened_at is not None:
            if self.clock() - self.opened_at &lt; self.reset_after:
                return fallback()                       # OPEN: fail fast
            self.opened_at = None                       # HALF-OPEN: allow one trial
            self.failures = self.max_failures - 1
        try:
            result = fn()
        except Exception:
            self.failures += 1
            if self.failures &gt;= self.max_failures:
                self.opened_at = self.clock()           # trip → OPEN
            return fallback()
        self.failures = 0                               # success → CLOSED
        return result

recs_breaker = CircuitBreaker()

def recommendations(user_id):
    if not flags.is_enabled("recs"):                    # kill switch
        return BESTSELLERS
    return recs_breaker.call(lambda: recs_client.get(user_id, timeout=0.3),
                             fallback=lambda: BESTSELLERS)
```

```sql
-- Safe manual data fix: reviewed, scoped, transactional, with a check before COMMIT
BEGIN;
UPDATE orders SET status = 'paid'
WHERE id IN (SELECT order_id FROM payments WHERE captured_at &gt; '2024-06-12 14:09' AND status = 'captured')
  AND status = 'pending';
-- expect ~412 rows; the client reports the count
SELECT count(*) FROM orders WHERE status = 'pending' AND created_at &gt; '2024-06-12 14:00';
COMMIT;   -- or ROLLBACK if the numbers don't match the review
```

## Exercises

1. Diagnose a simulated production failure using only logs/metrics/traces.

   &lt;details&gt;&lt;summary&gt;Solution&lt;/summary&gt;Example: p99 jumped at 10:40 with no deploy. Metrics show DB pool wait time rising and CPU normal → contention on a dependency, not compute. Traces show slow &lt;code&gt;SELECT … FROM orders WHERE customer_email = …&lt;/code&gt; spans. Logs show a new marketing job started at 10:38 running that query in a loop. Hypothesis: a missing index plus a new traffic pattern. Evidence: &lt;code&gt;EXPLAIN&lt;/code&gt; on a replica shows a sequential scan. Mitigation: pause the job; fix: add the index concurrently; verify pool waits return to normal.&lt;/details&gt;

2. Add a graceful-degradation path with a circuit breaker.

   &lt;details&gt;&lt;summary&gt;Solution&lt;/summary&gt;Wrap the non-critical dependency call in a tight timeout plus a breaker (as above), with a fallback that is cheap and safe (cached result, static default, or a hidden component). Emit metrics for breaker state and fallback count, and alert on a breaker that stays open. Test it by making the dependency hang: the page must still load within its SLO.&lt;/details&gt;

3. A pod is using 95% memory and climbing. Why not just restart it right away?

   &lt;details&gt;&lt;summary&gt;Solution&lt;/summary&gt;A restart destroys the evidence and the leak will return. If users aren't hurt yet, first capture a heap profile or dump (&lt;code&gt;memray attach&lt;/code&gt;, a JVM heap dump), note the version and traffic pattern, then restart or scale as mitigation. If users &lt;i&gt;are&lt;/i&gt; hurt, mitigate first — but try to capture from one pod while restarting the others.&lt;/details&gt;

## Mini project

**Inject a failure into a running service, debug it read-only, fix, and write up the forensic trail.**

```mermaid
flowchart LR
    SVC["a service with OTel +&lt;br/&gt;dashboards (Ch 14)"] --&gt; INJ["a teammate secretly injects one fault:&lt;br/&gt;memory leak · slow query ·&lt;br/&gt;lock contention · dependency timeout"]
    INJ --&gt; YOU["you: observe → hypothesize →&lt;br/&gt;read-only evidence (py-spy, logs, traces)"]
    YOU --&gt; MIT["mitigate&lt;br/&gt;(flag / breaker / rollback)"]
    MIT --&gt; STG["reproduce in staging"] --&gt; FIX["fix + regression test"] --&gt; CAN["canary + verify"]
    YOU --&gt; NOTES["forensic log: time, command,&lt;br/&gt;observation, conclusion"] --&gt; PM["postmortem"]
```

**Steps**

1. Add fault-injection switches (env var or flag) to a service: memory leak, N+1 query, a lock held too long, a dependency that hangs.
2. Add a kill switch and a circuit breaker around one non-critical dependency.
3. A teammate turns one fault on without telling you which.
4. Debug using only read-only tools; log every command and what you concluded, with timestamps.
5. Mitigate without a code change (flag, breaker, rollback), then reproduce in staging, fix, and canary.
6. Write a short postmortem from the forensic log.

**Done when:** you identify the injected fault from evidence alone, users see degradation rather than an outage, and the forensic log lets someone else follow your reasoning step by step.

## Open source

* [`async-profiler`](https://github.com/async-profiler/async-profiler) — a low-overhead sampling profiler for the JVM (CPU, allocations, locks), safe to attach in production; for Python, `benfred/py-spy` and `bloomberg/memray`.
* [`brendangregg/perf-tools`](https://github.com/brendangregg/perf-tools) — small scripts built on ftrace/perf for live Linux diagnosis (`iosnoop`, `execsnoop`, `opensnoop`); see also the BCC/bpftrace tools and Brendan Gregg's "Linux Performance Analysis in 60 Seconds".

---

## Interview

1. **"How do you debug a production-only issue?"**
   &lt;details&gt;&lt;summary&gt;Answer&lt;/summary&gt;Mitigate first if users are affected. Then observe read-only: SLO dashboards, traces, and logs, and diff everything that changed (deploys, flags, config, traffic, data shape, dependencies). Form a specific hypothesis and test it with low-risk evidence (sampling profilers, thread and heap dumps, targeted queries on replicas), capturing evidence before any restart. Reproduce in staging with prod-like data or replayed traffic, fix with a regression test, roll out with a canary, verify with the original symptom's metrics, and document the trail.&lt;/details&gt;

2. **"What's a circuit breaker for?"**
   &lt;details&gt;&lt;summary&gt;Answer&lt;/summary&gt;To stop a failing dependency from taking your service down with it. After a threshold of failures or timeouts, the breaker opens and calls fail fast or use a fallback instead of tying up threads and connections waiting. After a cool-down it lets trial requests through (half-open) and closes when they succeed. It limits cascading failures, gives the dependency room to recover, and enables graceful degradation.&lt;/details&gt;

---

## Checklist

- [ ] never mutate prod state carelessly
- [ ] reproduce in staging
- [ ] add degradation knobs

t;/text&gt;\n      &lt;rect class=\"sk\" x=\"245\" y=\"330\" width=\"140\" height=\"50\" rx=\"14\"/&gt;\n      &lt;text class=\"lbl b\" x=\"315\" y=\"361\" text-anchor=\"middle\"&gt;HalfOpen&lt;/text&gt;\n      &lt;path class=\"sk blue\" d=\"M500 170 C 510 240, 460 330, 387 350\" style=\"color:var(--ink)\" marker-end=\"url(#arr)\"/&gt;\n      &lt;text class=\"lbl\" x=\"512\" y=\"268\" style=\"font-size:14px\"&gt;after 30 s cool-down&lt;/text&gt;\n      &lt;path class=\"sk blue\" d=\"M250 332 C 200 290, 170 230, 160 172\" style=\"color:var(--ink)\" marker-end=\"url(#arr)\"/&gt;\n      &lt;text class=\"lbl g\" x=\"150\" y=\"272\" text-anchor=\"end\" style=\"font-size:14px\"&gt;trial call succeeds&lt;/text&gt;\n      &lt;path class=\"sk blue\" d=\"M375 330 C 410 290, 430 230, 440 172\" style=\"color:var(--ink)\" marker-end=\"url(#arr)\"/&gt;\n      &lt;text class=\"lbl r\" x=\"400\" y=\"258\" text-anchor=\"end\" style=\"font-size:14px\"&gt;trial call fails&lt;/text&gt;\n    &lt;/svg&gt;\n    &lt;figcaption&gt;Fig 2: circuit breaker \u2014 Closed \u2192 Open (too many failures) \u2192 HalfOpen (after cool-down) \u2192 Closed (trial succeeds) or back to Open (trial fails)&lt;/figcaption&gt;\n  &lt;/figure&gt;", "&lt;figure&gt;\n    &lt;svg viewBox=\"0 0 660 600\" role=\"img\" aria-label=\"Flow: a service with OTel and dashboards (Ch 14); a teammate secretly injects one fault (memory leak, slow query, lock contention, dependency timeout); you observe, hypothesize and gather read-only evidence (py-spy, logs, traces); then mitigate (flag, breaker, rollback), reproduce in staging, fix with a regression test, canary and verify; you also keep a forensic log (time, command, observation, conclusion) which feeds the postmortem\"&gt;\n      &lt;rect class=\"sk\" x=\"10\" y=\"25\" width=\"250\" height=\"60\" rx=\"10\"/&gt;\n      &lt;text class=\"lbl b\" x=\"135\" y=\"50\" text-anchor=\"middle\" style=\"font-size:15px\"&gt;a service with OTel +&lt;/text&gt;\n      &lt;text class=\"lbl b\" x=\"135\" y=\"71\" text-anchor=\"middle\" style=\"font-size:15px\"&gt;dashboards (Ch 14)&lt;/text&gt;\n      &lt;path class=\"sk blue\" d=\"M260 55 C 272 51, 285 59, 298 55\" style=\"color:var(--ink)\" marker-end=\"url(#arr)\"/&gt;\n      &lt;rect class=\"sk red\" x=\"300\" y=\"10\" width=\"350\" height=\"96\" rx=\"10\"/&gt;\n      &lt;text class=\"lbl r\" x=\"475\" y=\"35\" text-anchor=\"middle\" style=\"font-size:14px\"&gt;a teammate secretly injects one fault:&lt;/text&gt;\n      &lt;text class=\"lbl r\" x=\"475\" y=\"57\" text-anchor=\"middle\" style=\"font-size:14px\"&gt;memory leak \u00b7 slow query \u00b7&lt;/text&gt;\n      &lt;text class=\"lbl r\" x=\"475\" y=\"79\" text-anchor=\"middle\" style=\"font-size:14px\"&gt;lock contention \u00b7&lt;/text&gt;\n      &lt;text class=\"lbl r\" x=\"475\" y=\"98\" text-anchor=\"middle\" style=\"font-size:14px\"&gt;dependency timeout&lt;/text&gt;\n      &lt;path class=\"sk blue\" d=\"M475 106 C 480 125, 470 140, 475 158\" style=\"color:var(--ink)\" marker-end=\"url(#arr)\"/&gt;\n      &lt;rect class=\"sk\" x=\"270\" y=\"160\" width=\"380\" height=\"62\" rx=\"10\"/&gt;\n      &lt;text class=\"lbl b\" x=\"460\" y=\"186\" text-anchor=\"middle\" style=\"font-size:15px\"&gt;you: observe \u2192 hypothesize \u2192&lt;/text&gt;\n      &lt;text class=\"lbl b\" x=\"460\" y=\"208\" text-anchor=\"middle\" style=\"font-size:14px\"&gt;read-only evidence (py-spy, logs, traces)&lt;/text&gt;\n      &lt;path class=\"sk blue\" d=\"M330 222 C 300 240, 250 255, 200 270\" style=\"color:var(--ink)\" marker-end=\"url(#arr)\"/&gt;\n      &lt;path class=\"sk blue\" d=\"M560 222 C 565 240, 555 255, 560 270\" style=\"color:var(--ink)\" marker-end=\"url(#arr)\"/&gt;\n      &lt;rect class=\"sk\" x=\"20\" y=\"272\" width=\"240\" height=\"60\" rx=\"10\"/&gt;\n      &lt;text class=\"lbl b\" x=\"140\" y=\"298\" text-anchor=\"middle\" style=\"font-size:15px\"&gt;mitigate&lt;/text&gt;\n      &lt;text class=\"lbl\" x=\"140\" y=\"320\" text-anchor=\"middle\" style=\"font-size:14px\"&gt;(flag / breaker / rollback)&lt;/text&gt;\n      &lt;path class=\"sk blue\" d=\"M140 332 C 145 345, 135 355, 140 368\" style=\"color:var(--ink)\" marker-end=\"url(#arr)\"/&gt;\n      &lt;rect class=\"sk\" x=\"20\" y=\"370\" width=\"240\" height=\"44\" rx=\"10\"/&gt;\n      &lt;text class=\"lbl b\" x=\"140\" y=\"398\" text-anchor=\"middle\" style=\"font-size:15px\"&gt;reproduce in staging&lt;/text&gt;\n      &lt;path class=\"sk blue\" d=\"M140 414 C 145 425, 135 435, 140 448\" style=\"color:var(--ink)\" marker-end=\"url(#arr)\"/&gt;\n      &lt;rect class=\"sk\" x=\"20\" y=\"450\" width=\"240\" height=\"44\" rx=\"10\"/&gt;\n      &lt;text class=\"lbl b\" x=\"140\" y=\"478\" text-anchor=\"middle\" style=\"font-size:15px\"&gt;fix + regression test&lt;/text&gt;\n      &lt;path class=\"sk blue\" d=\"M140 494 C 145 505, 135 515, 140 528\" style=\"color:var(--ink)\" marker-end=\"url(#arr)\"/&gt;\n      &lt;rect class=\"sk green\" x=\"20\" y=\"530\" width=\"240\" height=\"44\" rx=\"10\"/&gt;\n      &lt;text class=\"lbl g\" x=\"140\" y=\"558\" text-anchor=\"middle\" style=\"font-size:15px\"&gt;canary + verify&lt;/text&gt;\n      &lt;rect class=\"sk\" x=\"420\" y=\"272\" width=\"230\" height=\"82\" rx=\"10\"/&gt;\n      &lt;text class=\"lbl b\" x=\"535\" y=\"296\" text-anchor=\"middle\" style=\"font-size:14px\"&gt;forensic log: time,&lt;/text&gt;\n      &lt;text class=\"lbl b\" x=\"535\" y=\"316\" text-anchor=\"middle\" style=\"font-size:14px\"&gt;command,&lt;/text&gt;\n      &lt;text class=\"lbl b\" x=\"535\" y=\"336\" text-anchor=\"middle\" style=\"font-size:14px\"&gt;observation, conclusion&lt;/text&gt;\n      &lt;path class=\"sk blue\" d=\"M535 354 C 540 375, 530 390, 535 408\" style=\"color:var(--ink)\" marker-end=\"url(#arr)\"/&gt;\n      &lt;rect class=\"sk green\" x=\"455\" y=\"410\" width=\"160\" height=\"44\" rx=\"10\"/&gt;\n      &lt;text class=\"lbl g\" x=\"535\" y=\"438\" text-anchor=\"middle\" style=\"font-size:15px\"&gt;postmortem&lt;/text&gt;\n    &lt;/svg&gt;\n    &lt;figcaption&gt;Fig 3: injected fault \u2192 you debug read-only \u2192 mitigate, reproduce in staging, fix, canary/verify; the forensic log feeds the postmortem&lt;/figcaption&gt;\n  &lt;/figure&gt;"]</textarea>
<textarea id="codes" hidden>{"# Observe (read-only)\nkubectl -n shop get pods -o wide                   # restarts? which nodes?\nkubectl -n shop describe pod api-7d9f-abc | tail -20   # OOMKilled? probe failures? events\nkubectl -n shop logs deploy/api --since=15m | jq -c 'select(.level==\"error\")' | head\nkubectl -n shop top pods\nkubectl -n shop rollout history deploy/api         # what changed recently?\n\n# Capture evidence before restarting anything\nkubectl -n shop debug -it api-7d9f-abc --image=python:3.12 --target=api -- bash\n#   inside: pip install py-spy &amp;&amp; py-spy dump --pid 1      # where is every thread stuck?\n#   memray attach 1 --duration 30 -o /tmp/leak.bin         # memory growth\nstrace -f -p &lt;pid&gt; -e trace=network,read,write -T 2&gt;&amp;1 | head   # blocked on which socket?": "&lt;span class=\"cm\"&gt;# Observe (read-only)&lt;/span&gt;\n&lt;span class=\"bi\"&gt;kubectl&lt;/span&gt; -n shop get pods -o wide                   &lt;span class=\"cm\"&gt;# restarts? which nodes?&lt;/span&gt;\n&lt;span class=\"bi\"&gt;kubectl&lt;/span&gt; -n shop describe pod api-7d9f-abc | &lt;span class=\"bi\"&gt;tail&lt;/span&gt; -&lt;span class=\"nu\"&gt;20&lt;/span&gt;   &lt;span class=\"cm\"&gt;# OOMKilled? probe failures? events&lt;/span&gt;\n&lt;span class=\"bi\"&gt;kubectl&lt;/span&gt; -n shop logs deploy/api --since=15m | jq -c &lt;span class=\"st\"&gt;'select(.level==\"error\")'&lt;/span&gt; | &lt;span class=\"bi\"&gt;head&lt;/span&gt;\n&lt;span class=\"bi\"&gt;kubectl&lt;/span&gt; -n shop &lt;span class=\"bi\"&gt;top&lt;/span&gt; pods\n&lt;span class=\"bi\"&gt;kubectl&lt;/span&gt; -n shop rollout history deploy/api         &lt;span class=\"cm\"&gt;# what changed recently?&lt;/span&gt;\n\n&lt;span class=\"cm\"&gt;# Capture evidence before restarting anything&lt;/span&gt;\n&lt;span class=\"bi\"&gt;kubectl&lt;/span&gt; -n shop debug -it api-7d9f-abc --image=&lt;span class=\"bi\"&gt;python&lt;/span&gt;:&lt;span class=\"nu\"&gt;3&lt;/span&gt;.&lt;span class=\"nu\"&gt;12&lt;/span&gt; --target=api -- bash\n&lt;span class=\"cm\"&gt;#   inside: pip install py-spy &amp;amp;&amp;amp; py-spy dump --pid 1      # where is every thread stuck?&lt;/span&gt;\n&lt;span class=\"cm\"&gt;#   memray attach 1 --duration 30 -o /tmp/leak.bin         # memory growth&lt;/span&gt;\nstrace -f -p &amp;lt;pid&amp;gt; -e trace=network,read,write -T &lt;span class=\"nu\"&gt;2&lt;/span&gt;&amp;gt;&amp;amp;&lt;span class=\"nu\"&gt;1&lt;/span&gt; | &lt;span class=\"bi\"&gt;head&lt;/span&gt;   &lt;span class=\"cm\"&gt;# blocked on which socket?&lt;/span&gt;", "# A circuit breaker with a fallback (minimal version; use pybreaker/resilience4j in real code)\nimport time\n\nclass CircuitBreaker:\n    def __init__(self, max_failures=5, reset_after=30.0, clock=time.monotonic):\n        self.max_failures, self.reset_after, self.clock = max_failures, reset_after, clock\n        self.failures, self.opened_at = 0, None\n\n    def call(self, fn, fallback):\n        if self.opened_at is not None:\n            if self.clock() - self.opened_at &lt; self.reset_after:\n                return fallback()                       # OPEN: fail fast\n            self.opened_at = None                       # HALF-OPEN: allow one trial\n            self.failures = self.max_failures - 1\n        try:\n            result = fn()\n        except Exception:\n            self.failures += 1\n            if self.failures &gt;= self.max_failures:\n                self.opened_at = self.clock()           # trip \u2192 OPEN\n            return fallback()\n        self.failures = 0                               # success \u2192 CLOSED\n        return result\n\nrecs_breaker = CircuitBreaker()\n\ndef recommendations(user_id):\n    if not flags.is_enabled(\"recs\"):                    # kill switch\n        return BESTSELLERS\n    return recs_breaker.call(lambda: recs_client.get(user_id, timeout=0.3),\n                             fallback=lambda: BESTSELLERS)": "&lt;span class=\"cm\"&gt;# A circuit breaker with a fallback (minimal version; use pybreaker/resilience4j in real code)&lt;/span&gt;\n&lt;span class=\"kw\"&gt;import&lt;/span&gt; time\n\n&lt;span class=\"kw\"&gt;class&lt;/span&gt; CircuitBreaker:\n    &lt;span class=\"kw\"&gt;def&lt;/span&gt; &lt;span class=\"fn\"&gt;__init__&lt;/span&gt;(&lt;span class=\"bi\"&gt;self&lt;/span&gt;, max_failures=&lt;span class=\"nu\"&gt;5&lt;/span&gt;, reset_after=&lt;span class=\"nu\"&gt;30.0&lt;/span&gt;, clock=time.monotonic):\n        &lt;span class=\"bi\"&gt;self&lt;/span&gt;.max_failures, &lt;span class=\"bi\"&gt;self&lt;/span&gt;.reset_after, &lt;span class=\"bi\"&gt;self&lt;/span&gt;.clock = max_failures, reset_after, clock\n        &lt;span class=\"bi\"&gt;self&lt;/span&gt;.failures, &lt;span class=\"bi\"&gt;self&lt;/span&gt;.opened_at = &lt;span class=\"nu\"&gt;0&lt;/span&gt;, &lt;span class=\"kw\"&gt;None&lt;/span&gt;\n\n    &lt;span class=\"kw\"&gt;def&lt;/span&gt; &lt;span class=\"fn\"&gt;call&lt;/span&gt;(&lt;span class=\"bi\"&gt;self&lt;/span&gt;, fn, fallback):\n        &lt;span class=\"kw\"&gt;if&lt;/span&gt; &lt;span class=\"bi\"&gt;self&lt;/span&gt;.opened_at &lt;span class=\"kw\"&gt;is&lt;/span&gt; &lt;span class=\"kw\"&gt;not&lt;/span&gt; &lt;span class=\"kw\"&gt;None&lt;/span&gt;:\n            &lt;span class=\"kw\"&gt;if&lt;/span&gt; &lt;span class=\"bi\"&gt;self&lt;/span&gt;.&lt;span class=\"fn\"&gt;clock&lt;/span&gt;() - &lt;span class=\"bi\"&gt;self&lt;/span&gt;.opened_at &amp;lt; &lt;span class=\"bi\"&gt;self&lt;/span&gt;.reset_after:\n                &lt;span class=\"kw\"&gt;return&lt;/span&gt; &lt;span class=\"fn\"&gt;fallback&lt;/span&gt;()                       &lt;span class=\"cm\"&gt;# OPEN: fail fast&lt;/span&gt;\n            &lt;span class=\"bi\"&gt;self&lt;/span&gt;.opened_at = &lt;span class=\"kw\"&gt;None&lt;/span&gt;                       &lt;span class=\"cm\"&gt;# HALF-OPEN: allow one trial&lt;/span&gt;\n            &lt;span class=\"bi\"&gt;self&lt;/span&gt;.failures = &lt;span class=\"bi\"&gt;self&lt;/span&gt;.max_failures - &lt;span class=\"nu\"&gt;1&lt;/span&gt;\n        &lt;span class=\"kw\"&gt;try&lt;/span&gt;:\n            result = &lt;span class=\"fn\"&gt;fn&lt;/span&gt;()\n        &lt;span class=\"kw\"&gt;except&lt;/span&gt; &lt;span class=\"bi\"&gt;Exception&lt;/span&gt;:\n            &lt;span class=\"bi\"&gt;self&lt;/span&gt;.failures += &lt;span class=\"nu\"&gt;1&lt;/span&gt;\n            &lt;span class=\"kw\"&gt;if&lt;/span&gt; &lt;span class=\"bi\"&gt;self&lt;/span&gt;.failures &amp;gt;= &lt;span class=\"bi\"&gt;self&lt;/span&gt;.max_failures:\n                &lt;span class=\"bi\"&gt;self&lt;/span&gt;.opened_at = &lt;span class=\"bi\"&gt;self&lt;/span&gt;.&lt;span class=\"fn\"&gt;clock&lt;/span&gt;()           &lt;span class=\"cm\"&gt;# trip \u2192 OPEN&lt;/span&gt;\n            &lt;span class=\"kw\"&gt;return&lt;/span&gt; &lt;span class=\"fn\"&gt;fallback&lt;/span&gt;()\n        &lt;span class=\"bi\"&gt;self&lt;/span&gt;.failures = &lt;span class=\"nu\"&gt;0&lt;/span&gt;                               &lt;span class=\"cm\"&gt;# success \u2192 CLOSED&lt;/span&gt;\n        &lt;span class=\"kw\"&gt;return&lt;/span&gt; result\n\nrecs_breaker = &lt;span class=\"fn\"&gt;CircuitBreaker&lt;/span&gt;()\n\n&lt;span class=\"kw\"&gt;def&lt;/span&gt; &lt;span class=\"fn\"&gt;recommendations&lt;/span&gt;(user_id):\n    &lt;span class=\"kw\"&gt;if&lt;/span&gt; &lt;span class=\"kw\"&gt;not&lt;/span&gt; flags.&lt;span class=\"fn\"&gt;is_enabled&lt;/span&gt;(&lt;span class=\"st\"&gt;\"recs\"&lt;/span&gt;):                    &lt;span class=\"cm\"&gt;# kill switch&lt;/span&gt;\n        &lt;span class=\"kw\"&gt;return&lt;/span&gt; BESTSELLERS\n    &lt;span class=\"kw\"&gt;return&lt;/span&gt; recs_breaker.&lt;span class=\"fn\"&gt;call&lt;/span&gt;(&lt;span class=\"kw\"&gt;lambda&lt;/span&gt;: recs_client.&lt;span class=\"fn\"&gt;get&lt;/span&gt;(user_id, timeout=&lt;span class=\"nu\"&gt;0.3&lt;/span&gt;),\n                             fallback=&lt;span class=\"kw\"&gt;lambda&lt;/span&gt;: BESTSELLERS)", "-- Safe manual data fix: reviewed, scoped, transactional, with a check before COMMIT\nBEGIN;\nUPDATE orders SET status = 'paid'\nWHERE id IN (SELECT order_id FROM payments WHERE captured_at &gt; '2024-06-12 14:09' AND status = 'captured')\n  AND status = 'pending';\n-- expect ~412 rows; the client reports the count\nSELECT count(*) FROM orders WHERE status = 'pending' AND created_at &gt; '2024-06-12 14:00';\nCOMMIT;   -- or ROLLBACK if the numbers don't match the review": "&lt;span class=\"cm\"&gt;-- Safe manual data fix: reviewed, scoped, transactional, with a check before COMMIT&lt;/span&gt;\n&lt;span class=\"kw\"&gt;BEGIN&lt;/span&gt;;\n&lt;span class=\"kw\"&gt;UPDATE&lt;/span&gt; orders &lt;span class=\"kw\"&gt;SET&lt;/span&gt; status = &lt;span class=\"st\"&gt;'paid'&lt;/span&gt;\n&lt;span class=\"kw\"&gt;WHERE&lt;/span&gt; id &lt;span class=\"kw\"&gt;IN&lt;/span&gt; (&lt;span class=\"kw\"&gt;SELECT&lt;/span&gt; order_id &lt;span class=\"kw\"&gt;FROM&lt;/span&gt; payments &lt;span class=\"kw\"&gt;WHERE&lt;/span&gt; captured_at &amp;gt; &lt;span class=\"st\"&gt;'2024-06-12 14:09'&lt;/span&gt; &lt;span class=\"kw\"&gt;AND&lt;/span&gt; status = &lt;span class=\"st\"&gt;'captured'&lt;/span&gt;)\n  &lt;span class=\"kw\"&gt;AND&lt;/span&gt; status = &lt;span class=\"st\"&gt;'pending'&lt;/span&gt;;\n&lt;span class=\"cm\"&gt;-- expect ~412 rows; the client reports the count&lt;/span&gt;\n&lt;span class=\"kw\"&gt;SELECT&lt;/span&gt; &lt;span class=\"bi\"&gt;count&lt;/span&gt;(*) &lt;span class=\"kw\"&gt;FROM&lt;/span&gt; orders &lt;span class=\"kw\"&gt;WHERE&lt;/span&gt; status = &lt;span class=\"st\"&gt;'pending'&lt;/span&gt; &lt;span class=\"kw\"&gt;AND&lt;/span&gt; created_at &amp;gt; &lt;span class=\"st\"&gt;'2024-06-12 14:00'&lt;/span&gt;;\n&lt;span class=\"kw\"&gt;COMMIT&lt;/span&gt;;   &lt;span class=\"cm\"&gt;-- or ROLLBACK if the numbers don't match the review&lt;/span&gt;"}</textarea>
