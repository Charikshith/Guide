<textarea id="source" hidden># Chapter 12 — Event Bus, CQRS &amp; Event Sourcing

&gt; **Volume 3 — Low-Level Design** · [Contents](index.md) · ← [Chapter 11 — Repository Pattern &amp; Data Mapping](ch11-repository-pattern-and-data-mapping.md) · Next → [Chapter 13 — Concurrency Patterns &amp; Thread Safety](ch13-concurrency-patterns-and-thread-safety.md)

---

## Concept

In-process event bus; command/query separation; storing events as the source of truth and projecting state.

**In one sentence:** inside one application, an event bus lets parts of the code react to "something happened" without calling each other directly; CQRS splits the code that *changes* data from the code that *reads* it so each can be shaped for its job; and event sourcing stores the list of changes itself as the truth and rebuilds current state by replaying it.

**Mental model — a chess game.** The board you see is the *read model*. The move list ("e4, e5, Nf3…") is the *event store*: from it you can rebuild the board at any point, replay the game, or analyze it in new ways later. A move request ("move the knight to f3") is a *command*, which the rules may reject. Announcing "white played Nf3" to the commentators is publishing an *event* on a bus.

This chapter is the **in-process, code-level** view. For the distributed version (Kafka, projections across services, the outbox), see [Vol 1 Ch 52](../volume-1-cs-foundations/ch52-event-sourcing-and-cqrs-distributed-view.md).

**Three ideas, separable**

| Idea | What it is | You can use it without the others? |
|------|-----------|:-:|
| **Event bus** (in-process) | `bus.publish(OrderPlaced(...))` → registered handlers run | yes |
| **CQRS** | commands (write side, domain model, invariants) are separate from queries (read side: denormalized, fast, no domain logic) | yes — even with a normal DB and no events |
| **Event sourcing** | the write model's state = `fold(events)`; the event store is append-only; read models are *projections* | usually paired with CQRS |

**Commands vs queries vs events**

| | Command | Query | Event |
|-|---------|-------|-------|
| Tense | imperative: `PlaceOrder` | question: `GetOrderSummary` | past: `OrderPlaced` |
| Changes state? | yes | **never** | it *records* a change |
| Can fail / be rejected? | yes | no (may return empty) | no — it already happened |
| Handlers | exactly one | exactly one | zero or many |

**CQRS — when is it worth it?**

| Worth it | Not worth it |
|----------|--------------|
| reads and writes have very different shapes or scale (1000:1 reads, dashboards, search) | simple CRUD screens |
| complex domain invariants on the write side | a small team and a simple domain |
| several read models from the same data (list, search, analytics) | when strong read-after-write consistency is required everywhere |
| paired with event sourcing | "because it's modern" |

**How event sourcing enables replay** — because every change is stored as an immutable event in order, you can: rebuild the aggregate's state at any time (`fold`); build a *new* read model later from the full history; fix a buggy projection and rebuild it; answer "what did this look like last Tuesday?" (temporal queries); and audit every change. Costs: event versioning forever, snapshots for long streams, and eventual consistency between write and read models.

**Event bus rules** — handlers must not depend on each other's order; one failing handler shouldn't break others (or should fail the whole command, as a deliberate choice); publish *after* the state change is committed (or use an outbox); keep handlers idempotent if events can be redelivered.

**State = fold over events**

```
 stream cart-7
 #1 CartCreated(customer=c1)        → {items: {}, total: 0}
 #2 ItemAdded(pen, 2, 150)          → {pen: 2}          total 300
 #3 ItemAdded(pad, 1, 400)          → {pen: 2, pad: 1}  total 700
 #4 ItemRemoved(pen)                → {pad: 1}          total 400
 state(cart-7) = reduce(apply, events, initial)   — replay any prefix to time-travel
```

## Example

```python
from collections import defaultdict
from dataclasses import dataclass, field
from functools import reduce

# ---- events ---------------------------------------------------------------------
@dataclass(frozen=True)
class CartCreated:  cart_id: str; customer: str
@dataclass(frozen=True)
class ItemAdded:    cart_id: str; sku: str; qty: int; price: int
@dataclass(frozen=True)
class ItemRemoved:  cart_id: str; sku: str

# ---- in-process event bus ----------------------------------------------------------------
class EventBus:
    def __init__(self): self._handlers = defaultdict(list)
    def subscribe(self, event_type, handler): self._handlers[event_type].append(handler)
    def publish(self, event):
        for h in self._handlers[type(event)]:
            h(event)

# ---- event store (append-only, per stream) + optimistic concurrency ------------------------
class ConcurrencyError(Exception): ...

class EventStore:
    def __init__(self, bus): self.streams, self.bus = defaultdict(list), bus
    def load(self, stream): return list(self.streams[stream])
    def append(self, stream, events, expected_version):
        if len(self.streams[stream]) != expected_version:
            raise ConcurrencyError(f"{stream}: expected v{expected_version}")
        self.streams[stream].extend(events)
        for e in events:
            self.bus.publish(e)                     # after append; in a real system via an outbox

# ---- write model: aggregate state = fold(events) ------------------------------------------
@dataclass
class Cart:
    id: str = ""
    items: dict = field(default_factory=dict)       # sku → (qty, price)
    version: int = 0

def apply(cart: Cart, e) -&gt; Cart:
    match e:
        case CartCreated(): cart.id = e.cart_id
        case ItemAdded():
            q, _ = cart.items.get(e.sku, (0, e.price))
            cart.items[e.sku] = (q + e.qty, e.price)
        case ItemRemoved(): cart.items.pop(e.sku, None)
    cart.version += 1
    return cart

def rehydrate(events): return reduce(apply, events, Cart())

# ---- command handlers (write side) ----------------------------------------------------------
def add_item(store, cart_id, sku, qty, price):
    cart = rehydrate(store.load(cart_id))
    if qty &lt;= 0: raise ValueError("qty must be positive")           # invariant check
    if sum(q for q, _ in cart.items.values()) + qty &gt; 20: raise ValueError("cart limit is 20 items")
    store.append(cart_id, [ItemAdded(cart_id, sku, qty, price)], expected_version=cart.version)

# ---- projection (read side) -------------------------------------------------------------
cart_view = {}                                        # the read model: ready-to-serve rows
def project(e):
    v = cart_view.setdefault(e.cart_id, {"lines": {}, "total": 0})
    if isinstance(e, ItemAdded):
        q = v["lines"].get(e.sku, (0, e.price))[0] + e.qty
        v["lines"][e.sku] = (q, e.price)
    elif isinstance(e, ItemRemoved):
        v["lines"].pop(e.sku, None)
    v["total"] = sum(q * p for q, p in v["lines"].values())

bus = EventBus()
for t in (CartCreated, ItemAdded, ItemRemoved):
    bus.subscribe(t, project)
store = EventStore(bus)

store.append("cart-7", [CartCreated("cart-7", "c1")], expected_version=0)
add_item(store, "cart-7", "pen", 2, 150)
add_item(store, "cart-7", "pad", 1, 400)
store.append("cart-7", [ItemRemoved("cart-7", "pen")], expected_version=3)
print(cart_view["cart-7"])                        # {'lines': {'pad': (1, 400)}, 'total': 400}

# Replay: rebuild the read model from scratch
cart_view.clear()
for e in store.load("cart-7"):
    project(e)
print(cart_view["cart-7"]["total"], rehydrate(store.load("cart-7")).version)   # 400 4
```

## Exercises

1. Implement an in-process event bus.

   &lt;details&gt;&lt;summary&gt;Solution&lt;/summary&gt;See &lt;code&gt;EventBus&lt;/code&gt;. Extensions: subscribe by base class (dispatch on &lt;code&gt;type(event).__mro__&lt;/code&gt;); an error policy (collect handler exceptions and log them vs fail the command); an async variant with &lt;code&gt;asyncio&lt;/code&gt;; and publishing only after the unit of work commits (&lt;a href="ch11-repository-pattern-and-data-mapping.md"&gt;Ch 11&lt;/a&gt;).&lt;/details&gt;

2. Split a read/write model and build a projection.

   &lt;details&gt;&lt;summary&gt;Solution&lt;/summary&gt;The write side keeps the &lt;code&gt;Cart&lt;/code&gt; aggregate with invariants and accepts commands only. The read side is &lt;code&gt;cart_view&lt;/code&gt;: denormalized, shaped exactly for the "show cart" screen, updated by a projection handler, and queried directly. Queries never touch the aggregate; commands never read the view.&lt;/details&gt;

3. Two requests add items to the same cart at the same moment. How does the example stop a lost update?

   &lt;details&gt;&lt;summary&gt;Solution&lt;/summary&gt;Optimistic concurrency: each command reads the stream at version n and appends with &lt;code&gt;expected_version=n&lt;/code&gt;. The second append sees the version is now n+1 and raises &lt;code&gt;ConcurrencyError&lt;/code&gt;; the handler reloads and retries, re-checking the invariants against the new state.&lt;/details&gt;

## Mini project

**An event-sourced counter/aggregate with replay and a CQRS read model.**

```mermaid
flowchart LR
    CLI["commands via CLI/API:&lt;br/&gt;open, deposit, withdraw"] --&gt; CH["command handlers&lt;br/&gt;(rehydrate → check → append)"]
    CH --&gt; ES[("SQLite event store&lt;br/&gt;(stream, version) UNIQUE")]
    ES --&gt; SNAP["snapshot every 100 events"]
    ES --&gt; BUS["event bus"] --&gt; PR["projection → balances table"]
    PR --&gt; QRY["queries: balance, statement"]
    REPLAY["replay tool: drop balances,&lt;br/&gt;rebuild from events"] --&gt; PR
    UPC["upcaster: DepositMade v1 → v2&lt;br/&gt;(adds currency)"] -.-&gt; CH &amp; PR
```

**Steps**

1. A bank-account aggregate (`AccountOpened`, `MoneyDeposited`, `MoneyWithdrawn`) with the invariant "no overdraft".
2. A SQLite event store with a `UNIQUE(stream_id, version)` constraint for optimistic concurrency.
3. Projections for `balances` and `statements`; queries read only these tables.
4. A replay command that rebuilds all projections from zero and compares them with the current ones.
5. Snapshots every N events; prove that loading from snapshot + tail equals a full replay.
6. Add a v2 event schema and an upcaster so old events still load.

**Done when:** replay reproduces the read models exactly, concurrent withdrawals can't overdraw, and old v1 events load through the upcaster.

## Interview

1. **"CQRS — when is it worth it?"**
   &lt;details&gt;&lt;summary&gt;Answer&lt;/summary&gt;When the write side has rich invariants and the read side needs very different, often multiple, shapes or scale — dashboards, search, feeds, heavy read traffic — so optimizing one model for both hurts. It pairs naturally with event sourcing. It isn't worth it for simple CRUD, since it adds code, two models, and eventual consistency between them. You can also apply it lightly: separate query services over the same database.&lt;/details&gt;

2. **"How does event sourcing enable replay?"**
   &lt;details&gt;&lt;summary&gt;Answer&lt;/summary&gt;The events are the source of truth: an ordered, append-only, immutable log of every change. Current state is a deterministic fold over them, so you can recompute it at any point in time, rebuild corrupted or buggy projections, create brand-new read models over the full history, and debug by replaying exactly what happened. That requires deterministic apply functions (no clock or random calls inside them), versioned events, and snapshots for long streams.&lt;/details&gt;

---

## Checklist

- [ ] decouple via events
- [ ] separate read/write models when needed
- [ ] rebuild state by replaying events

x=\"335.0\" y=\"41.0\" text-anchor=\"middle\" style=\"font-size:14px\"&gt;SendReceipt&lt;/text&gt;\n&lt;rect class=\"sk\" x=\"412.0\" y=\"10\" width=\"116.0\" height=\"52\" rx=\"8\"/&gt;\n&lt;text class=\"lbl b\" x=\"470.0\" y=\"41.0\" text-anchor=\"middle\" style=\"font-size:14px\"&gt;ReserveStock&lt;/text&gt;\n&lt;rect class=\"sk\" x=\"546.0\" y=\"10\" width=\"108.0\" height=\"52\" rx=\"8\"/&gt;\n&lt;text class=\"lbl b\" x=\"600.0\" y=\"41.0\" text-anchor=\"middle\" style=\"font-size:14px\"&gt;UpdateStats&lt;/text&gt;\n&lt;/svg&gt;\n&lt;figcaption&gt;Fig: an in-process event bus fans one event out to several handlers&lt;/figcaption&gt;\n&lt;/figure&gt;", "&lt;figure&gt;\n&lt;svg viewBox=\"0 0 660 520\" role=\"img\" aria-label=\"Mini project: commands via CLI or API go to command handlers, which append to a SQLite event store with snapshots; the event bus feeds a projection into a balances table that queries read; a replay tool rebuilds the projection; an upcaster upgrades DepositMade v1 to v2 for handlers and projections\"&gt;\n&lt;rect class=\"sk\" x=\"265.0\" y=\"13.0\" width=\"210.0\" height=\"54.0\" rx=\"10\"/&gt;\n&lt;text class=\"lbl\" x=\"370.0\" y=\"35.5\" text-anchor=\"middle\" style=\"font-size:14px\"&gt;commands via CLI/API:&lt;tspan x=\"370.0\" dy=\"19\"&gt;open, deposit, withdraw&lt;/tspan&gt;&lt;/text&gt;\n&lt;rect class=\"sk\" x=\"250.0\" y=\"93.0\" width=\"240.0\" height=\"54.0\" rx=\"10\"/&gt;\n&lt;text class=\"lbl\" x=\"370.0\" y=\"115.5\" text-anchor=\"middle\" style=\"font-size:14px\"&gt;command handlers&lt;tspan x=\"370.0\" dy=\"19\"&gt;(rehydrate \u2192 check \u2192 append)&lt;/tspan&gt;&lt;/text&gt;\n&lt;rect class=\"sk\" x=\"263.0\" y=\"183.0\" width=\"214.0\" height=\"54.0\" rx=\"14\"/&gt;\n&lt;path class=\"sk\" d=\"M269 189 Q 370 195 471 189\"/&gt;\n&lt;text class=\"lbl\" x=\"370.0\" y=\"205.5\" text-anchor=\"middle\" style=\"font-size:14px\"&gt;SQLite event store&lt;tspan x=\"370.0\" dy=\"19\"&gt;(stream, version) UNIQUE&lt;/tspan&gt;&lt;/text&gt;\n&lt;rect class=\"sk\" x=\"505.0\" y=\"183.0\" width=\"140.0\" height=\"54.0\" rx=\"10\"/&gt;\n&lt;text class=\"lbl\" x=\"575.0\" y=\"205.5\" text-anchor=\"middle\" style=\"font-size:14px\"&gt;snapshot every&lt;tspan x=\"575.0\" dy=\"19\"&gt;100 events&lt;/tspan&gt;&lt;/text&gt;\n&lt;rect class=\"sk\" x=\"324.0\" y=\"277.5\" width=\"92.0\" height=\"35.0\" rx=\"10\"/&gt;\n&lt;text class=\"lbl\" x=\"370.0\" y=\"300.0\" text-anchor=\"middle\" style=\"font-size:14px\"&gt;event bus&lt;/text&gt;\n&lt;rect class=\"sk\" x=\"296.0\" y=\"348.0\" width=\"148.0\" height=\"54.0\" rx=\"10\"/&gt;\n&lt;text class=\"lbl\" x=\"370.0\" y=\"370.5\" text-anchor=\"middle\" style=\"font-size:14px\"&gt;projection \u2192&lt;tspan x=\"370.0\" dy=\"19\"&gt;balances table&lt;/tspan&gt;&lt;/text&gt;\n&lt;rect class=\"sk\" x=\"292.0\" y=\"428.0\" width=\"156.0\" height=\"54.0\" rx=\"10\"/&gt;\n&lt;text class=\"lbl\" x=\"370.0\" y=\"450.5\" text-anchor=\"middle\" style=\"font-size:14px\"&gt;queries:&lt;tspan x=\"370.0\" dy=\"19\"&gt;balance, statement&lt;/tspan&gt;&lt;/text&gt;\n&lt;rect class=\"sk\" x=\"9.0\" y=\"348.0\" width=\"232.0\" height=\"54.0\" rx=\"10\"/&gt;\n&lt;text class=\"lbl\" x=\"125.0\" y=\"370.5\" text-anchor=\"middle\" style=\"font-size:14px\"&gt;replay tool: drop balances,&lt;tspan x=\"125.0\" dy=\"19\"&gt;rebuild from events&lt;/tspan&gt;&lt;/text&gt;\n&lt;rect class=\"sk\" x=\"13.0\" y=\"163.5\" width=\"184.0\" height=\"73.0\" rx=\"10\"/&gt;\n&lt;text class=\"lbl\" x=\"105.0\" y=\"186.0\" text-anchor=\"middle\" style=\"font-size:14px\"&gt;upcaster:&lt;tspan x=\"105.0\" dy=\"19\"&gt;DepositMade v1 \u2192 v2&lt;/tspan&gt;&lt;tspan x=\"105.0\" dy=\"19\"&gt;(adds currency)&lt;/tspan&gt;&lt;/text&gt;\n&lt;path class=\"sk blue\" d=\"M370.0 67.0 Q 364.0 80.0 370.0 93.0\" style=\"color:var(--ink)\" marker-end=\"url(#arr)\"/&gt;\n&lt;path class=\"sk blue\" d=\"M370.0 147.0 Q 364.0 165.0 370.0 183.0\" style=\"color:var(--ink)\" marker-end=\"url(#arr)\"/&gt;\n&lt;path class=\"sk blue\" d=\"M477.0 210.0 Q 491.0 216.0 505.0 210.0\" style=\"color:var(--ink)\" marker-end=\"url(#arr)\"/&gt;\n&lt;path class=\"sk blue\" d=\"M370.0 237.0 Q 364.0 257.2 370.0 277.5\" style=\"color:var(--ink)\" marker-end=\"url(#arr)\"/&gt;\n&lt;path class=\"sk blue\" d=\"M370.0 312.5 Q 364.0 330.2 370.0 348.0\" style=\"color:var(--ink)\" marker-end=\"url(#arr)\"/&gt;\n&lt;path class=\"sk blue\" d=\"M370.0 402.0 Q 364.0 415.0 370.0 428.0\" style=\"color:var(--ink)\" marker-end=\"url(#arr)\"/&gt;\n&lt;path class=\"sk blue\" d=\"M241.0 375.0 Q 268.5 381.0 296.0 375.0\" style=\"color:var(--ink)\" marker-end=\"url(#arr)\"/&gt;\n&lt;path class=\"sk blue\" d=\"M197.0 172.2 Q 240.5 165.4 280.6 147.0\" style=\"color:var(--ink);stroke-dasharray:7 5\" marker-end=\"url(#arr)\"/&gt;\n&lt;path class=\"sk blue\" d=\"M160.3 236.5 Q 241.4 297.3 329.1 348.0\" style=\"color:var(--ink);stroke-dasharray:7 5\" marker-end=\"url(#arr)\"/&gt;\n&lt;/svg&gt;\n&lt;figcaption&gt;Fig: event-sourced bank account with replay, snapshots and an upcaster for old events&lt;/figcaption&gt;\n&lt;/figure&gt;"]</textarea>
<textarea id="codes" hidden>{"from collections import defaultdict\nfrom dataclasses import dataclass, field\nfrom functools import reduce\n\n# ---- events ---------------------------------------------------------------------\n@dataclass(frozen=True)\nclass CartCreated:  cart_id: str; customer: str\n@dataclass(frozen=True)\nclass ItemAdded:    cart_id: str; sku: str; qty: int; price: int\n@dataclass(frozen=True)\nclass ItemRemoved:  cart_id: str; sku: str\n\n# ---- in-process event bus ----------------------------------------------------------------\nclass EventBus:\n    def __init__(self): self._handlers = defaultdict(list)\n    def subscribe(self, event_type, handler): self._handlers[event_type].append(handler)\n    def publish(self, event):\n        for h in self._handlers[type(event)]:\n            h(event)\n\n# ---- event store (append-only, per stream) + optimistic concurrency ------------------------\nclass ConcurrencyError(Exception): ...\n\nclass EventStore:\n    def __init__(self, bus): self.streams, self.bus = defaultdict(list), bus\n    def load(self, stream): return list(self.streams[stream])\n    def append(self, stream, events, expected_version):\n        if len(self.streams[stream]) != expected_version:\n            raise ConcurrencyError(f\"{stream}: expected v{expected_version}\")\n        self.streams[stream].extend(events)\n        for e in events:\n            self.bus.publish(e)                     # after append; in a real system via an outbox\n\n# ---- write model: aggregate state = fold(events) ------------------------------------------\n@dataclass\nclass Cart:\n    id: str = \"\"\n    items: dict = field(default_factory=dict)       # sku \u2192 (qty, price)\n    version: int = 0\n\ndef apply(cart: Cart, e) -&gt; Cart:\n    match e:\n        case CartCreated(): cart.id = e.cart_id\n        case ItemAdded():\n            q, _ = cart.items.get(e.sku, (0, e.price))\n            cart.items[e.sku] = (q + e.qty, e.price)\n        case ItemRemoved(): cart.items.pop(e.sku, None)\n    cart.version += 1\n    return cart\n\ndef rehydrate(events): return reduce(apply, events, Cart())\n\n# ---- command handlers (write side) ----------------------------------------------------------\ndef add_item(store, cart_id, sku, qty, price):\n    cart = rehydrate(store.load(cart_id))\n    if qty &lt;= 0: raise ValueError(\"qty must be positive\")           # invariant check\n    if sum(q for q, _ in cart.items.values()) + qty &gt; 20: raise ValueError(\"cart limit is 20 items\")\n    store.append(cart_id, [ItemAdded(cart_id, sku, qty, price)], expected_version=cart.version)\n\n# ---- projection (read side) -------------------------------------------------------------\ncart_view = {}                                        # the read model: ready-to-serve rows\ndef project(e):\n    v = cart_view.setdefault(e.cart_id, {\"lines\": {}, \"total\": 0})\n    if isinstance(e, ItemAdded):\n        q = v[\"lines\"].get(e.sku, (0, e.price))[0] + e.qty\n        v[\"lines\"][e.sku] = (q, e.price)\n    elif isinstance(e, ItemRemoved):\n        v[\"lines\"].pop(e.sku, None)\n    v[\"total\"] = sum(q * p for q, p in v[\"lines\"].values())\n\nbus = EventBus()\nfor t in (CartCreated, ItemAdded, ItemRemoved):\n    bus.subscribe(t, project)\nstore = EventStore(bus)\n\nstore.append(\"cart-7\", [CartCreated(\"cart-7\", \"c1\")], expected_version=0)\nadd_item(store, \"cart-7\", \"pen\", 2, 150)\nadd_item(store, \"cart-7\", \"pad\", 1, 400)\nstore.append(\"cart-7\", [ItemRemoved(\"cart-7\", \"pen\")], expected_version=3)\nprint(cart_view[\"cart-7\"])                        # {'lines': {'pad': (1, 400)}, 'total': 400}\n\n# Replay: rebuild the read model from scratch\ncart_view.clear()\nfor e in store.load(\"cart-7\"):\n    project(e)\nprint(cart_view[\"cart-7\"][\"total\"], rehydrate(store.load(\"cart-7\")).version)   # 400 4": "&lt;span class=\"kw\"&gt;from&lt;/span&gt; collections &lt;span class=\"kw\"&gt;import&lt;/span&gt; defaultdict\n&lt;span class=\"kw\"&gt;from&lt;/span&gt; dataclasses &lt;span class=\"kw\"&gt;import&lt;/span&gt; dataclass, field\n&lt;span class=\"kw\"&gt;from&lt;/span&gt; functools &lt;span class=\"kw\"&gt;import&lt;/span&gt; reduce\n\n&lt;span class=\"cm\"&gt;# ---- events ---------------------------------------------------------------------&lt;/span&gt;\n&lt;span class=\"bi\"&gt;@dataclass&lt;/span&gt;(frozen=&lt;span class=\"kw\"&gt;True&lt;/span&gt;)\n&lt;span class=\"kw\"&gt;class&lt;/span&gt; CartCreated:  cart_id: &lt;span class=\"bi\"&gt;str&lt;/span&gt;; customer: &lt;span class=\"bi\"&gt;str&lt;/span&gt;\n&lt;span class=\"bi\"&gt;@dataclass&lt;/span&gt;(frozen=&lt;span class=\"kw\"&gt;True&lt;/span&gt;)\n&lt;span class=\"kw\"&gt;class&lt;/span&gt; ItemAdded:    cart_id: &lt;span class=\"bi\"&gt;str&lt;/span&gt;; sku: &lt;span class=\"bi\"&gt;str&lt;/span&gt;; qty: &lt;span class=\"bi\"&gt;int&lt;/span&gt;; price: &lt;span class=\"bi\"&gt;int&lt;/span&gt;\n&lt;span class=\"bi\"&gt;@dataclass&lt;/span&gt;(frozen=&lt;span class=\"kw\"&gt;True&lt;/span&gt;)\n&lt;span class=\"kw\"&gt;class&lt;/span&gt; ItemRemoved:  cart_id: &lt;span class=\"bi\"&gt;str&lt;/span&gt;; sku: &lt;span class=\"bi\"&gt;str&lt;/span&gt;\n\n&lt;span class=\"cm\"&gt;# ---- in-process event bus ----------------------------------------------------------------&lt;/span&gt;\n&lt;span class=\"kw\"&gt;class&lt;/span&gt; EventBus:\n    &lt;span class=\"kw\"&gt;def&lt;/span&gt; &lt;span class=\"fn\"&gt;__init__&lt;/span&gt;(&lt;span class=\"bi\"&gt;self&lt;/span&gt;): &lt;span class=\"bi\"&gt;self&lt;/span&gt;._handlers = &lt;span class=\"fn\"&gt;defaultdict&lt;/span&gt;(&lt;span class=\"bi\"&gt;list&lt;/span&gt;)\n    &lt;span class=\"kw\"&gt;def&lt;/span&gt; &lt;span class=\"fn\"&gt;subscribe&lt;/span&gt;(&lt;span class=\"bi\"&gt;self&lt;/span&gt;, event_type, handler): &lt;span class=\"bi\"&gt;self&lt;/span&gt;._handlers[event_type].&lt;span class=\"fn\"&gt;append&lt;/span&gt;(handler)\n    &lt;span class=\"kw\"&gt;def&lt;/span&gt; &lt;span class=\"fn\"&gt;publish&lt;/span&gt;(&lt;span class=\"bi\"&gt;self&lt;/span&gt;, event):\n        &lt;span class=\"kw\"&gt;for&lt;/span&gt; h &lt;span class=\"kw\"&gt;in&lt;/span&gt; &lt;span class=\"bi\"&gt;self&lt;/span&gt;._handlers[&lt;span class=\"bi\"&gt;type&lt;/span&gt;(event)]:\n            &lt;span class=\"fn\"&gt;h&lt;/span&gt;(event)\n\n&lt;span class=\"cm\"&gt;# ---- event store (append-only, per stream) + optimistic concurrency ------------------------&lt;/span&gt;\n&lt;span class=\"kw\"&gt;class&lt;/span&gt; &lt;span class=\"fn\"&gt;ConcurrencyError&lt;/span&gt;(&lt;span class=\"bi\"&gt;Exception&lt;/span&gt;): ...\n\n&lt;span class=\"kw\"&gt;class&lt;/span&gt; EventStore:\n    &lt;span class=\"kw\"&gt;def&lt;/span&gt; &lt;span class=\"fn\"&gt;__init__&lt;/span&gt;(&lt;span class=\"bi\"&gt;self&lt;/span&gt;, bus): &lt;span class=\"bi\"&gt;self&lt;/span&gt;.streams, &lt;span class=\"bi\"&gt;self&lt;/span&gt;.bus = &lt;span class=\"fn\"&gt;defaultdict&lt;/span&gt;(&lt;span class=\"bi\"&gt;list&lt;/span&gt;), bus\n    &lt;span class=\"kw\"&gt;def&lt;/span&gt; &lt;span class=\"fn\"&gt;load&lt;/span&gt;(&lt;span class=\"bi\"&gt;self&lt;/span&gt;, stream): &lt;span class=\"kw\"&gt;return&lt;/span&gt; &lt;span class=\"bi\"&gt;list&lt;/span&gt;(&lt;span class=\"bi\"&gt;self&lt;/span&gt;.streams[stream])\n    &lt;span class=\"kw\"&gt;def&lt;/span&gt; &lt;span class=\"fn\"&gt;append&lt;/span&gt;(&lt;span class=\"bi\"&gt;self&lt;/span&gt;, stream, events, expected_version):\n        &lt;span class=\"kw\"&gt;if&lt;/span&gt; &lt;span class=\"bi\"&gt;len&lt;/span&gt;(&lt;span class=\"bi\"&gt;self&lt;/span&gt;.streams[stream]) != expected_version:\n            &lt;span class=\"kw\"&gt;raise&lt;/span&gt; &lt;span class=\"fn\"&gt;ConcurrencyError&lt;/span&gt;(&lt;span class=\"st\"&gt;f\"{stream}: expected v{expected_version}\"&lt;/span&gt;)\n        &lt;span class=\"bi\"&gt;self&lt;/span&gt;.streams[stream].&lt;span class=\"fn\"&gt;extend&lt;/span&gt;(events)\n        &lt;span class=\"kw\"&gt;for&lt;/span&gt; e &lt;span class=\"kw\"&gt;in&lt;/span&gt; events:\n            &lt;span class=\"bi\"&gt;self&lt;/span&gt;.bus.&lt;span class=\"fn\"&gt;publish&lt;/span&gt;(e)                     &lt;span class=\"cm\"&gt;# after append; in a real system via an outbox&lt;/span&gt;\n\n&lt;span class=\"cm\"&gt;# ---- write model: aggregate state = fold(events) ------------------------------------------&lt;/span&gt;\n&lt;span class=\"bi\"&gt;@dataclass&lt;/span&gt;\n&lt;span class=\"kw\"&gt;class&lt;/span&gt; Cart:\n    &lt;span class=\"bi\"&gt;id&lt;/span&gt;: &lt;span class=\"bi\"&gt;str&lt;/span&gt; = &lt;span class=\"st\"&gt;\"\"&lt;/span&gt;\n    items: &lt;span class=\"bi\"&gt;dict&lt;/span&gt; = &lt;span class=\"fn\"&gt;field&lt;/span&gt;(default_factory=&lt;span class=\"bi\"&gt;dict&lt;/span&gt;)       &lt;span class=\"cm\"&gt;# sku \u2192 (qty, price)&lt;/span&gt;\n    version: &lt;span class=\"bi\"&gt;int&lt;/span&gt; = &lt;span class=\"nu\"&gt;0&lt;/span&gt;\n\n&lt;span class=\"kw\"&gt;def&lt;/span&gt; &lt;span class=\"fn\"&gt;apply&lt;/span&gt;(cart: Cart, e) -&amp;gt; Cart:\n    &lt;span class=\"kw\"&gt;match&lt;/span&gt; e:\n        &lt;span class=\"kw\"&gt;case&lt;/span&gt; &lt;span class=\"fn\"&gt;CartCreated&lt;/span&gt;(): cart.&lt;span class=\"bi\"&gt;id&lt;/span&gt; = e.cart_id\n        &lt;span class=\"kw\"&gt;case&lt;/span&gt; &lt;span class=\"fn\"&gt;ItemAdded&lt;/span&gt;():\n            q, _ = cart.items.&lt;span class=\"fn\"&gt;get&lt;/span&gt;(e.sku, (&lt;span class=\"nu\"&gt;0&lt;/span&gt;, e.price))\n            cart.items[e.sku] = (q + e.qty, e.price)\n        &lt;span class=\"kw\"&gt;case&lt;/span&gt; &lt;span class=\"fn\"&gt;ItemRemoved&lt;/span&gt;(): cart.items.&lt;span class=\"fn\"&gt;pop&lt;/span&gt;(e.sku, &lt;span class=\"kw\"&gt;None&lt;/span&gt;)\n    cart.version += &lt;span class=\"nu\"&gt;1&lt;/span&gt;\n    &lt;span class=\"kw\"&gt;return&lt;/span&gt; cart\n\n&lt;span class=\"kw\"&gt;def&lt;/span&gt; &lt;span class=\"fn\"&gt;rehydrate&lt;/span&gt;(events): &lt;span class=\"kw\"&gt;return&lt;/span&gt; &lt;span class=\"fn\"&gt;reduce&lt;/span&gt;(apply, events, &lt;span class=\"fn\"&gt;Cart&lt;/span&gt;())\n\n&lt;span class=\"cm\"&gt;# ---- command handlers (write side) ----------------------------------------------------------&lt;/span&gt;\n&lt;span class=\"kw\"&gt;def&lt;/span&gt; &lt;span class=\"fn\"&gt;add_item&lt;/span&gt;(store, cart_id, sku, qty, price):\n    cart = &lt;span class=\"fn\"&gt;rehydrate&lt;/span&gt;(store.&lt;span class=\"fn\"&gt;load&lt;/span&gt;(cart_id))\n    &lt;span class=\"kw\"&gt;if&lt;/span&gt; qty &amp;lt;= &lt;span class=\"nu\"&gt;0&lt;/span&gt;: &lt;span class=\"kw\"&gt;raise&lt;/span&gt; &lt;span class=\"bi\"&gt;ValueError&lt;/span&gt;(&lt;span class=\"st\"&gt;\"qty must be positive\"&lt;/span&gt;)           &lt;span class=\"cm\"&gt;# invariant check&lt;/span&gt;\n    &lt;span class=\"kw\"&gt;if&lt;/span&gt; &lt;span class=\"bi\"&gt;sum&lt;/span&gt;(q &lt;span class=\"kw\"&gt;for&lt;/span&gt; q, _ &lt;span class=\"kw\"&gt;in&lt;/span&gt; cart.items.&lt;span class=\"fn\"&gt;values&lt;/span&gt;()) + qty &amp;gt; &lt;span class=\"nu\"&gt;20&lt;/span&gt;: &lt;span class=\"kw\"&gt;raise&lt;/span&gt; &lt;span class=\"bi\"&gt;ValueError&lt;/span&gt;(&lt;span class=\"st\"&gt;\"cart limit is 20 items\"&lt;/span&gt;)\n    store.&lt;span class=\"fn\"&gt;append&lt;/span&gt;(cart_id, [&lt;span class=\"fn\"&gt;ItemAdded&lt;/span&gt;(cart_id, sku, qty, price)], expected_version=cart.version)\n\n&lt;span class=\"cm\"&gt;# ---- projection (read side) -------------------------------------------------------------&lt;/span&gt;\ncart_view = {}                                        &lt;span class=\"cm\"&gt;# the read model: ready-to-serve rows&lt;/span&gt;\n&lt;span class=\"kw\"&gt;def&lt;/span&gt; &lt;span class=\"fn\"&gt;project&lt;/span&gt;(e):\n    v = cart_view.&lt;span class=\"fn\"&gt;setdefault&lt;/span&gt;(e.cart_id, {&lt;span class=\"st\"&gt;\"lines\"&lt;/span&gt;: {}, &lt;span class=\"st\"&gt;\"total\"&lt;/span&gt;: &lt;span class=\"nu\"&gt;0&lt;/span&gt;})\n    &lt;span class=\"kw\"&gt;if&lt;/span&gt; &lt;span class=\"bi\"&gt;isinstance&lt;/span&gt;(e, ItemAdded):\n        q = v[&lt;span class=\"st\"&gt;\"lines\"&lt;/span&gt;].&lt;span class=\"fn\"&gt;get&lt;/span&gt;(e.sku, (&lt;span class=\"nu\"&gt;0&lt;/span&gt;, e.price))[&lt;span class=\"nu\"&gt;0&lt;/span&gt;] + e.qty\n        v[&lt;span class=\"st\"&gt;\"lines\"&lt;/span&gt;][e.sku] = (q, e.price)\n    &lt;span class=\"kw\"&gt;elif&lt;/span&gt; &lt;span class=\"bi\"&gt;isinstance&lt;/span&gt;(e, ItemRemoved):\n        v[&lt;span class=\"st\"&gt;\"lines\"&lt;/span&gt;].&lt;span class=\"fn\"&gt;pop&lt;/span&gt;(e.sku, &lt;span class=\"kw\"&gt;None&lt;/span&gt;)\n    v[&lt;span class=\"st\"&gt;\"total\"&lt;/span&gt;] = &lt;span class=\"bi\"&gt;sum&lt;/span&gt;(q * p &lt;span class=\"kw\"&gt;for&lt;/span&gt; q, p &lt;span class=\"kw\"&gt;in&lt;/span&gt; v[&lt;span class=\"st\"&gt;\"lines\"&lt;/span&gt;].&lt;span class=\"fn\"&gt;values&lt;/span&gt;())\n\nbus = &lt;span class=\"fn\"&gt;EventBus&lt;/span&gt;()\n&lt;span class=\"kw\"&gt;for&lt;/span&gt; t &lt;span class=\"kw\"&gt;in&lt;/span&gt; (CartCreated, ItemAdded, ItemRemoved):\n    bus.&lt;span class=\"fn\"&gt;subscribe&lt;/span&gt;(t, project)\nstore = &lt;span class=\"fn\"&gt;EventStore&lt;/span&gt;(bus)\n\nstore.&lt;span class=\"fn\"&gt;append&lt;/span&gt;(&lt;span class=\"st\"&gt;\"cart-7\"&lt;/span&gt;, [&lt;span class=\"fn\"&gt;CartCreated&lt;/span&gt;(&lt;span class=\"st\"&gt;\"cart-7\"&lt;/span&gt;, &lt;span class=\"st\"&gt;\"c1\"&lt;/span&gt;)], expected_version=&lt;span class=\"nu\"&gt;0&lt;/span&gt;)\n&lt;span class=\"fn\"&gt;add_item&lt;/span&gt;(store, &lt;span class=\"st\"&gt;\"cart-7\"&lt;/span&gt;, &lt;span class=\"st\"&gt;\"pen\"&lt;/span&gt;, &lt;span class=\"nu\"&gt;2&lt;/span&gt;, &lt;span class=\"nu\"&gt;150&lt;/span&gt;)\n&lt;span class=\"fn\"&gt;add_item&lt;/span&gt;(store, &lt;span class=\"st\"&gt;\"cart-7\"&lt;/span&gt;, &lt;span class=\"st\"&gt;\"pad\"&lt;/span&gt;, &lt;span class=\"nu\"&gt;1&lt;/span&gt;, &lt;span class=\"nu\"&gt;400&lt;/span&gt;)\nstore.&lt;span class=\"fn\"&gt;append&lt;/span&gt;(&lt;span class=\"st\"&gt;\"cart-7\"&lt;/span&gt;, [&lt;span class=\"fn\"&gt;ItemRemoved&lt;/span&gt;(&lt;span class=\"st\"&gt;\"cart-7\"&lt;/span&gt;, &lt;span class=\"st\"&gt;\"pen\"&lt;/span&gt;)], expected_version=&lt;span class=\"nu\"&gt;3&lt;/span&gt;)\n&lt;span class=\"bi\"&gt;print&lt;/span&gt;(cart_view[&lt;span class=\"st\"&gt;\"cart-7\"&lt;/span&gt;])                        &lt;span class=\"cm\"&gt;# {'lines': {'pad': (1, 400)}, 'total': 400}&lt;/span&gt;\n\n&lt;span class=\"cm\"&gt;# Replay: rebuild the read model from scratch&lt;/span&gt;\ncart_view.&lt;span class=\"fn\"&gt;clear&lt;/span&gt;()\n&lt;span class=\"kw\"&gt;for&lt;/span&gt; e &lt;span class=\"kw\"&gt;in&lt;/span&gt; store.&lt;span class=\"fn\"&gt;load&lt;/span&gt;(&lt;span class=\"st\"&gt;\"cart-7\"&lt;/span&gt;):\n    &lt;span class=\"fn\"&gt;project&lt;/span&gt;(e)\n&lt;span class=\"bi\"&gt;print&lt;/span&gt;(cart_view[&lt;span class=\"st\"&gt;\"cart-7\"&lt;/span&gt;][&lt;span class=\"st\"&gt;\"total\"&lt;/span&gt;], &lt;span class=\"fn\"&gt;rehydrate&lt;/span&gt;(store.&lt;span class=\"fn\"&gt;load&lt;/span&gt;(&lt;span class=\"st\"&gt;\"cart-7\"&lt;/span&gt;)).version)   &lt;span class=\"cm\"&gt;# 400 4&lt;/span&gt;"}</textarea>
