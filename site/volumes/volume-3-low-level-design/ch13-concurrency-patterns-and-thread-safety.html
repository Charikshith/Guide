## Concept

Mutexes, channels, worker pools, actor model, lock-free patterns, and eliminating races.

**In one sentence:** safe concurrent code either *shares* data and guards it carefully (locks, atomics) or *doesn't share* data at all and passes messages instead (channels, actors) — and the second is usually easier to get right.

**Mental model — a shared kitchen.** Shared state with a mutex is one knife that cooks must take turns with — safe, but they wait and can deadlock. A channel is a pass-through window: one cook puts a plate in, another takes it out, and nobody touches the same plate at once. An actor is a cook with a private station and an order slip inbox — you never touch their station, you just drop slips in. A worker pool is a fixed number of cooks pulling tickets from one rail.

**The patterns**

| Pattern | Idea | Good for | Watch out for |
|---------|------|----------|---------------|
| **Mutex / lock** | one thread at a time in a critical section | small shared state (counters, caches) | deadlocks, contention, forgetting to lock |
| **RW lock** | many readers or one writer | read-mostly shared data | writer starvation |
| **Atomics** | indivisible CPU operations (`fetch_add`, compare-and-swap) | counters, flags, lock-free structures | subtle memory ordering; hard beyond simple cases |
| **Channel / queue** | threads communicate by sending values; the receiver owns them | pipelines, producer–consumer | unbounded queues hide overload |
| **Worker pool** | N workers pull tasks from a shared queue | bounded parallelism for many tasks | choosing N; per-task errors and results |
| **Actor model** | each actor owns private state and processes one message at a time from its mailbox | many independent stateful entities (sessions, devices, game objects) | mailbox overflow; request/reply is async |
| **Immutable data** | nothing changes, so nothing races | config, snapshots, messages | copying cost |
| **Thread confinement** | only one thread ever touches an object | UI threads, event loops, per-thread buffers | enforcing the rule |
| **Future / promise** | a handle to a result computed elsewhere | collecting per-task results | blocking on `.result()` in the wrong place |

**Shared state vs message passing** — "Do not communicate by sharing memory; share memory by communicating" (Go proverb). With message passing, each piece of data has *one owner at a time*, which removes data races by construction and makes the flow visible. Shared state is faster for tiny, hot data, but every access must be guarded, and composing locks invites deadlock ([Vol 1 Ch 38](../volume-1-cs-foundations/ch38-os-processes-threads-scheduling-synchronization-and-deadlocks.md)).

**Making a class thread-safe — options, in order of preference**

1. **Make it immutable** (frozen dataclass; return new objects).
2. **Confine it** to one thread or actor and talk to it through a queue.
3. **Guard it** with one internal lock around every method that touches shared fields (a *monitor*); never hand out references to internal mutable state; keep critical sections short; don't call unknown code (callbacks) while holding the lock.
4. Use **atomics / concurrent collections** (`queue.Queue`, `ConcurrentHashMap`, `AtomicU64`).
5. **Document the contract**: "thread-safe", "not thread-safe — confine to one thread", or "safe for concurrent reads only".

**Bound concurrency** — always cap it (pool size, semaphore, bounded queue), so overload turns into backpressure instead of a thousand threads or an out-of-memory crash.

**Shared state vs message passing**

```
 SHARED STATE + LOCK                         MESSAGE PASSING
 T1 ─┐   ┌────────────┐                      T1 ──msg──►┐
 T2 ─┼─► │ lock ▸ data│ ◄─ everyone waits    T2 ──msg──►├─► [queue] ─► owner thread ─► data
 T3 ─┘   └────────────┘    here               T3 ──msg──►┘                 (only it touches data)
 races possible if anyone forgets the lock   no races by construction
```

## Example

```python
import threading, queue, time
from concurrent.futures import ThreadPoolExecutor, as_completed

# ---- 1. Mutex-protected counter (a monitor) --------------------------------------
class Counter:
    """Thread-safe: every access to _n holds _lock."""
    def __init__(self): self._n, self._lock = 0, threading.Lock()
    def incr(self):
        with self._lock:
            self._n += 1
    @property
    def value(self):
        with self._lock:
            return self._n

c = Counter()
threads = [threading.Thread(target=lambda: [c.incr() for _ in range(10_000)]) for _ in range(8)]
for t in threads: t.start()
for t in threads: t.join()
print(c.value)                                              # 80000

# ---- 2. Channel-based worker pool: no shared mutable state -----------------------
def worker_pool(tasks, fn, n_workers=4):
    inbox, outbox = queue.Queue(maxsize=100), queue.Queue()
    STOP = object()
    def worker():
        while (item := inbox.get()) is not STOP:
            idx, arg = item
            try:
                outbox.put((idx, fn(arg), None))
            except Exception as e:
                outbox.put((idx, None, e))                  # per-task error, pool keeps running
    ws = [threading.Thread(target=worker) for _ in range(n_workers)]
    for w in ws: w.start()
    for i, t in enumerate(tasks): inbox.put((i, t))         # blocks when full → backpressure
    for _ in ws: inbox.put(STOP)
    for w in ws: w.join()
    results = [outbox.get() for _ in tasks]
    return [r for r in sorted(results, key=lambda r: r[0])]

out = worker_pool([1, 2, 0, 4], lambda x: 10 // x)
print([(i, v, type(e).__name__ if e else None) for i, v, e in out])
# [(0, 10, None), (1, 5, None), (2, None, 'ZeroDivisionError'), (3, 2, None)]

# ---- 3. An actor with a mailbox -------------------------------------------------
class AccountActor(threading.Thread):
    def __init__(self):
        super().__init__(daemon=True)
        self.mailbox, self._balance = queue.Queue(), 0      # _balance is touched ONLY by run()
    def run(self):
        while True:
            msg, arg, reply = self.mailbox.get()
            if msg == "deposit": self._balance += arg
            elif msg == "withdraw" and arg &lt;= self._balance: self._balance -= arg
            elif msg == "balance": reply.put(self._balance)
    def tell(self, msg, arg=None): self.mailbox.put((msg, arg, None))
    def ask(self, msg):
        reply = queue.Queue(maxsize=1); self.mailbox.put((msg, None, reply)); return reply.get(timeout=1)

acct = AccountActor(); acct.start()
for _ in range(100): acct.tell("deposit", 5)
acct.tell("withdraw", 120)
print(acct.ask("balance"))                                  # 380

# ---- 4. The standard library does most of this for you --------------------------
with ThreadPoolExecutor(max_workers=8) as pool:             # bounded worker pool + futures
    futs = {pool.submit(time.sleep, 0.01): i for i in range(20)}
    print(sum(1 for f in as_completed(futs) if f.exception() is None))   # 20
```

## Exercises

1. Implement a thread-safe worker pool.

   &lt;details&gt;&lt;summary&gt;Solution&lt;/summary&gt;See &lt;code&gt;worker_pool&lt;/code&gt;: a bounded input queue (backpressure), a fixed number of worker threads, a sentinel per worker for shutdown, per-task results with errors captured, and results re-ordered by index. Production additions: timeouts per task, cancellation, graceful shutdown on SIGTERM, and metrics for queue depth. Compare with &lt;code&gt;ThreadPoolExecutor&lt;/code&gt;.&lt;/details&gt;

2. Fix a data race with a channel instead of shared state.

   &lt;details&gt;&lt;summary&gt;Solution&lt;/summary&gt;Racy version: 8 threads append results to one global dict or counter without a lock. Fix: each thread sends &lt;code&gt;(key, value)&lt;/code&gt; into a &lt;code&gt;queue.Queue&lt;/code&gt;, and one aggregator thread (or the main thread, after joining) is the only code that updates the dict. The dict now has a single owner, so no lock is needed.&lt;/details&gt;

3. Why is `if key not in cache: cache[key] = compute(key)` not thread-safe even though dict operations are atomic in CPython?

   &lt;details&gt;&lt;summary&gt;Solution&lt;/summary&gt;The check and the set are two separate steps. Two threads can both see the key missing and both compute and write (check-then-act race). Guard the whole sequence with a lock (per key if &lt;code&gt;compute&lt;/code&gt; is slow), or use an atomic helper such as &lt;code&gt;dict.setdefault&lt;/code&gt; when the value is cheap.&lt;/details&gt;

## Mini project

**A concurrent task executor with a bounded worker pool and per-task results.**

```mermaid
flowchart LR
    SUB["submit(fn, *args, timeout, retries)"] --&gt; Q[("bounded priority queue")]
    Q --&gt; POOL["N workers (threads or asyncio tasks)"]
    POOL --&gt; RES["TaskHandle: status,&lt;br/&gt;result / error, duration,&lt;br/&gt;attempts"]
    POOL --&gt; MET["metrics: queue depth,&lt;br/&gt;active workers, p95 duration"]
    CANCEL["cancel(handle)"] --&gt; Q
    SHUT["shutdown(drain=True)"] --&gt; POOL
```

**Steps**

1. `Executor(workers=N, queue_size=M)` with `submit()` returning a `TaskHandle` (a future: `result(timeout)`, `cancel()`, `status`).
2. A bounded priority queue; `submit` blocks or raises `QueueFull` depending on a flag (backpressure policy).
3. Per-task timeout and retry with backoff (see [Ch 14](ch14-resilience-patterns-idempotency-retries-backoff-circuit-breakers.md)); errors are captured per task.
4. Graceful shutdown: stop accepting, drain or cancel queued tasks, join the workers.
5. Document the thread-safety contract of every public method; run a stress test with 10,000 tasks and random failures under `pytest-repeat`.

**Done when:** the stress test passes 100 runs in a row, the number of running tasks never exceeds N, and every submitted task ends with a result, an error, or "cancelled".

## Interview

1. **"Shared state vs message passing?"**
   &lt;details&gt;&lt;summary&gt;Answer&lt;/summary&gt;Shared state lets threads access the same memory under locks or atomics: low overhead for small hot data, but every access must be synchronized, races are easy to introduce, and combining locks risks deadlocks. Message passing gives each piece of data one owner at a time, and others communicate by sending messages over channels or mailboxes: no data races by construction and a clearer flow, at the cost of copying or queueing and asynchronous request/reply. Default to message passing; use shared state for small, well-encapsulated cases.&lt;/details&gt;

2. **"How do you make a class thread-safe?"**
   &lt;details&gt;&lt;summary&gt;Answer&lt;/summary&gt;Prefer immutability. Otherwise confine the object to one thread or actor, or encapsulate its state behind a single private lock that every method acquires (a monitor), making compound operations atomic, never leaking references to internal mutable state, keeping critical sections short, and not calling external code while holding the lock. Use concurrent collections or atomics where they fit. Then document the guarantee and stress-test it.&lt;/details&gt;

---

## Checklist

- [ ] prefer channels over shared state
- [ ] bound concurrency
- [ ] document thread-safety contracts

eue&lt;/text&gt;\n&lt;rect class=\"sk\" x=\"219.0\" y=\"183.0\" width=\"222.0\" height=\"54.0\" rx=\"10\"/&gt;\n&lt;text class=\"lbl\" x=\"330.0\" y=\"205.5\" text-anchor=\"middle\" style=\"font-size:14px\"&gt;N workers&lt;tspan x=\"330.0\" dy=\"19\"&gt;(threads or asyncio tasks)&lt;/tspan&gt;&lt;/text&gt;\n&lt;rect class=\"sk\" x=\"62.0\" y=\"283.5\" width=\"226.0\" height=\"73.0\" rx=\"10\"/&gt;\n&lt;text class=\"lbl\" x=\"175.0\" y=\"306.0\" text-anchor=\"middle\" style=\"font-size:14px\"&gt;TaskHandle: status,&lt;tspan x=\"175.0\" dy=\"19\"&gt;result / error, duration,&lt;/tspan&gt;&lt;tspan x=\"175.0\" dy=\"19\"&gt;attempts&lt;/tspan&gt;&lt;/text&gt;\n&lt;rect class=\"sk\" x=\"369.0\" y=\"293.0\" width=\"252.0\" height=\"54.0\" rx=\"10\"/&gt;\n&lt;text class=\"lbl\" x=\"495.0\" y=\"315.5\" text-anchor=\"middle\" style=\"font-size:14px\"&gt;metrics: queue depth,&lt;tspan x=\"495.0\" dy=\"19\"&gt;active workers, p95 duration&lt;/tspan&gt;&lt;/text&gt;\n&lt;rect class=\"sk\" x=\"499.0\" y=\"107.5\" width=\"132.0\" height=\"35.0\" rx=\"10\"/&gt;\n&lt;text class=\"lbl\" x=\"565.0\" y=\"130.0\" text-anchor=\"middle\" style=\"font-size:14px\"&gt;cancel(handle)&lt;/text&gt;\n&lt;rect class=\"sk\" x=\"474.0\" y=\"192.5\" width=\"182.0\" height=\"35.0\" rx=\"10\"/&gt;\n&lt;text class=\"lbl\" x=\"565.0\" y=\"215.0\" text-anchor=\"middle\" style=\"font-size:14px\"&gt;shutdown(drain=True)&lt;/text&gt;\n&lt;path class=\"sk blue\" d=\"M330.0 57.5 Q 324.0 82.5 330.0 107.5\" style=\"color:var(--ink)\" marker-end=\"url(#arr)\"/&gt;\n&lt;path class=\"sk blue\" d=\"M330.0 142.5 Q 324.0 162.8 330.0 183.0\" style=\"color:var(--ink)\" marker-end=\"url(#arr)\"/&gt;\n&lt;path class=\"sk blue\" d=\"M292.0 237.0 Q 255.7 255.4 226.4 283.5\" style=\"color:var(--ink)\" marker-end=\"url(#arr)\"/&gt;\n&lt;path class=\"sk blue\" d=\"M370.5 237.0 Q 409.2 270.0 454.5 293.0\" style=\"color:var(--ink)\" marker-end=\"url(#arr)\"/&gt;\n&lt;path class=\"sk blue\" d=\"M499.0 125.0 Q 463.5 119.0 428.0 125.0\" style=\"color:var(--ink)\" marker-end=\"url(#arr)\"/&gt;\n&lt;path class=\"sk blue\" d=\"M474.0 210.0 Q 457.5 204.0 441.0 210.0\" style=\"color:var(--ink)\" marker-end=\"url(#arr)\"/&gt;\n&lt;/svg&gt;\n&lt;figcaption&gt;Fig: the executor: bounded queue, worker pool, a handle per task, metrics, cancel and graceful shutdown&lt;/figcaption&gt;\n&lt;/figure&gt;"]</textarea>
<textarea id="codes" hidden>{"import threading, queue, time\nfrom concurrent.futures import ThreadPoolExecutor, as_completed\n\n# ---- 1. Mutex-protected counter (a monitor) --------------------------------------\nclass Counter:\n    \"\"\"Thread-safe: every access to _n holds _lock.\"\"\"\n    def __init__(self): self._n, self._lock = 0, threading.Lock()\n    def incr(self):\n        with self._lock:\n            self._n += 1\n    @property\n    def value(self):\n        with self._lock:\n            return self._n\n\nc = Counter()\nthreads = [threading.Thread(target=lambda: [c.incr() for _ in range(10_000)]) for _ in range(8)]\nfor t in threads: t.start()\nfor t in threads: t.join()\nprint(c.value)                                              # 80000\n\n# ---- 2. Channel-based worker pool: no shared mutable state -----------------------\ndef worker_pool(tasks, fn, n_workers=4):\n    inbox, outbox = queue.Queue(maxsize=100), queue.Queue()\n    STOP = object()\n    def worker():\n        while (item := inbox.get()) is not STOP:\n            idx, arg = item\n            try:\n                outbox.put((idx, fn(arg), None))\n            except Exception as e:\n                outbox.put((idx, None, e))                  # per-task error, pool keeps running\n    ws = [threading.Thread(target=worker) for _ in range(n_workers)]\n    for w in ws: w.start()\n    for i, t in enumerate(tasks): inbox.put((i, t))         # blocks when full \u2192 backpressure\n    for _ in ws: inbox.put(STOP)\n    for w in ws: w.join()\n    results = [outbox.get() for _ in tasks]\n    return [r for r in sorted(results, key=lambda r: r[0])]\n\nout = worker_pool([1, 2, 0, 4], lambda x: 10 // x)\nprint([(i, v, type(e).__name__ if e else None) for i, v, e in out])\n# [(0, 10, None), (1, 5, None), (2, None, 'ZeroDivisionError'), (3, 2, None)]\n\n# ---- 3. An actor with a mailbox -------------------------------------------------\nclass AccountActor(threading.Thread):\n    def __init__(self):\n        super().__init__(daemon=True)\n        self.mailbox, self._balance = queue.Queue(), 0      # _balance is touched ONLY by run()\n    def run(self):\n        while True:\n            msg, arg, reply = self.mailbox.get()\n            if msg == \"deposit\": self._balance += arg\n            elif msg == \"withdraw\" and arg &lt;= self._balance: self._balance -= arg\n            elif msg == \"balance\": reply.put(self._balance)\n    def tell(self, msg, arg=None): self.mailbox.put((msg, arg, None))\n    def ask(self, msg):\n        reply = queue.Queue(maxsize=1); self.mailbox.put((msg, None, reply)); return reply.get(timeout=1)\n\nacct = AccountActor(); acct.start()\nfor _ in range(100): acct.tell(\"deposit\", 5)\nacct.tell(\"withdraw\", 120)\nprint(acct.ask(\"balance\"))                                  # 380\n\n# ---- 4. The standard library does most of this for you --------------------------\nwith ThreadPoolExecutor(max_workers=8) as pool:             # bounded worker pool + futures\n    futs = {pool.submit(time.sleep, 0.01): i for i in range(20)}\n    print(sum(1 for f in as_completed(futs) if f.exception() is None))   # 20": "&lt;span class=\"kw\"&gt;import&lt;/span&gt; threading, queue, time\n&lt;span class=\"kw\"&gt;from&lt;/span&gt; concurrent.futures &lt;span class=\"kw\"&gt;import&lt;/span&gt; ThreadPoolExecutor, as_completed\n\n&lt;span class=\"cm\"&gt;# ---- 1. Mutex-protected counter (a monitor) --------------------------------------&lt;/span&gt;\n&lt;span class=\"kw\"&gt;class&lt;/span&gt; Counter:\n    &lt;span class=\"st\"&gt;\"\"\"Thread-safe: every access to _n holds _lock.\"\"\"&lt;/span&gt;\n    &lt;span class=\"kw\"&gt;def&lt;/span&gt; &lt;span class=\"fn\"&gt;__init__&lt;/span&gt;(&lt;span class=\"bi\"&gt;self&lt;/span&gt;): &lt;span class=\"bi\"&gt;self&lt;/span&gt;._n, &lt;span class=\"bi\"&gt;self&lt;/span&gt;._lock = &lt;span class=\"nu\"&gt;0&lt;/span&gt;, threading.&lt;span class=\"fn\"&gt;Lock&lt;/span&gt;()\n    &lt;span class=\"kw\"&gt;def&lt;/span&gt; &lt;span class=\"fn\"&gt;incr&lt;/span&gt;(&lt;span class=\"bi\"&gt;self&lt;/span&gt;):\n        &lt;span class=\"kw\"&gt;with&lt;/span&gt; &lt;span class=\"bi\"&gt;self&lt;/span&gt;._lock:\n            &lt;span class=\"bi\"&gt;self&lt;/span&gt;._n += &lt;span class=\"nu\"&gt;1&lt;/span&gt;\n    &lt;span class=\"bi\"&gt;@property&lt;/span&gt;\n    &lt;span class=\"kw\"&gt;def&lt;/span&gt; &lt;span class=\"fn\"&gt;value&lt;/span&gt;(&lt;span class=\"bi\"&gt;self&lt;/span&gt;):\n        &lt;span class=\"kw\"&gt;with&lt;/span&gt; &lt;span class=\"bi\"&gt;self&lt;/span&gt;._lock:\n            &lt;span class=\"kw\"&gt;return&lt;/span&gt; &lt;span class=\"bi\"&gt;self&lt;/span&gt;._n\n\nc = &lt;span class=\"fn\"&gt;Counter&lt;/span&gt;()\nthreads = [threading.&lt;span class=\"fn\"&gt;Thread&lt;/span&gt;(target=&lt;span class=\"kw\"&gt;lambda&lt;/span&gt;: [c.&lt;span class=\"fn\"&gt;incr&lt;/span&gt;() &lt;span class=\"kw\"&gt;for&lt;/span&gt; _ &lt;span class=\"kw\"&gt;in&lt;/span&gt; &lt;span class=\"bi\"&gt;range&lt;/span&gt;(&lt;span class=\"nu\"&gt;10_000&lt;/span&gt;)]) &lt;span class=\"kw\"&gt;for&lt;/span&gt; _ &lt;span class=\"kw\"&gt;in&lt;/span&gt; &lt;span class=\"bi\"&gt;range&lt;/span&gt;(&lt;span class=\"nu\"&gt;8&lt;/span&gt;)]\n&lt;span class=\"kw\"&gt;for&lt;/span&gt; t &lt;span class=\"kw\"&gt;in&lt;/span&gt; threads: t.&lt;span class=\"fn\"&gt;start&lt;/span&gt;()\n&lt;span class=\"kw\"&gt;for&lt;/span&gt; t &lt;span class=\"kw\"&gt;in&lt;/span&gt; threads: t.&lt;span class=\"fn\"&gt;join&lt;/span&gt;()\n&lt;span class=\"bi\"&gt;print&lt;/span&gt;(c.value)                                              &lt;span class=\"cm\"&gt;# 80000&lt;/span&gt;\n\n&lt;span class=\"cm\"&gt;# ---- 2. Channel-based worker pool: no shared mutable state -----------------------&lt;/span&gt;\n&lt;span class=\"kw\"&gt;def&lt;/span&gt; &lt;span class=\"fn\"&gt;worker_pool&lt;/span&gt;(tasks, fn, n_workers=&lt;span class=\"nu\"&gt;4&lt;/span&gt;):\n    inbox, outbox = queue.&lt;span class=\"fn\"&gt;Queue&lt;/span&gt;(maxsize=&lt;span class=\"nu\"&gt;100&lt;/span&gt;), queue.&lt;span class=\"fn\"&gt;Queue&lt;/span&gt;()\n    STOP = &lt;span class=\"bi\"&gt;object&lt;/span&gt;()\n    &lt;span class=\"kw\"&gt;def&lt;/span&gt; &lt;span class=\"fn\"&gt;worker&lt;/span&gt;():\n        &lt;span class=\"kw\"&gt;while&lt;/span&gt; (item := inbox.&lt;span class=\"fn\"&gt;get&lt;/span&gt;()) &lt;span class=\"kw\"&gt;is&lt;/span&gt; &lt;span class=\"kw\"&gt;not&lt;/span&gt; STOP:\n            idx, arg = item\n            &lt;span class=\"kw\"&gt;try&lt;/span&gt;:\n                outbox.&lt;span class=\"fn\"&gt;put&lt;/span&gt;((idx, &lt;span class=\"fn\"&gt;fn&lt;/span&gt;(arg), &lt;span class=\"kw\"&gt;None&lt;/span&gt;))\n            &lt;span class=\"kw\"&gt;except&lt;/span&gt; &lt;span class=\"bi\"&gt;Exception&lt;/span&gt; &lt;span class=\"kw\"&gt;as&lt;/span&gt; e:\n                outbox.&lt;span class=\"fn\"&gt;put&lt;/span&gt;((idx, &lt;span class=\"kw\"&gt;None&lt;/span&gt;, e))                  &lt;span class=\"cm\"&gt;# per-task error, pool keeps running&lt;/span&gt;\n    ws = [threading.&lt;span class=\"fn\"&gt;Thread&lt;/span&gt;(target=worker) &lt;span class=\"kw\"&gt;for&lt;/span&gt; _ &lt;span class=\"kw\"&gt;in&lt;/span&gt; &lt;span class=\"bi\"&gt;range&lt;/span&gt;(n_workers)]\n    &lt;span class=\"kw\"&gt;for&lt;/span&gt; w &lt;span class=\"kw\"&gt;in&lt;/span&gt; ws: w.&lt;span class=\"fn\"&gt;start&lt;/span&gt;()\n    &lt;span class=\"kw\"&gt;for&lt;/span&gt; i, t &lt;span class=\"kw\"&gt;in&lt;/span&gt; &lt;span class=\"bi\"&gt;enumerate&lt;/span&gt;(tasks): inbox.&lt;span class=\"fn\"&gt;put&lt;/span&gt;((i, t))         &lt;span class=\"cm\"&gt;# blocks when full \u2192 backpressure&lt;/span&gt;\n    &lt;span class=\"kw\"&gt;for&lt;/span&gt; _ &lt;span class=\"kw\"&gt;in&lt;/span&gt; ws: inbox.&lt;span class=\"fn\"&gt;put&lt;/span&gt;(STOP)\n    &lt;span class=\"kw\"&gt;for&lt;/span&gt; w &lt;span class=\"kw\"&gt;in&lt;/span&gt; ws: w.&lt;span class=\"fn\"&gt;join&lt;/span&gt;()\n    results = [outbox.&lt;span class=\"fn\"&gt;get&lt;/span&gt;() &lt;span class=\"kw\"&gt;for&lt;/span&gt; _ &lt;span class=\"kw\"&gt;in&lt;/span&gt; tasks]\n    &lt;span class=\"kw\"&gt;return&lt;/span&gt; [r &lt;span class=\"kw\"&gt;for&lt;/span&gt; r &lt;span class=\"kw\"&gt;in&lt;/span&gt; &lt;span class=\"bi\"&gt;sorted&lt;/span&gt;(results, key=&lt;span class=\"kw\"&gt;lambda&lt;/span&gt; r: r[&lt;span class=\"nu\"&gt;0&lt;/span&gt;])]\n\nout = &lt;span class=\"fn\"&gt;worker_pool&lt;/span&gt;([&lt;span class=\"nu\"&gt;1&lt;/span&gt;, &lt;span class=\"nu\"&gt;2&lt;/span&gt;, &lt;span class=\"nu\"&gt;0&lt;/span&gt;, &lt;span class=\"nu\"&gt;4&lt;/span&gt;], &lt;span class=\"kw\"&gt;lambda&lt;/span&gt; x: &lt;span class=\"nu\"&gt;10&lt;/span&gt; // x)\n&lt;span class=\"bi\"&gt;print&lt;/span&gt;([(i, v, &lt;span class=\"bi\"&gt;type&lt;/span&gt;(e).__name__ &lt;span class=\"kw\"&gt;if&lt;/span&gt; e &lt;span class=\"kw\"&gt;else&lt;/span&gt; &lt;span class=\"kw\"&gt;None&lt;/span&gt;) &lt;span class=\"kw\"&gt;for&lt;/span&gt; i, v, e &lt;span class=\"kw\"&gt;in&lt;/span&gt; out])\n&lt;span class=\"cm\"&gt;# [(0, 10, None), (1, 5, None), (2, None, 'ZeroDivisionError'), (3, 2, None)]&lt;/span&gt;\n\n&lt;span class=\"cm\"&gt;# ---- 3. An actor with a mailbox -------------------------------------------------&lt;/span&gt;\n&lt;span class=\"kw\"&gt;class&lt;/span&gt; &lt;span class=\"fn\"&gt;AccountActor&lt;/span&gt;(threading.Thread):\n    &lt;span class=\"kw\"&gt;def&lt;/span&gt; &lt;span class=\"fn\"&gt;__init__&lt;/span&gt;(&lt;span class=\"bi\"&gt;self&lt;/span&gt;):\n        &lt;span class=\"bi\"&gt;super&lt;/span&gt;().&lt;span class=\"fn\"&gt;__init__&lt;/span&gt;(daemon=&lt;span class=\"kw\"&gt;True&lt;/span&gt;)\n        &lt;span class=\"bi\"&gt;self&lt;/span&gt;.mailbox, &lt;span class=\"bi\"&gt;self&lt;/span&gt;._balance = queue.&lt;span class=\"fn\"&gt;Queue&lt;/span&gt;(), &lt;span class=\"nu\"&gt;0&lt;/span&gt;      &lt;span class=\"cm\"&gt;# _balance is touched ONLY by run()&lt;/span&gt;\n    &lt;span class=\"kw\"&gt;def&lt;/span&gt; &lt;span class=\"fn\"&gt;run&lt;/span&gt;(&lt;span class=\"bi\"&gt;self&lt;/span&gt;):\n        &lt;span class=\"kw\"&gt;while&lt;/span&gt; &lt;span class=\"kw\"&gt;True&lt;/span&gt;:\n            msg, arg, reply = &lt;span class=\"bi\"&gt;self&lt;/span&gt;.mailbox.&lt;span class=\"fn\"&gt;get&lt;/span&gt;()\n            &lt;span class=\"kw\"&gt;if&lt;/span&gt; msg == &lt;span class=\"st\"&gt;\"deposit\"&lt;/span&gt;: &lt;span class=\"bi\"&gt;self&lt;/span&gt;._balance += arg\n            &lt;span class=\"kw\"&gt;elif&lt;/span&gt; msg == &lt;span class=\"st\"&gt;\"withdraw\"&lt;/span&gt; &lt;span class=\"kw\"&gt;and&lt;/span&gt; arg &amp;lt;= &lt;span class=\"bi\"&gt;self&lt;/span&gt;._balance: &lt;span class=\"bi\"&gt;self&lt;/span&gt;._balance -= arg\n            &lt;span class=\"kw\"&gt;elif&lt;/span&gt; msg == &lt;span class=\"st\"&gt;\"balance\"&lt;/span&gt;: reply.&lt;span class=\"fn\"&gt;put&lt;/span&gt;(&lt;span class=\"bi\"&gt;self&lt;/span&gt;._balance)\n    &lt;span class=\"kw\"&gt;def&lt;/span&gt; &lt;span class=\"fn\"&gt;tell&lt;/span&gt;(&lt;span class=\"bi\"&gt;self&lt;/span&gt;, msg, arg=&lt;span class=\"kw\"&gt;None&lt;/span&gt;): &lt;span class=\"bi\"&gt;self&lt;/span&gt;.mailbox.&lt;span class=\"fn\"&gt;put&lt;/span&gt;((msg, arg, &lt;span class=\"kw\"&gt;None&lt;/span&gt;))\n    &lt;span class=\"kw\"&gt;def&lt;/span&gt; &lt;span class=\"fn\"&gt;ask&lt;/span&gt;(&lt;span class=\"bi\"&gt;self&lt;/span&gt;, msg):\n        reply = queue.&lt;span class=\"fn\"&gt;Queue&lt;/span&gt;(maxsize=&lt;span class=\"nu\"&gt;1&lt;/span&gt;); &lt;span class=\"bi\"&gt;self&lt;/span&gt;.mailbox.&lt;span class=\"fn\"&gt;put&lt;/span&gt;((msg, &lt;span class=\"kw\"&gt;None&lt;/span&gt;, reply)); &lt;span class=\"kw\"&gt;return&lt;/span&gt; reply.&lt;span class=\"fn\"&gt;get&lt;/span&gt;(timeout=&lt;span class=\"nu\"&gt;1&lt;/span&gt;)\n\nacct = &lt;span class=\"fn\"&gt;AccountActor&lt;/span&gt;(); acct.&lt;span class=\"fn\"&gt;start&lt;/span&gt;()\n&lt;span class=\"kw\"&gt;for&lt;/span&gt; _ &lt;span class=\"kw\"&gt;in&lt;/span&gt; &lt;span class=\"bi\"&gt;range&lt;/span&gt;(&lt;span class=\"nu\"&gt;100&lt;/span&gt;): acct.&lt;span class=\"fn\"&gt;tell&lt;/span&gt;(&lt;span class=\"st\"&gt;\"deposit\"&lt;/span&gt;, &lt;span class=\"nu\"&gt;5&lt;/span&gt;)\nacct.&lt;span class=\"fn\"&gt;tell&lt;/span&gt;(&lt;span class=\"st\"&gt;\"withdraw\"&lt;/span&gt;, &lt;span class=\"nu\"&gt;120&lt;/span&gt;)\n&lt;span class=\"bi\"&gt;print&lt;/span&gt;(acct.&lt;span class=\"fn\"&gt;ask&lt;/span&gt;(&lt;span class=\"st\"&gt;\"balance\"&lt;/span&gt;))                                  &lt;span class=\"cm\"&gt;# 380&lt;/span&gt;\n\n&lt;span class=\"cm\"&gt;# ---- 4. The standard library does most of this for you --------------------------&lt;/span&gt;\n&lt;span class=\"kw\"&gt;with&lt;/span&gt; &lt;span class=\"fn\"&gt;ThreadPoolExecutor&lt;/span&gt;(max_workers=&lt;span class=\"nu\"&gt;8&lt;/span&gt;) &lt;span class=\"kw\"&gt;as&lt;/span&gt; pool:             &lt;span class=\"cm\"&gt;# bounded worker pool + futures&lt;/span&gt;\n    futs = {pool.&lt;span class=\"fn\"&gt;submit&lt;/span&gt;(time.sleep, &lt;span class=\"nu\"&gt;0.01&lt;/span&gt;): i &lt;span class=\"kw\"&gt;for&lt;/span&gt; i &lt;span class=\"kw\"&gt;in&lt;/span&gt; &lt;span class=\"bi\"&gt;range&lt;/span&gt;(&lt;span class=\"nu\"&gt;20&lt;/span&gt;)}\n    &lt;span class=\"bi\"&gt;print&lt;/span&gt;(&lt;span class=\"bi\"&gt;sum&lt;/span&gt;(&lt;span class=\"nu\"&gt;1&lt;/span&gt; &lt;span class=\"kw\"&gt;for&lt;/span&gt; f &lt;span class=\"kw\"&gt;in&lt;/span&gt; &lt;span class=\"fn\"&gt;as_completed&lt;/span&gt;(futs) &lt;span class=\"kw\"&gt;if&lt;/span&gt; f.&lt;span class=\"fn\"&gt;exception&lt;/span&gt;() &lt;span class=\"kw\"&gt;is&lt;/span&gt; &lt;span class=\"kw\"&gt;None&lt;/span&gt;))   &lt;span class=\"cm\"&gt;# 20&lt;/span&gt;"}</textarea>
