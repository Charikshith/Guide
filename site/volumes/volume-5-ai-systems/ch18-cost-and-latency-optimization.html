## Concept

Caching (semantic + exact), batching, streaming, model routing, and reducing tokens.

**In one sentence:** you make LLM apps cheaper and faster by not calling the model when you don't have to (caching), sending fewer tokens when you do (prompt trimming and prompt caching), sending easy work to small models (routing), doing work in bulk (batching), and showing output as soon as it exists (streaming) — each verified against your evals so quality doesn't silently drop.

**Mental model — a busy café.** Pre-made popular drinks sit ready on the counter (cache). Simple orders go to the junior barista; complex ones to the head barista (routing). Ten identical orders are made in one go (batching). You hand over the coffee while the pastry is still warming (streaming). And you don't read the customer their whole order history before every cup (fewer tokens).

**Where cost and latency come from**

| Driver | Cost | Latency |
|--------|------|---------|
| input tokens | ✓ (per token) | prefill time grows with prompt length |
| **output tokens** | ✓✓ (priced several times higher than input) | decode is sequential: roughly tokens ÷ tokens-per-second |
| model size | bigger = pricier | bigger = slower per token |
| number of calls (agents, chains) | multiplies everything | sequential calls add up |
| network / queueing | — | TTFT under load |

**The toolbox**

| Technique | How | Typical effect | Risk |
|-----------|-----|----------------|------|
| **Exact cache** | key = hash(model, prompt, params) → stored response | 100% saving on repeats | only identical requests hit |
| **Semantic cache** | embed the query; if a past query is similar above a threshold, return its answer | hits paraphrases ("reset password" ≈ "forgot my password") | **wrong answers** on near-but-different queries ("cancel order 12" vs "cancel order 13"); needs a strict threshold and scoping |
| **Prompt caching** (provider-side) | mark a stable prefix (system prompt, tools, documents) as cacheable; later calls reuse it | cached input tokens cost a fraction and prefill is faster | the prefix must be byte-identical; put variable content last |
| **Model routing** | a cheap classifier or rules send easy requests to a small model, hard ones to a large model | often 50–80% cost reduction | misroutes → quality loss; monitor per route |
| Cascade | try the small model; escalate if confidence or validation fails | quality of the large model at a lower average cost | extra latency on escalations |
| **Batching** | offline: batch APIs (large discount, results within hours); self-hosted: continuous batching in vLLM ([Ch 4](ch04-inference-and-serving.md)) | throughput ↑, cost per token ↓ | batch APIs aren't real-time |
| **Streaming** | send tokens as they're generated | perceived latency ↓ dramatically (TTFT matters) | none — just do it for user-facing text |
| Token reduction | shorter system prompts, fewer and shorter examples, trimmed retrieved chunks, summarize history ([Ch 12](ch12-agent-memory.md)), ask for concise output, set `max_tokens` | linear savings | too aggressive → lost context |
| Parallelize | independent calls concurrently (`asyncio.gather`) | latency = the slowest call, not the sum | rate limits |
| Structured, short outputs | JSON with only needed fields | fewer output tokens | — |

**Measure first** — use the traces from [Ch 16](ch16-ai-observability.md): cost per request by route, tokens per step, cache hit rates, TTFT and total latency. Optimize the biggest line item, and re-run the eval ([Ch 17](ch17-evaluation.md)) after each change.

## Diagram

**A request path with cache hits, batching, and a small/large model router**

```mermaid
flowchart TD
    R["request"] --&gt; EC{"exact cache&lt;br/&gt;hash(prompt, model)"}
    EC -- hit --&gt; OUT["response (≈0 ms, $0)"]
    EC -- miss --&gt; SC{"semantic cache&lt;br/&gt;similarity ≥ 0.95&lt;br/&gt;same tenant + intent"}
    SC -- hit --&gt; OUT
    SC -- miss --&gt; RT{"router&lt;br/&gt;(rules + small classifier)"}
    RT -- "easy: FAQ, classify, extract" --&gt; SM["small model&lt;br/&gt;claude-haiku-4-5"]
    RT -- "hard: reasoning, code, multi-step" --&gt; LG["large model&lt;br/&gt;claude-opus-5-5"]
    SM -- "low confidence / invalid JSON" --&gt; LG
    SM &amp; LG --&gt; PC["provider prompt cache:&lt;br/&gt;system + tools + docs prefix"]
    PC --&gt; ST["stream tokens to the user"] --&gt; OUT
    OFF["offline jobs (nightly tagging)"] --&gt; BA["Batch API&lt;br/&gt;(discounted, async)"]
```

**Before and after (example numbers from one workload)**

```
                         before      after       change
 requests/day            100,000     100,000
 exact + semantic hits   0%          28%
 routed to small model   0%          55% of misses
 avg input tokens        6,200       2,900       prompt trimmed + cached prefix
 avg output tokens       480         260         "answer in ≤ 120 words"
 p50 TTFT                1.9 s       0.6 s       streaming + smaller model
 cost/day                $1,420      $310        −78%
 eval score              8.4         8.3         within the noise band ✅
```

**Semantic cache danger zone**

```
 cached query: "cancel order 1234"          similarity to new query
 new: "please cancel order #1234"           0.97 → hit ✓ (same intent, same entity)
 new: "cancel order 1235"                   0.96 → WRONG hit ✗ — must key on entities too
 new: "how do I cancel an order?"           0.88 → miss ✓
```

## Example

```python
import hashlib, json, anthropic, numpy as np
client = anthropic.Anthropic()

# 1) Exact cache
EXACT: dict[str, str] = {}
def exact_key(model, system, user): return hashlib.sha256(json.dumps([model, system, user]).encode()).hexdigest()

# 2) Semantic cache — scoped by tenant, only for "static" intents, strict threshold
class SemanticCache:
    def __init__(self, embed, threshold=0.95):
        self.embed, self.threshold, self.items = embed, threshold, []   # (tenant, vector, answer)
    def get(self, tenant, query):
        q = self.embed(query)
        best = max(((float(q @ v), a) for t, v, a in self.items if t == tenant), default=(0, None))
        return best[1] if best[0] &gt;= self.threshold else None
    def put(self, tenant, query, answer):
        self.items.append((tenant, self.embed(query), answer))

# 3) Router: rules first, then a cheap classifier call
def route(user_msg: str) -&gt; str:
    if len(user_msg) &lt; 200 and any(k in user_msg.lower() for k in ("opening hours", "price", "reset password")):
        return "claude-haiku-4-5-20251001"
    verdict = client.messages.create(model="claude-haiku-4-5-20251001", max_tokens=5,
        messages=[{"role": "user", "content": f"Answer EASY or HARD only. Is this request simple FAQ/lookup (EASY) or multi-step reasoning/code (HARD)?\n\n{user_msg}"}])
    return "claude-opus-5-5" if "HARD" in verdict.content[0].text else "claude-haiku-4-5-20251001"

# 4) Provider prompt caching: mark the large, stable prefix as cacheable
POLICY_DOC = open("policy.md").read()          # thousands of tokens, identical every call
def answer(user_msg: str, tenant="t1", sem: SemanticCache | None = None) -&gt; str:
    key = exact_key("any", "support-v14", user_msg)
    if key in EXACT: return EXACT[key]
    if sem and (hit := sem.get(tenant, user_msg)): return hit
    model = route(user_msg)
    with client.messages.stream(
        model=model, max_tokens=400,
        system=[{"type": "text", "text": "You are a concise support agent. Answer in at most 120 words."},
                {"type": "text", "text": POLICY_DOC, "cache_control": {"type": "ephemeral"}}],
        messages=[{"role": "user", "content": user_msg}],
    ) as stream:
        text = "".join(stream.text_stream)        # in a UI, forward each chunk as it arrives
    EXACT[key] = text
    if sem: sem.put(tenant, user_msg, text)
    return text
```

## Exercises

1. Add a semantic cache.

   &lt;details&gt;&lt;summary&gt;Solution&lt;/summary&gt;Embed incoming queries, search past queries for the same tenant, and return the cached answer only above a strict threshold (tune it on labeled pairs of "same" vs "different" questions). Restrict it to intents whose answers don't depend on user-specific or changing data, include extracted entities (order IDs, dates) in the key, and set a TTL. Measure hit rate &lt;i&gt;and&lt;/i&gt; wrong-hit rate on a test set.&lt;/details&gt;

2. Build a model router by task difficulty.

   &lt;details&gt;&lt;summary&gt;Solution&lt;/summary&gt;Start with rules for obvious cases, then a cheap classifier (a small model with a one-word answer, or a trained logistic regression on embeddings). Label ~200 historical requests with which model is &lt;i&gt;needed&lt;/i&gt; (run both, judge the outputs), and tune the router for high recall on HARD. Add a cascade: if the small model's output fails validation, retry on the large model. Report cost and eval score per route.&lt;/details&gt;

3. Your system prompt is 4,000 tokens and changes every request because it includes the current timestamp at the top. What's the problem?

   &lt;details&gt;&lt;summary&gt;Solution&lt;/summary&gt;Provider prompt caching needs an identical prefix, so a timestamp at the start breaks every cache hit. Move variable content (time, user data) after the stable part, or into the user message.&lt;/details&gt;

## Mini project

**An optimized pipeline with cache + routing, showing cost/latency before/after.**

```mermaid
flowchart LR
    LOAD["replay 2,000 realistic requests&lt;br/&gt;(with ~30% paraphrased repeats)"] --&gt; V0["v0: large model,&lt;br/&gt;no cache, no streaming"]
    LOAD --&gt; V1["v1: + exact + semantic cache"]
    LOAD --&gt; V2["v2: + router + cascade"]
    LOAD --&gt; V3["v3: + prompt caching + trimmed prompts + streaming"]
    V0 &amp; V1 &amp; V2 &amp; V3 --&gt; M["metrics: $/request, TTFT p50/p95,&lt;br/&gt;total latency, cache hits, wrong hits"]
    V0 &amp; V1 &amp; V2 &amp; V3 --&gt; Q["eval score (Ch 17) per version"]
    M &amp; Q --&gt; T["results table + chart"]
```

**Steps**

1. Build a replayable request set from real or synthetic traffic, including paraphrases and near-miss queries.
2. Measure v0 (baseline) for cost, latency, and eval score.
3. Add each optimization one at a time and re-measure all three.
4. Track semantic-cache wrong hits explicitly; tune the threshold.
5. Produce a table and chart; keep only optimizations that don't drop the eval score beyond the noise band.

**Done when:** you show a large cost and latency reduction with the eval score unchanged within noise, and you can say what each technique contributed.

## Open source

* [`zilliztech/GPTCache`](https://github.com/zilliztech/GPTCache) — a semantic cache for LLM responses with pluggable embeddings, stores, and similarity evaluators.
* [`vllm-project/vllm`](https://github.com/vllm-project/vllm) (batching) — continuous batching, PagedAttention, and automatic prefix caching for self-hosted serving. See also `lm-sys/RouteLLM` for learned model routing.

## Interview

1. **"How do you cut LLM cost without hurting quality?"**
   &lt;details&gt;&lt;summary&gt;Answer&lt;/summary&gt;Measure cost per route first. Then: cache exact and (carefully) semantic repeats; use provider prompt caching for stable prefixes; trim prompts, examples, and retrieved context; cap and shorten outputs; route easy requests to smaller models with a cascade fallback; use batch APIs for offline work; cut unnecessary agent steps. Re-run the eval suite after each change and ship only changes whose quality stays within the noise band.&lt;/details&gt;

2. **"Semantic vs exact cache?"**
   &lt;details&gt;&lt;summary&gt;Answer&lt;/summary&gt;An exact cache keys on the exact request, so it's always correct but hits only identical requests. A semantic cache matches by embedding similarity, so it hits paraphrases, but it can return wrong answers for queries that look similar but differ in an important detail (IDs, dates, negation, user-specific data). Use semantic caching only for stable, non-personalized intents, with strict thresholds, entity-aware keys, tenant scoping, TTLs, and measured false-hit rates.&lt;/details&gt;

=\"440\" height=\"56\" rx=\"8\" style=\"fill:#fdfbf4\"/&gt;\n      &lt;text class=\"lbl b\" x=\"340.0\" y=\"34.0\" text-anchor=\"middle\" style=\"font-size:15px\"&gt;replay 2,000 realistic requests&lt;/text&gt;\n      &lt;text class=\"lbl b\" x=\"340.0\" y=\"52.0\" text-anchor=\"middle\" style=\"font-size:15px\"&gt;(with ~30% paraphrased repeats)&lt;/text&gt;\n      &lt;rect class=\"sk\" x=\"6\" y=\"120\" width=\"158\" height=\"70\" rx=\"8\" style=\"fill:#fdfbf4\"/&gt;\n      &lt;text class=\"lbl b\" x=\"85.0\" y=\"142.0\" text-anchor=\"middle\" style=\"font-size:14px\"&gt;v0: large model,&lt;/text&gt;\n      &lt;text class=\"lbl b\" x=\"85.0\" y=\"160.0\" text-anchor=\"middle\" style=\"font-size:14px\"&gt;no cache, no&lt;/text&gt;\n      &lt;text class=\"lbl b\" x=\"85.0\" y=\"178.0\" text-anchor=\"middle\" style=\"font-size:14px\"&gt;streaming&lt;/text&gt;\n      &lt;path class=\"sk blue\" d=\"M340 66 C340 95, 85 90, 85 120\" style=\"color:var(--ink)\" marker-end=\"url(#arr)\"/&gt;\n      &lt;path class=\"sk blue\" d=\"M85 190 L85 245\" style=\"color:var(--ink)\"/&gt;\n      &lt;rect class=\"sk\" x=\"176\" y=\"120\" width=\"158\" height=\"70\" rx=\"8\" style=\"fill:#fdfbf4\"/&gt;\n      &lt;text class=\"lbl b\" x=\"255.0\" y=\"151.0\" text-anchor=\"middle\" style=\"font-size:14px\"&gt;v1: + exact +&lt;/text&gt;\n      &lt;text class=\"lbl b\" x=\"255.0\" y=\"169.0\" text-anchor=\"middle\" style=\"font-size:14px\"&gt;semantic cache&lt;/text&gt;\n      &lt;path class=\"sk blue\" d=\"M340 66 C340 95, 255 90, 255 120\" style=\"color:var(--ink)\" marker-end=\"url(#arr)\"/&gt;\n      &lt;path class=\"sk blue\" d=\"M255 190 L255 245\" style=\"color:var(--ink)\"/&gt;\n      &lt;rect class=\"sk\" x=\"346\" y=\"120\" width=\"158\" height=\"70\" rx=\"8\" style=\"fill:#fdfbf4\"/&gt;\n      &lt;text class=\"lbl b\" x=\"425.0\" y=\"151.0\" text-anchor=\"middle\" style=\"font-size:14px\"&gt;v2: + router +&lt;/text&gt;\n      &lt;text class=\"lbl b\" x=\"425.0\" y=\"169.0\" text-anchor=\"middle\" style=\"font-size:14px\"&gt;cascade&lt;/text&gt;\n      &lt;path class=\"sk blue\" d=\"M340 66 C340 95, 425 90, 425 120\" style=\"color:var(--ink)\" marker-end=\"url(#arr)\"/&gt;\n      &lt;path class=\"sk blue\" d=\"M425 190 L425 245\" style=\"color:var(--ink)\"/&gt;\n      &lt;rect class=\"sk\" x=\"516\" y=\"120\" width=\"158\" height=\"70\" rx=\"8\" style=\"fill:#fdfbf4\"/&gt;\n      &lt;text class=\"lbl b\" x=\"595.0\" y=\"142.0\" text-anchor=\"middle\" style=\"font-size:14px\"&gt;v3: + prompt&lt;/text&gt;\n      &lt;text class=\"lbl b\" x=\"595.0\" y=\"160.0\" text-anchor=\"middle\" style=\"font-size:14px\"&gt;caching + trimmed&lt;/text&gt;\n      &lt;text class=\"lbl b\" x=\"595.0\" y=\"178.0\" text-anchor=\"middle\" style=\"font-size:14px\"&gt;prompts + streaming&lt;/text&gt;\n      &lt;path class=\"sk blue\" d=\"M340 66 C340 95, 595 90, 595 120\" style=\"color:var(--ink)\" marker-end=\"url(#arr)\"/&gt;\n      &lt;path class=\"sk blue\" d=\"M595 190 L595 245\" style=\"color:var(--ink)\"/&gt;\n      &lt;path class=\"sk blue\" d=\"M85 245 L595 245\" style=\"color:var(--ink)\"/&gt;\n      &lt;path class=\"sk blue\" d=\"M175 245 L175 290\" style=\"color:var(--ink)\" marker-end=\"url(#arr)\"/&gt;\n      &lt;path class=\"sk blue\" d=\"M505 245 L505 290\" style=\"color:var(--ink)\" marker-end=\"url(#arr)\"/&gt;\n      &lt;rect class=\"sk\" x=\"10\" y=\"290\" width=\"330\" height=\"70\" rx=\"8\" style=\"fill:#fdfbf4\"/&gt;\n      &lt;text class=\"lbl b\" x=\"175.0\" y=\"312.0\" text-anchor=\"middle\" style=\"font-size:15px\"&gt;metrics: $/request, TTFT p50/p95,&lt;/text&gt;\n      &lt;text class=\"lbl b\" x=\"175.0\" y=\"330.0\" text-anchor=\"middle\" style=\"font-size:15px\"&gt;total latency, cache hits,&lt;/text&gt;\n      &lt;text class=\"lbl b\" x=\"175.0\" y=\"348.0\" text-anchor=\"middle\" style=\"font-size:15px\"&gt;wrong hits&lt;/text&gt;\n      &lt;rect class=\"sk\" x=\"350\" y=\"290\" width=\"320\" height=\"56\" rx=\"8\" style=\"fill:#fdfbf4\"/&gt;\n      &lt;text class=\"lbl b\" x=\"510.0\" y=\"323.0\" text-anchor=\"middle\" style=\"font-size:15px\"&gt;eval score (Ch 17) per version&lt;/text&gt;\n      &lt;rect class=\"sk green\" x=\"220\" y=\"420\" width=\"240\" height=\"40\" rx=\"8\" style=\"fill:#fdfbf4\"/&gt;\n      &lt;text class=\"lbl b\" x=\"340.0\" y=\"445.0\" text-anchor=\"middle\" style=\"font-size:15px\"&gt;results table + chart&lt;/text&gt;\n      &lt;path class=\"sk blue\" d=\"M175 360 C175 395, 300 385, 300 420\" style=\"color:var(--ink)\" marker-end=\"url(#arr)\"/&gt;\n      &lt;path class=\"sk blue\" d=\"M510 346 C510 390, 380 380, 380 420\" style=\"color:var(--ink)\" marker-end=\"url(#arr)\"/&gt;\n    &lt;/svg&gt;\n    &lt;figcaption&gt;Fig 2: An optimized pipeline with cache + routing, showing cost/latency before/after&lt;/figcaption&gt;\n  &lt;/figure&gt;"]</textarea>
<textarea id="codes" hidden>{"import hashlib, json, anthropic, numpy as np\nclient = anthropic.Anthropic()\n\n# 1) Exact cache\nEXACT: dict[str, str] = {}\ndef exact_key(model, system, user): return hashlib.sha256(json.dumps([model, system, user]).encode()).hexdigest()\n\n# 2) Semantic cache \u2014 scoped by tenant, only for \"static\" intents, strict threshold\nclass SemanticCache:\n    def __init__(self, embed, threshold=0.95):\n        self.embed, self.threshold, self.items = embed, threshold, []   # (tenant, vector, answer)\n    def get(self, tenant, query):\n        q = self.embed(query)\n        best = max(((float(q @ v), a) for t, v, a in self.items if t == tenant), default=(0, None))\n        return best[1] if best[0] &gt;= self.threshold else None\n    def put(self, tenant, query, answer):\n        self.items.append((tenant, self.embed(query), answer))\n\n# 3) Router: rules first, then a cheap classifier call\ndef route(user_msg: str) -&gt; str:\n    if len(user_msg) &lt; 200 and any(k in user_msg.lower() for k in (\"opening hours\", \"price\", \"reset password\")):\n        return \"claude-haiku-4-5-20251001\"\n    verdict = client.messages.create(model=\"claude-haiku-4-5-20251001\", max_tokens=5,\n        messages=[{\"role\": \"user\", \"content\": f\"Answer EASY or HARD only. Is this request simple FAQ/lookup (EASY) or multi-step reasoning/code (HARD)?\\n\\n{user_msg}\"}])\n    return \"claude-opus-5-5\" if \"HARD\" in verdict.content[0].text else \"claude-haiku-4-5-20251001\"\n\n# 4) Provider prompt caching: mark the large, stable prefix as cacheable\nPOLICY_DOC = open(\"policy.md\").read()          # thousands of tokens, identical every call\ndef answer(user_msg: str, tenant=\"t1\", sem: SemanticCache | None = None) -&gt; str:\n    key = exact_key(\"any\", \"support-v14\", user_msg)\n    if key in EXACT: return EXACT[key]\n    if sem and (hit := sem.get(tenant, user_msg)): return hit\n    model = route(user_msg)\n    with client.messages.stream(\n        model=model, max_tokens=400,\n        system=[{\"type\": \"text\", \"text\": \"You are a concise support agent. Answer in at most 120 words.\"},\n                {\"type\": \"text\", \"text\": POLICY_DOC, \"cache_control\": {\"type\": \"ephemeral\"}}],\n        messages=[{\"role\": \"user\", \"content\": user_msg}],\n    ) as stream:\n        text = \"\".join(stream.text_stream)        # in a UI, forward each chunk as it arrives\n    EXACT[key] = text\n    if sem: sem.put(tenant, user_msg, text)\n    return text": "&lt;span class=\"kw\"&gt;import&lt;/span&gt; hashlib, json, anthropic, numpy &lt;span class=\"kw\"&gt;as&lt;/span&gt; np\nclient = anthropic.&lt;span class=\"fn\"&gt;Anthropic&lt;/span&gt;()\n\n&lt;span class=\"cm\"&gt;# 1) Exact cache&lt;/span&gt;\nEXACT: &lt;span class=\"bi\"&gt;dict&lt;/span&gt;[&lt;span class=\"bi\"&gt;str&lt;/span&gt;, &lt;span class=\"bi\"&gt;str&lt;/span&gt;] = {}\n&lt;span class=\"kw\"&gt;def&lt;/span&gt; &lt;span class=\"fn\"&gt;exact_key&lt;/span&gt;(model, system, user): &lt;span class=\"kw\"&gt;return&lt;/span&gt; hashlib.&lt;span class=\"fn\"&gt;sha256&lt;/span&gt;(json.&lt;span class=\"fn\"&gt;dumps&lt;/span&gt;([model, system, user]).&lt;span class=\"fn\"&gt;encode&lt;/span&gt;()).&lt;span class=\"fn\"&gt;hexdigest&lt;/span&gt;()\n\n&lt;span class=\"cm\"&gt;# 2) Semantic cache \u2014 scoped by tenant, only for \"static\" intents, strict threshold&lt;/span&gt;\n&lt;span class=\"kw\"&gt;class&lt;/span&gt; SemanticCache:\n    &lt;span class=\"kw\"&gt;def&lt;/span&gt; &lt;span class=\"fn\"&gt;__init__&lt;/span&gt;(&lt;span class=\"bi\"&gt;self&lt;/span&gt;, embed, threshold=&lt;span class=\"nu\"&gt;0.95&lt;/span&gt;):\n        &lt;span class=\"bi\"&gt;self&lt;/span&gt;.embed, &lt;span class=\"bi\"&gt;self&lt;/span&gt;.threshold, &lt;span class=\"bi\"&gt;self&lt;/span&gt;.items = embed, threshold, []   &lt;span class=\"cm\"&gt;# (tenant, vector, answer)&lt;/span&gt;\n    &lt;span class=\"kw\"&gt;def&lt;/span&gt; &lt;span class=\"fn\"&gt;get&lt;/span&gt;(&lt;span class=\"bi\"&gt;self&lt;/span&gt;, tenant, query):\n        q = &lt;span class=\"bi\"&gt;self&lt;/span&gt;.&lt;span class=\"fn\"&gt;embed&lt;/span&gt;(query)\n        best = &lt;span class=\"bi\"&gt;max&lt;/span&gt;(((&lt;span class=\"bi\"&gt;float&lt;/span&gt;(q @ v), a) &lt;span class=\"kw\"&gt;for&lt;/span&gt; t, v, a &lt;span class=\"kw\"&gt;in&lt;/span&gt; &lt;span class=\"bi\"&gt;self&lt;/span&gt;.items &lt;span class=\"kw\"&gt;if&lt;/span&gt; t == tenant), default=(&lt;span class=\"nu\"&gt;0&lt;/span&gt;, &lt;span class=\"kw\"&gt;None&lt;/span&gt;))\n        &lt;span class=\"kw\"&gt;return&lt;/span&gt; best[&lt;span class=\"nu\"&gt;1&lt;/span&gt;] &lt;span class=\"kw\"&gt;if&lt;/span&gt; best[&lt;span class=\"nu\"&gt;0&lt;/span&gt;] &amp;gt;= &lt;span class=\"bi\"&gt;self&lt;/span&gt;.threshold &lt;span class=\"kw\"&gt;else&lt;/span&gt; &lt;span class=\"kw\"&gt;None&lt;/span&gt;\n    &lt;span class=\"kw\"&gt;def&lt;/span&gt; &lt;span class=\"fn\"&gt;put&lt;/span&gt;(&lt;span class=\"bi\"&gt;self&lt;/span&gt;, tenant, query, answer):\n        &lt;span class=\"bi\"&gt;self&lt;/span&gt;.items.&lt;span class=\"fn\"&gt;append&lt;/span&gt;((tenant, &lt;span class=\"bi\"&gt;self&lt;/span&gt;.&lt;span class=\"fn\"&gt;embed&lt;/span&gt;(query), answer))\n\n&lt;span class=\"cm\"&gt;# 3) Router: rules first, then a cheap classifier call&lt;/span&gt;\n&lt;span class=\"kw\"&gt;def&lt;/span&gt; &lt;span class=\"fn\"&gt;route&lt;/span&gt;(user_msg: &lt;span class=\"bi\"&gt;str&lt;/span&gt;) -&amp;gt; &lt;span class=\"bi\"&gt;str&lt;/span&gt;:\n    &lt;span class=\"kw\"&gt;if&lt;/span&gt; &lt;span class=\"bi\"&gt;len&lt;/span&gt;(user_msg) &amp;lt; &lt;span class=\"nu\"&gt;200&lt;/span&gt; &lt;span class=\"kw\"&gt;and&lt;/span&gt; &lt;span class=\"bi\"&gt;any&lt;/span&gt;(k &lt;span class=\"kw\"&gt;in&lt;/span&gt; user_msg.&lt;span class=\"fn\"&gt;lower&lt;/span&gt;() &lt;span class=\"kw\"&gt;for&lt;/span&gt; k &lt;span class=\"kw\"&gt;in&lt;/span&gt; (&lt;span class=\"st\"&gt;\"opening hours\"&lt;/span&gt;, &lt;span class=\"st\"&gt;\"price\"&lt;/span&gt;, &lt;span class=\"st\"&gt;\"reset password\"&lt;/span&gt;)):\n        &lt;span class=\"kw\"&gt;return&lt;/span&gt; &lt;span class=\"st\"&gt;\"claude-haiku-4-5-20251001\"&lt;/span&gt;\n    verdict = client.messages.&lt;span class=\"fn\"&gt;create&lt;/span&gt;(model=&lt;span class=\"st\"&gt;\"claude-haiku-4-5-20251001\"&lt;/span&gt;, max_tokens=&lt;span class=\"nu\"&gt;5&lt;/span&gt;,\n        messages=[{&lt;span class=\"st\"&gt;\"role\"&lt;/span&gt;: &lt;span class=\"st\"&gt;\"user\"&lt;/span&gt;, &lt;span class=\"st\"&gt;\"content\"&lt;/span&gt;: &lt;span class=\"st\"&gt;f\"Answer EASY or HARD only. Is this request simple FAQ/lookup (EASY) or multi-step reasoning/code (HARD)?\\n\\n{user_msg}\"&lt;/span&gt;}])\n    &lt;span class=\"kw\"&gt;return&lt;/span&gt; &lt;span class=\"st\"&gt;\"claude-opus-5-5\"&lt;/span&gt; &lt;span class=\"kw\"&gt;if&lt;/span&gt; &lt;span class=\"st\"&gt;\"HARD\"&lt;/span&gt; &lt;span class=\"kw\"&gt;in&lt;/span&gt; verdict.content[&lt;span class=\"nu\"&gt;0&lt;/span&gt;].text &lt;span class=\"kw\"&gt;else&lt;/span&gt; &lt;span class=\"st\"&gt;\"claude-haiku-4-5-20251001\"&lt;/span&gt;\n\n&lt;span class=\"cm\"&gt;# 4) Provider prompt caching: mark the large, stable prefix as cacheable&lt;/span&gt;\nPOLICY_DOC = &lt;span class=\"bi\"&gt;open&lt;/span&gt;(&lt;span class=\"st\"&gt;\"policy.md\"&lt;/span&gt;).&lt;span class=\"fn\"&gt;read&lt;/span&gt;()          &lt;span class=\"cm\"&gt;# thousands of tokens, identical every call&lt;/span&gt;\n&lt;span class=\"kw\"&gt;def&lt;/span&gt; &lt;span class=\"fn\"&gt;answer&lt;/span&gt;(user_msg: &lt;span class=\"bi\"&gt;str&lt;/span&gt;, tenant=&lt;span class=\"st\"&gt;\"t1\"&lt;/span&gt;, sem: SemanticCache | &lt;span class=\"kw\"&gt;None&lt;/span&gt; = &lt;span class=\"kw\"&gt;None&lt;/span&gt;) -&amp;gt; &lt;span class=\"bi\"&gt;str&lt;/span&gt;:\n    key = &lt;span class=\"fn\"&gt;exact_key&lt;/span&gt;(&lt;span class=\"st\"&gt;\"any\"&lt;/span&gt;, &lt;span class=\"st\"&gt;\"support-v14\"&lt;/span&gt;, user_msg)\n    &lt;span class=\"kw\"&gt;if&lt;/span&gt; key &lt;span class=\"kw\"&gt;in&lt;/span&gt; EXACT: &lt;span class=\"kw\"&gt;return&lt;/span&gt; EXACT[key]\n    &lt;span class=\"kw\"&gt;if&lt;/span&gt; sem &lt;span class=\"kw\"&gt;and&lt;/span&gt; (hit := sem.&lt;span class=\"fn\"&gt;get&lt;/span&gt;(tenant, user_msg)): &lt;span class=\"kw\"&gt;return&lt;/span&gt; hit\n    model = &lt;span class=\"fn\"&gt;route&lt;/span&gt;(user_msg)\n    &lt;span class=\"kw\"&gt;with&lt;/span&gt; client.messages.&lt;span class=\"fn\"&gt;stream&lt;/span&gt;(\n        model=model, max_tokens=&lt;span class=\"nu\"&gt;400&lt;/span&gt;,\n        system=[{&lt;span class=\"st\"&gt;\"type\"&lt;/span&gt;: &lt;span class=\"st\"&gt;\"text\"&lt;/span&gt;, &lt;span class=\"st\"&gt;\"text\"&lt;/span&gt;: &lt;span class=\"st\"&gt;\"You are a concise support agent. Answer in at most 120 words.\"&lt;/span&gt;},\n                {&lt;span class=\"st\"&gt;\"type\"&lt;/span&gt;: &lt;span class=\"st\"&gt;\"text\"&lt;/span&gt;, &lt;span class=\"st\"&gt;\"text\"&lt;/span&gt;: POLICY_DOC, &lt;span class=\"st\"&gt;\"cache_control\"&lt;/span&gt;: {&lt;span class=\"st\"&gt;\"type\"&lt;/span&gt;: &lt;span class=\"st\"&gt;\"ephemeral\"&lt;/span&gt;}}],\n        messages=[{&lt;span class=\"st\"&gt;\"role\"&lt;/span&gt;: &lt;span class=\"st\"&gt;\"user\"&lt;/span&gt;, &lt;span class=\"st\"&gt;\"content\"&lt;/span&gt;: user_msg}],\n    ) &lt;span class=\"kw\"&gt;as&lt;/span&gt; stream:\n        text = &lt;span class=\"st\"&gt;\"\"&lt;/span&gt;.&lt;span class=\"fn\"&gt;join&lt;/span&gt;(stream.text_stream)        &lt;span class=\"cm\"&gt;# in a UI, forward each chunk as it arrives&lt;/span&gt;\n    EXACT[key] = text\n    &lt;span class=\"kw\"&gt;if&lt;/span&gt; sem: sem.&lt;span class=\"fn\"&gt;put&lt;/span&gt;(tenant, user_msg, text)\n    &lt;span class=\"kw\"&gt;return&lt;/span&gt; text", "# Offline work \u2192 the Message Batches API (asynchronous, discounted)\nbatch = client.messages.batches.create(requests=[\n    {\"custom_id\": f\"doc-{i}\", \"params\": {\"model\": \"claude-haiku-4-5-20251001\", \"max_tokens\": 50,\n     \"messages\": [{\"role\": \"user\", \"content\": f\"Classify the sentiment: {t}\"}]}}\n    for i, t in enumerate(reviews)])\n# poll client.messages.batches.retrieve(batch.id); then read results": "&lt;span class=\"cm\"&gt;# Offline work \u2192 the Message Batches API (asynchronous, discounted)&lt;/span&gt;\nbatch = client.messages.batches.&lt;span class=\"fn\"&gt;create&lt;/span&gt;(requests=[\n    {&lt;span class=\"st\"&gt;\"custom_id\"&lt;/span&gt;: &lt;span class=\"st\"&gt;f\"doc-{i}\"&lt;/span&gt;, &lt;span class=\"st\"&gt;\"params\"&lt;/span&gt;: {&lt;span class=\"st\"&gt;\"model\"&lt;/span&gt;: &lt;span class=\"st\"&gt;\"claude-haiku-4-5-20251001\"&lt;/span&gt;, &lt;span class=\"st\"&gt;\"max_tokens\"&lt;/span&gt;: &lt;span class=\"nu\"&gt;50&lt;/span&gt;,\n     &lt;span class=\"st\"&gt;\"messages\"&lt;/span&gt;: [{&lt;span class=\"st\"&gt;\"role\"&lt;/span&gt;: &lt;span class=\"st\"&gt;\"user\"&lt;/span&gt;, &lt;span class=\"st\"&gt;\"content\"&lt;/span&gt;: &lt;span class=\"st\"&gt;f\"Classify the sentiment: {t}\"&lt;/span&gt;}]}}\n    &lt;span class=\"kw\"&gt;for&lt;/span&gt; i, t &lt;span class=\"kw\"&gt;in&lt;/span&gt; &lt;span class=\"bi\"&gt;enumerate&lt;/span&gt;(reviews)])\n&lt;span class=\"cm\"&gt;# poll client.messages.batches.retrieve(batch.id); then read results&lt;/span&gt;"}</textarea>
