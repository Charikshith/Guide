## Concept

The Model Context Protocol (tools/resources for agents) and Agent-to-Agent protocol (interoperability).

**In one sentence:** MCP is a standard plug that lets any AI application connect to any tool or data source through one protocol instead of custom glue code, and A2A is a standard way for independent agents — possibly built by different teams or vendors — to discover each other and hand off tasks.

**Mental model — USB and a phone network.** MCP is USB for AI apps: a laptop (the host app) can use any keyboard, drive, or camera (MCP servers) that speaks USB, without a custom driver for each pair. A2A is the phone network between companies: each agent has a public listing (its Agent Card), you call it, describe the job, and it reports back as the job progresses.

**MCP — the Model Context Protocol**

| Piece | Meaning |
|-------|---------|
| **Host** | the AI application the user works in (Claude Desktop, Claude Code, an IDE, your agent) |
| **Client** | a connector inside the host; one client per server connection |
| **Server** | a program exposing capabilities (GitHub, a database, a file system, your internal API) |
| Wire format | **JSON-RPC 2.0** messages |
| Transports | **stdio** (the host launches the server as a local subprocess) or **Streamable HTTP** (a remote server over HTTP, optionally streaming with SSE) |
| Lifecycle | `initialize` → capability negotiation → `notifications/initialized` → normal operation |

**What a server can offer**

| Primitive | Controlled by | Methods | Example |
|-----------|---------------|---------|---------|
| **Tools** | the model decides to call them | `tools/list`, `tools/call` | `get_weather(city)`, `create_issue(title, body)` |
| **Resources** | the application / user chooses what to attach | `resources/list`, `resources/read` (URIs like `file:///…`, `db://orders/42`) | a file, a table schema, a log |
| **Prompts** | the user picks them (e.g. slash commands) | `prompts/list`, `prompts/get` | "summarize this PR" template |

Clients can offer features back to servers too, such as *sampling* (the server asks the host's model for a completion) and *elicitation* (the server asks the user for input). Remote servers use OAuth 2.1 for authorization.

**What MCP standardizes:** discovery (what can this server do?), invocation (call with JSON arguments matching a JSON Schema), results and errors, and notifications (e.g. "the tool list changed"). It turns an N × M integration problem (every app × every tool) into N + M.

**A2A — the Agent2Agent protocol** (open source, originally from Google, now a Linux Foundation project)

| Piece | Meaning |
|-------|---------|
| **Agent Card** | a JSON document (commonly at `/.well-known/agent-card.json`) describing the agent: name, skills, endpoint, supported input/output types, auth requirements |
| Client agent / remote agent | the one delegating / the one doing the work |
| Transport | JSON-RPC 2.0 over HTTP(S); streaming via SSE; optional push notifications (webhooks) for long jobs |
| **Task** | the unit of work, with an ID and a lifecycle: `submitted` → `working` → (`input-required`) → `completed` / `failed` / `canceled` |
| Message / Part | turns between agents; parts can be text, files, or structured data |
| **Artifact** | the output the task produces |

**MCP vs A2A**

| | MCP | A2A |
|-|-----|-----|
| Connects | an agent ↔ tools and data | an agent ↔ another agent |
| The other side is | a capability with a schema (usually deterministic) | an autonomous peer with its own model, tools, and state (opaque) |
| Interaction | call a function, get a result | delegate a task that may take long, ask follow-up questions, and stream progress |
| Use when | "let my agent read our tickets DB" | "let our travel agent ask the partner's booking agent to book a hotel" |

They complement each other: an A2A agent often uses MCP servers internally.

sequenceDiagram
    participant C as MCP client
    participant S as MCP server
    C-&gt;&gt;S: initialize (protocolVersion, client capabilities)
    S--&gt;&gt;C: result (server capabilities: tools, resources, prompts)

    C-&gt;&gt;S: tools/list

    H--&gt;&gt;T: Task t-91 state input-required "Sea view for 20 EUR more?"
    T-&gt;&gt;H: message/send taskId t-91 "Yes"

## Example

```python
# An MCP server exposing a get_weather tool (official Python SDK, FastMCP API)
# pip install "mcp[cli]"
from mcp.server.fastmcp import FastMCP

mcp = FastMCP("weather")

@mcp.tool()
def get_weather(city: str) -&gt; str:
    """Current weather for a city. Returns temperature (C) and conditions."""
    fake = {"lisbon": "22 C, sunny", "oslo": "9 C, rain"}
    return fake.get(city.lower(), f"no data for {city}")

@mcp.resource("weather://cities")
def cities() -&gt; str:
    """The list of supported cities."""
    return "Lisbon, Oslo"

@mcp.prompt()
def packing_advice(city: str) -&gt; str:
    return f"Check the weather in {city} with get_weather and suggest what to pack."

if __name__ == "__main__":
    mcp.run()          # stdio by default; mcp.run(transport="streamable-http") for a remote server
```

```python
# An MCP client: launch the server over stdio, list tools, call one
import asyncio
from mcp import ClientSession, StdioServerParameters
from mcp.client.stdio import stdio_client

async def main():
    params = StdioServerParameters(command="python", args=["weather_server.py"])
    async with stdio_client(params) as (read, write):
        async with ClientSession(read, write) as session:
            await session.initialize()
            tools = await session.list_tools()
            print([t.name for t in tools.tools])                    # ['get_weather']
            result = await session.call_tool("get_weather", {"city": "Lisbon"})
            print(result.content[0].text)                           # 22 C, sunny

asyncio.run(main())
```

```json

## Exercises

1. Build an MCP server with one tool.

   &lt;details&gt;&lt;summary&gt;Solution&lt;/summary&gt;Use the FastMCP example: the function signature and docstring become the tool's input schema and description. Test it with the MCP Inspector (&lt;code&gt;mcp dev weather_server.py&lt;/code&gt;), then register it in a host and ask the model a question that needs the tool. Return clear errors (e.g. unknown city) as tool results rather than crashing.&lt;/details&gt;

2. Design an A2A message exchange for a task hand-off.

   &lt;details&gt;&lt;summary&gt;Solution&lt;/summary&gt;Client fetches the remote Agent Card and checks the skill and auth scheme. It sends &lt;code&gt;message/send&lt;/code&gt; (or &lt;code&gt;message/stream&lt;/code&gt;) with the task description and constraints. The remote returns a Task in &lt;code&gt;working&lt;/code&gt;, may move to &lt;code&gt;input-required&lt;/code&gt; with a question, the client answers with a message on the same task ID, and the task ends &lt;code&gt;completed&lt;/code&gt; with an artifact (or &lt;code&gt;failed&lt;/code&gt; with a reason). For long jobs, register a push-notification webhook. Log the task ID on both sides for tracing.&lt;/details&gt;

3. Your team wants to connect an agent to Postgres. MCP or A2A?

   &lt;details&gt;&lt;summary&gt;Solution&lt;/summary&gt;MCP: a database is a capability with a clear schema, not an autonomous peer. Expose a read-only &lt;code&gt;query&lt;/code&gt; tool plus schema resources, with row limits and least-privilege credentials.&lt;/details&gt;

## Mini project

**An MCP server + client, plus a two-agent A2A hand-off.**

```mermaid
flowchart LR
    subgraph Part1["Part 1 — MCP"]
      NS["notes MCP server&lt;br/&gt;tools: add_note, search_notes&lt;br/&gt;resource: notes://all&lt;br/&gt;prompt: weekly_review"]
      AG["your agent (Ch 11 loop)&lt;br/&gt;as an MCP client"] &lt;--&gt;|stdio| NS
    end
    subgraph Part2["Part 2 — A2A"]
      PA["planner agent (client)"] --&gt;|"Agent Card + message/send"| RA["research agent (remote)&lt;br/&gt;skill: summarize_topic"]
      RA --&gt;|"task states + artifact"| PA
      RA -. "uses MCP internally" .-&gt; NS
    end
```

**Steps**

1. Notes server: SQLite-backed tools with clear JSON Schemas, a resource listing all notes, and a prompt template.
2. Turn your Ch 11 agent into an MCP client: at startup, `list_tools` and convert each MCP tool into the model's tool format; route tool calls to `call_tool`.
3. Add a second transport: run the same server over Streamable HTTP.
4. Write a research agent that serves an Agent Card and handles `message/send`, returning task states and a summary artifact (use the A2A SDK or a small FastAPI app following the spec).
5. The planner agent discovers it, delegates "summarize my notes about X", handles an `input-required` question, and saves the artifact as a new note via MCP.

**Done when:** the agent uses the notes server with no tool-specific code, and the planner completes a full A2A task lifecycle including one follow-up question.

## Interview

1. **"What does MCP standardize?"**
   &lt;details&gt;&lt;summary&gt;Answer&lt;/summary&gt;How AI applications (hosts, via clients) discover and use external capabilities provided by servers: a JSON-RPC 2.0 message format, a lifecycle with capability negotiation, stdio and Streamable HTTP transports, and three server primitives — tools (model-invoked functions with JSON Schema inputs), resources (context data addressed by URI), and prompts (reusable templates) — plus client features like sampling and elicitation, and OAuth for remote servers. Build a connector once and it works in every compliant host.&lt;/details&gt;

2. **"Why A2A over ad-hoc APIs?"**
   &lt;details&gt;&lt;summary&gt;Answer&lt;/summary&gt;Agent-to-agent work isn't a single function call: tasks can be long-running, need clarifying questions, stream progress, and produce artifacts, and the peer is opaque (its own model and tools). A2A standardizes discovery (Agent Cards), the task lifecycle and states, messages with multi-part content, streaming and push notifications, and auth. That lets agents from different teams or vendors interoperate without bespoke integrations for each pair.&lt;/details&gt;

;path class=\"sk blue\" d=\"M500 134 C496 190, 504 220, 500 271\" style=\"color:var(--ink);stroke-dasharray:6 5\" marker-end=\"url(#arr)\"/&gt;\n      &lt;text class=\"lbl r\" x=\"312\" y=\"52\" text-anchor=\"middle\" style=\"font-size:14px;paint-order:stroke;stroke:#fdfbf4;stroke-width:5px;stroke-linejoin:round\"&gt;Agent Card +&lt;/text&gt;\n      &lt;text class=\"lbl r\" x=\"312\" y=\"70\" text-anchor=\"middle\" style=\"font-size:14px;paint-order:stroke;stroke:#fdfbf4;stroke-width:5px;stroke-linejoin:round\"&gt;message/send&lt;/text&gt;\n      &lt;text class=\"lbl r\" x=\"312\" y=\"130\" text-anchor=\"middle\" style=\"font-size:14px;paint-order:stroke;stroke:#fdfbf4;stroke-width:5px;stroke-linejoin:round\"&gt;task states +&lt;/text&gt;\n      &lt;text class=\"lbl r\" x=\"312\" y=\"148\" text-anchor=\"middle\" style=\"font-size:14px;paint-order:stroke;stroke:#fdfbf4;stroke-width:5px;stroke-linejoin:round\"&gt;artifact&lt;/text&gt;\n      &lt;text class=\"lbl r\" x=\"285\" y=\"310\" text-anchor=\"middle\" style=\"font-size:14px;paint-order:stroke;stroke:#fdfbf4;stroke-width:5px;stroke-linejoin:round\"&gt;stdio&lt;/text&gt;\n      &lt;text class=\"lbl r\" x=\"514\" y=\"205\" text-anchor=\"start\" style=\"font-size:14px;paint-order:stroke;stroke:#fdfbf4;stroke-width:5px;stroke-linejoin:round\"&gt;uses MCP internally&lt;/text&gt;\n    &lt;/svg&gt;\n    &lt;figcaption&gt;Fig 4: An MCP server + client, plus a two-agent A2A hand-off&lt;/figcaption&gt;\n  &lt;/figure&gt;"]</textarea>
<textarea id="codes" hidden>{"# An MCP server exposing a get_weather tool (official Python SDK, FastMCP API)\n# pip install \"mcp[cli]\"\nfrom mcp.server.fastmcp import FastMCP\n\nmcp = FastMCP(\"weather\")\n\n@mcp.tool()\ndef get_weather(city: str) -&gt; str:\n    \"\"\"Current weather for a city. Returns temperature (C) and conditions.\"\"\"\n    fake = {\"lisbon\": \"22 C, sunny\", \"oslo\": \"9 C, rain\"}\n    return fake.get(city.lower(), f\"no data for {city}\")\n\n@mcp.resource(\"weather://cities\")\ndef cities() -&gt; str:\n    \"\"\"The list of supported cities.\"\"\"\n    return \"Lisbon, Oslo\"\n\n@mcp.prompt()\ndef packing_advice(city: str) -&gt; str:\n    return f\"Check the weather in {city} with get_weather and suggest what to pack.\"\n\nif __name__ == \"__main__\":\n    mcp.run()          # stdio by default; mcp.run(transport=\"streamable-http\") for a remote server": "&lt;span class=\"cm\"&gt;# An MCP server exposing a get_weather tool (official Python SDK, FastMCP API)&lt;/span&gt;\n&lt;span class=\"cm\"&gt;# pip install \"mcp[cli]\"&lt;/span&gt;\n&lt;span class=\"kw\"&gt;from&lt;/span&gt; mcp.server.fastmcp &lt;span class=\"kw\"&gt;import&lt;/span&gt; FastMCP\n\nmcp = &lt;span class=\"fn\"&gt;FastMCP&lt;/span&gt;(&lt;span class=\"st\"&gt;\"weather\"&lt;/span&gt;)\n\n&lt;span class=\"bi\"&gt;@mcp.tool&lt;/span&gt;()\n&lt;span class=\"kw\"&gt;def&lt;/span&gt; &lt;span class=\"fn\"&gt;get_weather&lt;/span&gt;(city: &lt;span class=\"bi\"&gt;str&lt;/span&gt;) -&amp;gt; &lt;span class=\"bi\"&gt;str&lt;/span&gt;:\n    &lt;span class=\"st\"&gt;\"\"\"Current weather for a city. Returns temperature (C) and conditions.\"\"\"&lt;/span&gt;\n    fake = {&lt;span class=\"st\"&gt;\"lisbon\"&lt;/span&gt;: &lt;span class=\"st\"&gt;\"22 C, sunny\"&lt;/span&gt;, &lt;span class=\"st\"&gt;\"oslo\"&lt;/span&gt;: &lt;span class=\"st\"&gt;\"9 C, rain\"&lt;/span&gt;}\n    &lt;span class=\"kw\"&gt;return&lt;/span&gt; fake.&lt;span class=\"fn\"&gt;get&lt;/span&gt;(city.&lt;span class=\"fn\"&gt;lower&lt;/span&gt;(), &lt;span class=\"st\"&gt;f\"no data for {city}\"&lt;/span&gt;)\n\n&lt;span class=\"bi\"&gt;@mcp.resource&lt;/span&gt;(&lt;span class=\"st\"&gt;\"weather://cities\"&lt;/span&gt;)\n&lt;span class=\"kw\"&gt;def&lt;/span&gt; &lt;span class=\"fn\"&gt;cities&lt;/span&gt;() -&amp;gt; &lt;span class=\"bi\"&gt;str&lt;/span&gt;:\n    &lt;span class=\"st\"&gt;\"\"\"The list of supported cities.\"\"\"&lt;/span&gt;\n    &lt;span class=\"kw\"&gt;return&lt;/span&gt; &lt;span class=\"st\"&gt;\"Lisbon, Oslo\"&lt;/span&gt;\n\n&lt;span class=\"bi\"&gt;@mcp.prompt&lt;/span&gt;()\n&lt;span class=\"kw\"&gt;def&lt;/span&gt; &lt;span class=\"fn\"&gt;packing_advice&lt;/span&gt;(city: &lt;span class=\"bi\"&gt;str&lt;/span&gt;) -&amp;gt; &lt;span class=\"bi\"&gt;str&lt;/span&gt;:\n    &lt;span class=\"kw\"&gt;return&lt;/span&gt; &lt;span class=\"st\"&gt;f\"Check the weather in {city} with get_weather and suggest what to pack.\"&lt;/span&gt;\n\n&lt;span class=\"kw\"&gt;if&lt;/span&gt; __name__ == &lt;span class=\"st\"&gt;\"__main__\"&lt;/span&gt;:\n    mcp.&lt;span class=\"fn\"&gt;run&lt;/span&gt;()          &lt;span class=\"cm\"&gt;# stdio by default; mcp.run(transport=\"streamable-http\") for a remote server&lt;/span&gt;", "# An MCP client: launch the server over stdio, list tools, call one\nimport asyncio\nfrom mcp import ClientSession, StdioServerParameters\nfrom mcp.client.stdio import stdio_client\n\nasync def main():\n    params = StdioServerParameters(command=\"python\", args=[\"weather_server.py\"])\n    async with stdio_client(params) as (read, write):\n        async with ClientSession(read, write) as session:\n            await session.initialize()\n            tools = await session.list_tools()\n            print([t.name for t in tools.tools])                    # ['get_weather']\n            result = await session.call_tool(\"get_weather\", {\"city\": \"Lisbon\"})\n            print(result.content[0].text)                           # 22 C, sunny\n\nasyncio.run(main())": "&lt;span class=\"cm\"&gt;# An MCP client: launch the server over stdio, list tools, call one&lt;/span&gt;\n&lt;span class=\"kw\"&gt;import&lt;/span&gt; asyncio\n&lt;span class=\"kw\"&gt;from&lt;/span&gt; mcp &lt;span class=\"kw\"&gt;import&lt;/span&gt; ClientSession, StdioServerParameters\n&lt;span class=\"kw\"&gt;from&lt;/span&gt; mcp.client.stdio &lt;span class=\"kw\"&gt;import&lt;/span&gt; stdio_client\n\n&lt;span class=\"kw\"&gt;async&lt;/span&gt; &lt;span class=\"kw\"&gt;def&lt;/span&gt; &lt;span class=\"fn\"&gt;main&lt;/span&gt;():\n    params = &lt;span class=\"fn\"&gt;StdioServerParameters&lt;/span&gt;(command=&lt;span class=\"st\"&gt;\"python\"&lt;/span&gt;, args=[&lt;span class=\"st\"&gt;\"weather_server.py\"&lt;/span&gt;])\n    &lt;span class=\"kw\"&gt;async&lt;/span&gt; &lt;span class=\"kw\"&gt;with&lt;/span&gt; &lt;span class=\"fn\"&gt;stdio_client&lt;/span&gt;(params) &lt;span class=\"kw\"&gt;as&lt;/span&gt; (read, write):\n        &lt;span class=\"kw\"&gt;async&lt;/span&gt; &lt;span class=\"kw\"&gt;with&lt;/span&gt; &lt;span class=\"fn\"&gt;ClientSession&lt;/span&gt;(read, write) &lt;span class=\"kw\"&gt;as&lt;/span&gt; session:\n            &lt;span class=\"kw\"&gt;await&lt;/span&gt; session.&lt;span class=\"fn\"&gt;initialize&lt;/span&gt;()\n            tools = &lt;span class=\"kw\"&gt;await&lt;/span&gt; session.&lt;span class=\"fn\"&gt;list_tools&lt;/span&gt;()\n            &lt;span class=\"bi\"&gt;print&lt;/span&gt;([t.name &lt;span class=\"kw\"&gt;for&lt;/span&gt; t &lt;span class=\"kw\"&gt;in&lt;/span&gt; tools.tools])                    &lt;span class=\"cm\"&gt;# ['get_weather']&lt;/span&gt;\n            result = &lt;span class=\"kw\"&gt;await&lt;/span&gt; session.&lt;span class=\"fn\"&gt;call_tool&lt;/span&gt;(&lt;span class=\"st\"&gt;\"get_weather\"&lt;/span&gt;, {&lt;span class=\"st\"&gt;\"city\"&lt;/span&gt;: &lt;span class=\"st\"&gt;\"Lisbon\"&lt;/span&gt;})\n            &lt;span class=\"bi\"&gt;print&lt;/span&gt;(result.content[&lt;span class=\"nu\"&gt;0&lt;/span&gt;].text)                           &lt;span class=\"cm\"&gt;# 22 C, sunny&lt;/span&gt;\n\nasyncio.&lt;span class=\"fn\"&gt;run&lt;/span&gt;(&lt;span class=\"fn\"&gt;main&lt;/span&gt;())", "// Register the server in a host (e.g. claude_desktop_config.json or .mcp.json)\n{ \"mcpServers\": { \"weather\": { \"command\": \"python\", \"args\": [\"weather_server.py\"] } } }": "// Register the server in a host (e.g. claude_desktop_config.json or .mcp.json)\n{ &lt;span class=\"bi\"&gt;\"mcpServers\"&lt;/span&gt;: { &lt;span class=\"bi\"&gt;\"weather\"&lt;/span&gt;: { &lt;span class=\"bi\"&gt;\"command\"&lt;/span&gt;: &lt;span class=\"st\"&gt;\"python\"&lt;/span&gt;, &lt;span class=\"bi\"&gt;\"args\"&lt;/span&gt;: [&lt;span class=\"st\"&gt;\"weather_server.py\"&lt;/span&gt;] } } }", "// A2A: an Agent Card (abridged) and a JSON-RPC task request\n{\n  \"name\": \"Hotel Booking Agent\",\n  \"description\": \"Finds and books hotels.\",\n  \"url\": \"https://hotels.example.com/a2a\",\n  \"version\": \"1.0.0\",\n  \"capabilities\": { \"streaming\": true, \"pushNotifications\": true },\n  \"defaultInputModes\": [\"text/plain\"],\n  \"defaultOutputModes\": [\"text/plain\", \"application/json\"],\n  \"skills\": [{ \"id\": \"book_hotel\", \"name\": \"Book a hotel\",\n               \"description\": \"Book rooms given a city, dates, and budget.\" }]\n}\n\n{ \"jsonrpc\": \"2.0\", \"id\": 1, \"method\": \"message/send\",\n  \"params\": { \"message\": { \"role\": \"user\", \"messageId\": \"m-1\",\n    \"parts\": [{ \"kind\": \"text\", \"text\": \"Book 2 nights in Lisbon from May 3, under 150 EUR\" }] } } }": "// A2A: an Agent Card (abridged) and a JSON-RPC task request\n{\n  &lt;span class=\"bi\"&gt;\"name\"&lt;/span&gt;: &lt;span class=\"st\"&gt;\"Hotel Booking Agent\"&lt;/span&gt;,\n  &lt;span class=\"bi\"&gt;\"description\"&lt;/span&gt;: &lt;span class=\"st\"&gt;\"Finds and books hotels.\"&lt;/span&gt;,\n  &lt;span class=\"bi\"&gt;\"url\"&lt;/span&gt;: &lt;span class=\"st\"&gt;\"https://hotels.example.com/a2a\"&lt;/span&gt;,\n  &lt;span class=\"bi\"&gt;\"version\"&lt;/span&gt;: &lt;span class=\"st\"&gt;\"1.0.0\"&lt;/span&gt;,\n  &lt;span class=\"bi\"&gt;\"capabilities\"&lt;/span&gt;: { &lt;span class=\"bi\"&gt;\"streaming\"&lt;/span&gt;: &lt;span class=\"kw\"&gt;true&lt;/span&gt;, &lt;span class=\"bi\"&gt;\"pushNotifications\"&lt;/span&gt;: &lt;span class=\"kw\"&gt;true&lt;/span&gt; },\n  &lt;span class=\"bi\"&gt;\"defaultInputModes\"&lt;/span&gt;: [&lt;span class=\"st\"&gt;\"text/plain\"&lt;/span&gt;],\n  &lt;span class=\"bi\"&gt;\"defaultOutputModes\"&lt;/span&gt;: [&lt;span class=\"st\"&gt;\"text/plain\"&lt;/span&gt;, &lt;span class=\"st\"&gt;\"application/json\"&lt;/span&gt;],\n  &lt;span class=\"bi\"&gt;\"skills\"&lt;/span&gt;: [{ &lt;span class=\"bi\"&gt;\"id\"&lt;/span&gt;: &lt;span class=\"st\"&gt;\"book_hotel\"&lt;/span&gt;, &lt;span class=\"bi\"&gt;\"name\"&lt;/span&gt;: &lt;span class=\"st\"&gt;\"Book a hotel\"&lt;/span&gt;,\n               &lt;span class=\"bi\"&gt;\"description\"&lt;/span&gt;: &lt;span class=\"st\"&gt;\"Book rooms given a city, dates, and budget.\"&lt;/span&gt; }]\n}\n\n{ &lt;span class=\"bi\"&gt;\"jsonrpc\"&lt;/span&gt;: &lt;span class=\"st\"&gt;\"2.0\"&lt;/span&gt;, &lt;span class=\"bi\"&gt;\"id\"&lt;/span&gt;: &lt;span class=\"nu\"&gt;1&lt;/span&gt;, &lt;span class=\"bi\"&gt;\"method\"&lt;/span&gt;: &lt;span class=\"st\"&gt;\"message/send\"&lt;/span&gt;,\n  &lt;span class=\"bi\"&gt;\"params\"&lt;/span&gt;: { &lt;span class=\"bi\"&gt;\"message\"&lt;/span&gt;: { &lt;span class=\"bi\"&gt;\"role\"&lt;/span&gt;: &lt;span class=\"st\"&gt;\"user\"&lt;/span&gt;, &lt;span class=\"bi\"&gt;\"messageId\"&lt;/span&gt;: &lt;span class=\"st\"&gt;\"m-1\"&lt;/span&gt;,\n    &lt;span class=\"bi\"&gt;\"parts\"&lt;/span&gt;: [{ &lt;span class=\"bi\"&gt;\"kind\"&lt;/span&gt;: &lt;span class=\"st\"&gt;\"text\"&lt;/span&gt;, &lt;span class=\"bi\"&gt;\"text\"&lt;/span&gt;: &lt;span class=\"st\"&gt;\"Book 2 nights in Lisbon from May 3, under 150 EUR\"&lt;/span&gt; }] } } }"}</textarea>
