## Concept

Tree terminology; binary search trees; heaps (priority queues); tries (prefix search).

**In one sentence:** a tree is a hierarchy with one root; a BST keeps it sorted so you can search by halving, a heap keeps only the *smallest* item on top so you can always grab it fast, and a trie shares common prefixes so you can find all words starting with "ca" at once.

**Mental model — three kinds of organizing.**

* **BST** — a "guess the number" game: at each node, go left if smaller, right if bigger.
* **Heap** — a company org chart where every boss earns more than their reports: the CEO (root) is always the max, but siblings aren't sorted.
* **Trie** — a phone's contact search: typing `c`, `a`, `r` narrows the tree letter by letter.

**Terminology**

| Term | Meaning |
|------|---------|
| Root / leaf | top node / node with no children |
| Parent / child / sibling | the obvious family relations |
| Depth / height | edges from the root / longest path down to a leaf |
| Binary tree | each node has ≤ 2 children |
| Balanced | height is O(log n) (AVL, red-black trees guarantee it) |
| Complete | every level full except the last, filled left to right (heaps) |

**Comparison**

| | BST (balanced) | Binary heap | Trie |
|-|----------------|-------------|------|
| Ordering rule | left &lt; node &lt; right | parent ≤ children (min-heap) | edges are characters |
| Search a key | O(log n) | O(n) | O(L), L = key length |
| Min / max | O(log n) | **O(1)** peek, O(log n) pop | — |
| Insert | O(log n) | O(log n) | O(L) |
| Sorted iteration | O(n) in-order | no | lexicographic via DFS |
| Prefix queries | range scan | no | **O(L + results)** |
| Typical use | ordered maps (`TreeMap`, `BTreeMap`), indexes | priority queues, schedulers, Dijkstra, top-k | autocomplete, routers, spell check, IP lookup |

**Traversals (DFS orders)**

| Order | Visit | Use |
|-------|-------|-----|
| Pre-order | node, left, right | copy / serialize a tree |
| In-order | left, node, right | **BST → sorted order** |
| Post-order | left, right, node | delete / evaluate expression trees |
| Level-order (BFS) | level by level | shortest depth, printing by level |

**Unbalanced BSTs degrade:** inserting 1, 2, 3, 4, 5 in order makes a "linked list" of height n, so search is O(n). Self-balancing trees rotate nodes to keep height O(log n).

**Heap push: sift up**

```

```

## Example

```python
import heapq

h = []
for x in [5, 1, 8, 3]:
    heapq.heappush(h, x)
print(heapq.heappop(h), h[0])          # 1 3  (pop min, peek next min)
print(heapq.nsmallest(2, [9, 4, 7, 1]))  # [1, 4]

nums = [9, 4, 7, 1, 8]
heapq.heapify(nums)                     # O(n), not O(n log n)

class BST:
    class Node:
        __slots__ = ("key", "left", "right")
        def __init__(self, key): self.key, self.left, self.right = key, None, None

    def __init__(self): self.root = None

    def insert(self, key):
        def _ins(n):
            if n is None: return BST.Node(key)
            if key &lt; n.key: n.left = _ins(n.left)
            elif key &gt; n.key: n.right = _ins(n.right)
            return n
        self.root = _ins(self.root)

    def search(self, key):
        n = self.root
        while n and n.key != key:
            n = n.left if key &lt; n.key else n.right
        return n is not None

    def inorder(self):
        def _walk(n):
            if n:
                yield from _walk(n.left); yield n.key; yield from _walk(n.right)
        return list(_walk(self.root))

t = BST()
for k in [8, 3, 10, 1, 6, 14, 4, 7]:
    t.insert(k)
print(t.search(6), t.search(5), t.inorder())   # True False [1, 3, 4, 6, 7, 8, 10, 14]
```

```python
class Trie:
    def __init__(self): self.root = {}
    def insert(self, word):
        node = self.root
        for ch in word:
            node = node.setdefault(ch, {})
        node["$"] = True                       # end-of-word marker
    def complete(self, prefix):
        node = self.root
        for ch in prefix:
            if ch not in node: return []
            node = node[ch]
        out, stack = [], [(node, prefix)]
        while stack:
            n, word = stack.pop()
            if "$" in n: out.append(word)
            stack.extend((child, word + ch) for ch, child in n.items() if ch != "$")
        return sorted(out)

tr = Trie()
for w in ["car", "cart", "cat", "dog"]:
    tr.insert(w)
print(tr.complete("ca"))                         # ['car', 'cart', 'cat']
```

## Exercises

1. Implement BST insert/search/delete.

   &lt;details&gt;&lt;summary&gt;Solution&lt;/summary&gt;Insert and search are above. Delete has three cases: (a) a leaf → remove it; (b) one child → replace the node with its child; (c) two children → copy the in-order successor's key (the minimum of the right subtree) into the node, then delete the successor from the right subtree.&lt;/details&gt;

2. Build a trie and autocomplete a prefix.

   &lt;details&gt;&lt;summary&gt;Solution&lt;/summary&gt;See &lt;code&gt;Trie&lt;/code&gt; above. Extensions: store a count per node for "how many words have this prefix" in O(L), and rank completions by frequency with a small heap.&lt;/details&gt;

3. Why is `heapify` O(n) and not O(n log n)?

   &lt;details&gt;&lt;summary&gt;Solution&lt;/summary&gt;It sifts down from the last parent to the root. Most nodes are near the bottom and sift only a little: n/4 nodes move ≤1 level, n/8 move ≤2, and so on. The sum Σ n·k/2^(k+1) converges to O(n).&lt;/details&gt;

## Mini project

**A URL router or autocomplete engine backed by a trie.**

```mermaid
flowchart LR
    ROUTES["GET /users/:id&lt;br/&gt;GET /users/:id/orders&lt;br/&gt;GET /health"] --&gt; T["segment trie&lt;br/&gt;users → :id → orders"]
    REQ["GET /users/42/orders"] --&gt; M["match segment by segment&lt;br/&gt;static beats :param"] --&gt; H["handler + params {id: 42}"]
```

**Steps (router version)**

1. Split paths into segments; each trie node has static children, one `:param` child, and an optional handler per HTTP method.
2. Match request paths segment by segment, preferring static over param; collect params into a dict.
3. Return 404 (no path) vs 405 (path exists, method doesn't).
4. Benchmark 1,000 routes: trie lookup vs trying 1,000 regexes in a loop.

**Done when:** matching is O(segments), independent of the number of routes, and static routes always win over params.

## Interview

1. **"Heap vs BST?"**
   &lt;details&gt;&lt;summary&gt;Answer&lt;/summary&gt;A heap only guarantees the min (or max) is at the root: O(1) peek, O(log n) push/pop, no efficient search or sorted iteration, and it is compact as an array. A balanced BST keeps full order: O(log n) search, insert, delete, min, max, successor, and range queries. Use a heap for priority queues; use a BST for ordered maps.&lt;/details&gt;

2. **"Why is a BST O(n) when unbalanced?"**
   &lt;details&gt;&lt;summary&gt;Answer&lt;/summary&gt;Operations take O(height). Inserting sorted data sends every key to the same side, making a chain of height n. Self-balancing trees (AVL, red-black) or B-trees rotate or split nodes to keep the height O(log n).&lt;/details&gt;

<textarea id="codes" hidden>{"import heapq\n\nh = []\nfor x in [5, 1, 8, 3]:\n    heapq.heappush(h, x)\nprint(heapq.heappop(h), h[0])          # 1 3  (pop min, peek next min)\nprint(heapq.nsmallest(2, [9, 4, 7, 1]))  # [1, 4]\n\nnums = [9, 4, 7, 1, 8]\nheapq.heapify(nums)                     # O(n), not O(n log n)\n\nclass BST:\n    class Node:\n        __slots__ = (\"key\", \"left\", \"right\")\n        def __init__(self, key): self.key, self.left, self.right = key, None, None\n\n    def __init__(self): self.root = None\n\n    def insert(self, key):\n        def _ins(n):\n            if n is None: return BST.Node(key)\n            if key &lt; n.key: n.left = _ins(n.left)\n            elif key &gt; n.key: n.right = _ins(n.right)\n            return n\n        self.root = _ins(self.root)\n\n    def search(self, key):\n        n = self.root\n        while n and n.key != key:\n            n = n.left if key &lt; n.key else n.right\n        return n is not None\n\n    def inorder(self):\n        def _walk(n):\n            if n:\n                yield from _walk(n.left); yield n.key; yield from _walk(n.right)\n        return list(_walk(self.root))\n\nt = BST()\nfor k in [8, 3, 10, 1, 6, 14, 4, 7]:\n    t.insert(k)\nprint(t.search(6), t.search(5), t.inorder())   # True False [1, 3, 4, 6, 7, 8, 10, 14]": "&lt;span class=\"kw\"&gt;import&lt;/span&gt; heapq\n\nh = []\n&lt;span class=\"kw\"&gt;for&lt;/span&gt; x &lt;span class=\"kw\"&gt;in&lt;/span&gt; [&lt;span class=\"nu\"&gt;5&lt;/span&gt;, &lt;span class=\"nu\"&gt;1&lt;/span&gt;, &lt;span class=\"nu\"&gt;8&lt;/span&gt;, &lt;span class=\"nu\"&gt;3&lt;/span&gt;]:\n    heapq.&lt;span class=\"fn\"&gt;heappush&lt;/span&gt;(h, x)\n&lt;span class=\"bi\"&gt;print&lt;/span&gt;(heapq.&lt;span class=\"fn\"&gt;heappop&lt;/span&gt;(h), h[&lt;span class=\"nu\"&gt;0&lt;/span&gt;])          &lt;span class=\"cm\"&gt;# 1 3  (pop min, peek next min)&lt;/span&gt;\n&lt;span class=\"bi\"&gt;print&lt;/span&gt;(heapq.&lt;span class=\"fn\"&gt;nsmallest&lt;/span&gt;(&lt;span class=\"nu\"&gt;2&lt;/span&gt;, [&lt;span class=\"nu\"&gt;9&lt;/span&gt;, &lt;span class=\"nu\"&gt;4&lt;/span&gt;, &lt;span class=\"nu\"&gt;7&lt;/span&gt;, &lt;span class=\"nu\"&gt;1&lt;/span&gt;]))  &lt;span class=\"cm\"&gt;# [1, 4]&lt;/span&gt;\n\nnums = [&lt;span class=\"nu\"&gt;9&lt;/span&gt;, &lt;span class=\"nu\"&gt;4&lt;/span&gt;, &lt;span class=\"nu\"&gt;7&lt;/span&gt;, &lt;span class=\"nu\"&gt;1&lt;/span&gt;, &lt;span class=\"nu\"&gt;8&lt;/span&gt;]\nheapq.&lt;span class=\"fn\"&gt;heapify&lt;/span&gt;(nums)                     &lt;span class=\"cm\"&gt;# O(n), not O(n log n)&lt;/span&gt;\n\n&lt;span class=\"kw\"&gt;class&lt;/span&gt; BST:\n    &lt;span class=\"kw\"&gt;class&lt;/span&gt; Node:\n        __slots__ = (&lt;span class=\"st\"&gt;\"key\"&lt;/span&gt;, &lt;span class=\"st\"&gt;\"left\"&lt;/span&gt;, &lt;span class=\"st\"&gt;\"right\"&lt;/span&gt;)\n        &lt;span class=\"kw\"&gt;def&lt;/span&gt; &lt;span class=\"fn\"&gt;__init__&lt;/span&gt;(&lt;span class=\"bi\"&gt;self&lt;/span&gt;, key): &lt;span class=\"bi\"&gt;self&lt;/span&gt;.key, &lt;span class=\"bi\"&gt;self&lt;/span&gt;.left, &lt;span class=\"bi\"&gt;self&lt;/span&gt;.right = key, &lt;span class=\"kw\"&gt;None&lt;/span&gt;, &lt;span class=\"kw\"&gt;None&lt;/span&gt;\n\n    &lt;span class=\"kw\"&gt;def&lt;/span&gt; &lt;span class=\"fn\"&gt;__init__&lt;/span&gt;(&lt;span class=\"bi\"&gt;self&lt;/span&gt;): &lt;span class=\"bi\"&gt;self&lt;/span&gt;.root = &lt;span class=\"kw\"&gt;None&lt;/span&gt;\n\n    &lt;span class=\"kw\"&gt;def&lt;/span&gt; &lt;span class=\"fn\"&gt;insert&lt;/span&gt;(&lt;span class=\"bi\"&gt;self&lt;/span&gt;, key):\n        &lt;span class=\"kw\"&gt;def&lt;/span&gt; &lt;span class=\"fn\"&gt;_ins&lt;/span&gt;(n):\n            &lt;span class=\"kw\"&gt;if&lt;/span&gt; n &lt;span class=\"kw\"&gt;is&lt;/span&gt; &lt;span class=\"kw\"&gt;None&lt;/span&gt;: &lt;span class=\"kw\"&gt;return&lt;/span&gt; BST.&lt;span class=\"fn\"&gt;Node&lt;/span&gt;(key)\n            &lt;span class=\"kw\"&gt;if&lt;/span&gt; key &amp;lt; n.key: n.left = &lt;span class=\"fn\"&gt;_ins&lt;/span&gt;(n.left)\n            &lt;span class=\"kw\"&gt;elif&lt;/span&gt; key &amp;gt; n.key: n.right = &lt;span class=\"fn\"&gt;_ins&lt;/span&gt;(n.right)\n            &lt;span class=\"kw\"&gt;return&lt;/span&gt; n\n        &lt;span class=\"bi\"&gt;self&lt;/span&gt;.root = &lt;span class=\"fn\"&gt;_ins&lt;/span&gt;(&lt;span class=\"bi\"&gt;self&lt;/span&gt;.root)\n\n    &lt;span class=\"kw\"&gt;def&lt;/span&gt; &lt;span class=\"fn\"&gt;search&lt;/span&gt;(&lt;span class=\"bi\"&gt;self&lt;/span&gt;, key):\n        n = &lt;span class=\"bi\"&gt;self&lt;/span&gt;.root\n        &lt;span class=\"kw\"&gt;while&lt;/span&gt; n &lt;span class=\"kw\"&gt;and&lt;/span&gt; n.key != key:\n            n = n.left &lt;span class=\"kw\"&gt;if&lt;/span&gt; key &amp;lt; n.key &lt;span class=\"kw\"&gt;else&lt;/span&gt; n.right\n        &lt;span class=\"kw\"&gt;return&lt;/span&gt; n &lt;span class=\"kw\"&gt;is&lt;/span&gt; &lt;span class=\"kw\"&gt;not&lt;/span&gt; &lt;span class=\"kw\"&gt;None&lt;/span&gt;\n\n    &lt;span class=\"kw\"&gt;def&lt;/span&gt; &lt;span class=\"fn\"&gt;inorder&lt;/span&gt;(&lt;span class=\"bi\"&gt;self&lt;/span&gt;):\n        &lt;span class=\"kw\"&gt;def&lt;/span&gt; &lt;span class=\"fn\"&gt;_walk&lt;/span&gt;(n):\n            &lt;span class=\"kw\"&gt;if&lt;/span&gt; n:\n                &lt;span class=\"kw\"&gt;yield&lt;/span&gt; &lt;span class=\"kw\"&gt;from&lt;/span&gt; &lt;span class=\"fn\"&gt;_walk&lt;/span&gt;(n.left); &lt;span class=\"kw\"&gt;yield&lt;/span&gt; n.key; &lt;span class=\"kw\"&gt;yield&lt;/span&gt; &lt;span class=\"kw\"&gt;from&lt;/span&gt; &lt;span class=\"fn\"&gt;_walk&lt;/span&gt;(n.right)\n        &lt;span class=\"kw\"&gt;return&lt;/span&gt; &lt;span class=\"bi\"&gt;list&lt;/span&gt;(&lt;span class=\"fn\"&gt;_walk&lt;/span&gt;(&lt;span class=\"bi\"&gt;self&lt;/span&gt;.root))\n\nt = &lt;span class=\"fn\"&gt;BST&lt;/span&gt;()\n&lt;span class=\"kw\"&gt;for&lt;/span&gt; k &lt;span class=\"kw\"&gt;in&lt;/span&gt; [&lt;span class=\"nu\"&gt;8&lt;/span&gt;, &lt;span class=\"nu\"&gt;3&lt;/span&gt;, &lt;span class=\"nu\"&gt;10&lt;/span&gt;, &lt;span class=\"nu\"&gt;1&lt;/span&gt;, &lt;span class=\"nu\"&gt;6&lt;/span&gt;, &lt;span class=\"nu\"&gt;14&lt;/span&gt;, &lt;span class=\"nu\"&gt;4&lt;/span&gt;, &lt;span class=\"nu\"&gt;7&lt;/span&gt;]:\n    t.&lt;span class=\"fn\"&gt;insert&lt;/span&gt;(k)\n&lt;span class=\"bi\"&gt;print&lt;/span&gt;(t.&lt;span class=\"fn\"&gt;search&lt;/span&gt;(&lt;span class=\"nu\"&gt;6&lt;/span&gt;), t.&lt;span class=\"fn\"&gt;search&lt;/span&gt;(&lt;span class=\"nu\"&gt;5&lt;/span&gt;), t.&lt;span class=\"fn\"&gt;inorder&lt;/span&gt;())   &lt;span class=\"cm\"&gt;# True False [1, 3, 4, 6, 7, 8, 10, 14]&lt;/span&gt;", "class Trie:\n    def __init__(self): self.root = {}\n    def insert(self, word):\n        node = self.root\n        for ch in word:\n            node = node.setdefault(ch, {})\n        node[\"$\"] = True                       # end-of-word marker\n    def complete(self, prefix):\n        node = self.root\n        for ch in prefix:\n            if ch not in node: return []\n            node = node[ch]\n        out, stack = [], [(node, prefix)]\n        while stack:\n            n, word = stack.pop()\n            if \"$\" in n: out.append(word)\n            stack.extend((child, word + ch) for ch, child in n.items() if ch != \"$\")\n        return sorted(out)\n\ntr = Trie()\nfor w in [\"car\", \"cart\", \"cat\", \"dog\"]:\n    tr.insert(w)\nprint(tr.complete(\"ca\"))                         # ['car', 'cart', 'cat']": "&lt;span class=\"kw\"&gt;class&lt;/span&gt; Trie:\n    &lt;span class=\"kw\"&gt;def&lt;/span&gt; &lt;span class=\"fn\"&gt;__init__&lt;/span&gt;(&lt;span class=\"bi\"&gt;self&lt;/span&gt;): &lt;span class=\"bi\"&gt;self&lt;/span&gt;.root = {}\n    &lt;span class=\"kw\"&gt;def&lt;/span&gt; &lt;span class=\"fn\"&gt;insert&lt;/span&gt;(&lt;span class=\"bi\"&gt;self&lt;/span&gt;, word):\n        node = &lt;span class=\"bi\"&gt;self&lt;/span&gt;.root\n        &lt;span class=\"kw\"&gt;for&lt;/span&gt; ch &lt;span class=\"kw\"&gt;in&lt;/span&gt; word:\n            node = node.&lt;span class=\"fn\"&gt;setdefault&lt;/span&gt;(ch, {})\n        node[&lt;span class=\"st\"&gt;\"$\"&lt;/span&gt;] = &lt;span class=\"kw\"&gt;True&lt;/span&gt;                       &lt;span class=\"cm\"&gt;# end-of-word marker&lt;/span&gt;\n    &lt;span class=\"kw\"&gt;def&lt;/span&gt; &lt;span class=\"fn\"&gt;complete&lt;/span&gt;(&lt;span class=\"bi\"&gt;self&lt;/span&gt;, prefix):\n        node = &lt;span class=\"bi\"&gt;self&lt;/span&gt;.root\n        &lt;span class=\"kw\"&gt;for&lt;/span&gt; ch &lt;span class=\"kw\"&gt;in&lt;/span&gt; prefix:\n            &lt;span class=\"kw\"&gt;if&lt;/span&gt; ch &lt;span class=\"kw\"&gt;not&lt;/span&gt; &lt;span class=\"kw\"&gt;in&lt;/span&gt; node: &lt;span class=\"kw\"&gt;return&lt;/span&gt; []\n            node = node[ch]\n        out, stack = [], [(node, prefix)]\n        &lt;span class=\"kw\"&gt;while&lt;/span&gt; stack:\n            n, word = stack.&lt;span class=\"fn\"&gt;pop&lt;/span&gt;()\n            &lt;span class=\"kw\"&gt;if&lt;/span&gt; &lt;span class=\"st\"&gt;\"$\"&lt;/span&gt; &lt;span class=\"kw\"&gt;in&lt;/span&gt; n: out.&lt;span class=\"fn\"&gt;append&lt;/span&gt;(word)\n            stack.&lt;span class=\"fn\"&gt;extend&lt;/span&gt;((child, word + ch) &lt;span class=\"kw\"&gt;for&lt;/span&gt; ch, child &lt;span class=\"kw\"&gt;in&lt;/span&gt; n.&lt;span class=\"fn\"&gt;items&lt;/span&gt;() &lt;span class=\"kw\"&gt;if&lt;/span&gt; ch != &lt;span class=\"st\"&gt;\"$\"&lt;/span&gt;)\n        &lt;span class=\"kw\"&gt;return&lt;/span&gt; &lt;span class=\"bi\"&gt;sorted&lt;/span&gt;(out)\n\ntr = &lt;span class=\"fn\"&gt;Trie&lt;/span&gt;()\n&lt;span class=\"kw\"&gt;for&lt;/span&gt; w &lt;span class=\"kw\"&gt;in&lt;/span&gt; [&lt;span class=\"st\"&gt;\"car\"&lt;/span&gt;, &lt;span class=\"st\"&gt;\"cart\"&lt;/span&gt;, &lt;span class=\"st\"&gt;\"cat\"&lt;/span&gt;, &lt;span class=\"st\"&gt;\"dog\"&lt;/span&gt;]:\n    tr.&lt;span class=\"fn\"&gt;insert&lt;/span&gt;(w)\n&lt;span class=\"bi\"&gt;print&lt;/span&gt;(tr.&lt;span class=\"fn\"&gt;complete&lt;/span&gt;(&lt;span class=\"st\"&gt;\"ca\"&lt;/span&gt;))                         &lt;span class=\"cm\"&gt;# ['car', 'cart', 'cat']&lt;/span&gt;"}</textarea>
