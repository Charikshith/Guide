## Concept

`if`/`else`, `switch`/`match`, and loops (`for`, `while`, `do/while`, break, continue). Pattern matching in modern languages.

**In one sentence:** control flow decides *which* line runs next — branch on a condition, repeat while a condition holds, or jump out early.

**Mental model — a train on tracks.** The program is a train running straight down the track. An `if` is a switch point that sends it left or right. A loop is a circular siding it goes around until a signal turns green. `break` is an emergency exit off the loop. `continue` skips the rest of this lap.

**The building blocks**

| Construct | Use when | Notes |
|-----------|----------|-------|
| `if / elif / else` | 2–3 conditions | order matters: first true branch wins |
| `switch` (C, Java, JS) | one value vs many constants | falls through without `break` |
| `match` (Rust, Python 3.10+, Scala) | one value vs many *shapes* | destructures data; Rust checks exhaustiveness |
| `for x in items` | known collection | preferred; no index bugs |
| `for (i = 0; i &lt; n; i++)` | index arithmetic needed | off-by-one risk |
| `while cond` | unknown number of iterations | make sure cond eventually becomes false |
| `do { } while (cond)` | body must run at least once | e.g. "ask until valid" |
| `break` | leave the loop now | |
| `continue` | skip to the next iteration | |
| `return` | leave the whole function | often the clearest early exit |

**Pattern matching** goes beyond comparing values. It matches *structure* and binds names:

```python
match command.split():
    case ["go", direction]:        # list of 2, first is "go"
        move(direction)
    case ["take", *items]:         # "take" followed by anything
        pick_up(items)
    case _:
        print("unknown")
```

**Off-by-one errors** — the most common loop bug. Use half-open ranges `[start, end)`: `range(0, n)` runs n times, and `range(a, b)` has `b − a` items.

## Diagram

**if / else branching**

```mermaid
flowchart TD
    S([start]) --&gt; C{"score &gt;= 90?"}
    C -- yes --&gt; A["grade = 'A'"]
    C -- no --&gt; C2{"score &gt;= 75?"}
    C2 -- yes --&gt; B["grade = 'B'"]
    C2 -- no --&gt; F["grade = 'C'"]
    A &amp; B &amp; F --&gt; E([end])
```

**A loop with its exit condition, break, and continue**

```mermaid
flowchart TD
    I["i = 0"] --&gt; T{"i &lt; len(xs)?"}
    T -- no --&gt; DONE([exit loop])
    T -- yes --&gt; N{"xs[i] &lt; 0?"}
    N -- yes --&gt; CONT["continue"] --&gt; INC
    N -- no --&gt; Z{"xs[i] == 0?"}
    Z -- yes --&gt; BRK["break"] --&gt; DONE
    Z -- no --&gt; BODY["total += xs[i]"] --&gt; INC["i += 1"] --&gt; T
```

**C-style switch fallthrough**

```
 switch (n) {            n = 1 runs:
   case 1: puts("one");     "one"
   case 2: puts("two");     "two"    ← fell through! no break
           break;
   case 3: puts("three");   (stops at break)
 }
```

## Example

```rust
enum Shape {
    Circle { r: f64 },
    Rect { w: f64, h: f64 },
    Triangle { b: f64, h: f64 },
}

fn area(s: &amp;Shape) -&gt; f64 {
    match s {                                  // compiler checks every variant is handled
        Shape::Circle { r } =&gt; std::f64::consts::PI * r * r,
        Shape::Rect { w, h } =&gt; w * h,
        Shape::Triangle { b, h } =&gt; 0.5 * b * h,
    }
}

fn main() {
    let xs = [3, 1, 4, 1, 5];
    let mut total = 0;
    for x in xs {
        total += x;
    }
    println!("{total}");                                   // 14
    println!("{:.2}", area(&amp;Shape::Circle { r: 1.0 }));    // 3.14
}
```

```python
# Early return beats deeply nested ifs
def shipping_cost(order):
    if not order.items:
        return 0
    if order.total &gt;= 50:
        return 0
    if order.express:
        return 15
    return 5
```

## Exercises

1. Rewrite an if/else chain as a `match`.

   ```python
   if status == 200: msg = "ok"
   elif status == 404: msg = "not found"
   elif status in (500, 502, 503): msg = "server error"
   else: msg = "other"
   ```

   &lt;details&gt;&lt;summary&gt;Solution&lt;/summary&gt;

   ```python
   match status:
       case 200: msg = "ok"
       case 404: msg = "not found"
       case 500 | 502 | 503: msg = "server error"
       case _: msg = "other"
   ```
   &lt;/details&gt;

2. Implement FizzBuzz using both a loop and recursion.

   &lt;details&gt;&lt;summary&gt;Solution&lt;/summary&gt;

   ```python
   def fb(i):
       return "FizzBuzz" if i % 15 == 0 else "Fizz" if i % 3 == 0 else "Buzz" if i % 5 == 0 else str(i)

   for i in range(1, 101):
       print(fb(i))

   def fizzbuzz_rec(i=1, n=100):
       if i &gt; n:
           return
       print(fb(i))
       fizzbuzz_rec(i + 1, n)
   ```
   &lt;/details&gt;

3. How many times does `for i in range(2, 10, 3)` run, and with which values?

   &lt;details&gt;&lt;summary&gt;Solution&lt;/summary&gt;3 times: 2, 5, 8.&lt;/details&gt;

## Mini project

**A number-guessing game with input validation and a retry loop.**

```mermaid
stateDiagram-v2
    [*] --&gt; Pick: secret = random 1..100
    Pick --&gt; Ask
    Ask --&gt; Ask: not a number / out of range
    Ask --&gt; High: guess &gt; secret
    Ask --&gt; Low: guess &lt; secret
    High --&gt; Ask: "too high"
    Low --&gt; Ask: "too low"
    Ask --&gt; Won: guess == secret
    Ask --&gt; Lost: attempts == 7
    Won --&gt; [*]
    Lost --&gt; [*]
```

**Steps**

1. Pick a secret number with `random.randint(1, 100)`.
2. Loop: read input, reject non-numbers and out-of-range values *without* using up an attempt.
3. Say "too high" or "too low"; `break` on a win.
4. Use `for … else` (Python) to print a loss message when attempts run out.
5. Ask "play again?" with a `do/while`-style loop.

**Done when:** no input can crash it, and 7 attempts are always enough with binary search (log₂ 100 &lt; 7).

## Interview

1. **"When is `switch` faster than an if/else chain?"**
   &lt;details&gt;&lt;summary&gt;Answer&lt;/summary&gt;When cases are dense integer constants, compilers can build a jump table: one indexed jump, O(1), instead of up to n comparisons. For sparse values they may use binary search. Modern compilers often optimize if/else chains the same way, so measure before caring.&lt;/details&gt;

2. **"Explain fallthrough in C-style switch."**
   &lt;details&gt;&lt;summary&gt;Answer&lt;/summary&gt;A &lt;code&gt;case&lt;/code&gt; label is only an entry point. Execution continues into the next case until a &lt;code&gt;break&lt;/code&gt;. It lets several cases share code, but a forgotten break is a classic bug, so C# forbids implicit fallthrough and Go requires an explicit &lt;code&gt;fallthrough&lt;/code&gt; keyword.&lt;/details&gt;

## Checklist

- [ ] convert if/else to match
- [ ] know loop exit vs continue
- [ ] avoid off-by-one errors

<textarea id="codes" hidden>{"match command.split():\n    case [\"go\", direction]:        # list of 2, first is \"go\"\n        move(direction)\n    case [\"take\", *items]:         # \"take\" followed by anything\n        pick_up(items)\n    case _:\n        print(\"unknown\")": "&lt;span class=\"kw\"&gt;match&lt;/span&gt; command.&lt;span class=\"fn\"&gt;split&lt;/span&gt;():\n    &lt;span class=\"kw\"&gt;case&lt;/span&gt; [&lt;span class=\"st\"&gt;\"go\"&lt;/span&gt;, direction]:        &lt;span class=\"cm\"&gt;# list of 2, first is \"go\"&lt;/span&gt;\n        &lt;span class=\"fn\"&gt;move&lt;/span&gt;(direction)\n    &lt;span class=\"kw\"&gt;case&lt;/span&gt; [&lt;span class=\"st\"&gt;\"take\"&lt;/span&gt;, *items]:         &lt;span class=\"cm\"&gt;# \"take\" followed by anything&lt;/span&gt;\n        &lt;span class=\"fn\"&gt;pick_up&lt;/span&gt;(items)\n    &lt;span class=\"kw\"&gt;case&lt;/span&gt; _:\n        &lt;span class=\"bi\"&gt;print&lt;/span&gt;(&lt;span class=\"st\"&gt;\"unknown\"&lt;/span&gt;)", "enum Shape {\n    Circle { r: f64 },\n    Rect { w: f64, h: f64 },\n    Triangle { b: f64, h: f64 },\n}\n\nfn area(s: &amp;Shape) -&gt; f64 {\n    match s {                                  // compiler checks every variant is handled\n        Shape::Circle { r } =&gt; std::f64::consts::PI * r * r,\n        Shape::Rect { w, h } =&gt; w * h,\n        Shape::Triangle { b, h } =&gt; 0.5 * b * h,\n    }\n}\n\nfn main() {\n    let xs = [3, 1, 4, 1, 5];\n    let mut total = 0;\n    for x in xs {\n        total += x;\n    }\n    println!(\"{total}\");                                   // 14\n    println!(\"{:.2}\", area(&amp;Shape::Circle { r: 1.0 }));    // 3.14\n}": "&lt;span class=\"kw\"&gt;enum&lt;/span&gt; Shape {\n    Circle { r: &lt;span class=\"bi\"&gt;f64&lt;/span&gt; },\n    Rect { w: &lt;span class=\"bi\"&gt;f64&lt;/span&gt;, h: &lt;span class=\"bi\"&gt;f64&lt;/span&gt; },\n    Triangle { b: &lt;span class=\"bi\"&gt;f64&lt;/span&gt;, h: &lt;span class=\"bi\"&gt;f64&lt;/span&gt; },\n}\n\n&lt;span class=\"kw\"&gt;fn&lt;/span&gt; &lt;span class=\"fn\"&gt;area&lt;/span&gt;(s: &amp;amp;Shape) -&amp;gt; &lt;span class=\"bi\"&gt;f64&lt;/span&gt; {\n    &lt;span class=\"kw\"&gt;match&lt;/span&gt; s {                                  &lt;span class=\"cm\"&gt;// compiler checks every variant is handled&lt;/span&gt;\n        Shape::Circle { r } =&amp;gt; std::&lt;span class=\"bi\"&gt;f64&lt;/span&gt;::consts::PI * r * r,\n        Shape::Rect { w, h } =&amp;gt; w * h,\n        Shape::Triangle { b, h } =&amp;gt; &lt;span class=\"nu\"&gt;0.5&lt;/span&gt; * b * h,\n    }\n}\n\n&lt;span class=\"kw\"&gt;fn&lt;/span&gt; &lt;span class=\"fn\"&gt;main&lt;/span&gt;() {\n    &lt;span class=\"kw\"&gt;let&lt;/span&gt; xs = [&lt;span class=\"nu\"&gt;3&lt;/span&gt;, &lt;span class=\"nu\"&gt;1&lt;/span&gt;, &lt;span class=\"nu\"&gt;4&lt;/span&gt;, &lt;span class=\"nu\"&gt;1&lt;/span&gt;, &lt;span class=\"nu\"&gt;5&lt;/span&gt;];\n    &lt;span class=\"kw\"&gt;let&lt;/span&gt; &lt;span class=\"kw\"&gt;mut&lt;/span&gt; total = &lt;span class=\"nu\"&gt;0&lt;/span&gt;;\n    &lt;span class=\"kw\"&gt;for&lt;/span&gt; x &lt;span class=\"kw\"&gt;in&lt;/span&gt; xs {\n        total += x;\n    }\n    &lt;span class=\"fn\"&gt;println!&lt;/span&gt;(&lt;span class=\"st\"&gt;\"{total}\"&lt;/span&gt;);                                   &lt;span class=\"cm\"&gt;// 14&lt;/span&gt;\n    &lt;span class=\"fn\"&gt;println!&lt;/span&gt;(&lt;span class=\"st\"&gt;\"{:.2}\"&lt;/span&gt;, &lt;span class=\"fn\"&gt;area&lt;/span&gt;(&amp;amp;Shape::Circle { r: &lt;span class=\"nu\"&gt;1.0&lt;/span&gt; }));    &lt;span class=\"cm\"&gt;// 3.14&lt;/span&gt;\n}", "# Early return beats deeply nested ifs\ndef shipping_cost(order):\n    if not order.items:\n        return 0\n    if order.total &gt;= 50:\n        return 0\n    if order.express:\n        return 15\n    return 5": "&lt;span class=\"cm\"&gt;# Early return beats deeply nested ifs&lt;/span&gt;\n&lt;span class=\"kw\"&gt;def&lt;/span&gt; &lt;span class=\"fn\"&gt;shipping_cost&lt;/span&gt;(order):\n    &lt;span class=\"kw\"&gt;if&lt;/span&gt; &lt;span class=\"kw\"&gt;not&lt;/span&gt; order.items:\n        &lt;span class=\"kw\"&gt;return&lt;/span&gt; &lt;span class=\"nu\"&gt;0&lt;/span&gt;\n    &lt;span class=\"kw\"&gt;if&lt;/span&gt; order.total &amp;gt;= &lt;span class=\"nu\"&gt;50&lt;/span&gt;:\n        &lt;span class=\"kw\"&gt;return&lt;/span&gt; &lt;span class=\"nu\"&gt;0&lt;/span&gt;\n    &lt;span class=\"kw\"&gt;if&lt;/span&gt; order.express:\n        &lt;span class=\"kw\"&gt;return&lt;/span&gt; &lt;span class=\"nu\"&gt;15&lt;/span&gt;\n    &lt;span class=\"kw\"&gt;return&lt;/span&gt; &lt;span class=\"nu\"&gt;5&lt;/span&gt;", "if status == 200: msg = \"ok\"\nelif status == 404: msg = \"not found\"\nelif status in (500, 502, 503): msg = \"server error\"\nelse: msg = \"other\"": "&lt;span class=\"kw\"&gt;if&lt;/span&gt; status == &lt;span class=\"nu\"&gt;200&lt;/span&gt;: msg = &lt;span class=\"st\"&gt;\"ok\"&lt;/span&gt;\n&lt;span class=\"kw\"&gt;elif&lt;/span&gt; status == &lt;span class=\"nu\"&gt;404&lt;/span&gt;: msg = &lt;span class=\"st\"&gt;\"not found\"&lt;/span&gt;\n&lt;span class=\"kw\"&gt;elif&lt;/span&gt; status &lt;span class=\"kw\"&gt;in&lt;/span&gt; (&lt;span class=\"nu\"&gt;500&lt;/span&gt;, &lt;span class=\"nu\"&gt;502&lt;/span&gt;, &lt;span class=\"nu\"&gt;503&lt;/span&gt;): msg = &lt;span class=\"st\"&gt;\"server error\"&lt;/span&gt;\n&lt;span class=\"kw\"&gt;else&lt;/span&gt;: msg = &lt;span class=\"st\"&gt;\"other\"&lt;/span&gt;", "match status:\n    case 200: msg = \"ok\"\n    case 404: msg = \"not found\"\n    case 500 | 502 | 503: msg = \"server error\"\n    case _: msg = \"other\"": "&lt;span class=\"kw\"&gt;match&lt;/span&gt; status:\n    &lt;span class=\"kw\"&gt;case&lt;/span&gt; &lt;span class=\"nu\"&gt;200&lt;/span&gt;: msg = &lt;span class=\"st\"&gt;\"ok\"&lt;/span&gt;\n    &lt;span class=\"kw\"&gt;case&lt;/span&gt; &lt;span class=\"nu\"&gt;404&lt;/span&gt;: msg = &lt;span class=\"st\"&gt;\"not found\"&lt;/span&gt;\n    &lt;span class=\"kw\"&gt;case&lt;/span&gt; &lt;span class=\"nu\"&gt;500&lt;/span&gt; | &lt;span class=\"nu\"&gt;502&lt;/span&gt; | &lt;span class=\"nu\"&gt;503&lt;/span&gt;: msg = &lt;span class=\"st\"&gt;\"server error\"&lt;/span&gt;\n    &lt;span class=\"kw\"&gt;case&lt;/span&gt; _: msg = &lt;span class=\"st\"&gt;\"other\"&lt;/span&gt;", "def fb(i):\n    return \"FizzBuzz\" if i % 15 == 0 else \"Fizz\" if i % 3 == 0 else \"Buzz\" if i % 5 == 0 else str(i)\n\nfor i in range(1, 101):\n    print(fb(i))\n\ndef fizzbuzz_rec(i=1, n=100):\n    if i &gt; n:\n        return\n    print(fb(i))\n    fizzbuzz_rec(i + 1, n)": "&lt;span class=\"kw\"&gt;def&lt;/span&gt; &lt;span class=\"fn\"&gt;fb&lt;/span&gt;(i):\n    &lt;span class=\"kw\"&gt;return&lt;/span&gt; &lt;span class=\"st\"&gt;\"FizzBuzz\"&lt;/span&gt; &lt;span class=\"kw\"&gt;if&lt;/span&gt; i % &lt;span class=\"nu\"&gt;15&lt;/span&gt; == &lt;span class=\"nu\"&gt;0&lt;/span&gt; &lt;span class=\"kw\"&gt;else&lt;/span&gt; &lt;span class=\"st\"&gt;\"Fizz\"&lt;/span&gt; &lt;span class=\"kw\"&gt;if&lt;/span&gt; i % &lt;span class=\"nu\"&gt;3&lt;/span&gt; == &lt;span class=\"nu\"&gt;0&lt;/span&gt; &lt;span class=\"kw\"&gt;else&lt;/span&gt; &lt;span class=\"st\"&gt;\"Buzz\"&lt;/span&gt; &lt;span class=\"kw\"&gt;if&lt;/span&gt; i % &lt;span class=\"nu\"&gt;5&lt;/span&gt; == &lt;span class=\"nu\"&gt;0&lt;/span&gt; &lt;span class=\"kw\"&gt;else&lt;/span&gt; &lt;span class=\"bi\"&gt;str&lt;/span&gt;(i)\n\n&lt;span class=\"kw\"&gt;for&lt;/span&gt; i &lt;span class=\"kw\"&gt;in&lt;/span&gt; &lt;span class=\"bi\"&gt;range&lt;/span&gt;(&lt;span class=\"nu\"&gt;1&lt;/span&gt;, &lt;span class=\"nu\"&gt;101&lt;/span&gt;):\n    &lt;span class=\"bi\"&gt;print&lt;/span&gt;(&lt;span class=\"fn\"&gt;fb&lt;/span&gt;(i))\n\n&lt;span class=\"kw\"&gt;def&lt;/span&gt; &lt;span class=\"fn\"&gt;fizzbuzz_rec&lt;/span&gt;(i=&lt;span class=\"nu\"&gt;1&lt;/span&gt;, n=&lt;spa
