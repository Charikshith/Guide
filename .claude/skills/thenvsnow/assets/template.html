<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>{{TITLE}}</title>
<script>
/* Theme: opens in Deep dark; the ☀/☾ button switches to light and remembers it (the device's dark mode is ignored). */
(function () {
  var d = document.documentElement;
  try { var t = localStorage.getItem('vs-theme'); if (t === 'light' || t === 'dark') d.setAttribute('data-theme', t); } catch (e) {}
  document.addEventListener('DOMContentLoaded', function () {
    var b = document.querySelector('.theme-toggle'); if (!b) return;
    var sync = function () {
      var light = d.getAttribute('data-theme') === 'light';
      b.textContent = light ? '☾' : '☀';
      b.setAttribute('aria-label', light ? 'Switch to dark theme' : 'Switch to light theme');
      b.title = light ? 'Dark theme' : 'Light theme';
    };
    sync();
    b.addEventListener('click', function () {
      var next = d.getAttribute('data-theme') === 'light' ? 'dark' : 'light';
      d.setAttribute('data-theme', next);
      try { localStorage.setItem('vs-theme', next); } catch (e) {}
      sync();
    });
  });
})();
</script>
<style>
/* ===== Tokens — default theme: Deep dark. Colours carry meaning: c1..c5 are the only accent families ===== */
:root{
  --bg:#0f1013; --surface:#1a1b20; --ink:#ededf1; --muted:#a4a6b0; --line:#34363e; --zone:#202228;
  --c1:#7aa7ff; --c1-soft:#1b2846;   /* blue   */
  --c2:#40d0a0; --c2-soft:#13332a;   /* green  */
  --c3:#f4a94e; --c3-soft:#3a2912;   /* amber  */
  --c4:#f472a8; --c4-soft:#3d1729;   /* rose   */
  --c5:#ab8dff; --c5-soft:#291f47;   /* violet */
  --on-accent:#0f1013;
  --shadow:rgba(0,0,0,.55); --mass:#555b69; --mass-shade:#383c46;
  --font:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  --mono:ui-monospace,"Cascadia Code",Consolas,Menlo,monospace;
  --r:18px;
  color-scheme:dark;
}
/* ===== Light theme (Warm paper) — via the ☀ button ===== */
:root[data-theme="light"]{
  --bg:#f4f2ec; --surface:#ffffff; --ink:#18181b; --muted:#5b5e66; --line:#d9d5cb; --zone:#ece9e1;
  --c1:#2563eb; --c1-soft:#dce7fe; --c2:#0b8a64; --c2-soft:#d2f0e4; --c3:#c76a00; --c3-soft:#fde8cc;
  --c4:#c8246b; --c4-soft:#fcdfea; --c5:#6c3fd8; --c5-soft:#e9e1fd; --on-accent:#ffffff;
  --shadow:rgba(30,25,15,.16); --mass:#ffffff; --mass-shade:#d6d2c8;
  color-scheme:light;
}
.theme-toggle{position:fixed;top:14px;right:14px;z-index:20;width:42px;height:42px;border-radius:50%;
  border:1px solid var(--line);background:var(--surface);color:var(--ink);font-size:19px;line-height:1;cursor:pointer;
  box-shadow:0 6px 16px -8px var(--shadow);transition:transform .15s}
.theme-toggle:hover{transform:scale(1.07)}
.theme-toggle:focus-visible{outline:2px solid var(--c1);outline-offset:2px}
.hand .theme-toggle{display:none}   /* handwritten style is always paper */
@media print{.theme-toggle{display:none}}

*,*::before,*::after{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.55 var(--font);-webkit-font-smoothing:antialiased}
body::before{ /* soft colour glow behind the header */
  content:"";position:fixed;inset:0 0 auto 0;height:520px;z-index:-1;pointer-events:none;
  background:radial-gradient(60% 80% at 15% 0%,var(--c1-soft),transparent 70%),
             radial-gradient(50% 70% at 90% 10%,var(--c5-soft),transparent 70%);
  opacity:.9}
.page{max-width:1040px;margin:0 auto;padding:44px 24px 56px}
@media (max-width:600px){.page{padding:24px 16px 40px}}

/* ===== Header ===== */
.eyebrow{display:inline-flex;align-items:center;gap:8px;margin:0 0 14px;padding:6px 12px 6px 10px;border-radius:999px;
  background:var(--surface);border:1px solid var(--line);font:600 12px/1 var(--font);letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.eyebrow::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--c1);box-shadow:0 0 0 3px var(--c1-soft)}
h1{font-size:clamp(30px,5vw,48px);line-height:1.08;letter-spacing:-.025em;margin:0 0 12px;font-weight:800}
h1 .accent{background:linear-gradient(90deg,var(--c1),var(--c5));-webkit-background-clip:text;background-clip:text;color:transparent}
.lede{font-size:18px;color:var(--muted);max-width:66ch;margin:0}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin:18px 0 0;padding:0;list-style:none}
.chips li{background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:5px 12px;font-size:14px;color:var(--muted)}
.chips b{color:var(--ink);font-weight:700}
h2{font-size:20px;letter-spacing:-.01em;margin:44px 0 14px;display:flex;align-items:center;gap:10px}
h2::after{content:"";flex:1;height:1px;background:var(--line)}

/* ===== Main visual ===== */
.stage{position:relative;margin:28px 0 0;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);
  padding:18px;overflow-x:auto;box-shadow:0 1px 2px var(--shadow),0 18px 40px -24px var(--shadow)}
.stage::before{ /* faint dot grid */
  content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;opacity:.55;
  background:radial-gradient(circle,var(--line) 1px,transparent 1.4px) 0 0/22px 22px}
.stage > svg{position:relative;display:block;width:100%;height:auto;overflow:visible}
.stage figcaption{position:relative;font-size:14px;color:var(--muted);margin-top:12px}
@media (max-width:600px){.stage{padding:12px}.stage > svg{min-width:640px}.stage figcaption{position:sticky;left:0}}
.scroll-hint{display:none;font-size:13px;color:var(--muted);margin:8px 0 0}
@media (max-width:600px){.scroll-hint{display:block}}

/* --- SVG vocabulary: use these classes, never hard-coded colours --- */
.node{fill:var(--surface);stroke:var(--line);stroke-width:1.5}
.node.c1{fill:url(#g-c1);stroke:var(--c1)} .node.c2{fill:url(#g-c2);stroke:var(--c2)}
.node.c3{fill:url(#g-c3);stroke:var(--c3)} .node.c4{fill:url(#g-c4);stroke:var(--c4)}
.node.c5{fill:url(#g-c5);stroke:var(--c5)}
.node.solid.c1{fill:var(--c1)} .node.solid.c2{fill:var(--c2)} .node.solid.c3{fill:var(--c3)}
.node.solid.c4{fill:var(--c4)} .node.solid.c5{fill:var(--c5)}
.lift{filter:url(#shadow)}                          /* soft drop shadow: put on a <g> or shape */
.chip{stroke:none} .chip.c1{fill:var(--c1)} .chip.c2{fill:var(--c2)} .chip.c3{fill:var(--c3)} .chip.c4{fill:var(--c4)} .chip.c5{fill:var(--c5)}
.ico{color:var(--ink)} .ico.on{color:var(--on-accent)}
.ico.c1{color:var(--c1)} .ico.c2{color:var(--c2)} .ico.c3{color:var(--c3)} .ico.c4{color:var(--c4)} .ico.c5{color:var(--c5)} .ico.muted{color:var(--muted)}
.zone{fill:var(--zone);stroke:var(--line);stroke-width:1;stroke-dasharray:5 5;fill-opacity:.7}
/* scene shapes (sky, ground, sea, body outline …): soft fills that fade */
.wash{stroke:none} .wash.c1{fill:url(#fade-c1)} .wash.c2{fill:url(#fade-c2)} .wash.c3{fill:url(#fade-c3)}
.wash.c4{fill:url(#fade-c4)} .wash.c5{fill:url(#fade-c5)} .wash.up.c1{fill:url(#rise-c1)} .wash.up.c2{fill:url(#rise-c2)}
.wash.up.c3{fill:url(#rise-c3)} .wash.up.c4{fill:url(#rise-c4)} .wash.up.c5{fill:url(#rise-c5)}
.wash.line{stroke-width:2} .wash.line.c1{stroke:var(--c1)} .wash.line.c2{stroke:var(--c2)} .wash.line.c3{stroke:var(--c3)}
.mass{fill:var(--mass);stroke:none} .mass.shade{fill:var(--mass-shade)}   /* solid soft blobs: clouds, organs, objects */
.edge{fill:none;stroke:var(--muted);stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.edge.c1{stroke:var(--c1)} .edge.c2{stroke:var(--c2)} .edge.c3{stroke:var(--c3)} .edge.c4{stroke:var(--c4)} .edge.c5{stroke:var(--c5)}
.edge.dash{stroke-dasharray:6 7}
.edge.thick{stroke-width:3.5}
.edge.flow{stroke-dasharray:7 9;animation:march 1.1s linear infinite}   /* marching dashes = something is moving */
@keyframes march{to{stroke-dashoffset:-16}}
.particle{stroke:var(--surface);stroke-width:1.5} .particle.c1{fill:var(--c1)} .particle.c2{fill:var(--c2)}
.particle.c3{fill:var(--c3)} .particle.c4{fill:var(--c4)} .particle.c5{fill:var(--c5)}
.spin{transform-box:fill-box;transform-origin:center;animation:spin 24s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.pulse{transform-box:fill-box;transform-origin:center;animation:pulse 2.4s ease-in-out infinite}
@keyframes pulse{50%{transform:scale(1.06)}}
.leader{fill:none;stroke:var(--muted);stroke-width:1.2}
.dot{fill:var(--muted)}
.t{font:600 16px var(--font);fill:var(--ink)}
.t.sub{font-weight:400;font-size:14px;fill:var(--muted)}
.t.big{font-size:20px;font-weight:800}
.t.small{font-size:13px;font-weight:600;fill:var(--muted)}
.t.on{fill:var(--on-accent)}
.t.c1{fill:var(--c1)} .t.c2{fill:var(--c2)} .t.c3{fill:var(--c3)} .t.c4{fill:var(--c4)} .t.c5{fill:var(--c5)}
.t.mono{font-family:var(--mono)}
.t.halo{paint-order:stroke;stroke:var(--surface);stroke-width:5px;stroke-linejoin:round}  /* readable over scenes/lines */
.badge circle{fill:var(--ink);stroke:var(--surface);stroke-width:2.5} .badge text{font:800 13px var(--font);fill:var(--surface)}
.badge.c1 circle{fill:var(--c1)} .badge.c2 circle{fill:var(--c2)} .badge.c3 circle{fill:var(--c3)}
.badge.c4 circle{fill:var(--c4)} .badge.c5 circle{fill:var(--c5)}
/* step focus (wired up by the script at the bottom) */
[data-step]{transition:opacity .25s}
svg.focusing [data-step]:not(.on){opacity:.18}
@media (prefers-reduced-motion:reduce){.edge.flow,.spin,.pulse{animation:none}.particle{display:none}}

/* ===== Walkthrough player (inserted by the script; no markup needed) ===== */
.player{position:relative;display:flex;flex-wrap:wrap;align-items:center;gap:10px 12px;margin-top:14px;padding:10px 14px 10px 10px;
  border:1px solid var(--line);border-radius:14px;background:var(--bg)}
@media (max-width:600px){.player{position:sticky;left:0}}
.player button{font:inherit;cursor:pointer}
.player button:focus-visible{outline:2px solid var(--c1);outline-offset:2px}
.pl-play{flex:none;width:42px;height:42px;border-radius:50%;border:0;background:var(--ink);color:var(--surface);display:grid;place-items:center;
  box-shadow:0 6px 16px -8px var(--shadow);transition:transform .15s}
.pl-play:hover{transform:scale(1.06)}
.pl-play svg{margin-left:2px} .player.playing .pl-play svg{margin-left:0}
.pl-nav{flex:none;width:32px;height:32px;border-radius:50%;border:1px solid var(--line);background:var(--surface);color:var(--ink);padding:0;display:grid;place-items:center}
.pl-track{display:flex;gap:4px;flex:none}
.pl-seg{width:34px;height:20px;padding:0;border:0;background:none;color:var(--ink)}
.pl-seg.c1{color:var(--c1)} .pl-seg.c2{color:var(--c2)} .pl-seg.c3{color:var(--c3)} .pl-seg.c4{color:var(--c4)} .pl-seg.c5{color:var(--c5)}
.pl-seg i{display:block;height:6px;border-radius:3px;background:var(--line);overflow:hidden}
.pl-seg s{display:block;height:100%;width:0;background:currentColor;text-decoration:none}
.pl-seg.done s,.pl-seg.active s{width:100%}
.player.playing .pl-seg.active s{animation:pl-fill var(--dur,4s) linear}
@keyframes pl-fill{from{width:0}to{width:100%}}
.pl-cap{flex:1 1 300px;margin:0;font-size:15px;line-height:1.45;color:var(--muted);min-height:44px;display:flex;flex-wrap:wrap;align-items:center;gap:0 6px}
.pl-cap b{color:var(--ink)}
.pl-n{font:700 12px/1 var(--font);letter-spacing:.06em;text-transform:uppercase;color:var(--surface);background:var(--muted);padding:4px 7px;border-radius:999px}
@media print{.player{display:none}}

/* ===== Reading guide: numbered steps that match the badges ===== */
.steps{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(auto-fit,minmax(176px,1fr));gap:12px;counter-reset:s}
.steps li{counter-increment:s;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px 16px 16px 54px;position:relative;
  cursor:default;transition:transform .2s,box-shadow .2s,border-color .2s;outline:none}
.steps li::before{content:counter(s);position:absolute;left:14px;top:15px;width:26px;height:26px;border-radius:50%;
  background:var(--ink);color:var(--surface);font:800 13px/26px var(--font);text-align:center}
.steps li.c1::before{background:var(--c1)} .steps li.c2::before{background:var(--c2)} .steps li.c3::before{background:var(--c3)}
.steps li.c4::before{background:var(--c4)} .steps li.c5::before{background:var(--c5)}
.steps li.on,.steps li:hover,.steps li:focus-visible{transform:translateY(-2px);border-color:var(--muted);box-shadow:0 10px 24px -14px var(--shadow)}
.steps b{display:block;margin-bottom:2px}
.steps span{color:var(--muted);font-size:15px}

/* ===== Takeaways ===== */
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:12px}
.card{position:relative;overflow:hidden;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px 16px 16px 60px}
.card::before{content:"";position:absolute;inset:0 auto 0 0;width:4px;background:var(--c1)}
.card svg{position:absolute;left:18px;top:17px;width:26px;height:26px;color:var(--c1)}
.card.c2::before{background:var(--c2)} .card.c3::before{background:var(--c3)} .card.c4::before{background:var(--c4)} .card.c5::before{background:var(--c5)}
.card.c2 svg{color:var(--c2)} .card.c3 svg{color:var(--c3)} .card.c4 svg{color:var(--c4)} .card.c5 svg{color:var(--c5)}
.card b{display:block;margin-bottom:2px}
.card p{margin:0;color:var(--muted)}

/* ===== Legend ===== */
.legend{display:flex;flex-wrap:wrap;gap:8px 20px;margin:14px 0 0;padding:0;list-style:none;font-size:14px;color:var(--muted)}
.legend li{display:flex;align-items:center;gap:8px}
.sw{width:14px;height:14px;border-radius:4px;border:1.5px solid var(--line);background:var(--surface)}
.sw.c1{background:var(--c1-soft);border-color:var(--c1)} .sw.c2{background:var(--c2-soft);border-color:var(--c2)}
.sw.c3{background:var(--c3-soft);border-color:var(--c3)} .sw.c4{background:var(--c4-soft);border-color:var(--c4)}
.sw.c5{background:var(--c5-soft);border-color:var(--c5)}
.sw.line{height:3px;border:0;border-radius:2px;background:var(--muted)}
.sw.line.c1{background:var(--c1)} .sw.line.c2{background:var(--c2)} .sw.line.c3{background:var(--c3)}
.sw.line.c4{background:var(--c4)} .sw.line.c5{background:var(--c5)}

/* ===== Footnote ===== */
.note{margin-top:32px;padding-top:14px;border-top:1px solid var(--line);font-size:14px;color:var(--muted)}
code{font-family:var(--mono);font-size:.92em;background:var(--zone);padding:1px 5px;border-radius:5px}

@media print{body{background:#fff}body::before{display:none}.stage,.steps li,.card{break-inside:avoid;box-shadow:none}}

/* ===== /thenvsnow ===== */
.sr-only{position:absolute;width:1px;height:1px;margin:-1px;padding:0;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap;border:0}
.tn{--then:var(--c3);--then-soft:var(--c3-soft);--now:var(--c1);--now-soft:var(--c1-soft);--good:var(--c2);--bad:var(--c4);margin-top:26px}
.tn h3{margin:0}
.tn .lbl{display:block;font:800 11px/1.4 var(--font);letter-spacing:.09em;text-transform:uppercase;color:var(--muted)}

/* --- hero: two panels + before/after slider --- */
.tn-panels{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.tn-panel{position:relative;border:1px solid var(--line);border-radius:var(--r);padding:16px 18px 16px 18px;overflow:hidden;background:var(--surface)}
.tn-panel::before{content:"";position:absolute;inset:0 auto 0 0;width:5px;background:var(--then)}
.tn-panel.then{background:linear-gradient(135deg,var(--then-soft),var(--surface) 75%);filter:saturate(.6)}
.tn-panel.then::before{background:var(--then)}
.tn-panel.now{background:linear-gradient(135deg,var(--now-soft),var(--surface) 75%)}
.tn-panel.now::before{background:linear-gradient(var(--now),var(--c5))}
.tn-panel .tag{display:inline-block;font:800 11px/1 var(--font);letter-spacing:.12em;text-transform:uppercase;padding:5px 9px;border-radius:999px;background:var(--then);color:var(--on-accent)}
.tn-panel.now .tag{background:var(--now)}
.tn-panel .tn-y{display:block;font:800 clamp(40px,7vw,64px)/1 var(--font);letter-spacing:-.03em;margin:10px 0 4px;font-variant-numeric:tabular-nums}
.tn-panel.then .tn-y{color:var(--then)}
.tn-panel.now .tn-y{background:linear-gradient(90deg,var(--c1),var(--c5));-webkit-background-clip:text;background-clip:text;color:transparent}
.tn-panel h3{font-size:18px;line-height:1.25}
.tn-panel p{margin:4px 0 0;color:var(--muted);font-size:15px}

.tn-slider{position:relative;margin-top:14px;aspect-ratio:16/9;border:1px solid var(--line);border-radius:var(--r);overflow:hidden;background:var(--surface);
  touch-action:pan-y;user-select:none;-webkit-user-select:none;cursor:ew-resize;box-shadow:0 1px 2px var(--shadow),0 18px 40px -24px var(--shadow);--pos:50%}
.tn-layer{position:absolute;inset:0;width:100%;height:100%;display:block}
.tn-layer.then{background:var(--zone);filter:sepia(.55) saturate(.7) brightness(.96)}
.tn-layer.now{background:var(--surface);clip-path:inset(0 0 0 var(--pos))}
.tn-slider .ytag{position:absolute;top:12px;z-index:3;font:800 13px/1 var(--font);letter-spacing:.06em;padding:7px 11px;border-radius:999px;pointer-events:none;box-shadow:0 6px 14px -8px var(--shadow)}
.tn-slider .ytag.then{left:12px;background:var(--then);color:var(--on-accent)}
.tn-slider .ytag.now{right:12px;background:var(--now);color:var(--on-accent)}
.tn-handle{position:absolute;top:0;bottom:0;left:var(--pos);width:44px;margin-left:-22px;z-index:4;cursor:ew-resize;outline:none;touch-action:none}
.tn-handle::before{content:"";position:absolute;left:50%;top:0;bottom:0;width:3px;margin-left:-1.5px;background:var(--ink);box-shadow:0 0 0 1.5px var(--surface)}
.tn-knob{position:absolute;left:50%;top:50%;width:44px;height:44px;margin:-22px 0 0 -22px;border-radius:50%;background:var(--ink);color:var(--surface);display:grid;place-items:center;
  box-shadow:0 8px 20px -6px var(--shadow),0 0 0 3px var(--surface);transition:transform .15s}
.tn-handle:hover .tn-knob{transform:scale(1.08)}
.tn-handle:focus-visible .tn-knob{outline:3px solid var(--c1);outline-offset:3px}
.tn-hint{margin:8px 0 0;font-size:13px;color:var(--muted)}

/* scene vocabulary (classes only — colours come from the theme) */
.k0{fill:var(--zone)} .k1{fill:var(--mass)} .k2{fill:var(--mass-shade)} .kd{fill:var(--ink)} .km{fill:var(--muted)} .ks{fill:var(--surface)}
.kc1{fill:var(--c1)} .kc2{fill:var(--c2)} .kc3{fill:var(--c3)} .kc4{fill:var(--c4)} .kc5{fill:var(--c5)}
.kf1{fill:var(--c1-soft)} .kf2{fill:var(--c2-soft)} .kf3{fill:var(--c3-soft)} .kf4{fill:var(--c4-soft)} .kf5{fill:var(--c5-soft)}
.kl{fill:none;stroke:var(--muted);stroke-width:2;stroke-linejoin:round;stroke-linecap:round}
.kl.d{stroke:var(--ink)} .kl.t{stroke-width:1.2} .kl.c1{stroke:var(--c1)} .kl.c2{stroke:var(--c2)} .kl.c3{stroke:var(--c3)} .kl.c4{stroke:var(--c4)} .kl.c5{stroke:var(--c5)}
.ko{stroke:var(--muted);stroke-width:2;stroke-linejoin:round}
.kt{font:700 15px var(--font);fill:var(--ink)} .kt.s{font-size:12.5px;font-weight:600;fill:var(--muted)} .kt.m{font-family:var(--mono)}

/* --- toolbar --- */
.tn-bar{display:flex;flex-wrap:wrap;align-items:center;gap:10px 14px;margin:0 0 14px}
.tn-seg{display:inline-flex;border:1px solid var(--line);border-radius:999px;background:var(--surface);padding:3px}
.tn-seg button{font:700 14px/1 var(--font);border:0;background:none;color:var(--muted);padding:9px 16px;border-radius:999px;cursor:pointer;min-width:48px}
.tn-seg button[aria-pressed="true"]{background:var(--ink);color:var(--surface)}
.tn-seg button:focus-visible,.tn-btn:focus-visible{outline:2px solid var(--c1);outline-offset:2px}
.tn-seg-l{font-size:13px;color:var(--muted);font-weight:600}
.tn-btn{font:700 14px/1 var(--font);display:inline-flex;align-items:center;gap:8px;border:1px solid var(--line);background:var(--surface);color:var(--ink);padding:11px 16px;border-radius:999px;cursor:pointer}
.tn-btn:hover{border-color:var(--muted)}
.tn-btn.nav{padding:11px 13px}
.tn-btn[aria-pressed="true"]{background:var(--ink);color:var(--surface)}
.tn-play-grp{display:inline-flex;gap:6px;align-items:center}

/* --- metric rows --- */
.tn-metrics{border:1px solid var(--line);border-radius:var(--r);background:var(--surface);overflow:hidden;box-shadow:0 1px 2px var(--shadow)}
.tn-head,.tn-metric{display:grid;grid-template-columns:minmax(0,1.4fr) minmax(0,1fr) minmax(0,1.1fr) minmax(0,1fr) minmax(0,1.2fr);gap:6px 16px;align-items:center;padding:14px 20px}
.tn-head{background:var(--zone);font:800 11.5px/1.2 var(--font);letter-spacing:.09em;text-transform:uppercase;color:var(--muted);padding-top:11px;padding-bottom:11px}
.tn-head span:nth-child(2),.tn-head span:nth-child(4){text-align:center}
.tn-head span:nth-child(3){text-align:center}
.tn-head .then{color:var(--then)} .tn-head .now{color:var(--now)}
.tn-metric{border-top:1px solid var(--line);transition:opacity .25s,background .25s}
.tn-metrics.focusing .tn-metric:not(.on){opacity:.32}
.tn-metric.on{background:var(--zone)}
.tn-lab{display:flex;align-items:flex-start;gap:10px;min-width:0}
.tn-lab > svg{flex:none;width:26px;height:26px;color:var(--c1);margin-top:1px}
.tn-lab b{display:block;font-size:16px;line-height:1.3}
.tn-lab small{display:block;color:var(--muted);font-size:13px;line-height:1.35;margin-top:1px}
.tn-ref{font-size:11px;margin-left:2px;white-space:nowrap}
.tn-ref a{color:var(--c1);text-decoration:none;font-weight:700;padding:0 1px}
.tn-ref a:hover{text-decoration:underline}
.tn-val{text-align:center;min-width:0}
.tn-val::before{content:attr(data-y);display:none;font:800 11px/1 var(--font);letter-spacing:.08em;color:var(--muted);margin-bottom:3px}
.tn-val b{display:block;font:800 clamp(20px,2.6vw,26px)/1.1 var(--font);letter-spacing:-.02em;font-variant-numeric:tabular-nums;overflow-wrap:anywhere}
.tn-val small{display:block;font-size:12.5px;color:var(--muted);margin-top:2px}
.tn-val.then b{color:var(--then)}
.tn-val.now b{color:var(--ink)}
.tn-chg{display:flex;flex-direction:column;align-items:center;gap:3px;text-align:center;min-width:0}
.tn-pill{display:inline-flex;align-items:center;gap:6px;font:800 15px/1 var(--font);padding:8px 12px;border-radius:999px;background:var(--zone);color:var(--ink);border:1px solid var(--line);font-variant-numeric:tabular-nums;white-space:nowrap}
.tn-pill svg{width:14px;height:14px;flex:none}
.tn-metric.good .tn-pill{background:var(--c2-soft);border-color:var(--good);color:var(--good)}
.tn-metric.bad .tn-pill{background:var(--c4-soft);border-color:var(--bad);color:var(--bad)}
.tn-chg i{font:600 12px/1 var(--font);font-style:normal;color:var(--muted)}
.tn-metric.good .tn-chg i{color:var(--good)} .tn-metric.bad .tn-chg i{color:var(--bad)}
.tn-bars{display:grid;gap:5px;min-width:0}
.tn-bars .tk{display:block;height:11px;border-radius:6px;background:var(--zone);overflow:hidden}
.tn-bars .tk s{display:block;height:100%;width:var(--w);border-radius:6px;text-decoration:none;transition:width .7s cubic-bezier(.2,.8,.2,1)}
.tn-bars .tk.then s{background:var(--then)} .tn-bars .tk.now s{background:linear-gradient(90deg,var(--c1),var(--c5))}
.tn-bars em{font:600 11px/1 var(--font);font-style:normal;color:var(--muted);margin-top:1px}
.tn-metrics.pre .tk s{width:0}
@media screen and (max-width:760px){
  .tn-head{display:none}
  .tn-metric{grid-template-columns:1fr auto 1fr;padding:16px 14px 14px;gap:10px 8px}
  .tn-lab,.tn-bars{grid-column:1 / -1}
  .tn-val::before{display:block}
  .tn-val{order:0}
  .tn-chg{order:0}
}

/* --- changed / same --- */
.tn-cols{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.tn-col{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px 18px}
.tn-col h3{display:flex;align-items:center;gap:8px;font-size:17px;margin-bottom:10px}
.tn-col h3 svg{width:22px;height:22px}
.tn-col.changed h3{color:var(--c3)} .tn-col.same h3{color:var(--c2)}
.tn-col ul{list-style:none;margin:0;padding:0;display:grid;gap:10px}
.tn-col li{display:grid;grid-template-columns:24px minmax(0,1fr);gap:10px;align-items:start}
.tn-col li svg{width:22px;height:22px;margin-top:1px}
.tn-col.changed li svg{color:var(--c3)} .tn-col.same li svg{color:var(--c2)}
.tn-col li span{min-width:0}
.tn-col li b{font-weight:700}

/* --- milestones strip --- */
.tn-miles{list-style:none;margin:0;padding:0;display:grid;grid-auto-flow:column;grid-auto-columns:minmax(0,1fr);gap:12px;position:relative}
.tn-miles::before{content:"";position:absolute;left:0;right:0;top:14px;height:3px;border-radius:2px;background:linear-gradient(90deg,var(--then),var(--now))}
.tn-miles li{position:relative;padding-top:36px;min-width:0}
.tn-miles li::before{content:"";position:absolute;top:7px;left:0;width:17px;height:17px;border-radius:50%;background:var(--surface);border:4px solid var(--c1)}
.tn-miles li.cap:first-child::before{border-color:var(--then)}
.tn-miles li.cap:last-child::before{border-color:var(--c5)}
.tn-miles .yr{display:block;font:800 18px/1.1 var(--font);font-variant-numeric:tabular-nums}
.tn-miles b{display:block;font-size:15px;line-height:1.3;margin-top:2px}
.tn-miles span.d{display:block;font-size:14px;color:var(--muted);line-height:1.4;margin-top:2px}
@media screen and (max-width:760px){
  .tn-miles{grid-auto-flow:row;gap:16px}
  .tn-miles::before{left:8px;right:auto;top:8px;bottom:8px;width:3px;height:auto;background:linear-gradient(var(--then),var(--now))}
  .tn-miles li{padding:0 0 0 36px}
  .tn-miles li::before{top:2px}
}

/* --- callouts --- */
.tn-two{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.tn-big,.tn-why{border:1px solid var(--line);border-radius:var(--r);padding:18px 20px;position:relative;overflow:hidden}
.tn-big{background:linear-gradient(135deg,var(--c5-soft),var(--surface) 80%);border-color:var(--c5)}
.tn-why{background:linear-gradient(135deg,var(--c2-soft),var(--surface) 80%);border-color:var(--c2)}
.tn-big .lbl{color:var(--c5)} .tn-why .lbl{color:var(--c2)}
.tn-big .hl{display:block;font:800 clamp(24px,4vw,34px)/1.15 var(--font);letter-spacing:-.02em;margin:6px 0 6px}
.tn-big p,.tn-why p{margin:0;color:var(--muted)}
.tn-why ul{margin:6px 0 0;padding-left:20px;color:var(--muted)} .tn-why li{margin:3px 0} .tn-why li b{color:var(--ink)}

/* --- sources --- */
.tn-src{margin:0;padding:0 0 0 22px;display:grid;gap:8px;font-size:14.5px}
.tn-src li{padding-left:4px;overflow-wrap:anywhere;scroll-margin-top:80px}
.tn-src li:target{background:var(--c3-soft);border-radius:6px}
.tn-src li::marker{font-weight:800;color:var(--muted)}
.tn-src .yr{color:var(--muted)}
.tn-src a{color:var(--c1)}
.tn-src .for{display:block;color:var(--muted);font-size:13.5px}

/* --- handwritten style (only when asked: data-style="handwritten") --- */
:root.hand.hand{
  --bg:#e9e4d8; --surface:#fdfbf4; --ink:#1f3a93; --muted:#4a5a8a; --line:#9fb7d6; --zone:#f3eedf;
  --c1:#1f3a93; --c1-soft:rgba(64,196,255,.30);  --c2:#1e8449; --c2-soft:rgba(118,255,3,.32);
  --c3:#b9770e; --c3-soft:rgba(255,235,59,.60);  --c4:#c0392b; --c4-soft:rgba(255,128,171,.40);
  --c5:#7d3c98; --c5-soft:rgba(206,147,216,.40); --on-accent:#fff; --shadow:rgba(0,0,0,.16);
  --font:'Kalam','Patrick Hand','Segoe Print','Comic Sans MS',cursive;
  --title:'Caveat','Kalam','Segoe Print','Bradley Hand',cursive;
  color-scheme:light;
}
.hand body::before{display:none}
.hand .page{margin:24px auto;padding:40px 28px 48px 88px;box-shadow:0 2px 6px rgba(0,0,0,.15),0 12px 28px rgba(0,0,0,.12);
  background:linear-gradient(90deg,transparent 62px,#e8a0a0 62px,#e8a0a0 64px,transparent 64px),
             repeating-linear-gradient(var(--surface) 0,var(--surface) 31px,#c9dcef 31px,#c9dcef 32px)}
@media (max-width:600px){.hand .page{margin:0;padding:24px 14px 40px 44px;
  background:linear-gradient(90deg,transparent 30px,#e8a0a0 30px,#e8a0a0 32px,transparent 32px),
             repeating-linear-gradient(var(--surface) 0,var(--surface) 31px,#c9dcef 31px,#c9dcef 32px)}}
.hand .eyebrow{background:none;border:0;padding:0;font:700 22px/1 var(--title);letter-spacing:0;text-transform:none;color:var(--c4)}
.hand .eyebrow::before{display:none}
.hand h1{font-family:var(--title);font-size:clamp(42px,6vw,60px);font-weight:700;letter-spacing:0;color:#222;transform:rotate(-1deg);transform-origin:left}
.hand h1 .accent{color:inherit;-webkit-background-clip:border-box;background-clip:border-box;
  background:linear-gradient(transparent 58%,var(--c3-soft) 58%,var(--c3-soft) 92%,transparent 92%)}
.hand h2{font-family:var(--title);font-size:30px;font-weight:700;letter-spacing:0;color:#222}
.hand .lede,.hand .note{color:var(--ink)}
.hand .chips li{background:var(--c3-soft);border:0;border-radius:3px 8px 4px 9px;color:var(--ink)}
.hand .chips b{color:#222}
.hand .tn-panel,.hand .tn-col,.hand .tn-big,.hand .tn-why,.hand .tn-metrics,.hand .tn-slider{border:2px solid #222;border-radius:4px 14px 6px 16px;box-shadow:2px 3px 0 rgba(0,0,0,.14);filter:none}
.hand .tn-panel.then{filter:none}
.hand .tn-panel .tn-y,.hand .tn-big .hl,.hand .tn-col h3,.hand .tn-panel h3,.hand .tn-miles .yr,.hand .tn-lab b{font-family:var(--title);letter-spacing:0}
.hand .tn-panel .tn-y{font-size:clamp(48px,8vw,76px)}
.hand .tn-panel.now .tn-y{color:var(--c1);background:none;-webkit-text-fill-color:currentcolor}
.hand .tn-val b,.hand .tn-pill{font-family:var(--title)}
.hand .tn-val b{font-size:clamp(24px,3vw,32px)}
.hand .tn-pill{font-size:19px}
.hand .tn-seg,.hand .tn-btn{border:2px solid #222}
.hand .tn-seg button,.hand .tn-btn{font-family:var(--font)}
.hand .tn-head{font-family:var(--title);font-size:17px;letter-spacing:0;text-transform:none;color:#222}
.hand .tn .lbl{font-family:var(--title);font-size:19px;letter-spacing:0;text-transform:none;color:#222}
.hand .tn-big{background:#fff59d}
.hand .tn-metric.good .tn-pill{background:var(--c2-soft)} .hand .tn-metric.bad .tn-pill{background:var(--c4-soft)}

/* --- print: always light, both scenes side by side, 1-2 pages --- */
@page{size:A4 portrait;margin:9mm}
@media print{
  :root:root:root:not(.hand){
    --bg:#ffffff; --surface:#ffffff; --ink:#15151a; --muted:#4b4e57; --line:#c9c6bd; --zone:#f1efe9;
    --c1:#1d4ed8; --c1-soft:#dbe6fd; --c2:#0b7a58; --c2-soft:#d3eee3; --c3:#b45f00; --c3-soft:#fde6c8;
    --c4:#b91c5c; --c4-soft:#fadbe7; --c5:#5b34c4; --c5-soft:#e7defb; --on-accent:#ffffff; --shadow:transparent;
    --mass:#ffffff; --mass-shade:#d6d2c8;
    color-scheme:light;
  }
  html{-webkit-print-color-adjust:exact;print-color-adjust:exact}
  body{background:#fff;font-size:8.6pt;line-height:1.3}
  .page,.hand .page{max-width:none;margin:0;padding:0;box-shadow:none;background:none}
  .theme-toggle,.tn-bar,.tn-hint,.tn-handle,.tn-cap,.steps,.tn-steps-h{display:none!important}
  .eyebrow{display:none}
  h1{font-size:19pt;margin:0 0 2pt}
  h1 .accent{background:none;-webkit-text-fill-color:currentcolor;color:var(--c1)}
  .lede{font-size:9.4pt;max-width:none}
  .chips{margin:5pt 0 0;gap:4pt}.chips li{font-size:7.8pt;padding:2pt 7pt}
  h2{font-size:11.5pt;margin:12pt 0 5pt}
  .tn{margin-top:8pt}
  .tn-panels{gap:8pt}.tn-panel{padding:6pt 10pt;break-inside:avoid;filter:none}
  .tn-panel .tn-y{font-size:24pt;margin:4pt 0 1pt}.tn-panel .tag{font-size:7pt;padding:3pt 6pt}
  .tn-panel h3{font-size:10pt}.tn-panel p{font-size:8pt;margin:2pt 0 0}
  .tn-slider{display:grid;grid-template-columns:1fr 1fr;gap:8pt;aspect-ratio:auto;border:0;background:none;box-shadow:none;margin-top:8pt;overflow:visible;cursor:default}
  .tn-layer{position:relative;inset:auto;height:auto;aspect-ratio:16/9;border:1px solid var(--line);border-radius:8pt}
  .tn-layer.now{clip-path:none;grid-column:2;grid-row:1}
  .tn-layer.then{grid-column:1;grid-row:1}
  .tn-slider .ytag{top:6pt;font-size:8pt;padding:4pt 7pt}
  .tn-slider .ytag.then{left:6pt}
  .tn-slider .ytag.now{right:6pt;left:auto}
  .tn-metrics{border-radius:8pt}
  .tn-head,.tn-metric{padding:5pt 10pt;gap:3pt 10pt;break-inside:avoid}
  .tn-head{font-size:7.2pt;padding-top:4pt;padding-bottom:4pt}
  .tn-lab > svg{width:15pt;height:15pt}.tn-lab b{font-size:9.4pt}.tn-lab small{font-size:7.6pt}
  .tn-val b{font-size:12.5pt}.tn-val small{font-size:7.4pt}
  .tn-pill{font-size:9pt;padding:3pt 7pt}.tn-chg i{font-size:7pt}
  .tn-bars{gap:3pt}.tn-bars .tk{height:6pt}.tn-bars .tk s{transition:none}.tn-bars em{font-size:6.6pt}
  .tn-metrics.focusing .tn-metric:not(.on){opacity:1}.tn-metric.on{background:none}
  .tn-cols,.tn-two{gap:8pt}
  .tn-col,.tn-big,.tn-why{padding:7pt 10pt;break-inside:avoid}
  .tn-col h3{font-size:10pt;margin-bottom:4pt}.tn-col ul{gap:4pt}.tn-col li{font-size:8.4pt}
  .tn-col li svg,.tn-col h3 svg{width:12pt;height:12pt}.tn-col li{grid-template-columns:14pt minmax(0,1fr);gap:5pt}
  .tn-miles{gap:8pt;break-inside:avoid}.tn-miles .yr{font-size:11pt}.tn-miles b{font-size:8.6pt}.tn-miles span.d{font-size:7.8pt}
  .tn-miles li{padding-top:28pt}.tn-miles::before{top:10pt}.tn-miles li::before{top:5pt}
  .tn-big .hl{font-size:15pt}.tn-big p,.tn-why p,.tn-why ul{font-size:8.4pt}
  .tn-src{font-size:7.8pt;gap:3pt}.tn-src .for{font-size:7.4pt}
  .tn-src a::after{content:" (" attr(href) ")";color:var(--muted);font-size:7pt}
  .note{margin-top:8pt;padding-top:5pt;font-size:7.6pt}
  .hand h1{font-size:22pt}.hand h2{font-size:12.5pt;margin:12pt 0 5pt}
  .hand .tn-panel .tn-y{font-size:26pt}.hand .tn-val b{font-size:13pt}.hand .tn-pill{font-size:9.5pt}
  .hand .tn-big .hl{font-size:16pt}.hand .tn-col h3,.hand .tn-panel h3{font-size:11pt}.hand .tn-lab b{font-size:9.6pt}
  .hand .tn-head{font-size:9pt}.hand .tn .lbl{font-size:10pt}.hand .tn-miles .yr{font-size:12pt}
  .hand .tn-panel,.hand .tn-col,.hand .tn-big,.hand .tn-why,.hand .tn-metrics{border-width:1.2pt;box-shadow:none}
  .hand .tn-big{background:none}
}
@media screen and (max-width:760px){
  .tn-panels,.tn-cols,.tn-two{grid-template-columns:1fr}
  .tn-slider .ytag{font-size:11.5px;padding:6px 9px;top:8px}
  .tn-slider .ytag.then{left:8px}.tn-slider .ytag.now{right:8px}
}
@media (prefers-reduced-motion:reduce){.tn-bars .tk s,.tn-metric{transition:none}}
</style>

<body>
<!-- Shared defs: gradients, shadow, arrowheads, icon library. Icons: a use element pointing at an i-* symbol id, e.g. i-sun (see SKILL.md) -->
<svg width="0" height="0" style="position:absolute" aria-hidden="true"><defs>
  <filter id="shadow" x="-20%" y="-20%" width="140%" height="160%"><feDropShadow dx="0" dy="6" stdDeviation="7" style="flood-color:var(--shadow)"/></filter>
  <!-- card fill: surface → soft tint -->
  <linearGradient id="g-c1" x1="0" y1="0" x2="0" y2="1"><stop offset="0" style="stop-color:var(--surface)"/><stop offset="1" style="stop-color:var(--c1-soft)"/></linearGradient>
  <linearGradient id="g-c2" x1="0" y1="0" x2="0" y2="1"><stop offset="0" style="stop-color:var(--surface)"/><stop offset="1" style="stop-color:var(--c2-soft)"/></linearGradient>
  <linearGradient id="g-c3" x1="0" y1="0" x2="0" y2="1"><stop offset="0" style="stop-color:var(--surface)"/><stop offset="1" style="stop-color:var(--c3-soft)"/></linearGradient>
  <linearGradient id="g-c4" x1="0" y1="0" x2="0" y2="1"><stop offset="0" style="stop-color:var(--surface)"/><stop offset="1" style="stop-color:var(--c4-soft)"/></linearGradient>
  <linearGradient id="g-c5" x1="0" y1="0" x2="0" y2="1"><stop offset="0" style="stop-color:var(--surface)"/><stop offset="1" style="stop-color:var(--c5-soft)"/></linearGradient>
  <!-- scene washes: fade = strong at top, rise = strong at bottom -->
  <linearGradient id="fade-c1" x1="0" y1="0" x2="0" y2="1"><stop offset="0" style="stop-color:var(--c1-soft)"/><stop offset="1" style="stop-color:var(--c1-soft);stop-opacity:0"/></linearGradient>
  <linearGradient id="fade-c2" x1="0" y1="0" x2="0" y2="1"><stop offset="0" style="stop-color:var(--c2-soft)"/><stop offset="1" style="stop-color:var(--c2-soft);stop-opacity:.25"/></linearGradient>
  <linearGradient id="fade-c3" x1="0" y1="0" x2="0" y2="1"><stop offset="0" style="stop-color:var(--c3-soft)"/><stop offset="1" style="stop-color:var(--c3-soft);stop-opacity:0"/></linearGradient>
  <linearGradient id="fade-c4" x1="0" y1="0" x2="0" y2="1"><stop offset="0" style="stop-color:var(--c4-soft)"/><stop offset="1" style="stop-color:var(--c4-soft);stop-opacity:0"/></linearGradient>
  <linearGradient id="fade-c5" x1="0" y1="0" x2="0" y2="1"><stop offset="0" style="stop-color:var(--c5-soft)"/><stop offset="1" style="stop-color:var(--c5-soft);stop-opacity:0"/></linearGradient>
  <linearGradient id="rise-c1" x1="0" y1="1" x2="0" y2="0"><stop offset="0" style="stop-color:var(--c1-soft)"/><stop offset="1" style="stop-color:var(--c1-soft);stop-opacity:.2"/></linearGradient>
  <linearGradient id="rise-c2" x1="0" y1="1" x2="0" y2="0"><stop offset="0" style="stop-color:var(--c2-soft)"/><stop offset="1" style="stop-color:var(--c2-soft);stop-opacity:.2"/></linearGradient>
  <linearGradient id="rise-c3" x1="0" y1="1" x2="0" y2="0"><stop offset="0" style="stop-color:var(--c3-soft)"/><stop offset="1" style="stop-color:var(--c3-soft);stop-opacity:.2"/></linearGradient>
  <linearGradient id="rise-c4" x1="0" y1="1" x2="0" y2="0"><stop offset="0" style="stop-color:var(--c4-soft)"/><stop offset="1" style="stop-color:var(--c4-soft);stop-opacity:.2"/></linearGradient>
  <linearGradient id="rise-c5" x1="0" y1="1" x2="0" y2="0"><stop offset="0" style="stop-color:var(--c5-soft)"/><stop offset="1" style="stop-color:var(--c5-soft);stop-opacity:.2"/></linearGradient>
  <!-- arrowheads: one per colour (markers don't inherit the path colour) -->
  <marker id="arr"    viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1 L9 5 L1 9 z" style="fill:var(--muted)"/></marker>
  <marker id="arr-c1" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1 L9 5 L1 9 z" style="fill:var(--c1)"/></marker>

<script>
/* ===== /thenvsnow engine =====
   Reads the content markup and builds what the data describes:
   - <div class="tn" data-then-year data-now-year> : the two years being compared;
   - .tn-slider (two svg.tn-layer.then / .now): a draggable, keyboard-accessible before/after slider (handle, year tags);
   - .tn-metric[data-label data-then data-now ...]: renders both values, the % or x change (computed here, never typed),
     colour by better/worse (data-better), a bar pair, a source number and screen-reader text;
   - #tn-m-pct / #tn-m-x: show change as % or x;   #tn-play / #tn-prev / #tn-next + ol.steps + [data-step]: walkthrough;
   - .tn-fill[data-of data-show]: fills computed numbers into prose; ol.tn-miles: adds the start and end years;
   - <div class="tn" data-style="handwritten"> turns on the notebook look and loads the two handwriting fonts.
   Exposes window.__tnReady / __tnErrors / __tnModel for the validator. No dependencies. */
(() => {
  const errors = window.__tnErrors = [], model = window.__tnModel = [];
  const root = document.documentElement, tn = document.querySelector('.tn');
  const hand = !!tn && /hand/i.test(tn.dataset.style || '');
  if (hand) root.classList.add('hand');
  window.__tnReady = !hand ? Promise.resolve() : new Promise(res => {
    const l = document.createElement('link'); l.rel = 'stylesheet';
    l.href = 'https://fonts.googleapis.com/css2?family=Caveat:wght@400;700&family=Kalam:wght@400;700&display=swap';
    l.onload = () => Promise.all(['400 16px Kalam', '700 16px Kalam', '700 32px Caveat'].map(f => document.fonts.load(f))).catch(() => {}).then(res);
    l.onerror = res; document.head.appendChild(l);
    setTimeout(res, 2500);                      // offline: carry on with the fallback font
  });
  if (!tn) { errors.push('no .tn container found'); return; }

  const MINUS = '−', TIMES = '×';
  const UNITS = { B: ['bytes', 1], KB: ['bytes', 1e3], MB: ['bytes', 1e6], GB: ['bytes', 1e9], TB: ['bytes', 1e12],
    KiB: ['bytes', 1024], MiB: ['bytes', 1048576], GiB: ['bytes', 1073741824], TiB: ['bytes', 1099511627776],
    g: ['mass', 1], kg: ['mass', 1000], lb: ['mass', 453.59237], oz: ['mass', 28.349523125],
    Hz: ['freq', 1], kHz: ['freq', 1e3], MHz: ['freq', 1e6], GHz: ['freq', 1e9],
    mm: ['len', 1], cm: ['len', 10], m: ['len', 1000], km: ['len', 1e6], in: ['len', 25.4], ft: ['len', 304.8], mi: ['len', 1609344],
    s: ['time', 1], min: ['time', 60], h: ['time', 3600] };
  const num = s => { const t = String(s == null ? '' : s).replace(/,/g, '').trim(); const n = Number(t); return t !== '' && Number.isFinite(n) ? n : NaN; };
  const decs = s => { const m = String(s).replace(/,/g, '').match(/\.(\d+)/); return m ? Math.min(4, m[1].length) : 0; };
  const fmt = (v, d) => v.toLocaleString('en-US', { minimumFractionDigits: d, maximumFractionDigits: d });
  const compact = v => v >= 1e6 ? (v / 1e6).toFixed(1).replace(/\.0$/, '') + 'M' : v >= 1e5 ? Math.round(v / 1e3) + 'K' : fmt(Math.round(v), 0);
  const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
  const ty = tn.dataset.thenYear || '', ny = tn.dataset.nowYear || '';

  /* ---------- the change, computed from the data ---------- */
  const pctText = p => { const a = Math.abs(p), s = p < 0 ? MINUS : '+';
    return s + (a >= 1e5 ? compact(a) : a >= 1000 ? fmt(Math.round(a), 0) : a.toFixed(1)) + '%'; };
  const xText = r => (r >= 1e6 ? compact(r) : r >= 1000 ? fmt(Math.round(r), 0) : r >= 100 ? fmt(Math.round(r), 0) : r >= 10 ? r.toFixed(1) : r >= 1 ? r.toFixed(2) : r >= 0.1 ? r.toFixed(2) : r.toPrecision(2)) + TIMES;
  const spoken = (m) => {
    const up = m.pct >= 0, a = Math.abs(m.pct);
    const pc = a >= 1000 ? fmt(Math.round(a), 0) : a.toFixed(1);
    const verdict = m.cls === 'good' ? ' That is better.' : m.cls === 'bad' ? ' That is worse.' : '';
    return `${m.label}: ${m.thenTxt} in ${ty}, ${m.nowTxt} in ${ny}. ${up ? 'Up' : 'Down'} ${pc} percent, which is ${m.ratio >= 1 ? m.ratio.toPrecision(3) + ' times as much' : m.ratio.toPrecision(2) + ' times as much'}.${verdict}`;
  };

  /* ---------- metric rows ---------- */
  const box = tn.querySelector('.tn-metrics');
  const els = [...tn.querySelectorAll('.tn-metric')];
  const arrowUp = '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 19V5M5 12l7-7 7 7" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></svg>';
  const arrowDn = '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12l7 7 7-7" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></svg>';
  els.forEach((el, i) => {
    const d = el.dataset, label = d.label || ('metric ' + (i + 1));
    const tv = num(d.then), nv = num(d.now);
    const m = { el, id: d.id || '', label, ok: false };
    model.push(m);
    if (!d.label) errors.push(`metric ${i + 1}: missing data-label`);
    if (Number.isNaN(tv) || Number.isNaN(nv)) { errors.push(`metric "${label}": data-then / data-now is not a number (then="${d.then}", now="${d.now}")`); el.classList.add('neutral'); return; }
    const uT = d.thenUnit || d.unit || '', uN = d.nowUnit || d.unit || '';
    let fT = 1, fN = 1;
    if (uT !== uN) {
      const a = UNITS[uT], b = UNITS[uN];
      if (!a || !b || a[0] !== b[0]) { errors.push(`metric "${label}": the two units differ ("${uT}" vs "${uN}") and cannot be converted - use one unit`); return; }
      fT = a[1]; fN = b[1];
    }
    const bt = tv * fT, bn = nv * fN;
    if (bt === 0) { errors.push(`metric "${label}": the THEN value is 0, so a % change is undefined - use another measure`); return; }
    if (bt < 0 || bn < 0) { errors.push(`metric "${label}": negative values are not supported`); return; }
    const ratio = bn / bt, pct = (ratio - 1) * 100;
    const better = (d.better || 'neutral').toLowerCase();
    if (!['higher', 'lower', 'neutral'].includes(better)) errors.push(`metric "${label}": data-better must be higher, lower or neutral`);
    const cls = better === 'neutral' || Math.abs(pct) < 0.05 ? 'neutral' : ((pct > 0) === (better === 'higher') ? 'good' : 'bad');
    const decO = d.dec != null && d.dec !== '' ? Math.max(0, +d.dec) : null, decT = decO ?? decs(d.then), decN = decO ?? decs(d.now), dec = Math.max(decT, decN);
    const pre = d.pre || '', ap = (d.approx || '').toLowerCase();
    const mk = (v, side) => (ap === side || ap === 'both' || ap === 'yes' ? '≈' : '') + pre + fmt(v, side === 'then' ? decT : decN);
    const dispT = d.thenDisp || uT, dispN = d.nowDisp || uN;
    const valT = mk(tv, 'then'), valN = mk(nv, 'now');
    const thenTxt = valT + (dispT ? ' ' + dispT : ''), nowTxt = valN + (dispN ? ' ' + dispN : '');
    Object.assign(m, { ok: true, then: tv, now: nv, ratio, pct, cls, thenTxt, nowTxt, better, dec });

    // bars: linear unless the gap is huge (then log, and say so)
    let log = d.bars === 'log' || (d.bars !== 'linear' && (ratio > 200 || ratio < 1 / 200));
    const hi = Math.max(bt, bn), lo = Math.min(bt, bn);
    const w = v => log ? (Math.log10(v / (lo / 10)) / Math.log10(hi / (lo / 10))) * 100 : (v / hi) * 100;
    const wt = Math.max(1.5, w(bt)), wn = Math.max(1.5, w(bn));

    const refs = (d.src || '').split(/[,\s]+/).filter(Boolean).map(n => `<a href="#src-${esc(n)}" title="Source ${esc(n)}" aria-label="Source ${esc(n)}">${esc(n)}</a>`).join(',');
    const icon = d.icon ? `<svg aria-hidden="true"><use href="#i-${esc(d.icon)}"/></svg>` : '';
    el.classList.add(cls);
    el.innerHTML = `<div class="tn-lab">${icon}<div><b>${esc(label)}${refs ? `<sup class="tn-ref">${refs}</sup>` : ''}</b>${d.note ? `<small>${esc(d.note)}</small>` : ''}</div></div>
      <div class="tn-val then" data-y="${esc(ty)}"><b>${esc(valT)}</b><small>${esc(dispT)}</small></div>
      <div class="tn-chg"><span class="tn-pill"><i class="ar"></i><span class="tn-ct"></span></span><i class="tn-vd"></i></div>
      <div class="tn-val now" data-y="${esc(ny)}"><b>${esc(valN)}</b><small>${esc(dispN)}</small></div>
      <div class="tn-bars" aria-hidden="true"><span class="tk then"><s style="--w:${wt.toFixed(1)}%"></s></span><span class="tk now"><s style="--w:${wn.toFixed(1)}%"></s></span>${log ? '<em>log scale</em>' : ''}</div>
      <p class="sr-only">${esc(spoken(m))}</p>`;
    el.querySelector('.tn-vd').textContent = cls === 'good' ? 'better' : cls === 'bad' ? 'worse' : '';
    const ar = el.querySelector('.ar'); ar.outerHTML = pct >= 0 ? arrowUp : arrowDn;
    m.ct = el.querySelector('.tn-ct');
  });

  /* column header row */
  if (box && els.length) {
    const h = document.createElement('div'); h.className = 'tn-head'; h.setAttribute('aria-hidden', 'true');
    h.innerHTML = `<span>Measure</span><span class="then">Then · ${esc(ty)}</span><span class="chg">Change</span><span class="now">Now · ${esc(ny)}</span><span>Scale</span>`;
    box.insertBefore(h, box.firstChild);
    requestAnimationFrame(() => { box.classList.add('pre'); requestAnimationFrame(() => box.classList.remove('pre')); });
  }

  /* ---------- % / x toggle ---------- */
  let mode = 'pct';
  const bP = document.getElementById('tn-m-pct'), bX = document.getElementById('tn-m-x');
  const render = () => {
    model.forEach(m => { if (m.ok && m.ct) m.ct.textContent = mode === 'x' ? xText(m.ratio) : pctText(m.pct); });
    if (bP) bP.setAttribute('aria-pressed', String(mode === 'pct'));
    if (bX) bX.setAttribute('aria-pressed', String(mode === 'x'));
    tn.dataset.mode = mode;
  };
  if (bP) bP.addEventListener('click', () => { mode = 'pct'; render(); });
  if (bX) bX.addEventListener('click', () => { mode = 'x'; render(); });
  render();

  /* ---------- prose fills ---------- */
  tn.querySelectorAll('.tn-fill').forEach(f => {
    const m = model.find(x => x.id && x.id === f.dataset.of), s = f.dataset.show || 'pct';
    if (!m || !m.ok) { errors.push(`.tn-fill: no usable metric with data-id="${f.dataset.of}"`); return; }
    f.textContent = s === 'then' ? m.thenTxt : s === 'now' ? m.nowTxt : s === 'x' ? xText(m.ratio) : s === 'pct' ? pctText(m.pct) : s === 'abs' ? pctText(m.pct).replace(/^[+−]/, '') : (errors.push('.tn-fill: data-show must be then, now, pct, abs or x'), '');
  });

  /* ---------- milestones: add the start and end years ---------- */
  const miles = tn.querySelector('.tn-miles');
  if (miles && ty && ny) {
    const cap = (y, t, last) => { const li = document.createElement('li'); li.className = 'cap'; li.innerHTML = `<span class="yr">${esc(y)}</span><b>${t}</b>`; return li; };
    miles.insertBefore(cap(ty, 'Then', false), miles.firstChild); miles.appendChild(cap(ny, 'Now', true));
    miles.querySelectorAll('li:not(.cap)').forEach(li => {
      if (li.dataset.year && !li.querySelector('.yr')) li.insertAdjacentHTML('afterbegin', `<span class="yr">${esc(li.dataset.year)}</span>`);
      const r = (li.dataset.src || '').split(/[,\s]+/).filter(Boolean).map(n => `<a href="#src-${esc(n)}" title="Source ${esc(n)}" aria-label="Source ${esc(n)}">${esc(n)}</a>`).join(',');
      if (r && li.querySelector('b')) li.querySelector('b').insertAdjacentHTML('beforeend', `<sup class="tn-ref">${r}</sup>`);
    });
  }

  /* ---------- before / after slider ---------- */
  const sl = tn.querySelector('.tn-slider');
  let setPos = () => {};
  if (sl) {
    sl.insertAdjacentHTML('beforeend', `<span class="ytag then" aria-hidden="true">THEN · ${esc(ty)}</span><span class="ytag now" aria-hidden="true">NOW · ${esc(ny)}</span>
      <div class="tn-handle" role="slider" tabindex="0" aria-label="Compare ${esc(ty)} with ${esc(ny)}" aria-orientation="horizontal" aria-valuemin="0" aria-valuemax="100" aria-valuenow="50">
        <span class="tn-knob"><svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true"><path d="M9 6l-6 6 6 6M15 6l6 6-6 6" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></svg></span></div>`);
    const h = sl.querySelector('.tn-handle'); let pos = 50;
    setPos = p => {
      pos = Math.max(0, Math.min(100, p)); sl.style.setProperty('--pos', pos + '%');
      h.setAttribute('aria-valuenow', String(Math.round(pos)));
      h.setAttribute('aria-valuetext', pos <= 2 ? `Showing ${ty} only` : pos >= 98 ? `Showing ${ny} only` : `${Math.round(pos)} percent: ${ty} on the left, ${ny} on the right`);
    };
    const fromEvent = e => { const r = sl.getBoundingClientRect(); setPos((e.clientX - r.left) / r.width * 100); };
    let drag = false;
    sl.addEventListener('pointerdown', e => { drag = true; try { sl.setPointerCapture(e.pointerId); } catch (x) {} fromEvent(e); h.focus({ preventScroll: true }); });
    sl.addEventListener('pointermove', e => { if (drag) fromEvent(e); });
    const end = e => { drag = false; try { sl.releasePointerCapture(e.pointerId); } catch (x) {} };
    sl.addEventListener('pointerup', end); sl.addEventListener('pointercancel', end);
    h.addEventListener('keydown', e => {
      const k = e.key, step = e.shiftKey ? 1 : 5;
      if (k === 'ArrowLeft' || k === 'ArrowDown') setPos(pos - step);
      else if (k === 'ArrowRight' || k === 'ArrowUp') setPos(pos + step);
      else if (k === 'PageDown') setPos(pos - 20); else if (k === 'PageUp') setPos(pos + 20);
      else if (k === 'Home') setPos(0); else if (k === 'End') setPos(100);
      else return;
      e.preventDefault();
    });
    setPos(50);
  }

  /* ---------- walkthrough over the rows ---------- */
  const items = [...document.querySelectorAll('ol.steps > li')], N = items.length;
  const pBtn = document.getElementById('tn-play'), prev = document.getElementById('tn-prev'), next = document.getElementById('tn-next'), cap = document.getElementById('tn-cap');
  let cur = 0, pinned = null, playing = false, timer = null;
  const targets = n => [...tn.querySelectorAll('[data-step]')].filter(el => el.dataset.step.split(/\s+/).includes(String(n)));
  const set = n => {
    if (box) box.classList.toggle('focusing', n != null);
    tn.querySelectorAll('[data-step]').forEach(el => el.classList.toggle('on', n != null && el.dataset.step.split(/\s+/).includes(String(n))));
    items.forEach((li, i) => li.classList.toggle('on', n === i + 1));
  };
  const title = li => (li.querySelector('b')?.textContent || '').trim();
  const body = li => (li.querySelector('span')?.textContent || li.textContent.replace(title(li), '')).trim();
  const dur = li => Math.min(8000, Math.max(3200, body(li).split(/\s+/).length * 260));
  const idle = () => { if (cap) cap.innerHTML = N ? `<span class="pl-n">${N} steps</span> Press Play to go through the numbers one by one.` : ''; };
  const show = n => {
    cur = n; pinned = n || null; set(pinned);
    if (!cap) return;
    if (!n) { idle(); return; }
    cap.innerHTML = `<span class="pl-n">${n} / ${N}</span><b>${esc(title(items[n - 1]))}</b> ${esc(body(items[n - 1]))}`;
    if (playing) { const t = targets(n)[0]; if (t && t.scrollIntoView) t.scrollIntoView({ block: 'nearest', behavior: 'smooth' }); }
  };
  const PLAY = '▶ Play walkthrough', PAUSE = '❚❚ Pause';
  const stop = () => { playing = false; clearTimeout(timer); if (pBtn) { pBtn.textContent = PLAY; pBtn.setAttribute('aria-pressed', 'false'); } };
  const tick = () => {
    if (cur >= N) { stop(); show(0); if (cap) cap.innerHTML = `<span class="pl-n">done</span><b>That is all ${N} steps.</b> Press Play to watch again.`; return; }
    show(cur + 1); timer = setTimeout(tick, dur(items[cur - 1]));
  };
  const play = () => { playing = true; if (pBtn) { pBtn.textContent = PAUSE; pBtn.setAttribute('aria-pressed', 'true'); } if (cur >= N) cur = 0; tick(); };
  const go = n => { stop(); show(Math.max(1, Math.min(N, n))); };
  if (pBtn) { pBtn.textContent = PLAY; pBtn.addEventListener('click', () => playing ? stop() : play()); }
  if (prev) prev.addEventListener('click', () => go((cur || 2) - 1));
  if (next) next.addEventListener('click', () => go(cur + 1));
  idle();
  items.forEach((li, i) => {
    li.tabIndex = 0;
    li.addEventListener('mouseenter', () => set(i + 1)); li.addEventListener('mouseleave', () => set(pinned));
    li.addEventListener('focus', () => set(i + 1)); li.addEventListener('blur', () => set(pinned));
    li.addEventListener('click', () => { if (pinned === i + 1) { stop(); show(0); } else go(i + 1); });
  });
  els.forEach(el => {
    if (!el.dataset.step) return;
    el.addEventListener('mouseenter', () => { if (!playing) set(+el.dataset.step.split(/\s+/)[0]); });
    el.addEventListener('mouseleave', () => { if (!playing) set(pinned); });
  });
})();
</script>
</body>
</html>
