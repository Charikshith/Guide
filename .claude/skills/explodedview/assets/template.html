<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>{{TITLE}}</title>
<script>
/* Theme: opens in Deep dark; the ☀/☾ button switches to light and remembers it (the device's dark mode is ignored). */
(function () {
  var d = document.documentElement;
  try { var t = localStorage.getItem('vs-theme'); if (t === 'light' || t === 'dark') d.setAttribute('data-theme', t); } catch (e) {}
  document.addEventListener('DOMContentLoaded', function () {
    var b = document.querySelector('.theme-toggle'); if (!b) return;
    var sync = function () {
      var light = d.getAttribute('data-theme') === 'light';
      b.textContent = light ? '☾' : '☀';
      b.setAttribute('aria-label', light ? 'Switch to dark theme' : 'Switch to light theme');
      b.title = light ? 'Dark theme' : 'Light theme';
    };
    sync();
    b.addEventListener('click', function () {
      var next = d.getAttribute('data-theme') === 'light' ? 'dark' : 'light';
      d.setAttribute('data-theme', next);
      try { localStorage.setItem('vs-theme', next); } catch (e) {}
      sync();
    });
  });
})();
</script>
<style>
/* ===== Tokens — default theme: Deep dark. Colours carry meaning: c1..c5 are the only accent families ===== */
:root{
  --bg:#0f1013; --surface:#1a1b20; --ink:#ededf1; --muted:#a4a6b0; --line:#34363e; --zone:#202228;
  --c1:#7aa7ff; --c1-soft:#1b2846;   /* blue   */
  --c2:#40d0a0; --c2-soft:#13332a;   /* green  */
  --c3:#f4a94e; --c3-soft:#3a2912;   /* amber  */
  --c4:#f472a8; --c4-soft:#3d1729;   /* rose   */
  --c5:#ab8dff; --c5-soft:#291f47;   /* violet */
  --on-accent:#0f1013;
  --shadow:rgba(0,0,0,.55); --mass:#555b69; --mass-shade:#383c46;
  --font:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  --mono:ui-monospace,"Cascadia Code",Consolas,Menlo,monospace;
  --r:18px;
  color-scheme:dark;
}
/* ===== Light theme (Warm paper) — via the ☀ button ===== */
:root[data-theme="light"]{
  --bg:#f4f2ec; --surface:#ffffff; --ink:#18181b; --muted:#5b5e66; --line:#d9d5cb; --zone:#ece9e1;
  --c1:#2563eb; --c1-soft:#dce7fe; --c2:#0b8a64; --c2-soft:#d2f0e4; --c3:#c76a00; --c3-soft:#fde8cc;
  --c4:#c8246b; --c4-soft:#fcdfea; --c5:#6c3fd8; --c5-soft:#e9e1fd; --on-accent:#ffffff;
  --shadow:rgba(30,25,15,.16); --mass:#ffffff; --mass-shade:#d6d2c8;
  color-scheme:light;
}
.theme-toggle{position:fixed;top:14px;right:14px;z-index:20;width:42px;height:42px;border-radius:50%;
  border:1px solid var(--line);background:var(--surface);color:var(--ink);font-size:19px;line-height:1;cursor:pointer;
  box-shadow:0 6px 16px -8px var(--shadow);transition:transform .15s}
.theme-toggle:hover{transform:scale(1.07)}
.theme-toggle:focus-visible{outline:2px solid var(--c1);outline-offset:2px}
.hand .theme-toggle{display:none}   /* handwritten style is always paper */
@media print{.theme-toggle{display:none}}

*,*::before,*::after{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.55 var(--font);-webkit-font-smoothing:antialiased}
body::before{ /* soft colour glow behind the header */
  content:"";position:fixed;inset:0 0 auto 0;height:520px;z-index:-1;pointer-events:none;
  background:radial-gradient(60% 80% at 15% 0%,var(--c1-soft),transparent 70%),
             radial-gradient(50% 70% at 90% 10%,var(--c5-soft),transparent 70%);
  opacity:.9}
.page{max-width:1040px;margin:0 auto;padding:44px 24px 56px}
@media (max-width:600px){.page{padding:24px 16px 40px}}

/* ===== Header ===== */
.eyebrow{display:inline-flex;align-items:center;gap:8px;margin:0 0 14px;padding:6px 12px 6px 10px;border-radius:999px;
  background:var(--surface);border:1px solid var(--line);font:600 12px/1 var(--font);letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.eyebrow::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--c1);box-shadow:0 0 0 3px var(--c1-soft)}
h1{font-size:clamp(30px,5vw,48px);line-height:1.08;letter-spacing:-.025em;margin:0 0 12px;font-weight:800}
h1 .accent{background:linear-gradient(90deg,var(--c1),var(--c5));-webkit-background-clip:text;background-clip:text;color:transparent}
.lede{font-size:18px;color:var(--muted);max-width:66ch;margin:0}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin:18px 0 0;padding:0;list-style:none}
.chips li{background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:5px 12px;font-size:14px;color:var(--muted)}
.chips b{color:var(--ink);font-weight:700}
h2{font-size:20px;letter-spacing:-.01em;margin:44px 0 14px;display:flex;align-items:center;gap:10px}
h2::after{content:"";flex:1;height:1px;background:var(--line)}

/* ===== Main visual ===== */
.stage{position:relative;margin:28px 0 0;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);
  padding:18px;overflow-x:auto;box-shadow:0 1px 2px var(--shadow),0 18px 40px -24px var(--shadow)}
.stage::before{ /* faint dot grid */
  content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;opacity:.55;
  background:radial-gradient(circle,var(--line) 1px,transparent 1.4px) 0 0/22px 22px}
.stage > svg{position:relative;display:block;width:100%;height:auto;overflow:visible}
.stage figcaption{position:relative;font-size:14px;color:var(--muted);margin-top:12px}
@media (max-width:600px){.stage{padding:12px}.stage > svg{min-width:640px}.stage figcaption{position:sticky;left:0}}
.scroll-hint{display:none;font-size:13px;color:var(--muted);margin:8px 0 0}
@media (max-width:600px){.scroll-hint{display:block}}

/* --- SVG vocabulary: use these classes, never hard-coded colours --- */
.node{fill:var(--surface);stroke:var(--line);stroke-width:1.5}
.node.c1{fill:url(#g-c1);stroke:var(--c1)} .node.c2{fill:url(#g-c2);stroke:var(--c2)}
.node.c3{fill:url(#g-c3);stroke:var(--c3)} .node.c4{fill:url(#g-c4);stroke:var(--c4)}
.node.c5{fill:url(#g-c5);stroke:var(--c5)}
.node.solid.c1{fill:var(--c1)} .node.solid.c2{fill:var(--c2)} .node.solid.c3{fill:var(--c3)}
.node.solid.c4{fill:var(--c4)} .node.solid.c5{fill:var(--c5)}
.lift{filter:url(#shadow)}                          /* soft drop shadow: put on a <g> or shape */
.chip{stroke:none} .chip.c1{fill:var(--c1)} .chip.c2{fill:var(--c2)} .chip.c3{fill:var(--c3)} .chip.c4{fill:var(--c4)} .chip.c5{fill:var(--c5)}
.ico{color:var(--ink)} .ico.on{color:var(--on-accent)}
.ico.c1{color:var(--c1)} .ico.c2{color:var(--c2)} .ico.c3{color:var(--c3)} .ico.c4{color:var(--c4)} .ico.c5{color:var(--c5)} .ico.muted{color:var(--muted)}
.zone{fill:var(--zone);stroke:var(--line);stroke-width:1;stroke-dasharray:5 5;fill-opacity:.7}
/* scene shapes (sky, ground, sea, body outline …): soft fills that fade */
.wash{stroke:none} .wash.c1{fill:url(#fade-c1)} .wash.c2{fill:url(#fade-c2)} .wash.c3{fill:url(#fade-c3)}
.wash.c4{fill:url(#fade-c4)} .wash.c5{fill:url(#fade-c5)} .wash.up.c1{fill:url(#rise-c1)} .wash.up.c2{fill:url(#rise-c2)}
.wash.up.c3{fill:url(#rise-c3)} .wash.up.c4{fill:url(#rise-c4)} .wash.up.c5{fill:url(#rise-c5)}
.wash.line{stroke-width:2} .wash.line.c1{stroke:var(--c1)} .wash.line.c2{stroke:var(--c2)} .wash.line.c3{stroke:var(--c3)}
.mass{fill:var(--mass);stroke:none} .mass.shade{fill:var(--mass-shade)}   /* solid soft blobs: clouds, organs, objects */
.edge{fill:none;stroke:var(--muted);stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.edge.c1{stroke:var(--c1)} .edge.c2{stroke:var(--c2)} .edge.c3{stroke:var(--c3)} .edge.c4{stroke:var(--c4)} .edge.c5{stroke:var(--c5)}
.edge.dash{stroke-dasharray:6 7}
.edge.thick{stroke-width:3.5}
.edge.flow{stroke-dasharray:7 9;animation:march 1.1s linear infinite}   /* marching dashes = something is moving */
@keyframes march{to{stroke-dashoffset:-16}}
.particle{stroke:var(--surface);stroke-width:1.5} .particle.c1{fill:var(--c1)} .particle.c2{fill:var(--c2)}
.particle.c3{fill:var(--c3)} .particle.c4{fill:var(--c4)} .particle.c5{fill:var(--c5)}
.spin{transform-box:fill-box;transform-origin:center;animation:spin 24s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.pulse{transform-box:fill-box;transform-origin:center;animation:pulse 2.4s ease-in-out infinite}
@keyframes pulse{50%{transform:scale(1.06)}}
.leader{fill:none;stroke:var(--muted);stroke-width:1.2}
.dot{fill:var(--muted)}
.t{font:600 16px var(--font);fill:var(--ink)}
.t.sub{font-weight:400;font-size:14px;fill:var(--muted)}
.t.big{font-size:20px;font-weight:800}
.t.small{font-size:13px;font-weight:600;fill:var(--muted)}
.t.on{fill:var(--on-accent)}
.t.c1{fill:var(--c1)} .t.c2{fill:var(--c2)} .t.c3{fill:var(--c3)} .t.c4{fill:var(--c4)} .t.c5{fill:var(--c5)}
.t.mono{font-family:var(--mono)}
.t.halo{paint-order:stroke;stroke:var(--surface);stroke-width:5px;stroke-linejoin:round}  /* readable over scenes/lines */
.badge circle{fill:var(--ink);stroke:var(--surface);stroke-width:2.5} .badge text{font:800 13px var(--font);fill:var(--surface)}
.badge.c1 circle{fill:var(--c1)} .badge.c2 circle{fill:var(--c2)} .badge.c3 circle{fill:var(--c3)}
.badge.c4 circle{fill:var(--c4)} .badge.c5 circle{fill:var(--c5)}
/* step focus (wired up by the script at the bottom) */
[data-step]{transition:opacity .25s}
svg.focusing [data-step]:not(.on){opacity:.18}
@media (prefers-reduced-motion:reduce){.edge.flow,.spin,.pulse{animation:none}.particle{display:none}}

/* ===== Walkthrough player (inserted by the script; no markup needed) ===== */
.player{position:relative;display:flex;flex-wrap:wrap;align-items:center;gap:10px 12px;margin-top:14px;padding:10px 14px 10px 10px;
  border:1px solid var(--line);border-radius:14px;background:var(--bg)}
@media (max-width:600px){.player{position:sticky;left:0}}
.player button{font:inherit;cursor:pointer}
.player button:focus-visible{outline:2px solid var(--c1);outline-offset:2px}
.pl-play{flex:none;width:42px;height:42px;border-radius:50%;border:0;background:var(--ink);color:var(--surface);display:grid;place-items:center;
  box-shadow:0 6px 16px -8px var(--shadow);transition:transform .15s}
.pl-play:hover{transform:scale(1.06)}
.pl-play svg{margin-left:2px} .player.playing .pl-play svg{margin-left:0}
.pl-nav{flex:none;width:32px;height:32px;border-radius:50%;border:1px solid var(--line);background:var(--surface);color:var(--ink);padding:0;display:grid;place-items:center}
.pl-track{display:flex;gap:4px;flex:none}
.pl-seg{width:34px;height:20px;padding:0;border:0;background:none;color:var(--ink)}
.pl-seg.c1{color:var(--c1)} .pl-seg.c2{color:var(--c2)} .pl-seg.c3{color:var(--c3)} .pl-seg.c4{color:var(--c4)} .pl-seg.c5{color:var(--c5)}
.pl-seg i{display:block;height:6px;border-radius:3px;background:var(--line);overflow:hidden}
.pl-seg s{display:block;height:100%;width:0;background:currentColor;text-decoration:none}
.pl-seg.done s,.pl-seg.active s{width:100%}
.player.playing .pl-seg.active s{animation:pl-fill var(--dur,4s) linear}
@keyframes pl-fill{from{width:0}to{width:100%}}
.pl-cap{flex:1 1 300px;margin:0;font-size:15px;line-height:1.45;color:var(--muted);min-height:44px;display:flex;flex-wrap:wrap;align-items:center;gap:0 6px}
.pl-cap b{color:var(--ink)}
.pl-n{font:700 12px/1 var(--font);letter-spacing:.06em;text-transform:uppercase;color:var(--surface);background:var(--muted);padding:4px 7px;border-radius:999px}
@media print{.player{display:none}}

/* ===== Reading guide: numbered steps that match the badges ===== */
.steps{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(auto-fit,minmax(176px,1fr));gap:12px;counter-reset:s}
.steps li{counter-increment:s;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px 16px 16px 54px;position:relative;
  cursor:default;transition:transform .2s,box-shadow .2s,border-color .2s;outline:none}
.steps li::before{content:counter(s);position:absolute;left:14px;top:15px;width:26px;height:26px;border-radius:50%;
  background:var(--ink);color:var(--surface);font:800 13px/26px var(--font);text-align:center}
.steps li.c1::before{background:var(--c1)} .steps li.c2::before{background:var(--c2)} .steps li.c3::before{background:var(--c3)}
.steps li.c4::before{background:var(--c4)} .steps li.c5::before{background:var(--c5)}
.steps li.on,.steps li:hover,.steps li:focus-visible{transform:translateY(-2px);border-color:var(--muted);box-shadow:0 10px 24px -14px var(--shadow)}
.steps b{display:block;margin-bottom:2px}
.steps span{color:var(--muted);font-size:15px}

/* ===== Takeaways ===== */
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:12px}
.card{position:relative;overflow:hidden;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px 16px 16px 60px}
.card::before{content:"";position:absolute;inset:0 auto 0 0;width:4px;background:var(--c1)}
.card svg{position:absolute;left:18px;top:17px;width:26px;height:26px;color:var(--c1)}
.card.c2::before{background:var(--c2)} .card.c3::before{background:var(--c3)} .card.c4::before{background:var(--c4)} .card.c5::before{background:var(--c5)}
.card.c2 svg{color:var(--c2)} .card.c3 svg{color:var(--c3)} .card.c4 svg{color:var(--c4)} .card.c5 svg{color:var(--c5)}
.card b{display:block;margin-bottom:2px}
.card p{margin:0;color:var(--muted)}

/* ===== Legend ===== */
.legend{display:flex;flex-wrap:wrap;gap:8px 20px;margin:14px 0 0;padding:0;list-style:none;font-size:14px;color:var(--muted)}
.legend li{display:flex;align-items:center;gap:8px}
.sw{width:14px;height:14px;border-radius:4px;border:1.5px solid var(--line);background:var(--surface)}
.sw.c1{background:var(--c1-soft);border-color:var(--c1)} .sw.c2{background:var(--c2-soft);border-color:var(--c2)}
.sw.c3{background:var(--c3-soft);border-color:var(--c3)} .sw.c4{background:var(--c4-soft);border-color:var(--c4)}
.sw.c5{background:var(--c5-soft);border-color:var(--c5)}
.sw.line{height:3px;border:0;border-radius:2px;background:var(--muted)}
.sw.line.c1{background:var(--c1)} .sw.line.c2{background:var(--c2)} .sw.line.c3{background:var(--c3)}
.sw.line.c4{background:var(--c4)} .sw.line.c5{background:var(--c5)}

/* ===== Footnote ===== */
.note{margin-top:32px;padding-top:14px;border-top:1px solid var(--line);font-size:14px;color:var(--muted)}
code{font-family:var(--mono);font-size:.92em;background:var(--zone);padding:1px 5px;border-radius:5px}

@media print{body{background:#fff}body::before{display:none}.stage,.steps li,.card{break-inside:avoid;box-shadow:none}}

/* ===== Exploded view (parts are drawn by the author; the engine script moves them) ===== */
.c0{--pc:var(--muted)} .c1{--pc:var(--c1)} .c2{--pc:var(--c2)} .c3{--pc:var(--c3)} .c4{--pc:var(--c4)} .c5{--pc:var(--c5)}
/* part faces: opaque, tinted by the part's colour (--pc), so parts hide what is behind them. --vk multiplies the tint (dark chips) */
.ev-dark{--pc:#3b414e;--vk:3.4} .ev-metal{--pc:#9aa3b2}
.pf,.iso-t,.iso-l,.iso-r{stroke:color-mix(in srgb,var(--pc,var(--muted)) 62%,#000);stroke-width:1.1;stroke-linejoin:round;stroke-linecap:round}
.pf{fill:color-mix(in srgb,var(--pc,var(--muted)) min(100%,calc(30% * var(--vk,1))),var(--surface))}
.pf.lt{fill:color-mix(in srgb,var(--pc,var(--muted)) min(100%,calc(13% * var(--vk,1))),var(--surface))}
.pf.dk{fill:color-mix(in srgb,var(--pc,var(--muted)) min(100%,calc(58% * var(--vk,1))),var(--surface))}
.pf.hole{fill:var(--bg)}
.iso-t{fill:color-mix(in srgb,var(--pc,var(--muted)) min(100%,calc(20% * var(--vk,1))),var(--surface))}
.iso-l{fill:color-mix(in srgb,var(--pc,var(--muted)) min(100%,calc(40% * var(--vk,1))),var(--surface))}
.iso-r{fill:color-mix(in srgb,var(--pc,var(--muted)) min(100%,calc(60% * var(--vk,1))),var(--surface))}
.ev-edge{fill:none;stroke:color-mix(in srgb,var(--pc,var(--muted)) 62%,#000);stroke-width:1.1;stroke-linejoin:round;stroke-linecap:round}
.ev-sh{fill:var(--shadow);stroke:none;opacity:.8;filter:url(#ev-blur);pointer-events:none}
.ev-hole{fill:color-mix(in srgb,var(--pc,var(--muted)) 55%,#050608);stroke:var(--pc,var(--muted));stroke-width:1}
.ev-floor{fill:color-mix(in srgb,var(--pc,var(--muted)) 38%,#0b0c10);stroke:none}
.ev-wallin{fill:color-mix(in srgb,var(--pc,var(--muted)) 62%,#0b0c10);stroke:none}
.ev-screen{fill:color-mix(in srgb,var(--pc,var(--muted)) 24%,#0b0c10);stroke:color-mix(in srgb,var(--pc,var(--muted)) 60%,#0b0c10);stroke-width:1}
.ev-wall{fill:url(#ev-wallpaper);stroke:#05060a;stroke-width:.8}
.ev-label{fill:color-mix(in srgb,var(--pc,var(--muted)) 14%,var(--surface));stroke:color-mix(in srgb,var(--pc,var(--muted)) 50%,var(--surface));stroke-width:.8}
.ev-app{fill:var(--pc,var(--muted));stroke:none;opacity:.9}
.ev-ring{fill:color-mix(in srgb,var(--pc,var(--muted)) 40%,var(--surface));stroke:var(--pc,var(--muted));stroke-width:.9}
.ev-glassf{fill:color-mix(in srgb,var(--pc,var(--muted)) 20%,var(--surface));stroke:var(--pc,var(--muted));stroke-width:.8}
.ev-lensin{fill:#0a1230;stroke:#5d7cff;stroke-width:.8}
.ev-glint{fill:#fff;opacity:.85;stroke:none}
.ev-face{font-family:var(--font);font-weight:700;fill:var(--ink);opacity:.8;pointer-events:none}
.ev-face.on-dark{fill:#fff;opacity:.9}
.ev-gloss-h{fill:url(#ev-sh-h);stroke:none;pointer-events:none}
.ev-gloss-v{fill:url(#ev-sh-v);stroke:none;pointer-events:none}
.ev-spec{fill:none;stroke:#fff;stroke-width:1.1;stroke-linecap:round;opacity:.55;pointer-events:none}
.ev-thr{stroke:color-mix(in srgb,var(--pc,var(--muted)) 80%,#000);opacity:.75}
.ev-slot{fill:none;stroke:var(--pc,var(--muted));stroke-width:2;stroke-linecap:round}
.ev-wire{fill:none;stroke:color-mix(in srgb,var(--pc,var(--muted)) 55%,var(--surface));stroke-linecap:round;stroke-linejoin:round}
.ev-wire.dk{stroke:color-mix(in srgb,var(--pc,var(--muted)) 70%,#000)}
.ev-wire.ol{stroke:color-mix(in srgb,var(--pc,var(--muted)) 80%,#000)}
.ev-wire.hi{stroke:#fff;opacity:.55}
.ev-fine{fill:none;stroke:var(--pc,var(--muted));stroke-width:1;stroke-linecap:round;opacity:.8}
.ev-ghost{pointer-events:none;filter:grayscale(.85)}
.ev-ghost-l{fill:var(--muted)}
.ev-axis.main{stroke-dasharray:16 5 3 5;stroke-width:1.3}
.ev-part{cursor:pointer;outline:none}
.ev-part.hl,.ev-latepart.hl{filter:drop-shadow(0 0 7px var(--pc,var(--muted)))}
.ev-part.hl .pf,.ev-part.hl .iso-t,.ev-part.hl .iso-l,.ev-part.hl .iso-r{stroke-width:2.2}
.ev-part.pending,.ev-latepart.pending{opacity:.28}
svg.focusing .ev-part:not(.on),svg.focusing .ev-latepart:not(.on){opacity:.55}
svg.focusing .ev-part.pending:not(.on){opacity:.22}
svg.focusing .ev-b:not(.on){opacity:.4}
.ev-axis{fill:none;stroke:var(--muted);stroke-width:1.4;stroke-dasharray:6 6;stroke-linecap:round}
.ev-b{cursor:pointer}
.ev-b .bc{fill:var(--pc,var(--muted));stroke:var(--surface);stroke-width:2.5}
.ev-b text.bn{font:800 13px var(--font);fill:var(--surface);text-anchor:middle;pointer-events:none}
.ev-b.hl .bc{stroke:var(--ink)}
.ev-b .leader{stroke:var(--pc,var(--muted));stroke-width:1.3}
.ev-b .dot{fill:var(--pc,var(--muted))}
.ev-b .ev-name{font:600 14px var(--font);fill:var(--ink);pointer-events:none}

/* ===== Controls (inserted by the script) ===== */
.ev-bar{position:relative;display:flex;flex-wrap:wrap;align-items:center;gap:10px 14px;margin-top:14px;padding:10px 14px;
  border:1px solid var(--line);border-radius:14px;background:var(--bg)}
@media (max-width:600px){.ev-bar{position:sticky;left:0}}
.ev-btn{font:600 14px/1 var(--font);cursor:pointer;padding:10px 14px;border-radius:999px;border:1px solid var(--line);background:var(--surface);color:var(--ink);
  transition:transform .15s,border-color .15s}
.ev-btn:hover{border-color:var(--muted);transform:translateY(-1px)}
.ev-btn:focus-visible,.ev-rng input:focus-visible{outline:2px solid var(--c1);outline-offset:2px}
.ev-btn[aria-pressed="true"]{background:var(--c1-soft);border-color:var(--c1)}
.ev-btn.play{background:var(--ink);color:var(--surface);border-color:var(--ink)}
.ev-rng{display:flex;align-items:center;gap:10px;flex:1 1 220px;min-width:200px;font-size:14px;color:var(--muted)}
.ev-rng input{flex:1;min-width:90px;accent-color:var(--c1);height:24px;cursor:pointer}
.ev-rng output{font:700 14px var(--font);color:var(--ink);min-width:3.4em;text-align:right}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

/* ===== Parts list ===== */
.ev-list{width:100%;border-collapse:separate;border-spacing:0;background:var(--surface);border:1px solid var(--line);border-radius:14px;overflow:hidden;font-size:15px}
.ev-list th{text-align:left;font:700 12px/1 var(--font);letter-spacing:.08em;text-transform:uppercase;color:var(--muted);padding:12px 14px;background:var(--zone)}
.ev-list td{padding:10px 14px;border-top:1px solid var(--line);vertical-align:top}
.ev-list td.n{width:52px}
.ev-list td.n span{display:inline-grid;place-items:center;width:26px;height:26px;border-radius:50%;background:var(--pc,var(--muted));color:var(--surface);font:800 13px/1 var(--font)}
.ev-list td.nm{font-weight:700}
.ev-list td.q{width:56px;text-align:center;color:var(--muted)}
.ev-list td.ro{color:var(--muted)}
.ev-list tbody tr{cursor:default;outline:none;transition:background .15s}
.ev-list tbody tr.hl,.ev-list tbody tr:hover,.ev-list tbody tr:focus-visible{background:var(--zone)}
.ev-list tbody tr:focus-visible{box-shadow:inset 3px 0 0 var(--pc,var(--muted))}
@media (max-width:600px){
  .ev-list thead{display:none}
  .ev-list tbody tr{display:grid;grid-template-columns:44px 1fr 44px;align-items:start;border-top:1px solid var(--line)}
  .ev-list tbody tr:first-child{border-top:0}
  .ev-list td{border-top:0;padding:10px 8px 2px}
  .ev-list td.n{width:auto;padding-left:12px}
  .ev-list td.q{width:auto}
  .ev-list td.q::before{content:"×"}
  .ev-list td.ro{grid-column:2 / 4;padding-top:0;padding-bottom:10px;font-size:14px}
}

/* ===== Handwritten notebook style - only when <figure class="stage" data-style="handwritten"> (the user asked for it) ===== */
:root.hand.hand{
  --bg:#e9e4d8; --surface:#fdfbf4; --ink:#1f3a93; --muted:#4a5a8a; --line:#9fb7d6; --zone:#f3eedf;
  --c1:#1f3a93; --c1-soft:rgba(64,196,255,.30);  --c2:#1e8449; --c2-soft:rgba(118,255,3,.32);
  --c3:#b9770e; --c3-soft:rgba(255,235,59,.60);  --c4:#c0392b; --c4-soft:rgba(255,128,171,.40);
  --c5:#7d3c98; --c5-soft:rgba(206,147,216,.40); --on-accent:#222; --shadow:rgba(0,0,0,.16);
  --font:'Kalam','Patrick Hand','Segoe Print','Comic Sans MS',cursive;
  --title:'Caveat','Kalam','Segoe Print','Bradley Hand',cursive;
  color-scheme:light;
}
.hand body::before{display:none}
.hand .page{margin:24px auto;padding:40px 28px 56px 88px;box-shadow:0 2px 6px rgba(0,0,0,.15),0 12px 28px rgba(0,0,0,.12);
  background:linear-gradient(90deg,transparent 62px,#e8a0a0 62px,#e8a0a0 64px,transparent 64px),
             repeating-linear-gradient(var(--surface) 0,var(--surface) 31px,#c9dcef 31px,#c9dcef 32px)}
@media (max-width:600px){.hand .page{margin:0;padding:24px 14px 40px 44px;
  background:linear-gradient(90deg,transparent 30px,#e8a0a0 30px,#e8a0a0 32px,transparent 32px),
             repeating-linear-gradient(var(--surface) 0,var(--surface) 31px,#c9dcef 31px,#c9dcef 32px)}}
.hand .eyebrow{background:none;border:0;padding:0;font:700 22px/1 var(--title);letter-spacing:0;text-transform:none;color:var(--c4)}
.hand .eyebrow::before{display:none}
.hand h1{font-family:var(--title);font-size:clamp(42px,6vw,60px);font-weight:700;letter-spacing:0;color:#222;transform:rotate(-1deg);transform-origin:left}
.hand h1 .accent{color:inherit;-webkit-background-clip:border-box;background-clip:border-box;
  background:linear-gradient(transparent 58%,var(--c3-soft) 58%,var(--c3-soft) 92%,transparent 92%)}
.hand h2{font-family:var(--title);font-size:34px;font-weight:700;color:var(--c4)}
.hand h2::before{content:"\27A4";font-size:22px}
.hand h2::after{display:none}
.hand .lede,.hand .note,.hand .legend{color:var(--ink)}
.hand .chips li{background:var(--c3-soft);border:0;border-radius:3px 8px 4px 9px;color:var(--ink)}
.hand .chips b{color:#222}
.hand .stage{background:var(--surface);border:2px dashed var(--line);box-shadow:none}
.hand .stage::before{display:none}
.hand .stage figcaption{font-family:var(--title);font-size:20px;color:#222}
.hand .lift{filter:none}
.hand .t{font-weight:400} .hand .t.on{fill:#222;font-weight:700} .hand .t.small{font-weight:700}
.hand .ev-b .ev-name{font-size:16px;font-weight:700}
.hand .ev-b text.bn{font:700 16px var(--title)}
.hand .ev-axis{stroke:#333}
.hand .pf,.hand .iso-t,.hand .iso-l,.hand .iso-r{stroke:#222;stroke-width:1.8}
.hand .ev-btn{background:var(--surface);border:2px solid #222;font-family:var(--font);border-radius:6px 14px 8px 16px}
.hand .ev-btn[aria-pressed="true"]{background:var(--c3-soft)}
.hand .ev-btn.play{background:var(--c4);color:#fff;border-color:#222}
.hand .ev-bar,.hand .player{background:var(--surface);border:2px solid #222;border-radius:6px 14px 8px 16px}
.hand .pl-play{background:var(--c4);color:#fff}
.hand .pl-n{background:var(--c4)}
.hand .ev-list{background:var(--surface);border:2px solid #222;border-radius:4px 12px 6px 14px}
.hand .ev-list th{font-family:var(--title);font-size:19px;letter-spacing:0;text-transform:none;color:#222;background:transparent}
.hand .ev-list td{border-top:1px dashed var(--line)}
.hand .ev-list td.ro,.hand .ev-list td.q{color:var(--ink)}
.hand .steps li{background:transparent;border:2px solid #222;border-radius:4px 12px 6px 14px}
.hand .steps li::before{background:none;color:var(--c4);border:2px solid var(--c4);font:700 17px/22px var(--title)}
.hand .steps b{font-family:var(--title);font-size:22px;color:#222}
.hand .steps span{color:var(--ink)}
.hand .card{background:#fff59d;border:0;border-radius:2px;box-shadow:2px 4px 8px rgba(0,0,0,.18);transform:rotate(-1deg)}
.hand .card:nth-child(2){transform:rotate(1.2deg)}
.hand .card::before{display:none}
.hand .card svg{color:var(--c4)}
.hand .card b{font-family:var(--title);font-size:24px;color:var(--c4)}
.hand .card p{color:#333}

/* ===== Print: always light, the EXPLODED view, the parts list included; controls hidden ===== */
@media print{
  :root:root:root:not(.hand){
    --bg:#ffffff; --surface:#ffffff; --ink:#15151a; --muted:#4b4e57; --line:#c9c6bd; --zone:#f1efe9;
    --c1:#1d4ed8; --c1-soft:#dbe6fd; --c2:#0b7a58; --c2-soft:#d3eee3; --c3:#b45f00; --c3-soft:#fde6c8;
    --c4:#b91c5c; --c4-soft:#fadbe7; --c5:#5b34c4; --c5-soft:#e7defb; --on-accent:#ffffff; --shadow:transparent;
    color-scheme:light;
  }
  @page{margin:12mm}
  html{-webkit-print-color-adjust:exact;print-color-adjust:exact}
  .ev-bar,.scroll-hint,.theme-toggle{display:none!important}
  .page,.hand .page{max-width:none;margin:0;padding:0;box-shadow:none;background:none}
  .stage{overflow:visible;padding:8px}
  .stage > svg{min-width:0}
  h2{margin:18px 0 8px;break-after:avoid}
  .ev-list,.ev-list tr,.steps li,.card{break-inside:avoid}
  .ev-list{font-size:11pt}
  .ev-list th,.ev-list td{padding:6px 10px}
  .ev-part.hl{filter:none}
}
.sw.c0{background:var(--zone);border-color:var(--muted)}
</style>
</head>
<body>
<!-- Shared defs: gradients, shadow, arrowheads, icon library. Icons: a use element pointing at an i-* symbol id, e.g. i-sun (see SKILL.md) -->
<svg width="0" height="0" style="position:absolute" aria-hidden="true"><defs>
  <filter id="shadow" x="-20%" y="-20%" width="140%" height="160%"><feDropShadow dx="0" dy="6" stdDeviation="7" style="flood-color:var(--shadow)"/></filter>
  <!-- card fill: surface → soft tint -->
  <linearGradient id="g-c1" x1="0" y1="0" x2="0" y2="1"><stop offset="0" style="stop-color:var(--surface)"/><stop offset="1" style="stop-color:var(--c1-soft)"/></linearGradient>
  <linearGradient id="g-c2" x1="0" y1="0" x2="0" y2="1"><stop offset="0" style="stop-color:var(--surface)"/><stop offset="1" style="stop-color:var(--c2-soft)"/></linearGradient>
  <linearGradient id="g-c3" x1="0" y1="0" x2="0" y2="1"><stop offset="0" style="stop-color:var(--surface)"/><stop offset="1" style="stop-color:var(--c3-soft)"/></linearGradient>
  <linearGradient id="g-c4" x1="0" y1="0" x2="0" y2="1"><stop offset="0" style="stop-color:var(--surface)"/><stop offset="1" style="stop-color:var(--c4-soft)"/></linearGradient>
  <linearGradient id="g-c5" x1="0" y1="0" x2="0" y2="1"><stop offset="0" style="stop-color:var(--surface)"/><stop offset="1" style="stop-color:var(--c5-soft)"/></linearGradient>
  <!-- scene washes: fade = strong at top, rise = strong at bottom -->
  <linearGradient id="fade-c1" x1="0" y1="0" x2="0" y2="1"><stop offset="0" style="stop-color:var(--c1-soft)"/><stop offset="1" style="stop-color:var(--c1-soft);stop-opacity:0"/></linearGradient>
  <linearGradient id="fade-c2" x1="0" y1="0" x2="0" y2="1"><stop offset="0" style="stop-color:var(--c2-soft)"/><stop offset="1" style="stop-color:var(--c2-soft);stop-opacity:.25"/></linearGradient>
  <linearGradient id="fade-c3" x1="0" y1="0" x2="0" y2="1"><stop offset="0" style="stop-color:var(--c3-soft)"/><stop offset="1" style="stop-color:var(--c3-soft);stop-opacity:0"/></linearGradient>
  <linearGradient id="fade-c4" x1="0" y1="0" x2="0" y2="1"><stop offset="0" style="stop-color:var(--c4-soft)"/><stop offset="1" style="stop-color:var(--c4-soft);stop-opacity:0"/></linearGradient>
  <linearGradient id="fade-c5" x1="0" y1="0" x2="0" y2="1"><stop offset="0" style="stop-color:var(--c5-soft)"/><stop offset="1" style="stop-color:var(--c5-soft);stop-opacity:0"/></linearGradient>
  <linearGradient id="rise-c1" x1="0" y1="1" x2="0" y2="0"><stop offset="0" style="stop-color:var(--c1-soft)"/><stop offset="1" style="stop-color:var(--c1-soft);stop-opacity:.2"/></linearGradient>
  <linearGradient id="rise-c2" x1="0" y1="1" x2="0" y2="0"><stop offset="0" style="stop-color:var(--c2-soft)"/><stop offset="1" style="stop-color:var(--c2-soft);stop-opacity:.2"/></linearGradient>
  <linearGradient id="rise-c3" x1="0" y1="1" x2="0" y2="0"><stop offset="0" style="stop-color:var(--c3-soft)"/><stop offset="1" style="stop-color:var(--c3-soft);stop-opacity:.2"/></linearGradient>
  <linearGradient id="rise-c4" x1="0" y1="1" x2="0" y2="0"><stop offset="0" style="stop-color:var(--c4-soft)"/><stop offset="1" style="stop-color:var(--c4-soft);stop-opacity:.2"/></linearGradient>
  <linearGradient id="rise-c5" x1="0" y1="1" x2="0" y2="0"><stop offset="0" style="stop-color:var(--c5-soft)"/><stop offset="1" style="stop-color:var(--c5-soft);stop-opacity:.2"/></linearGradient>
  <!-- arrowheads: one per colour (markers don't inherit the path colour) -->
  <marker id="arr"    viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1 L9 5 L1 9 z" style="fill:var(--muted)"/></marker>
  <marker id="arr-c1" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1 L9 5 L1 9 z" style="fill:var(--c1)"/></marker>
  <marker id="arr-c2" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1 L9 5 L1 9 z" style="fill:var(--c2)"/></marker>
  <marker id="arr-c3" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1 L9 5 L1 9 z" style="fill:var(--c3)"/></marker>
  <marker id="arr-c4" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1 L9 5 L1 9 z" style="fill:var(--c4)"/></marker>
  <marker id="arr-c5" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1 L9 5 L1 9 z" style="fill:var(--c5)"/></marker>

  <!-- exploded view: shading overlays (h = across a horizontal tube, v = across a vertical one), blur, wallpaper -->
  <linearGradient id="ev-sh-h" x1="0" y1="0" x2="0" y2="1"><stop offset="0" style="stop-color:#000;stop-opacity:.42"/><stop offset=".12" style="stop-color:#000;stop-opacity:.12"/><stop offset=".3" style="stop-color:#fff;stop-opacity:.46"/><stop offset=".46" style="stop-color:#fff;stop-opacity:.12"/><stop offset=".64" style="stop-color:#000;stop-opacity:0"/><stop offset=".86" style="stop-color:#000;stop-opacity:.24"/><stop offset="1" style="stop-color:#000;stop-opacity:.52"/></linearGradient>
  <linearGradient id="ev-sh-v" x1="0" y1="0" x2="1" y2="0"><stop offset="0" style="stop-color:#000;stop-opacity:.42"/><stop offset=".12" style="stop-color:#000;stop-opacity:.12"/><stop offset=".3" style="stop-color:#fff;stop-opacity:.46"/><stop offset=".46" style="stop-color:#fff;stop-opacity:.12"/><stop offset=".64" style="stop-color:#000;stop-opacity:0"/><stop offset=".86" style="stop-color:#000;stop-opacity:.24"/><stop offset="1" style="stop-color:#000;stop-opacity:.52"/></linearGradient>
  <linearGradient id="ev-wallpaper" x1="0" y1="0" x2="1" y2="1"><stop offset="0" style="stop-color:#16224f"/><stop offset=".55" style="stop-color:#43246b"/><stop offset="1" style="stop-color:#0c0f1f"/></linearGradient>
  <filter id="ev-blur" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="3.2"/></filter>

<script>
/* ===== Exploded-view engine =====
   The author draws the parts as <g class="ev-part" data-n="3" data-order="2" data-dx="0" data-dy="-120"> inside the
   first .stage svg (data-dx / data-dy = how far the part moves when fully exploded; or data-gap="120" along the
   svg's data-axis, default "0,-1" = straight up). This script then:
   - expands drawing helpers  <g class="ev-prim" data-type="...">  into shaded SVG shapes:
       2-D side views : tube (cylinder with end caps) cone thread coil teeth slab
       isometric      : box rbox poly (extruded, rounded) cyl lens screw irect icirc itext sface
   - moves every part between assembled (0) and exploded (1): slider, Assemble, Explode, Play assembly;
   - ZOOMS the view to fit what is on screen (assembled = big, exploded = everything fits);
   - draws dashed assembly lines (data-mate="N": a guide to the part it fits on; data-line="none" hides it; + an optional dash-dot centre line), numbered balloons with leader lines that follow
     the part, an optional faint "ghost" of the assembled object, links parts <-> balloons <-> parts-list rows on hover;
   - syncs with the reading guide: the template walkthrough calls window.__evStep(n): parts whose data-order <= n are
     assembled, the rest wait exploded; each part also gets data-step = its order;
   - prints the EXPLODED state. data-style="handwritten" on the figure turns on the notebook look (loads fonts).
   Exposes window.__ev (set(t, instant), pos(), parts), __evReady and __evErrors for the validator. */
(() => {
  const errors = window.__evErrors = [], root = document.documentElement;
  const svg = document.querySelector('.stage > svg'), fig = svg && svg.closest('.stage');
  if (!svg) { errors.push('no .stage > svg found'); return; }
  const NS = 'http://www.w3.org/2000/svg';
  const hand = /hand/i.test(fig.dataset.style || '');
  if (hand) root.classList.add('hand');
  const fontsReady = !hand ? Promise.resolve() : new Promise(res => {
    const l = document.createElement('link'); l.rel = 'stylesheet';
    l.href = 'https://fonts.googleapis.com/css2?family=Caveat:wght@400;700&family=Kalam:wght@400;700&display=swap';
    l.onload = () => Promise.all(['400 16px Kalam', '700 16px Kalam', '700 32px Caveat'].map(f => document.fonts.load(f))).catch(() => {}).then(res);
    l.onerror = res; document.head.appendChild(l);
    setTimeout(res, 2500);                      // offline: carry on with the fallback font
  });
  window.__evReady = fontsReady.then(() => { try { init(); } catch (e) { errors.push(String(e && e.message || e)); console.error(e); } });

  function init() {
    const num = (v, d = 0) => { const n = parseFloat(v); return isFinite(n) ? n : d; };
    const f = n => +n.toFixed(1);
    const add = (g, tag, attrs) => { const e = document.createElementNS(NS, tag); for (const k in attrs) e.setAttribute(k, attrs[k]); g.appendChild(e); return e; };
    const d = (el, k, def) => num(el.dataset[k], def);
    const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
    let uid = 0;

    /* ---------- 1. drawing helpers ---------- */
    const FILL = { screen: 'ev-screen', hole: 'ev-hole', label: 'ev-label', lt: 'pf lt', dk: 'pf dk', wall: 'ev-wall', app: 'ev-app', ring: 'ev-ring', glass: 'ev-glassf', plain: 'pf' };
    /* --- 2-D side views (x y = top-left; the long axis is horizontal, or vertical with dir="v") --- */
    const tubeAt = (G, x, y, L, T, o) => {                         // shaded cylinder with end caps; x..x+L includes the caps
      const e = o.cap != null ? o.cap : T * .26, ends = o.ends == null ? 'lr' : o.ends, hasL = ends.includes('l'), hasR = ends.includes('r');
      const xl = x + (hasL ? e : 0), xr = x + L - (hasR ? e : 0);
      const body = `M${f(xl)} ${f(y)}L${f(xr)} ${f(y)}L${f(xr)} ${f(y + T)}L${f(xl)} ${f(y + T)}` + (hasL ? `A${f(e)} ${f(T / 2)} 0 0 1 ${f(xl)} ${f(y)}` : '') + 'Z';
      add(G, 'path', { class: 'pf', d: body }); add(G, 'path', { class: 'ev-gloss-h', d: body });
      add(G, 'path', { class: 'ev-spec', d: `M${f(xl + (hasL ? e * .6 : 1))} ${f(y + T * .28)}L${f(xr - 1)} ${f(y + T * .28)}` });
      if (hasR) {
        add(G, 'ellipse', { class: 'pf lt', cx: f(xr), cy: f(y + T / 2), rx: f(e), ry: f(T / 2) });
        if (o.wall > 0) { const ry = T / 2 - o.wall; add(G, 'ellipse', { class: 'ev-hole', cx: f(xr), cy: f(y + T / 2), rx: f(Math.max(.6, e * ry / (T / 2))), ry: f(ry) }); }
      }
    };
    const rot = (g, x, y, T, v) => v ? add(g, 'g', { transform: `translate(${f(x + T)} ${f(y)}) rotate(90)` }) : g;
    const opts = g => ({ cap: g.dataset.cap != null ? d(g, 'cap') : null, ends: g.dataset.ends, wall: d(g, 'wall', 0) });
    /* --- isometric projection (set on the svg: data-angle 30 = true isometric, data-k scale, data-ox/oy origin) --- */
    const A = num(svg.dataset.angle, 30) * Math.PI / 180, K = num(svg.dataset.k, 1), OX = num(svg.dataset.ox, 0), OY = num(svg.dataset.oy, 0);
    const cs = Math.cos(A), sn = Math.sin(A);
    const P = (x, y, z = 0) => [OX + (x - y) * cs * K, OY + (x + y) * sn * K - z * K];
    const pts = (...ps) => ps.map(p => P(...p).map(f).join(',')).join(' ');
    const poly3 = (g, ps, z, cls, extra) => add(g, 'polygon', Object.assign({ class: cls, points: ps.map(([x, y]) => P(x, y, z).map(f).join(',')).join(' ') }, extra || {}));
    const cyl = (g, cx, cy, z, r, h, hole, cls) => {
      const [tx, ty] = P(cx, cy, z + h), [bx, by] = P(cx, cy, z), rx = r * K * cs * Math.SQRT2, ry = r * K * sn * Math.SQRT2;
      const side = `M${f(tx - rx)} ${f(ty)}L${f(bx - rx)} ${f(by)}A${f(rx)} ${f(ry)} 0 0 0 ${f(bx + rx)} ${f(by)}L${f(tx + rx)} ${f(ty)}Z`;
      add(g, 'path', { class: cls || 'iso-l', d: side }); add(g, 'path', { class: 'ev-gloss-v', d: side });
      add(g, 'ellipse', { class: 'iso-t', cx: f(tx), cy: f(ty), rx: f(rx), ry: f(ry) });
      if (hole) add(g, 'ellipse', { class: 'ev-hole', cx: f(tx), cy: f(ty), rx: f(rx * hole), ry: f(ry * hole) });
      return [tx, ty, rx, ry];
    };
    /* outlines in the xy plane */
    const rrPts = (x, y, w, h, r, n = 5) => {
      r = Math.max(0, Math.min(r, w / 2, h / 2));
      if (!r) return [[x, y], [x + w, y], [x + w, y + h], [x, y + h]];
      const out = [];
      [[x + w - r, y + r, -90], [x + w - r, y + h - r, 0], [x + r, y + h - r, 90], [x + r, y + r, 180]].forEach(([cx, cy, a0]) => {
        for (let i = 0; i <= n; i++) { const a = (a0 + 90 * i / n) * Math.PI / 180; out.push([cx + r * Math.cos(a), cy + r * Math.sin(a)]); }
      });
      return out;
    };
    const roundPoly = (p, r, n = 5) => {                         // fillet every corner of a polygon
      if (!r) return p;
      const out = [], N = p.length;
      for (let i = 0; i < N; i++) {
        const B = p[i], Aa = p[(i + N - 1) % N], C = p[(i + 1) % N];
        let u = [Aa[0] - B[0], Aa[1] - B[1]], v = [C[0] - B[0], C[1] - B[1]];
        const lu = Math.hypot(...u), lv = Math.hypot(...v); u = u.map(q => q / lu); v = v.map(q => q / lv);
        const th = Math.acos(Math.max(-1, Math.min(1, u[0] * v[0] + u[1] * v[1])));
        if (th < .05 || th > Math.PI - .05) { out.push(B); continue; }
        const t = Math.min(r / Math.tan(th / 2), lu / 2, lv / 2), rr = t * Math.tan(th / 2);
        const P1 = [B[0] + u[0] * t, B[1] + u[1] * t], P2 = [B[0] + v[0] * t, B[1] + v[1] * t];
        let bs = [u[0] + v[0], u[1] + v[1]]; const lb = Math.hypot(...bs); bs = bs.map(q => q / lb);
        const c = [B[0] + bs[0] * rr / Math.sin(th / 2), B[1] + bs[1] * rr / Math.sin(th / 2)];
        const a1 = Math.atan2(P1[1] - c[1], P1[0] - c[0]); let da = Math.atan2(P2[1] - c[1], P2[0] - c[0]) - a1;
        while (da > Math.PI) da -= 2 * Math.PI; while (da < -Math.PI) da += 2 * Math.PI;
        for (let k = 0; k <= n; k++) { const a = a1 + da * k / n; out.push([c[0] + rr * Math.cos(a), c[1] + rr * Math.sin(a)]); }
      }
      return out;
    };
    const area = p => p.reduce((s, q, i) => { const r = p[(i + 1) % p.length]; return s + q[0] * r[1] - r[0] * q[1]; }, 0) / 2;
    const normals = p => { const s = area(p) > 0 ? 1 : -1; return p.map((q, i) => { const r = p[(i + 1) % p.length], dx = r[0] - q[0], dy = r[1] - q[1], l = Math.hypot(dx, dy) || 1; return s > 0 ? [dy / l, -dx / l] : [-dy / l, dx / l]; }); };
    const sideStyle = pct => { const c = `color-mix(in srgb,var(--pc,var(--muted)) min(100%,calc(${pct.toFixed(1)}% * var(--vk,1))),var(--surface))`; return `fill:${c};stroke:${c};stroke-width:.8;stroke-linejoin:round`; };
    /* extrude an outline (list of [x,y]) from z up by h: walls shaded by direction (light from the top-left), top face, edge lines */
    const extrude = (g, out, z, h, o = {}) => {
      const N = out.length, nm = normals(out), G = o.into || g;
      if (o.shadow) poly3(g, out, z, 'ev-sh', { transform: 'translate(5 8)' });
      const vis = nm.map(n => n[0] + n[1] > .02);
      const quads = [];
      out.forEach((p, i) => {
        if (!vis[i]) return;
        const q = out[(i + 1) % N], n = nm[i], pct = Math.max(36, Math.min(66, 51 + 11 * (n[0] - n[1])));
        quads.push([(p[0] + p[1] + q[0] + q[1]), pts([p[0], p[1], z], [q[0], q[1], z], [q[0], q[1], z + h], [p[0], p[1], z + h]), pct]);
      });
      quads.sort((a, b) => a[0] - b[0]).forEach(([, points, pct]) => add(G, 'polygon', { points, style: sideStyle(pct) }));
      /* silhouette of the lower edge + the two vertical end edges of each run of visible walls */
      for (let s = 0; s < N; s++) {
        if (!vis[s] || vis[(s + N - 1) % N]) continue;
        let e = s; while (vis[(e + 1) % N] && (e + 1) % N !== s) e++;
        const run = []; for (let i = s; i <= e + 1; i++) run.push(out[i % N]);
        const bot = run.map(([x, y]) => P(x, y, z)), top0 = P(run[0][0], run[0][1], z + h), top1 = P(...run[run.length - 1], z + h);
        add(G, 'path', { class: 'ev-edge', d: 'M' + top0.map(f).join(' ') + 'L' + bot.map(q => q.map(f).join(' ')).join('L') + 'L' + top1.map(f).join(' ') });
      }
      if (o.hole) {                                                   // top face with an opening (a frame): even-odd path
        const ring = ps => 'M' + ps.map(([x, y]) => P(x, y, z + h).map(f).join(' ')).join('L') + 'Z';
        add(G, 'path', { class: 'iso-t', d: ring(out) + ring(o.hole), 'fill-rule': 'evenodd' });
      } else poly3(G, out, z + h, 'iso-t');
      return { out, top: z + h };
    };
    const inset = (g, x, y, w, dd, r, s, rs) => rrPts(x + s, y + s, w - 2 * s, dd - 2 * s, rs != null ? rs : Math.max(r - s, .8));
    const faceItems = (g, x, y, w, dd, r, zt) => {                // pocket + panel on the top face of a rounded box

      parts.forEach(p => { if (p.e > .12) full = U(full, R(p.bbb, p.ox * p.e, p.oy * p.e)); });
      if (gbb) full = U(full, R(gbb));
      const w = sm((mean - .05) / .3), b = core.map((v, i) => v + (full[i] - v) * w);
      let vw = Math.max(b[2] - b[0] + 2 * PAD, (b[3] - b[1] + 2 * PAD) * ASP); vw = Math.max(vw, vb0.width / ZMAX);
      const vh = vw / ASP, cx = (b[0] + b[2]) / 2, cy = (b[1] + b[3]) / 2;
      svg.setAttribute('viewBox', `${(cx - vw / 2).toFixed(2)} ${(cy - vh / 2).toFixed(2)} ${vw.toFixed(2)} ${vh.toFixed(2)}`);
    };
    const render = () => {
      let sum = 0;
      parts.forEach(p => {
        const e = p.e; sum += e;
        p.el.setAttribute('transform', `translate(${f(p.ox * e)} ${f(p.oy * e)})`);
        p.bgrp.setAttribute('transform', `translate(${f(p.ox * e)} ${f(p.oy * e)})`);
        p.bgrp.style.opacity = Math.max(0, Math.min(1, (e - .08) / .3));
        p.bgrp.style.pointerEvents = e < .2 ? 'none' : '';
        if (p.late) p.late.setAttribute('transform', `translate(${f(p.ox * e)} ${f(p.oy * e)})`);
        const mp = p.mate && parts.find(q => q.n === p.mate);
        if (mp) {                                                   // guide to the part it fits on: from this part to the mate
          p.line.setAttribute('x1', f(p.ctr[0] + p.ox * e)); p.line.setAttribute('y1', f(p.ctr[1] + p.oy * e));
          p.line.setAttribute('x2', f(mp.ctr[0] + mp.ox * mp.e)); p.line.setAttribute('y2', f(mp.ctr[1] + mp.oy * mp.e));
        } else { p.line.setAttribute('x2', f(p.ctr[0] + p.ox * e)); p.line.setAttribute('y2', f(p.ctr[1] + p.oy * e)); }
        p.line.style.opacity = Math.min(1, e * 5);
      });
      const m = sum / parts.length, pct = Math.round(m * 100);
      if (cline) cline.style.opacity = Math.min(1, m * 4);
      if (ghost) ghost.style.opacity = (Math.min(1, m * 4) * .4).toFixed(2);
      if (FIT) fit(m);
      rng.value = pct; out.textContent = pct + '%';
      bAsm.setAttribute('aria-pressed', String(pct === 0)); bExp.setAttribute('aria-pressed', String(pct === 100));
    };
    const frame = now => {
      let live = false;
      parts.forEach(p => {
        const t = p.tw; if (!t) return;
        const u = Math.min(1, (now - t.t0) / t.dur), k = u < .5 ? 4 * u * u * u : 1 - Math.pow(-2 * u + 2, 3) / 2;
        p.e = t.from + (t.to - t.from) * k;
        if (u >= 1) { p.e = t.to; p.tw = null; } else live = true;
      });
      render(); raf = live ? requestAnimationFrame(frame) : 0;
    };
    const to = (p, v, ms) => {
      if (reduce || !ms || Math.abs(p.e - v) < .001) { p.tw = null; p.e = v; return; }
      p.tw = { from: p.e, to: v, t0: performance.now(), dur: ms };
    };
    const kick = () => { render(); if (!raf && parts.some(p => p.tw)) raf = requestAnimationFrame(frame); };
    const setAll = (v, ms) => { parts.forEach(p => to(p, v, ms)); kick(); };
    const cancelSeq = () => { if (seq) { clearTimeout(seq); seq = null; } };
    const exitStep = () => { if (stepN && window.__vs) { window.__vs.show(0); } };

    window.__ev = {
      parts, maxOrder, get gt() { return gt; },
      set(t, instant) { cancelSeq(); exitStep(); gt = t; setAll(t, instant ? 0 : 700); },
      pos: () => parts.map(p => p.e),
    };

    /* controls */
    rng.addEventListener('input', () => { cancelSeq(); exitStep(); gt = rng.value / 100; setAll(gt, 0); });
    bAsm.addEventListener('click', () => { cancelSeq(); exitStep(); gt = 0; setAll(0, 900); });
    bExp.addEventListener('click', () => { cancelSeq(); exitStep(); gt = 1; setAll(1, 900); });
    bar.querySelector('[data-act=play]').addEventListener('click', () => {
      cancelSeq(); if (window.__vs) { window.__vs.stop(); if (stepN) window.__vs.show(0); }
      gt = 1; setAll(1, 0);
      let k = 0;
      const last = Math.min(maxOrder, document.querySelectorAll('ol.steps > li').length || maxOrder);
      const tick = () => {
        if (document.querySelector('.player.playing')) { seq = null; return; }   // the template player took over
        k++;
        if (k > last) {
          seq = null; if (window.__vs) window.__vs.show(0); else window.__evStep(0);
          gt = 0; setAll(0, 900); return;
        }
        if (window.__vs) window.__vs.show(k); else window.__evStep(k);
        seq = setTimeout(tick, reduce ? 1200 : 1700);
      };
      tick();
    });

    /* reading guide / walkthrough hook (called by the template player's show(n); n = 0 means "no step") */
    window.__evStep = n => {
      if (n > 0) {
        stepN = n; svg.classList.add('ev-step');
        parts.forEach(p => { to(p, p.order <= n ? 0 : 1, 900); p.el.classList.toggle('pending', p.order > n); if (p.late) p.late.classList.toggle('pending', p.order > n); });
      } else {
        if (stepN >= maxOrder) gt = 0;               // the walkthrough reached the end: leave it assembled
        stepN = 0; svg.classList.remove('ev-step');
        parts.forEach(p => { p.el.classList.remove('pending'); if (p.late) p.late.classList.remove('pending'); to(p, gt, 900); });
      }
      kick();
    };

    /* ---------- 4. hover / focus: part <-> balloon <-> list row ---------- */
    const hl = (n, on) => {
      parts.forEach(p => { if (p.n === n) { [p.el, p.late, p.bgrp, p.row].forEach(x => x && x.classList.toggle('hl', on)); } });
    };
    parts.forEach(p => {
      [p.el, p.late, p.bgrp].forEach(x => { if (!x) return;
        x.addEventListener('mouseenter', () => hl(p.n, true)); x.addEventListener('mouseleave', () => hl(p.n, false));
      });
      p.el.addEventListener('focus', () => hl(p.n, true)); p.el.addEventListener('blur', () => hl(p.n, false));
      if (p.row) {
        p.row.addEventListener('mouseenter', () => hl(p.n, true)); p.row.addEventListener('mouseleave', () => hl(p.n, false));
        p.row.addEventListener('focus', () => hl(p.n, true)); p.row.addEventListener('blur', () => hl(p.n, false));
      }
    });

    /* ---------- 5. print = exploded, light ---------- */
    let saved = null;
    const beforePrint = () => { if (saved) return; saved = { gt, stepN, pos: parts.map(p => p.e) }; cancelSeq(); parts.forEach(p => { p.tw = null; p.e = 1; }); render(); };
    const afterPrint = () => { if (!saved) return; parts.forEach((p, i) => { p.e = saved.pos[i]; }); saved = null; render(); };
    window.addEventListener('beforeprint', beforePrint); window.addEventListener('afterprint', afterPrint);
    const mq = matchMedia('print'); (mq.addEventListener ? mq.addEventListener('change', e => e.matches ? beforePrint() : afterPrint()) : mq.addListener(e => e.matches ? beforePrint() : afterPrint()));

    parts.forEach(p => { p.e = gt; }); render();
    document.documentElement.setAttribute('data-ev-ready', '1');
  }
})();
</script>
<script>
/* Step focus + walkthrough player. Built automatically from the first .stage svg and ol.steps:
   - hovering / tapping step N highlights every [data-step~="N"] element (and vice versa);
   - a player bar (play/pause, prev/next, progress, caption) is inserted inside the stage.
   No dependencies; nothing to add to the content markup. */
(window.__evReady || Promise.resolve()).then(() => {
  const svg = document.querySelector('.stage > svg'), items = [...document.querySelectorAll('ol.steps > li')];
  if (!svg || !items.length) return;
  const N = items.length, fig = svg.closest('.stage');
  let pinned = null, cur = 0, playing = false, timer = null;
  const set = n => {
    svg.classList.toggle('focusing', n != null);
    svg.querySelectorAll('[data-step]').forEach(el => el.classList.toggle('on', n != null && el.dataset.step.split(' ').includes(String(n))));
    items.forEach((li, i) => li.classList.toggle('on', n === i + 1));
  };

  /* ---- player UI ---- */
  const PLAY = '<svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path d="M8 5.5v13l10.5-6.5z" fill="currentColor"/></svg>';
  const PAUSE = '<svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path d="M7 5h3.5v14H7zM13.5 5H17v14h-3.5z" fill="currentColor"/></svg>';
  const title = li => (li.querySelector('b')?.textContent || '').trim();
  const body = li => (li.querySelector('span')?.textContent || li.textContent.replace(title(li), '')).trim();
  const bar = document.createElement('div');
  bar.className = 'player';
  bar.innerHTML = `<button class="pl-play" type="button" aria-label="Play walkthrough">${PLAY}</button>
    <button class="pl-nav" type="button" data-d="-1" aria-label="Previous step"><svg viewBox="0 0 24 24" width="16" height="16" aria-hidden="true"><path d="M15 5l-7 7 7 7" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
    <button class="pl-nav" type="button" data-d="1" aria-label="Next step"><svg viewBox="0 0 24 24" width="16" height="16" aria-hidden="true"><path d="M9 5l7 7-7 7" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
    <div class="pl-track">${items.map((li, i) => `<button class="pl-seg ${li.className}" type="button" aria-label="Step ${i + 1}: ${title(li)}"><i><s></s></i></button>`).join('')}</div>
    <p class="pl-cap" aria-live="polite"><span class="pl-n">${N} steps</span><b>Walkthrough</b> Press play to go through it step by step.</p>`;
  fig.insertBefore(bar, fig.querySelector('figcaption'));
  const btn = bar.querySelector('.pl-play'), segs = [...bar.querySelectorAll('.pl-seg')], cap = bar.querySelector('.pl-cap');
  const dur = li => Math.min(9000, Math.max(3500, body(li).split(/\s+/).length * 280));

  const show = n => {
    cur = n; pinned = n || null; set(pinned);
    if (window.__evStep) window.__evStep(n);
    segs.forEach((s, i) => {
      s.classList.toggle('done', i + 1 < n);
      s.classList.remove('active'); void s.offsetWidth;        // restart the fill animation
      s.classList.toggle('active', i + 1 === n);
      s.style.setProperty('--dur', n ? dur(items[n - 1]) + 'ms' : '0ms');
    });
    cap.innerHTML = n
      ? `<span class="pl-n">${n} / ${N}</span><b>${title(items[n - 1])}</b> ${body(items[n - 1])}`
      : `<span class="pl-n">${N} steps</span><b>Walkthrough</b> Press play to go through it step by step.`;
  };
  const tick = () => {
    if (cur >= N) { stop(); show(0); cap.innerHTML = `<span class="pl-n">done</span><b>That's all ${N} steps.</b> Press play to watch again.`; return; }
    show(cur + 1);
    timer = setTimeout(tick, dur(items[cur - 1]));
  };
  const play = () => { playing = true; bar.classList.add('playing'); btn.innerHTML = PAUSE; btn.setAttribute('aria-label', 'Pause walkthrough');
    if (cur >= N) cur = 0; if (cur) { show(cur); timer = setTimeout(tick, dur(items[cur - 1])); } else tick(); };
  const stop = () => { playing = false; clearTimeout(timer); bar.classList.remove('playing'); btn.innerHTML = PLAY; btn.setAttribute('aria-label', 'Play walkthrough'); };
  const go = n => { stop(); show(Math.max(1, Math.min(N, n))); };
  window.__vs = { show: n => { stop(); show(n); }, stop };

  btn.addEventListener('click', () => playing ? stop() : play());
  bar.querySelectorAll('.pl-nav').forEach(b => b.addEventListener('click', () => go((cur || (b.dataset.d > 0 ? 0 : 2)) + +b.dataset.d)));
  segs.forEach((s, i) => s.addEventListener('click', () => go(i + 1)));
  bar.addEventListener('keydown', e => {
    if (e.key === 'ArrowRight') { e.preventDefault(); go(cur + 1); }
    if (e.key === 'ArrowLeft')  { e.preventDefault(); go(cur - 1); }
  });

  /* ---- hover / tap on the reading guide and the visual ---- */
  items.forEach((li, i) => {
    li.tabIndex = 0;
    li.addEventListener('mouseenter', () => set(i + 1));
    li.addEventListener('mouseleave', () => set(pinned));
    li.addEventListener('focus', () => set(i + 1));
    li.addEventListener('blur', () => set(pinned));
    li.addEventListener('click', () => { if (pinned === i + 1) { stop(); show(0); } else go(i + 1); });
  });
  svg.querySelectorAll('[data-step]').forEach(el => {
    el.addEventListener('mouseenter', () => set(+el.dataset.step.split(' ')[0]));
    el.addEventListener('mouseleave', () => set(pinned));
  });
});
</script>
</body>
</html>
