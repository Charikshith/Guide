<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>{{TITLE}}</title>
<script>
/* Theme: opens in Deep dark; the ☀/☾ button switches to light and remembers it (the device's dark mode is ignored). */
(function () {
  var d = document.documentElement;
  try { var t = localStorage.getItem('vs-theme'); if (t === 'light' || t === 'dark') d.setAttribute('data-theme', t); } catch (e) {}
  document.addEventListener('DOMContentLoaded', function () {
    var b = document.querySelector('.theme-toggle'); if (!b) return;
    var sync = function () {
      var light = d.getAttribute('data-theme') === 'light';
      b.textContent = light ? '☾' : '☀';
      b.setAttribute('aria-label', light ? 'Switch to dark theme' : 'Switch to light theme');
      b.title = light ? 'Dark theme' : 'Light theme';
    };
    sync();
    b.addEventListener('click', function () {
      var next = d.getAttribute('data-theme') === 'light' ? 'dark' : 'light';
      d.setAttribute('data-theme', next);
      try { localStorage.setItem('vs-theme', next); } catch (e) {}
      sync();
    });
  });
})();
</script>
<style>
/* ===== Tokens — default theme: Deep dark. Colours carry meaning: c1..c5 are the only accent families ===== */
:root{
  --bg:#0f1013; --surface:#1a1b20; --ink:#ededf1; --muted:#a4a6b0; --line:#34363e; --zone:#202228;
  --c1:#7aa7ff; --c1-soft:#1b2846;   /* blue   */
  --c2:#40d0a0; --c2-soft:#13332a;   /* green  */
  --c3:#f4a94e; --c3-soft:#3a2912;   /* amber  */
  --c4:#f472a8; --c4-soft:#3d1729;   /* rose   */
  --c5:#ab8dff; --c5-soft:#291f47;   /* violet */
  --on-accent:#0f1013;
  --shadow:rgba(0,0,0,.55); --mass:#555b69; --mass-shade:#383c46;
  --font:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  --mono:ui-monospace,"Cascadia Code",Consolas,Menlo,monospace;
  --r:18px;
  color-scheme:dark;
}
/* ===== Light theme (Warm paper) — via the ☀ button ===== */
:root[data-theme="light"]{
  --bg:#f4f2ec; --surface:#ffffff; --ink:#18181b; --muted:#5b5e66; --line:#d9d5cb; --zone:#ece9e1;
  --c1:#2563eb; --c1-soft:#dce7fe; --c2:#0b8a64; --c2-soft:#d2f0e4; --c3:#c76a00; --c3-soft:#fde8cc;
  --c4:#c8246b; --c4-soft:#fcdfea; --c5:#6c3fd8; --c5-soft:#e9e1fd; --on-accent:#ffffff;
  --shadow:rgba(30,25,15,.16); --mass:#ffffff; --mass-shade:#d6d2c8;
  color-scheme:light;
}
.theme-toggle{position:fixed;top:14px;right:14px;z-index:20;width:42px;height:42px;border-radius:50%;
  border:1px solid var(--line);background:var(--surface);color:var(--ink);font-size:19px;line-height:1;cursor:pointer;
  box-shadow:0 6px 16px -8px var(--shadow);transition:transform .15s}
.theme-toggle:hover{transform:scale(1.07)}
.theme-toggle:focus-visible{outline:2px solid var(--c1);outline-offset:2px}
.hand .theme-toggle{display:none}   /* handwritten style is always paper */
@media print{.theme-toggle{display:none}}

*,*::before,*::after{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.55 var(--font);-webkit-font-smoothing:antialiased}
body::before{ /* soft colour glow behind the header */
  content:"";position:fixed;inset:0 0 auto 0;height:520px;z-index:-1;pointer-events:none;
  background:radial-gradient(60% 80% at 15% 0%,var(--c1-soft),transparent 70%),
             radial-gradient(50% 70% at 90% 10%,var(--c5-soft),transparent 70%);
  opacity:.9}
.page{max-width:1040px;margin:0 auto;padding:44px 24px 56px}
@media (max-width:600px){.page{padding:24px 16px 40px}}

/* ===== Header ===== */
.eyebrow{display:inline-flex;align-items:center;gap:8px;margin:0 0 14px;padding:6px 12px 6px 10px;border-radius:999px;
  background:var(--surface);border:1px solid var(--line);font:600 12px/1 var(--font);letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.eyebrow::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--c1);box-shadow:0 0 0 3px var(--c1-soft)}
h1{font-size:clamp(30px,5vw,48px);line-height:1.08;letter-spacing:-.025em;margin:0 0 12px;font-weight:800}
h1 .accent{background:linear-gradient(90deg,var(--c1),var(--c5));-webkit-background-clip:text;background-clip:text;color:transparent}
.lede{font-size:18px;color:var(--muted);max-width:66ch;margin:0}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin:18px 0 0;padding:0;list-style:none}
.chips li{background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:5px 12px;font-size:14px;color:var(--muted)}
.chips b{color:var(--ink);font-weight:700}
h2{font-size:20px;letter-spacing:-.01em;margin:44px 0 14px;display:flex;align-items:center;gap:10px}
h2::after{content:"";flex:1;height:1px;background:var(--line)}

/* ===== Main visual ===== */
.stage{position:relative;margin:28px 0 0;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);
  padding:18px;overflow-x:auto;box-shadow:0 1px 2px var(--shadow),0 18px 40px -24px var(--shadow)}
.stage::before{ /* faint dot grid */
  content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;opacity:.55;
  background:radial-gradient(circle,var(--line) 1px,transparent 1.4px) 0 0/22px 22px}
.stage > svg{position:relative;display:block;width:100%;height:auto;overflow:visible}
.stage figcaption{position:relative;font-size:14px;color:var(--muted);margin-top:12px}
@media (max-width:600px){.stage{padding:12px}.stage > svg{min-width:640px}.stage figcaption{position:sticky;left:0}}
.scroll-hint{display:none;font-size:13px;color:var(--muted);margin:8px 0 0}
@media (max-width:600px){.scroll-hint{display:block}}

/* --- SVG vocabulary: use these classes, never hard-coded colours --- */
.node{fill:var(--surface);stroke:var(--line);stroke-width:1.5}
.node.c1{fill:url(#g-c1);stroke:var(--c1)} .node.c2{fill:url(#g-c2);stroke:var(--c2)}
.node.c3{fill:url(#g-c3);stroke:var(--c3)} .node.c4{fill:url(#g-c4);stroke:var(--c4)}
.node.c5{fill:url(#g-c5);stroke:var(--c5)}
.node.solid.c1{fill:var(--c1)} .node.solid.c2{fill:var(--c2)} .node.solid.c3{fill:var(--c3)}
.node.solid.c4{fill:var(--c4)} .node.solid.c5{fill:var(--c5)}
.lift{filter:url(#shadow)}                          /* soft drop shadow: put on a <g> or shape */
.chip{stroke:none} .chip.c1{fill:var(--c1)} .chip.c2{fill:var(--c2)} .chip.c3{fill:var(--c3)} .chip.c4{fill:var(--c4)} .chip.c5{fill:var(--c5)}
.ico{color:var(--ink)} .ico.on{color:var(--on-accent)}
.ico.c1{color:var(--c1)} .ico.c2{color:var(--c2)} .ico.c3{color:var(--c3)} .ico.c4{color:var(--c4)} .ico.c5{color:var(--c5)} .ico.muted{color:var(--muted)}
.zone{fill:var(--zone);stroke:var(--line);stroke-width:1;stroke-dasharray:5 5;fill-opacity:.7}
/* scene shapes (sky, ground, sea, body outline …): soft fills that fade */
.wash{stroke:none} .wash.c1{fill:url(#fade-c1)} .wash.c2{fill:url(#fade-c2)} .wash.c3{fill:url(#fade-c3)}
.wash.c4{fill:url(#fade-c4)} .wash.c5{fill:url(#fade-c5)} .wash.up.c1{fill:url(#rise-c1)} .wash.up.c2{fill:url(#rise-c2)}
.wash.up.c3{fill:url(#rise-c3)} .wash.up.c4{fill:url(#rise-c4)} .wash.up.c5{fill:url(#rise-c5)}
.wash.line{stroke-width:2} .wash.line.c1{stroke:var(--c1)} .wash.line.c2{stroke:var(--c2)} .wash.line.c3{stroke:var(--c3)}
.mass{fill:var(--mass);stroke:none} .mass.shade{fill:var(--mass-shade)}   /* solid soft blobs: clouds, organs, objects */
.edge{fill:none;stroke:var(--muted);stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.edge.c1{stroke:var(--c1)} .edge.c2{stroke:var(--c2)} .edge.c3{stroke:var(--c3)} .edge.c4{stroke:var(--c4)} .edge.c5{stroke:var(--c5)}
.edge.dash{stroke-dasharray:6 7}
.edge.thick{stroke-width:3.5}
.edge.flow{stroke-dasharray:7 9;animation:march 1.1s linear infinite}   /* marching dashes = something is moving */
@keyframes march{to{stroke-dashoffset:-16}}
.particle{stroke:var(--surface);stroke-width:1.5} .particle.c1{fill:var(--c1)} .particle.c2{fill:var(--c2)}
.particle.c3{fill:var(--c3)} .particle.c4{fill:var(--c4)} .particle.c5{fill:var(--c5)}
.spin{transform-box:fill-box;transform-origin:center;animation:spin 24s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.pulse{transform-box:fill-box;transform-origin:center;animation:pulse 2.4s ease-in-out infinite}
@keyframes pulse{50%{transform:scale(1.06)}}
.leader{fill:none;stroke:var(--muted);stroke-width:1.2}
.dot{fill:var(--muted)}
.t{font:600 16px var(--font);fill:var(--ink)}
.t.sub{font-weight:400;font-size:14px;fill:var(--muted)}
.t.big{font-size:20px;font-weight:800}
.t.small{font-size:13px;font-weight:600;fill:var(--muted)}
.t.on{fill:var(--on-accent)}
.t.c1{fill:var(--c1)} .t.c2{fill:var(--c2)} .t.c3{fill:var(--c3)} .t.c4{fill:var(--c4)} .t.c5{fill:var(--c5)}
.t.mono{font-family:var(--mono)}
.t.halo{paint-order:stroke;stroke:var(--surface);stroke-width:5px;stroke-linejoin:round}  /* readable over scenes/lines */
.badge circle{fill:var(--ink);stroke:var(--surface);stroke-width:2.5} .badge text{font:800 13px var(--font);fill:var(--surface)}
.badge.c1 circle{fill:var(--c1)} .badge.c2 circle{fill:var(--c2)} .badge.c3 circle{fill:var(--c3)}
.badge.c4 circle{fill:var(--c4)} .badge.c5 circle{fill:var(--c5)}
/* step focus (wired up by the script at the bottom) */
[data-step]{transition:opacity .25s}
svg.focusing [data-step]:not(.on){opacity:.18}
@media (prefers-reduced-motion:reduce){.edge.flow,.spin,.pulse{animation:none}.particle{display:none}}

/* ===== Walkthrough player (inserted by the script; no markup needed) ===== */
.player{position:relative;display:flex;flex-wrap:wrap;align-items:center;gap:10px 12px;margin-top:14px;padding:10px 14px 10px 10px;
  border:1px solid var(--line);border-radius:14px;background:var(--bg)}
@media (max-width:600px){.player{position:sticky;left:0}}
.player button{font:inherit;cursor:pointer}
.player button:focus-visible{outline:2px solid var(--c1);outline-offset:2px}
.pl-play{flex:none;width:42px;height:42px;border-radius:50%;border:0;background:var(--ink);color:var(--surface);display:grid;place-items:center;
  box-shadow:0 6px 16px -8px var(--shadow);transition:transform .15s}
.pl-play:hover{transform:scale(1.06)}
.pl-play svg{margin-left:2px} .player.playing .pl-play svg{margin-left:0}
.pl-nav{flex:none;width:32px;height:32px;border-radius:50%;border:1px solid var(--line);background:var(--surface);color:var(--ink);padding:0;display:grid;place-items:center}
.pl-track{display:flex;gap:4px;flex:none}
.pl-seg{width:34px;height:20px;padding:0;border:0;background:none;color:var(--ink)}
.pl-seg.c1{color:var(--c1)} .pl-seg.c2{color:var(--c2)} .pl-seg.c3{color:var(--c3)} .pl-seg.c4{color:var(--c4)} .pl-seg.c5{color:var(--c5)}
.pl-seg i{display:block;height:6px;border-radius:3px;background:var(--line);overflow:hidden}
.pl-seg s{display:block;height:100%;width:0;background:currentColor;text-decoration:none}
.pl-seg.done s,.pl-seg.active s{width:100%}
.player.playing .pl-seg.active s{animation:pl-fill var(--dur,4s) linear}
@keyframes pl-fill{from{width:0}to{width:100%}}
.pl-cap{flex:1 1 300px;margin:0;font-size:15px;line-height:1.45;color:var(--muted);min-height:44px;display:flex;flex-wrap:wrap;align-items:center;gap:0 6px}
.pl-cap b{color:var(--ink)}
.pl-n{font:700 12px/1 var(--font);letter-spacing:.06em;text-transform:uppercase;color:var(--surface);background:var(--muted);padding:4px 7px;border-radius:999px}
@media print{.player{display:none}}

/* ===== Reading guide: numbered steps that match the badges ===== */
.steps{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(auto-fit,minmax(176px,1fr));gap:12px;counter-reset:s}
.steps li{counter-increment:s;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px 16px 16px 54px;position:relative;
  cursor:default;transition:transform .2s,box-shadow .2s,border-color .2s;outline:none}
.steps li::before{content:counter(s);position:absolute;left:14px;top:15px;width:26px;height:26px;border-radius:50%;
  background:var(--ink);color:var(--surface);font:800 13px/26px var(--font);text-align:center}
.steps li.c1::before{background:var(--c1)} .steps li.c2::before{background:var(--c2)} .steps li.c3::before{background:var(--c3)}
.steps li.c4::before{background:var(--c4)} .steps li.c5::before{background:var(--c5)}
.steps li.on,.steps li:hover,.steps li:focus-visible{transform:translateY(-2px);border-color:var(--muted);box-shadow:0 10px 24px -14px var(--shadow)}
.steps b{display:block;margin-bottom:2px}
.steps span{color:var(--muted);font-size:15px}

/* ===== Takeaways ===== */
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:12px}
.card{position:relative;overflow:hidden;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px 16px 16px 60px}
.card::before{content:"";position:absolute;inset:0 auto 0 0;width:4px;background:var(--c1)}
.card svg{position:absolute;left:18px;top:17px;width:26px;height:26px;color:var(--c1)}
.card.c2::before{background:var(--c2)} .card.c3::before{background:var(--c3)} .card.c4::before{background:var(--c4)} .card.c5::before{background:var(--c5)}
.card.c2 svg{color:var(--c2)} .card.c3 svg{color:var(--c3)} .card.c4 svg{color:var(--c4)} .card.c5 svg{color:var(--c5)}
.card b{display:block;margin-bottom:2px}
.card p{margin:0;color:var(--muted)}

/* ===== Legend ===== */
.legend{display:flex;flex-wrap:wrap;gap:8px 20px;margin:14px 0 0;padding:0;list-style:none;font-size:14px;color:var(--muted)}
.legend li{display:flex;align-items:center;gap:8px}
.sw{width:14px;height:14px;border-radius:4px;border:1.5px solid var(--line);background:var(--surface)}
.sw.c1{background:var(--c1-soft);border-color:var(--c1)} .sw.c2{background:var(--c2-soft);border-color:var(--c2)}
.sw.c3{background:var(--c3-soft);border-color:var(--c3)} .sw.c4{background:var(--c4-soft);border-color:var(--c4)}
.sw.c5{background:var(--c5-soft);border-color:var(--c5)}
.sw.line{height:3px;border:0;border-radius:2px;background:var(--muted)}
.sw.line.c1{background:var(--c1)} .sw.line.c2{background:var(--c2)} .sw.line.c3{background:var(--c3)}
.sw.line.c4{background:var(--c4)} .sw.line.c5{background:var(--c5)}

/* ===== Footnote ===== */
.note{margin-top:32px;padding-top:14px;border-top:1px solid var(--line);font-size:14px;color:var(--muted)}
code{font-family:var(--mono);font-size:.92em;background:var(--zone);padding:1px 5px;border-radius:5px}

@media print{body{background:#fff}body::before{display:none}.stage,.steps li,.card{break-inside:avoid;box-shadow:none}}

/* ===== Diagram (drawn by the engine script — don't hand-place) ===== */
.stage > svg.dg{max-width:var(--w,100%);margin:0 auto}
@media (max-width:600px){.stage > svg.dg{min-width:min(var(--w,640px),860px)}}
.dg-edge{fill:none;stroke:var(--muted);stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.dg-edge.c1{stroke:var(--c1)} .dg-edge.c2{stroke:var(--c2)} .dg-edge.c3{stroke:var(--c3)} .dg-edge.c4{stroke:var(--c4)} .dg-edge.c5{stroke:var(--c5)}
.dg-edge.dashed{stroke-dasharray:7 7}
.dg-edge.thick{stroke-width:3.6}
.dg-lbl{font-weight:700}
.node-in{fill:none;stroke:var(--line);stroke-width:1.5;stroke-linecap:round}
.node-in.c1{stroke:var(--c1)} .node-in.c2{stroke:var(--c2)} .node-in.c3{stroke:var(--c3)} .node-in.c4{stroke:var(--c4)} .node-in.c5{stroke:var(--c5)}
/* groups: containers drawn behind their members */
.dg-box,.dg-box-sw{fill:var(--zone);fill-opacity:.55;stroke:var(--line);stroke-width:1.5;stroke-dasharray:7 6}
.dg-group.alt .dg-box{fill:var(--surface);fill-opacity:.7}
.dg-group.c1 .dg-box{fill:var(--c1-soft);fill-opacity:.45;stroke:var(--c1)} .dg-group.c2 .dg-box{fill:var(--c2-soft);fill-opacity:.45;stroke:var(--c2)}
.dg-group.c3 .dg-box{fill:var(--c3-soft);fill-opacity:.45;stroke:var(--c3)} .dg-group.c4 .dg-box{fill:var(--c4-soft);fill-opacity:.45;stroke:var(--c4)}
.dg-group.c5 .dg-box{fill:var(--c5-soft);fill-opacity:.45;stroke:var(--c5)}
.dg-gt{letter-spacing:.08em}
.dg-group.c1 .dg-gt{fill:var(--c1)} .dg-group.c2 .dg-gt{fill:var(--c2)} .dg-group.c3 .dg-gt{fill:var(--c3)} .dg-group.c4 .dg-gt{fill:var(--c4)} .dg-group.c5 .dg-gt{fill:var(--c5)}
.dg-group{cursor:pointer;outline:none} .dg-group:hover .dg-box{stroke-width:2}
.dg-group.sel .dg-box{stroke-width:2.6;stroke-dasharray:none}
.dg-group:focus-visible .dg-box{stroke-width:3;stroke:var(--ink)}
.dg-node{cursor:pointer;outline:none} .dg-node:focus-visible .node{stroke-width:3.2;stroke:var(--ink)}
.dg-node,.dg-edge-g,.dg-lbl,.dg-group{transition:opacity .25s}
/* hover a box: its arrows and neighbours stay lit */
svg.hovering .dg-node:not(.rel),svg.hovering .dg-edge-g:not(.rel),svg.hovering .dg-lbl:not(.rel){opacity:.15}
svg.hovering .dg-node.rel,svg.hovering .dg-edge-g.rel,svg.hovering .dg-lbl.rel{opacity:1!important}
svg.hovering .dg-edge-g.rel .dg-edge{stroke-width:3.2}
/* click a group: everything outside it fades; arrows that leave it stay half-lit */
svg.gfocus .dg-node:not(.in):not(.half){opacity:.18} svg.gfocus .dg-node.half{opacity:.6}
svg.gfocus .dg-edge-g:not(.in):not(.half),svg.gfocus .dg-lbl:not(.in):not(.half){opacity:.1}
svg.gfocus .dg-edge-g.half,svg.gfocus .dg-lbl.half{opacity:.5}
svg.gfocus .dg-group:not(.in){opacity:.3}
svg.gfocus .dg-node.in,svg.gfocus .dg-edge-g.in,svg.gfocus .dg-lbl.in{opacity:1!important}
/* try a flow */
svg.tracing .dg-node:not(.trace),svg.tracing .dg-edge-g:not(.trace),svg.tracing .dg-lbl:not(.trace){opacity:.14}
svg.tracing .dg-edge-g.trace .dg-edge{stroke-width:3.8}
.dg-token{fill:var(--ink);stroke:var(--surface);stroke-width:3;filter:url(#shadow)}
.dg-token.c1{fill:var(--c1)} .dg-token.c2{fill:var(--c2)} .dg-token.c3{fill:var(--c3)} .dg-token.c4{fill:var(--c4)} .dg-token.c5{fill:var(--c5)}
.dg-err{margin:0 0 12px;padding:12px 14px;border-radius:12px;border:1.5px solid var(--c4);background:var(--c4-soft);color:var(--ink);font-weight:600}
#dg-legend svg{flex:none;overflow:visible}
/* "Try a flow" */
.paths{display:flex;flex-wrap:wrap;align-items:center;gap:8px;margin:14px 0 0}
.paths:empty{display:none}
.paths-lbl{font-size:14px;font-weight:700;color:var(--muted);margin-right:2px}
.path-btn{display:inline-flex;align-items:center;gap:8px;font:600 14px var(--font);color:var(--ink);background:var(--surface);
  border:1px solid var(--line);border-radius:999px;padding:6px 12px 6px 10px;cursor:pointer;transition:border-color .2s,box-shadow .2s}
.path-btn i{width:10px;height:10px;border-radius:50%;background:var(--ink)}
.path-btn.c1 i{background:var(--c1)} .path-btn.c2 i{background:var(--c2)} .path-btn.c3 i{background:var(--c3)} .path-btn.c4 i{background:var(--c4)} .path-btn.c5 i{background:var(--c5)}
.path-btn:hover{border-color:var(--muted)}
.path-btn.on{border-color:var(--ink);box-shadow:0 0 0 2px var(--line)}
.path-btn:focus-visible{outline:2px solid var(--c1);outline-offset:2px}
.path-note{flex-basis:100%;margin:2px 0 0;font-size:14px;color:var(--muted);min-height:1.4em}
@media print{.paths{display:none}}

/* ===== Handwritten notebook style — "style": "handwritten" in the diagram spec ===== */
:root.hand.hand{   /* beats the dark-mode rules: paper stays paper */
  --bg:#e9e4d8; --surface:#fdfbf4; --ink:#1f3a93; --muted:#4a5a8a; --line:#9fb7d6; --zone:#f3eedf;
  --c1:#1f3a93; --c1-soft:rgba(64,196,255,.30);  --c2:#1e8449; --c2-soft:rgba(118,255,3,.32);
  --c3:#b9770e; --c3-soft:rgba(255,235,59,.60);  --c4:#c0392b; --c4-soft:rgba(255,128,171,.40);
  --c5:#7d3c98; --c5-soft:rgba(206,147,216,.40); --on-accent:#222; --shadow:rgba(0,0,0,.16);
  --font:'Kalam','Patrick Hand','Segoe Print','Comic Sans MS',cursive;
  --title:'Caveat','Kalam','Segoe Print','Bradley Hand',cursive;
  color-scheme:light;
}
.hand body::before{display:none}
.hand .page{margin:24px auto;padding:40px 28px 56px 88px;box-shadow:0 2px 6px rgba(0,0,0,.15),0 12px 28px rgba(0,0,0,.12);
  background:linear-gradient(90deg,transparent 62px,#e8a0a0 62px,#e8a0a0 64px,transparent 64px),
             repeating-linear-gradient(var(--surface) 0,var(--surface) 31px,#c9dcef 31px,#c9dcef 32px)}
@media (max-width:600px){.hand .page{margin:0;padding:24px 14px 40px 44px;
  background:linear-gradient(90deg,transparent 30px,#e8a0a0 30px,#e8a0a0 32px,transparent 32px),
             repeating-linear-gradient(var(--surface) 0,var(--surface) 31px,#c9dcef 31px,#c9dcef 32px)}}
.hand .eyebrow{background:none;border:0;padding:0;font:700 22px/1 var(--title);letter-spacing:0;text-transform:none;color:var(--c4)}
.hand .eyebrow::before{display:none}
.hand h1{font-family:var(--title);font-size:clamp(42px,6vw,60px);font-weight:700;letter-spacing:0;color:#222;transform:rotate(-1deg);transform-origin:left}
.hand h1 .accent{color:inherit;-webkit-background-clip:border-box;background-clip:border-box;
  background:linear-gradient(transparent 58%,var(--c3-soft) 58%,var(--c3-soft) 92%,transparent 92%)}
.hand h2{font-family:var(--title);font-size:34px;font-weight:700;color:var(--c4)}
.hand h2::before{content:"➤";font-size:22px}
.hand h2::after{display:none}
.hand .lede,.hand .note,.hand .legend{color:var(--ink)}
.hand .chips li{background:var(--c3-soft);border:0;border-radius:3px 8px 4px 9px;color:var(--ink)}
.hand .chips b{color:#222}
.hand .stage{background:transparent;border:2px dashed var(--line);box-shadow:none}
.hand .stage::before{display:none}
.hand .stage figcaption{font-family:var(--title);font-size:20px;color:#222}
/* shapes: pen sketch with highlighter fill */
.hand .lift{filter:none}
.hand .node,.hand .node-in,.hand .dg-edge,.hand .dg-box{filter:url(#rough)}
.hand .node{stroke-width:2.4}
.hand .node.c1,.hand .node.solid.c1{fill:var(--c1-soft);stroke:var(--c1)} .hand .node.c2,.hand .node.solid.c2{fill:var(--c2-soft);stroke:var(--c2)}
.hand .node.c3,.hand .node.solid.c3{fill:var(--c3-soft);stroke:var(--c3)} .hand .node.c4,.hand .node.solid.c4{fill:var(--c4-soft);stroke:var(--c4)}
.hand .node.c5,.hand .node.solid.c5{fill:var(--c5-soft);stroke:var(--c5)}
.hand .t{font-weight:400} .hand .t.on{fill:#222;font-weight:700} .hand .t.small{font-weight:700}
.hand .chip{fill:var(--surface);stroke-width:2} .hand .chip.c1{fill:var(--surface);stroke:var(--c1)} .hand .chip.c2{fill:var(--surface);stroke:var(--c2)}
.hand .chip.c3{fill:var(--surface);stroke:var(--c3)} .hand .chip.c4{fill:var(--surface);stroke:var(--c4)} .hand .chip.c5{fill:var(--surface);stroke:var(--c5)}
.hand .ico.on{color:var(--ink)}
.hand .dg-edge{stroke:#333;stroke-width:2.2}
.hand .dg-box{fill:none;stroke:var(--line);stroke-width:1.5;stroke-dasharray:6 6;opacity:1}
.hand .badge circle,.hand .badge.c1 circle,.hand .badge.c2 circle,.hand .badge.c3 circle,.hand .badge.c4 circle,.hand .badge.c5 circle{fill:var(--surface);stroke:var(--c4);stroke-width:2}
.hand .badge text{fill:var(--c4);font:700 18px var(--title)}
.hand .dg-token{fill:var(--c4)}
/* page parts: notebook boxes and sticky notes */
.hand .steps li{background:transparent;border:2px solid #222;border-radius:4px 12px 6px 14px}
.hand .steps li::before{background:none;color:var(--c4);border:2px solid var(--c4);font:700 17px/22px var(--title)}
.hand .steps b{font-family:var(--title);font-size:22px;color:#222}
.hand .steps span{color:var(--ink)}
.hand .card{background:#fff59d;border:0;border-radius:2px;box-shadow:2px 4px 8px rgba(0,0,0,.18);transform:rotate(-1deg)}
.hand .card:nth-child(2){transform:rotate(1.2deg)}
.hand .card::before{display:none}
.hand .card svg{color:var(--c4)}
.hand .card b{font-family:var(--title);font-size:24px;color:var(--c4)}
.hand .card p{color:#333}
.hand .player{background:var(--surface);border:2px solid #222;border-radius:6px 14px 8px 16px}
.hand .pl-play{background:var(--c4);color:#fff}
.hand .pl-n{background:var(--c4)}
.hand .path-btn{background:var(--surface);border:2px solid #222;font-family:var(--font);border-radius:6px 14px 8px 16px}
.hand .node-in{stroke:var(--ink);stroke-width:2}
.hand .dg-edge.c1{stroke:var(--c1)} .hand .dg-edge.c2{stroke:var(--c2)} .hand .dg-edge.c3{stroke:var(--c3)} .hand .dg-edge.c4{stroke:var(--c4)} .hand .dg-edge.c5{stroke:var(--c5)}
.hand .dg-edge.thick{stroke-width:3.4}
.hand .dg-box,.hand .dg-group.alt .dg-box{fill:none;stroke:var(--line);stroke-width:2;stroke-dasharray:8 6;opacity:1}
.hand .dg-group.c1 .dg-box{fill:var(--c1-soft);fill-opacity:.22;stroke:var(--c1)} .hand .dg-group.c2 .dg-box{fill:var(--c2-soft);fill-opacity:.22;stroke:var(--c2)}
.hand .dg-group.c3 .dg-box{fill:var(--c3-soft);fill-opacity:.22;stroke:var(--c3)} .hand .dg-group.c4 .dg-box{fill:var(--c4-soft);fill-opacity:.22;stroke:var(--c4)}
.hand .dg-group.c5 .dg-box{fill:var(--c5-soft);fill-opacity:.22;stroke:var(--c5)}
.hand .dg-gt{font:700 20px var(--title);letter-spacing:.02em;fill:var(--ink)}
.hand .dg-group.c1 .dg-gt{fill:var(--c1)} .hand .dg-group.c2 .dg-gt{fill:var(--c2)} .hand .dg-group.c3 .dg-gt{fill:var(--c3)} .hand .dg-group.c4 .dg-gt{fill:var(--c4)} .hand .dg-group.c5 .dg-gt{fill:var(--c5)}
.hand .dg-lbl{font-weight:700}
.hand .dg-box-sw{fill:none;stroke:var(--line);stroke-width:2}
.hand .path-note{color:var(--ink)}
</style>
</head>

<main class="page">

  <!-- CONTENT GOES HERE -->
</main>
<script>
/* ===== Diagram engine =====
   Reads <script type="application/json" id="dg-spec"> and draws it into <svg id="dg">.
   Groups are laid out as nested boxes (each group is laid out on its own, then placed as one block
   by its parent), so a group always encloses its members and sibling groups never overlap.
   Inside a level: layered layout (ranks = longest path, barycenter ordering, priority placement).
   Edges are routed on an orthogonal grid (Dijkstra, bend / crossing / overlap penalties) around every box.
   Exposes window.__dgErrors / __dgWarnings / __dgLayout / __dgReady for the validator. */
(() => {
  const NS = 'http://www.w3.org/2000/svg';
  const svg = document.getElementById('dg'), specEl = document.getElementById('dg-spec');
  const errors = window.__dgErrors = [], warns = window.__dgWarnings = [];
  if (!svg || !specEl) { if (svg || specEl) errors.push('need both <svg id="dg"> and <script id="dg-spec">'); return; }
  const mk = (tag, attrs, parent) => { const e = document.createElementNS(NS, tag); for (const k in attrs || {}) e.setAttribute(k, attrs[k]); if (parent) parent.appendChild(e); return e; };
  const showErrors = () => {
    const box = document.createElement('div'); box.className = 'dg-err';
    box.textContent = 'Diagram error: ' + errors.join(' · ');
    svg.parentNode.insertBefore(box, svg);
  };
  let spec;
  try { spec = JSON.parse(specEl.textContent); } catch (e) { errors.push('dg-spec is not valid JSON: ' + e.message); return showErrors(); }

  /* style: "handwritten" -> notebook look; load the handwriting fonts BEFORE measuring text */
  const hand = /hand/i.test(spec.style || '');
  if (hand) document.documentElement.classList.add('hand');
  const fontsReady = !hand ? Promise.resolve() : new Promise(res => {
    const l = document.createElement('link'); l.rel = 'stylesheet';
    l.href = 'https://fonts.googleapis.com/css2?family=Caveat:wght@400;700&family=Kalam:wght@400;700&display=swap';
    l.onload = () => Promise.all(['400 16px Kalam', '700 16px Kalam', '700 32px Caveat'].map(f => document.fonts.load(f))).catch(() => {}).then(res);
    l.onerror = res; document.head.appendChild(l);
    setTimeout(res, 2500);                 // offline: carry on with the fallback font
  });
  window.__dgReady = fontsReady.then(() => { try { draw(); } catch (e) { errors.push('engine crashed: ' + e.message); showErrors(); } });

  function draw() {
  /* ---------- 1. read the spec ---------- */
  const LR = String(spec.direction || 'LR').toUpperCase() !== 'TB';
  const KINDS = { service: 'c1', database: 'c2', queue: 'c3', user: 'c4', external: 'c5', document: 'c3', ellipse: 'c1' };
  const ICON_KINDS = ['service', 'document', 'database', 'queue'];
  const STYLES = ['solid', 'dashed', 'thick'];
  const isColor = c => /^c[1-5]$/.test(c);
  const nodes = new Map(), groups = new Map();
  const root = { id: null, items: [], isGroup: true, depth: -1, uid: 'root', lev: new Map() };
  (spec.groups || []).forEach((g, i) => {
    if (!g.id) return errors.push(`group #${i + 1} has no id`);
    if (groups.has(g.id)) return errors.push(`duplicate group id "${g.id}"`);
    if (g.color && !isColor(g.color)) errors.push(`group "${g.id}": unknown color "${g.color}" (use c1-c5)`);
    groups.set(g.id, { ...g, label: g.label || g.id, items: [], isGroup: true, uid: 'g:' + g.id, lev: new Map(), parentG: null });
  });
  groups.forEach(g => {
    if (g.parent == null) return;
    const p = groups.get(g.parent);
    if (!p) return errors.push(`group "${g.id}": parent "${g.parent}" is not in "groups"`);
    g.parentG = p;
  });
  groups.forEach(g => { let k = g, n = 0; while (k.parentG && n++ < 50) k = k.parentG; if (n >= 50) errors.push(`group "${g.id}" is inside itself (parent loop)`); });
  (spec.nodes || []).forEach((n, i) => {
    if (!n.id) return errors.push(`node #${i + 1} has no id`);
    if (nodes.has(n.id)) return errors.push(`duplicate node id "${n.id}"`);
    const kind = n.kind || 'service';
    if (!KINDS[kind]) errors.push(`node "${n.id}": unknown kind "${kind}" (use ${Object.keys(KINDS).join(', ')})`);
    if (n.color && !isColor(n.color)) errors.push(`node "${n.id}": unknown color "${n.color}" (use c1-c5)`);
    if (n.icon && !document.getElementById('i-' + n.icon)) errors.push(`node "${n.id}": unknown icon "${n.icon}"`);
    if (n.icon && !ICON_KINDS.includes(kind)) warns.push(`node "${n.id}": icons are not shown on kind "${kind}"`);
    if (n.group != null && !groups.has(n.group)) errors.push(`node "${n.id}": group "${n.group}" is not in "groups"`);
    nodes.set(n.id, { ...n, kind, label: n.label || n.id, color: n.color || KINDS[kind] || 'c1', i, uid: 'n:' + n.id, isGroup: false, parentG: groups.get(n.group) || null });
  });
  const edges = [];
  (spec.edges || []).forEach((e, i) => {
    const bad = id => !nodes.has(id);
    if (bad(e.from) || bad(e.to)) return errors.push(`edge #${i + 1} "${e.from}" → "${e.to}" uses an unknown node id` + (groups.has(e.from) || groups.has(e.to) ? ' (edges connect nodes, not groups)' : ''));
    if (e.style && !STYLES.includes(e.style)) errors.push(`edge #${i + 1}: unknown style "${e.style}" (use solid, dashed, thick)`);
    if (e.color && !isColor(e.color)) errors.push(`edge #${i + 1}: unknown color "${e.color}" (use c1-c5)`);
    if (e.from === e.to) return warns.push(`edge #${i + 1}: "${e.from}" → itself is skipped`);
    edges.push({ ...e, i, u: nodes.get(e.from), v: nodes.get(e.to) });
  });
  if (!nodes.size) errors.push('no nodes');
  if (errors.length) return showErrors();

  /* nesting: a group is registered in its parent the first time one of its members shows up */
  const chainOf = it => { const c = []; for (let k = it.parentG; k; k = k.parentG) c.unshift(k); return c; };
  const attach = (it, parent) => { if (!parent.items.includes(it)) parent.items.push(it); };
  nodes.forEach(n => {
    const ch = chainOf(n); let parent = root;
    ch.forEach((g, d) => { g.depth = d; attach(g, parent); parent = g; });
    attach(n, parent); n.depth = ch.length;
  });
  groups.forEach(g => { if (g.depth == null) warns.push(`group "${g.id}" has no nodes and is left out`); });
  const live = [...groups.values()].filter(g => g.depth != null);
  if (nodes.size > 18) warns.push(`${nodes.size} nodes is a lot - consider splitting the diagram (aim for 18 or fewer)`);

  /* ---------- 2. measure text and size the shapes ---------- */
  const meas = mk('text', { x: -9999, y: -9999 }, svg);
  const tw = (s, cls) => { meas.setAttribute('class', cls); meas.textContent = s; return meas.getComputedTextLength(); };
  const wrap = (s, max, cls) => {
    const lines = []; let cur = '';
    String(s || '').split(/\s+/).filter(Boolean).forEach(w => {
      const t = cur ? cur + ' ' + w : w;
      if (cur && tw(t, cls) > max) { lines.push(cur); cur = w; } else cur = t;
    });
    if (cur) lines.push(cur);
    if (lines.length > 1 && lines[lines.length - 1].replace(/\s/g, '').length <= 3) { const last = lines.pop(); lines[lines.length - 1] += ' ' + last; }
    return lines;
  };
  const RY = 9;   // cylinder cap height
  nodes.forEach(n => {
    const max = n.kind === 'ellipse' ? 130 : 148;
    n.tl = wrap(n.label, max, 't'); n.sl = n.sub ? wrap(n.sub, max, 't sub') : [];
    n.tw = Math.max(0, ...n.tl.map(l => tw(l, 't')), ...n.sl.map(l => tw(l, 't sub')));
    n.th = n.tl.length * 20 + n.sl.length * 18;
    n.hasIcon = !!n.icon && ICON_KINDS.includes(n.kind);
    n.pad = n.hasIcon ? 56 : 18;
    const k = n.kind;
    if (k === 'database') { n.w = Math.max(112, n.tw + n.pad + 22); n.h = Math.max(70, n.th + 2 * RY + 20); }
    else if (k === 'queue') { n.w = Math.max(124, n.tw + n.pad + 38); n.h = Math.max(54, n.th + 26); }
    else if (k === 'user') { n.body = Math.max(44, n.th + 18); n.w = Math.max(96, n.tw + 30); n.h = 30 + n.body; }
    else if (k === 'external') { n.w = Math.max(150, n.tw / .62 + 12); n.h = Math.max(80, n.th / .5 + 16); }
    else if (k === 'ellipse') { n.w = Math.max(120, (n.tw + 14) * 1.4); n.h = Math.max(60, (n.th + 8) * 1.5); }
    else if (k === 'document') { n.w = Math.max(112, n.tw + n.pad + 24); n.h = Math.max(58, n.th + 30); }
    else { n.w = Math.max(112, n.tw + n.pad + 22); n.h = Math.max(54, n.th + 26); }
    n.w = Math.ceil(n.w); n.h = Math.ceil(n.h);
  });
  live.forEach(g => { g.titleW = tw((g.label || '').toUpperCase(), 't small dg-gt') + 8; });
  edges.forEach(e => { e.lw = e.label ? tw(e.label, 't small halo dg-lbl') : 0; });
  meas.remove();

  /* ---------- 3. each edge belongs to the lowest group that holds both ends ---------- */
  edges.forEach(e => {
    const cu = [root, ...chainOf(e.u), e.u], cv = [root, ...chainOf(e.v), e.v];
    let k = 0; while (k < cu.length - 1 && k < cv.length - 1 && cu[k + 1] === cv[k + 1]) k++;
    e.lca = cu[k]; e.iu = cu[k + 1]; e.iv = cv[k + 1];
    const key = e.iu.uid + '>' + e.iv.uid, L = e.lca.lev;
    if (!L.has(key)) L.set(key, { u: e.iu, v: e.iv, lw: 0, i: e.i }); const le = L.get(key); le.lw = Math.max(le.lw, e.lw);
  });

  /* ---------- 4. layered layout of one level (items = nodes or whole groups) ---------- */
  const GB = 38, GA = 62, DUMMY = 26;
  const avg = a => a.reduce((s, x) => s + x, 0) / a.length;
  function layered(items, ledges) {
    const da = it => LR ? it.w : it.h, db = it => LR ? it.h : it.w;
    items.forEach((it, i) => { it.oo = []; it.oi = []; it.ord0 = i; });
    ledges.forEach(e => { e.u.oo.push(e); e.v.oi.push(e); });
    const state = new Map(); let disc = 0;
    const dfs = it => { state.set(it, 1); it.disc = disc++; it.oo.forEach(e => { const s = state.get(e.v); if (s === 1) e.back = true; else if (!s) dfs(e.v); }); state.set(it, 2); };
    items.filter(it => !it.oi.length).forEach(it => { if (!state.get(it)) dfs(it); });
    items.forEach(it => { if (!state.get(it)) dfs(it); });
    const fwd = ledges.filter(e => !e.back);
    // ranks = longest path
    const indeg = new Map(items.map(it => [it, 0])); fwd.forEach(e => indeg.set(e.v, indeg.get(e.v) + 1));
    items.forEach(it => it.rank = 0);
    const q = items.filter(it => !indeg.get(it)).sort((a, b) => a.disc - b.disc);
    while (q.length) { const it = q.shift(); it.oo.forEach(e => { if (e.back) return; e.v.rank = Math.max(e.v.rank, it.rank + 1); indeg.set(e.v, indeg.get(e.v) - 1); if (!indeg.get(e.v)) q.push(e.v); }); }
    // sources move right next to what they feed
    items.filter(it => !it.oi.length && it.oo.some(e => !e.back)).forEach(it => { it.rank = Math.max(0, Math.min(...it.oo.filter(e => !e.back).map(e => e.v.rank)) - 1); });
    const R = Math.max(...items.map(it => it.rank)) + 1;
    // vertices: items + dummies for long edges
    const V = [], layers = Array.from({ length: R }, () => []);
    const link = (p, c, e) => { p.succs.push({ v: c, e }); c.preds.push({ v: p, e }); };
    items.forEach(it => { it.vx = { item: it, rank: it.rank, da: da(it), db: db(it), preds: [], succs: [], disc: it.disc }; V.push(it.vx); });
    fwd.forEach(e => {
      const a = e.u.vx, b = e.v.vx; let prev = a;
      for (let r = a.rank + 1; r < b.rank; r++) { const d = { item: null, rank: r, da: 0, db: DUMMY, preds: [], succs: [], disc: a.disc + .5 + e.i * 1e-3 }; V.push(d); link(prev, d, e); prev = d; }
      link(prev, b, e);
    });
    V.forEach(v => layers[v.rank].push(v));
    const reindex = L => L.forEach((v, i) => v.o = i);
    layers.forEach(L => { L.sort((a, b) => a.disc - b.disc); reindex(L); });
    for (let it = 0; it < 8; it++) {
      for (let r = 1; r < R; r++) { layers[r].forEach(v => v.bc = v.preds.length ? avg(v.preds.map(p => p.v.o)) : v.o); layers[r].sort((a, b) => a.bc - b.bc || a.disc - b.disc); reindex(layers[r]); }
      for (let r = R - 2; r >= 0; r--) { layers[r].forEach(v => v.bc = v.succs.length ? avg(v.succs.map(s => s.v.o)) : v.o); layers[r].sort((a, b) => a.bc - b.bc || a.disc - b.disc); reindex(layers[r]); }
    }
    // across-axis placement (priority method)
    layers.forEach(L => { let x = 0; L.forEach(v => { v.b = x + v.db / 2; x += v.db + GB; }); const off = x / 2; L.forEach(v => v.b -= off); });
    const place = (L, want, prio) => {
      const x = new Array(L.length).fill(null);
      [...L.keys()].sort((a, b) => prio(L[b]) - prio(L[a]) || a - b).forEach(i => {
        let lo = -Infinity, hi = Infinity, acc = L[i].db / 2;
        for (let j = i - 1; j >= 0; j--) { if (x[j] !== null) { lo = x[j] + L[j].db / 2 + GB + acc; break; } acc += L[j].db + GB; }
        acc = L[i].db / 2;
        for (let j = i + 1; j < L.length; j++) { if (x[j] !== null) { hi = x[j] - L[j].db / 2 - GB - acc; break; } acc += L[j].db + GB; }
        x[i] = lo > hi ? lo : Math.min(Math.max(want(L[i]), lo), hi);
      });
      L.forEach((v, i) => v.b = x[i]);
    };
    const first = (arr, key) => arr.find(p => p.e.first) || arr[0];
    const down = v => v.preds.length ? avg(v.preds.map(p => p.v.b)) : v.b;
    const up = v => v.succs.length ? avg(v.succs.map(s => s.v.b)) : v.b;
    const pDown = v => (v.item ? 0 : 200) + v.preds.length * 10, pUp = v => (v.item ? 0 : 200) + v.succs.length * 10;
    for (const pass of ['d', 'u', 'd', 'u', 'd']) {
      if (pass === 'd') for (let r = 1; r < R; r++) place(layers[r], down, pDown);
      else for (let r = R - 2; r >= 0; r--) place(layers[r], up, pUp);
    }
    let minB = Infinity, maxB = -Infinity;
    V.forEach(v => { minB = Math.min(minB, v.b - v.db / 2); maxB = Math.max(maxB, v.b + v.db / 2); });
    // along-axis placement: rank thickness + a gap wide enough for the edge labels in it
    const thick = layers.map(L => Math.max(0, ...L.map(v => v.da)));
    const gap = []; for (let r = 0; r < R - 1; r++) gap[r] = GA;
    if (LR) fwd.forEach(e => { for (let r = e.u.rank; r < e.v.rank; r++) gap[r] = Math.max(gap[r], e.lw + 38); });
    const a0 = []; let a = 0; for (let r = 0; r < R; r++) { a0[r] = a; a += thick[r] + (gap[r] || 0); }

      p.setAttribute('transform', `translate(${x} ${y}) scale(${w} ${h})`);
      p.setAttribute('d', 'M.22 1C.08 1 .0 .78 .1 .6C.04 .4 .2 .3 .32 .36C.36 .1 .62 .02 .7 .26C.86 .16 1 .34 .92 .56C1 .72 .92 1 .78 1Z');
    } else if (k === 'ellipse') {
      mk('ellipse', { class: `node ${color}`, cx, cy, rx: w / 2, ry: h / 2 }, L);
    } else if (k === 'document') {
      mk('path', { class: `node ${color}`, 'stroke-linejoin': 'round', d: `M${x} ${y}H${x1 - 16}L${x1} ${y + 16}V${y1}H${x}Z` }, L);
      mk('path', { class: `node-in ${color}`, d: `M${x1 - 16} ${y}V${y + 16}H${x1}` }, L);
    } else mk('rect', { class: `node ${color}`, x, y, width: w, height: h, rx: 14 }, L);
  };
  [...nodes.values()].sort((a, b) => a.i - b.i).forEach(n => {
    const g = mk('g', { class: 'dg-node', 'data-id': n.id, tabindex: 0, 'aria-label': n.label }, gN); n.el = g;
    if (n.step != null) g.setAttribute('data-step', String(n.step));
    const L = mk('g', { class: 'lift' }, g), x0 = n.x, cx = n.x + n.w / 2;
    shape(n, L);
    let ty = n.y + n.h / 2, tx = cx, anchor = 'middle';
    if (n.kind === 'database') ty += RY / 2; else if (n.kind === 'user') ty = n.y + 30 + n.body / 2;
    if (n.hasIcon) {
      const ix = x0 + (n.kind === 'queue' ? 34 : 29);
      mk('circle', { class: `chip ${n.color}`, cx: ix, cy: ty, r: 17 }, L);
      mk('use', { href: '#i-' + n.icon, class: 'ico on', x: ix - 10, y: ty - 10, width: 20, height: 20 }, L);
      tx = x0 + n.pad + (n.kind === 'queue' ? 16 : 0); anchor = 'start';
    } else if (n.kind === 'queue') tx = cx - 6;
    const t = mk('text', { 'text-anchor': anchor }, L); let yy = ty - n.th / 2;
    n.tl.forEach(s => { yy += 20; const sp = mk('tspan', { class: 't', x: tx, y: yy - 5 }, t); sp.textContent = s; });
    n.sl.forEach(s => { yy += 18; const sp = mk('tspan', { class: 't sub', x: tx, y: yy - 4.5 }, t); sp.textContent = s; });
    if (n.step != null && !badged.has(String(n.step))) {
      badged.add(String(n.step));
      const [bx, by] = n.kind === 'user' ? [n.x + 2, n.y + 32] : n.kind === 'external' ? [n.x + n.w * .13, n.y + n.h * .22] : n.kind === 'ellipse' ? [n.x + n.w * .14, n.y + n.h * .16] : n.kind === 'database' ? [n.x, n.y + RY + 2] : [n.x, n.y];
      const b = mk('g', { class: `badge ${n.color}`, transform: `translate(${bx.toFixed(1)},${by.toFixed(1)})` }, gB);
      mk('circle', { r: 13 }, b); const bt = mk('text', { 'text-anchor': 'middle', dy: 4.5 }, b); bt.textContent = n.step;
    }
  });

  /* ---------- 8. fit the viewBox ---------- */
  const bb = rootG.getBBox(), P = 26;
  const W = bb.width + P * 2, H = bb.height + P * 2;
  svg.setAttribute('viewBox', `${(bb.x - P).toFixed(1)} ${(bb.y - P).toFixed(1)} ${W.toFixed(1)} ${H.toFixed(1)}`);
  svg.style.setProperty('--w', W.toFixed(0) + 'px');
  const parents = id => { const c = []; for (let k = nodes.get(id).parentG; k; k = k.parentG) c.push(k.id); return c; };
  window.__dgLayout = {
    nodes: [...nodes.values()].map(n => ({ id: n.id, x: n.x, y: n.y, w: n.w, h: n.h, group: n.group || null })),
    groups: live.map(g => ({ id: g.id, parent: g.parent || null, x: g.x, y: g.y, w: g.w, h: g.h, title: { x: g.x + 8, y: g.y + 8, w: g.titleW + 16, h: 26 } })),
    edges: edges.map(e => ({ from: e.from, to: e.to, pts: e.pts })),
    labels: edges.filter(e => e.lbl).map(e => { const b = e.lbl.getBBox(); return { text: e.label, x: b.x, y: b.y, w: b.width, h: b.height }; })
  };

  /* ---------- 9. legend ---------- */
  const leg = document.getElementById('dg-legend');
  if (leg) {
    const sw = {
      service: ['<rect x="2" y="3" width="24" height="14" rx="4" class="node c1"/>', 'Service / component'],
      database: ['<path d="M4 6V15A10 3 0 0 0 24 15V6Z" class="node c2"/><ellipse cx="14" cy="6" rx="10" ry="3" class="node c2"/>', 'Database / storage'],
      queue: ['<path d="M6 3H22A4 7 0 0 1 22 17H6A4 7 0 0 1 6 3Z" class="node c3"/>', 'Queue'],
      user: ['<rect x="3" y="9" width="22" height="9" rx="4" class="node c4"/><circle cx="14" cy="5" r="4" class="node c4"/>', 'Person'],
      external: ['<path d="M7 17C3 17 1 13 4 11C3 7 8 5 11 7C13 2 20 3 21 8C26 8 27 15 22 17Z" class="node c5"/>', 'Outside service'],
      document: ['<path d="M5 2H18L23 7V18H5Z" class="node c3"/>', 'Document / file'],
      ellipse: ['<ellipse cx="14" cy="10" rx="12" ry="7" class="node c1"/>', 'Concept / part']
    };
    const used = new Set([...nodes.values()].map(n => n.kind));
    let html = Object.keys(sw).filter(k => used.has(k)).map(k => `<li><svg width="28" height="20" viewBox="0 0 28 20">${sw[k][0]}</svg>${sw[k][1]}</li>`).join('');
    const sty = new Set(edges.map(e => e.style || 'solid'));
    if (sty.has('dashed')) html += '<li><svg width="28" height="20" viewBox="0 0 28 20"><path d="M2 10H26" class="dg-edge dashed"/></svg>Optional / indirect</li>';
    if (sty.has('thick')) html += '<li><svg width="28" height="20" viewBox="0 0 28 20"><path d="M2 10H26" class="dg-edge thick"/></svg>Main flow</li>';
    if (edges.some(e => e.both)) html += '<li><svg width="28" height="20" viewBox="0 0 28 20"><path d="M6 10H22M9 6L4 10L9 14M19 6L24 10L19 14" class="dg-edge"/></svg>Both directions</li>';
    if (live.length) html += '<li><svg width="28" height="20" viewBox="0 0 28 20"><rect x="2" y="2" width="24" height="16" rx="5" class="dg-box-sw"/></svg>Group (click to focus)</li>';
    leg.innerHTML = html + (spec.legend || []).map(l => `<li><span class="sw ${l.color || ''}"></span>${l.label}</li>`).join('');
  }

  /* ---------- 10. hover, group focus, "Try a flow" ---------- */
  const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
  const box = document.getElementById('dg-flows');
  const flows = spec.flows || spec.paths || [];
  const HINT = live.length ? 'Hover a box to see what it connects to. Click a group to focus on it.' : 'Hover a box to see what it connects to.';
  let note = null, pinned = null, focusG = null, active = null, token = null, raf = 0;
  if (box) {
    box.innerHTML = (flows.length ? '<span class="paths-lbl">Try a flow:</span>' + flows.map((p, i) => `<button type="button" class="path-btn ${p.color || ''}" data-i="${i}"><i></i>${p.name}</button>`).join('') : '') + `<p class="path-note" aria-live="polite"></p>`;
    note = box.querySelector('.path-note'); note.textContent = HINT;
  }
  const say = t => { if (note) note.textContent = t || HINT; };
  const clearCls = (cls) => svg.querySelectorAll('.' + cls).forEach(el => el.classList.remove(cls));
  const hover = id => {
    clearCls('rel'); svg.classList.toggle('hovering', id != null);
    if (id == null) return;
    const n = nodes.get(id); n.el.classList.add('rel');
    edges.forEach(e => { if (e.from === id || e.to === id) { e.g.classList.add('rel'); e.lbl?.classList.add('rel'); (e.from === id ? e.v : e.u).el.classList.add('rel'); } });
  };
  const focusGroup = gid => {
    clearCls('in'); clearCls('half'); clearCls('sel'); focusG = gid; svg.classList.toggle('gfocus', gid != null);
    if (gid == null) return say();
    const g = groups.get(gid);
    live.forEach(o => { if (o === g || isIn({ parentG: o }, g) || isIn({ parentG: g }, o)) o.el.classList.add('in'); });
    g.el.classList.add('sel');
    nodes.forEach(n => { if (isIn(n, g)) n.el.classList.add('in'); });
    edges.forEach(e => { const a = isIn(e.u, g), b = isIn(e.v, g); if (a && b) { e.g.classList.add('in'); e.lbl?.classList.add('in'); } else if (a || b) { e.g.classList.add('half'); e.lbl?.classList.add('half'); (a ? e.v : e.u).el.classList.add('half'); } });
    say(g.note ? `${g.label}: ${g.note}` : `${g.label}: ${[...nodes.values()].filter(n => isIn(n, g)).map(n => n.label).join(', ')}.`);
  };
  nodes.forEach(n => {
    n.el.addEventListener('mouseenter', () => { if (pinned == null) hover(n.id); });
    n.el.addEventListener('mouseleave', () => { hover(pinned); });
    n.el.addEventListener('focus', () => { if (pinned == null) hover(n.id); });
    n.el.addEventListener('blur', () => hover(pinned));
    n.el.addEventListener('click', ev => { ev.stopPropagation(); pinned = pinned === n.id ? null : n.id; hover(pinned); });
    n.el.addEventListener('keydown', ev => { if (ev.key === 'Enter' || ev.key === ' ') { ev.preventDefault(); n.el.dispatchEvent(new MouseEvent('click')); } });
  });
  live.forEach(g => {
    const go = ev => { ev.stopPropagation(); focusGroup(focusG === g.id ? null : g.id); };
    g.el.addEventListener('click', go);
    g.el.addEventListener('keydown', ev => { if (ev.key === 'Enter' || ev.key === ' ') { ev.preventDefault(); go(ev); } });
  });
  svg.addEventListener('click', () => { pinned = null; hover(null); focusGroup(null); });
  document.addEventListener('keydown', ev => { if (ev.key === 'Escape') { pinned = null; hover(null); focusGroup(null); clearFlow(); } });

  const edgeFor = (a, b) => { const f = edges.find(e => e.from === a && e.to === b); if (f) return { e: f, rev: false }; const r = edges.find(e => e.both && e.from === b && e.to === a); return r ? { e: r, rev: true } : null; };
  const clearFlow = () => {
    cancelAnimationFrame(raf); token?.remove(); token = null; active = null;
    svg.classList.remove('tracing'); clearCls('trace');
    box?.querySelectorAll('.path-btn').forEach(b => b.classList.remove('on')); if (note && !focusG) say();
  };
  if (box && flows.length) {
    flows.forEach(p => (p.nodes || []).forEach((id, i) => { if (!nodes.has(id)) warns.push(`flow "${p.name}": unknown node "${id}"`); else if (i && nodes.has(p.nodes[i - 1]) && !edgeFor(p.nodes[i - 1], id)) warns.push(`flow "${p.name}": no arrow from "${p.nodes[i - 1]}" to "${id}"`); }));
    const run = i => {
      if (active === i) return clearFlow();
      clearFlow(); pinned = null; hover(null); focusGroup(null); active = i;
      const p = flows[i]; box.querySelector(`[data-i="${i}"]`).classList.add('on'); note.textContent = p.note || '';
      svg.classList.add('tracing'); const pts = [];
      (p.nodes || []).forEach((id, k) => {
        nodes.get(id)?.el.classList.add('trace');
        if (!k) return; const f = edgeFor(p.nodes[k - 1], id);
        if (f) { f.e.g.classList.add('trace'); f.e.lbl?.classList.add('trace'); pts.push(...(f.rev ? [...f.e.pts].reverse() : f.e.pts)); }
      });
      if (reduce || pts.length < 2) return;
      const guide = mk('path', { d: rounded(clean(pts), 10), fill: 'none', stroke: 'none' }, rootG);
      const len = guide.getTotalLength(), speed = 260, t0 = performance.now();
      token = mk('circle', { class: 'dg-token ' + (p.color || ''), r: 8 }, rootG);
      const step = now => {
        const d = Math.min(len, (now - t0) / 1000 * speed), q = guide.getPointAtLength(d);
        token.setAttribute('cx', q.x); token.setAttribute('cy', q.y);
        if (d < len) raf = requestAnimationFrame(step); else guide.remove();
      };
      raf = requestAnimationFrame(step);
    };
    box.querySelectorAll('.path-btn').forEach(b => b.addEventListener('click', () => run(+b.dataset.i)));
    document.addEventListener('click', ev => { if (ev.target.closest('.player') && active != null) clearFlow(); }, true);
  }
  }
})();
</script>
<script>
/* Step focus + walkthrough player. Built automatically from the first .stage svg and ol.steps:
   - hovering / tapping step N highlights every [data-step~="N"] element (and vice versa);
   - a player bar (play/pause, prev/next, progress, caption) is inserted inside the stage.
   No dependencies; nothing to add to the content markup. */
(window.__dgReady || Promise.resolve()).then(() => {
  const svg = document.querySelector('.stage > svg'), items = [...document.querySelectorAll('ol.steps > li')];
  if (!svg || !items.length) return;
  const N = items.length, fig = svg.closest('.stage');
  let pinned = null, cur = 0, playing = false, timer = null;
  const set = n => {
    svg.classList.toggle('focusing', n != null);
    svg.querySelectorAll('[data-step]').forEach(el => el.classList.toggle('on', n != null && el.dataset.step.split(' ').includes(String(n))));
    items.forEach((li, i) => li.classList.toggle('on', n === i + 1));
  };

  /* ---- player UI ---- */
  const PLAY = '<svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path d="M8 5.5v13l10.5-6.5z" fill="currentColor"/></svg>';
  const PAUSE = '<svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path d="M7 5h3.5v14H7zM13.5 5H17v14h-3.5z" fill="currentColor"/></svg>';
  const title = li => (li.querySelector('b')?.textContent || '').trim();
  const body = li => (li.querySelector('span')?.textContent || li.textContent.replace(title(li), '')).trim();
  const bar = document.createElement('div');
  bar.className = 'player';
  bar.innerHTML = `<button class="pl-play" type="button" aria-label="Play walkthrough">${PLAY}</button>
    <button class="pl-nav" type="button" data-d="-1" aria-label="Previous step"><svg viewBox="0 0 24 24" width="16" height="16" aria-hidden="true"><path d="M15 5l-7 7 7 7" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
    <button class="pl-nav" type="button" data-d="1" aria-label="Next step"><svg viewBox="0 0 24 24" width="16" height="16" aria-hidden="true"><path d="M9 5l7 7-7 7" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
    <div class="pl-track">${items.map((li, i) => `<button class="pl-seg ${li.className}" type="button" aria-label="Step ${i + 1}: ${title(li)}"><i><s></s></i></button>`).join('')}</div>
    <p class="pl-cap" aria-live="polite"><span class="pl-n">${N} steps</span><b>Walkthrough</b> Press play to go through it step by step.</p>`;
  fig.insertBefore(bar, fig.querySelector('figcaption'));
  const btn = bar.querySelector('.pl-play'), segs = [...bar.querySelectorAll('.pl-seg')], cap = bar.querySelector('.pl-cap');
  const dur = li => Math.min(9000, Math.max(3500, body(li).split(/\s+/).length * 280));

  const show = n => {
    cur = n; pinned = n || null; set(pinned);
    segs.forEach((s, i) => {
      s.classList.toggle('done', i + 1 < n);
      s.classList.remove('active'); void s.offsetWidth;        // restart the fill animation
      s.classList.toggle('active', i + 1 === n);
      s.style.setProperty('--dur', n ? dur(items[n - 1]) + 'ms' : '0ms');
    });
    cap.innerHTML = n
      ? `<span class="pl-n">${n} / ${N}</span><b>${title(items[n - 1])}</b> ${body(items[n - 1])}`
      : `<span class="pl-n">${N} steps</span><b>Walkthrough</b> Press play to go through it step by step.`;
  };
  const tick = () => {
    if (cur >= N) { stop(); show(0); cap.innerHTML = `<span class="pl-n">done</span><b>That's all ${N} steps.</b> Press play to watch again.`; return; }
    show(cur + 1);
    timer = setTimeout(tick, dur(items[cur - 1]));
  };
  const play = () => { playing = true; bar.classList.add('playing'); btn.innerHTML = PAUSE; btn.setAttribute('aria-label', 'Pause walkthrough');
    if (cur >= N) cur = 0; if (cur) { show(cur); timer = setTimeout(tick, dur(items[cur - 1])); } else tick(); };
  const stop = () => { playing = false; clearTimeout(timer); bar.classList.remove('playing'); btn.innerHTML = PLAY; btn.setAttribute('aria-label', 'Play walkthrough'); };
  const go = n => { stop(); show(Math.max(1, Math.min(N, n))); };

  btn.addEventListener('click', () => playing ? stop() : play());
  bar.querySelectorAll('.pl-nav').forEach(b => b.addEventListener('click', () => go((cur || (b.dataset.d > 0 ? 0 : 2)) + +b.dataset.d)));
  segs.forEach((s, i) => s.addEventListener('click', () => go(i + 1)));
  bar.addEventListener('keydown', e => {
    if (e.key === 'ArrowRight') { e.preventDefault(); go(cur + 1); }
    if (e.key === 'ArrowLeft')  { e.preventDefault(); go(cur - 1); }
  });

  /* ---- hover / tap on the reading guide and the visual ---- */
  items.forEach((li, i) => {
    li.tabIndex = 0;
    li.addEventListener('mouseenter', () => set(i + 1));
    li.addEventListener('mouseleave', () => set(pinned));
    li.addEventListener('focus', () => set(i + 1));
    li.addEventListener('blur', () => set(pinned));
    li.addEventListener('click', () => { if (pinned === i + 1) { stop(); show(0); } else go(i + 1); });
  });
  svg.querySelectorAll('[data-step]').forEach(el => {
    el.addEventListener('mouseenter', () => set(+el.dataset.step.split(' ')[0]));
    el.addEventListener('mouseleave', () => set(pinned));
  });
});
</script>
</body>
