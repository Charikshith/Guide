<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>{{TITLE}}</title>
<script>
/* Theme: opens in Deep dark; the ☀/☾ button switches to light and remembers it (the device's dark mode is ignored). */
(function () {
  var d = document.documentElement;
  try { var t = localStorage.getItem('vs-theme'); if (t === 'light' || t === 'dark') d.setAttribute('data-theme', t); } catch (e) {}
  document.addEventListener('DOMContentLoaded', function () {
    var b = document.querySelector('.theme-toggle'); if (!b) return;
    var sync = function () {
      var light = d.getAttribute('data-theme') === 'light';
      b.textContent = light ? '☾' : '☀';
      b.setAttribute('aria-label', light ? 'Switch to dark theme' : 'Switch to light theme');
      b.title = light ? 'Dark theme' : 'Light theme';
    };
    sync();
    b.addEventListener('click', function () {
      var next = d.getAttribute('data-theme') === 'light' ? 'dark' : 'light';
      d.setAttribute('data-theme', next);
      try { localStorage.setItem('vs-theme', next); } catch (e) {}
      sync();
    });
  });
})();
</script>
<style>
/* ===== Tokens — default theme: Deep dark. Colours carry meaning: c1..c5 are the only accent families ===== */
:root{
  --bg:#0f1013; --surface:#1a1b20; --ink:#ededf1; --muted:#a4a6b0; --line:#34363e; --zone:#202228;
  --c1:#7aa7ff; --c1-soft:#1b2846;   /* blue   */
  --c2:#40d0a0; --c2-soft:#13332a;   /* green  */
  --c3:#f4a94e; --c3-soft:#3a2912;   /* amber  */
  --c4:#f472a8; --c4-soft:#3d1729;   /* rose   */
  --c5:#ab8dff; --c5-soft:#291f47;   /* violet */
  --on-accent:#0f1013;
  --shadow:rgba(0,0,0,.55); --mass:#555b69; --mass-shade:#383c46;
  --font:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  --mono:ui-monospace,"Cascadia Code",Consolas,Menlo,monospace;
  --r:18px;
  color-scheme:dark;
}
/* ===== Light theme (Warm paper) — via the ☀ button ===== */
:root[data-theme="light"]{
  --bg:#f4f2ec; --surface:#ffffff; --ink:#18181b; --muted:#5b5e66; --line:#d9d5cb; --zone:#ece9e1;
  --c1:#2563eb; --c1-soft:#dce7fe; --c2:#0b8a64; --c2-soft:#d2f0e4; --c3:#c76a00; --c3-soft:#fde8cc;
  --c4:#c8246b; --c4-soft:#fcdfea; --c5:#6c3fd8; --c5-soft:#e9e1fd; --on-accent:#ffffff;
  --shadow:rgba(30,25,15,.16); --mass:#ffffff; --mass-shade:#d6d2c8;
  color-scheme:light;
}
.theme-toggle{position:fixed;top:14px;right:14px;z-index:20;width:42px;height:42px;border-radius:50%;
  border:1px solid var(--line);background:var(--surface);color:var(--ink);font-size:19px;line-height:1;cursor:pointer;
  box-shadow:0 6px 16px -8px var(--shadow);transition:transform .15s}
.theme-toggle:hover{transform:scale(1.07)}
.theme-toggle:focus-visible{outline:2px solid var(--c1);outline-offset:2px}
.hand .theme-toggle{display:none}   /* handwritten style is always paper */
@media print{.theme-toggle{display:none}}

*,*::before,*::after{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.55 var(--font);-webkit-font-smoothing:antialiased}
body::before{ /* soft colour glow behind the header */
  content:"";position:fixed;inset:0 0 auto 0;height:520px;z-index:-1;pointer-events:none;
  background:radial-gradient(60% 80% at 15% 0%,var(--c1-soft),transparent 70%),
             radial-gradient(50% 70% at 90% 10%,var(--c5-soft),transparent 70%);
  opacity:.9}
.page{max-width:1040px;margin:0 auto;padding:44px 24px 56px}
@media (max-width:600px){.page{padding:24px 16px 40px}}

/* ===== Header ===== */
.eyebrow{display:inline-flex;align-items:center;gap:8px;margin:0 0 14px;padding:6px 12px 6px 10px;border-radius:999px;
  background:var(--surface);border:1px solid var(--line);font:600 12px/1 var(--font);letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.eyebrow::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--c1);box-shadow:0 0 0 3px var(--c1-soft)}
h1{font-size:clamp(30px,5vw,48px);line-height:1.08;letter-spacing:-.025em;margin:0 0 12px;font-weight:800}
h1 .accent{background:linear-gradient(90deg,var(--c1),var(--c5));-webkit-background-clip:text;background-clip:text;color:transparent}
.lede{font-size:18px;color:var(--muted);max-width:66ch;margin:0}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin:18px 0 0;padding:0;list-style:none}
.chips li{background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:5px 12px;font-size:14px;color:var(--muted)}
.chips b{color:var(--ink);font-weight:700}
h2{font-size:20px;letter-spacing:-.01em;margin:44px 0 14px;display:flex;align-items:center;gap:10px}
h2::after{content:"";flex:1;height:1px;background:var(--line)}

/* ===== Main visual ===== */
.stage{position:relative;margin:28px 0 0;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);
  padding:18px;overflow-x:auto;box-shadow:0 1px 2px var(--shadow),0 18px 40px -24px var(--shadow)}
.stage::before{ /* faint dot grid */
  content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;opacity:.55;
  background:radial-gradient(circle,var(--line) 1px,transparent 1.4px) 0 0/22px 22px}
.stage > svg{position:relative;display:block;width:100%;height:auto;overflow:visible}
.stage figcaption{position:relative;font-size:14px;color:var(--muted);margin-top:12px}
@media (max-width:600px){.stage{padding:12px}.stage > svg{min-width:640px}.stage figcaption{position:sticky;left:0}}
.scroll-hint{display:none;font-size:13px;color:var(--muted);margin:8px 0 0}
@media (max-width:600px){.scroll-hint{display:block}}

/* --- SVG vocabulary: use these classes, never hard-coded colours --- */
.node{fill:var(--surface);stroke:var(--line);stroke-width:1.5}
.node.c1{fill:url(#g-c1);stroke:var(--c1)} .node.c2{fill:url(#g-c2);stroke:var(--c2)}
.node.c3{fill:url(#g-c3);stroke:var(--c3)} .node.c4{fill:url(#g-c4);stroke:var(--c4)}
.node.c5{fill:url(#g-c5);stroke:var(--c5)}
.node.solid.c1{fill:var(--c1)} .node.solid.c2{fill:var(--c2)} .node.solid.c3{fill:var(--c3)}
.node.solid.c4{fill:var(--c4)} .node.solid.c5{fill:var(--c5)}
.lift{filter:url(#shadow)}                          /* soft drop shadow: put on a <g> or shape */
.chip{stroke:none} .chip.c1{fill:var(--c1)} .chip.c2{fill:var(--c2)} .chip.c3{fill:var(--c3)} .chip.c4{fill:var(--c4)} .chip.c5{fill:var(--c5)}
.ico{color:var(--ink)} .ico.on{color:var(--on-accent)}
.ico.c1{color:var(--c1)} .ico.c2{color:var(--c2)} .ico.c3{color:var(--c3)} .ico.c4{color:var(--c4)} .ico.c5{color:var(--c5)} .ico.muted{color:var(--muted)}
.zone{fill:var(--zone);stroke:var(--line);stroke-width:1;stroke-dasharray:5 5;fill-opacity:.7}
/* scene shapes (sky, ground, sea, body outline …): soft fills that fade */
.wash{stroke:none} .wash.c1{fill:url(#fade-c1)} .wash.c2{fill:url(#fade-c2)} .wash.c3{fill:url(#fade-c3)}
.wash.c4{fill:url(#fade-c4)} .wash.c5{fill:url(#fade-c5)} .wash.up.c1{fill:url(#rise-c1)} .wash.up.c2{fill:url(#rise-c2)}
.wash.up.c3{fill:url(#rise-c3)} .wash.up.c4{fill:url(#rise-c4)} .wash.up.c5{fill:url(#rise-c5)}
.wash.line{stroke-width:2} .wash.line.c1{stroke:var(--c1)} .wash.line.c2{stroke:var(--c2)} .wash.line.c3{stroke:var(--c3)}
.mass{fill:var(--mass);stroke:none} .mass.shade{fill:var(--mass-shade)}   /* solid soft blobs: clouds, organs, objects */
.edge{fill:none;stroke:var(--muted);stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.edge.c1{stroke:var(--c1)} .edge.c2{stroke:var(--c2)} .edge.c3{stroke:var(--c3)} .edge.c4{stroke:var(--c4)} .edge.c5{stroke:var(--c5)}
.edge.dash{stroke-dasharray:6 7}
.edge.thick{stroke-width:3.5}
.edge.flow{stroke-dasharray:7 9;animation:march 1.1s linear infinite}   /* marching dashes = something is moving */
@keyframes march{to{stroke-dashoffset:-16}}
.particle{stroke:var(--surface);stroke-width:1.5} .particle.c1{fill:var(--c1)} .particle.c2{fill:var(--c2)}
.particle.c3{fill:var(--c3)} .particle.c4{fill:var(--c4)} .particle.c5{fill:var(--c5)}
.spin{transform-box:fill-box;transform-origin:center;animation:spin 24s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.pulse{transform-box:fill-box;transform-origin:center;animation:pulse 2.4s ease-in-out infinite}
@keyframes pulse{50%{transform:scale(1.06)}}
.leader{fill:none;stroke:var(--muted);stroke-width:1.2}
.dot{fill:var(--muted)}
.t{font:600 16px var(--font);fill:var(--ink)}
.t.sub{font-weight:400;font-size:14px;fill:var(--muted)}
.t.big{font-size:20px;font-weight:800}
.t.small{font-size:13px;font-weight:600;fill:var(--muted)}
.t.on{fill:var(--on-accent)}
.t.c1{fill:var(--c1)} .t.c2{fill:var(--c2)} .t.c3{fill:var(--c3)} .t.c4{fill:var(--c4)} .t.c5{fill:var(--c5)}
.t.mono{font-family:var(--mono)}
.t.halo{paint-order:stroke;stroke:var(--surface);stroke-width:5px;stroke-linejoin:round}  /* readable over scenes/lines */
.badge circle{fill:var(--ink);stroke:var(--surface);stroke-width:2.5} .badge text{font:800 13px var(--font);fill:var(--surface)}
.badge.c1 circle{fill:var(--c1)} .badge.c2 circle{fill:var(--c2)} .badge.c3 circle{fill:var(--c3)}
.badge.c4 circle{fill:var(--c4)} .badge.c5 circle{fill:var(--c5)}
/* step focus (wired up by the script at the bottom) */
[data-step]{transition:opacity .25s}
svg.focusing [data-step]:not(.on){opacity:.18}
@media (prefers-reduced-motion:reduce){.edge.flow,.spin,.pulse{animation:none}.particle{display:none}}

/* ===== Walkthrough player (inserted by the script; no markup needed) ===== */
.player{position:relative;display:flex;flex-wrap:wrap;align-items:center;gap:10px 12px;margin-top:14px;padding:10px 14px 10px 10px;
  border:1px solid var(--line);border-radius:14px;background:var(--bg)}
@media (max-width:600px){.player{position:sticky;left:0}}
.player button{font:inherit;cursor:pointer}
.player button:focus-visible{outline:2px solid var(--c1);outline-offset:2px}
.pl-play{flex:none;width:42px;height:42px;border-radius:50%;border:0;background:var(--ink);color:var(--surface);display:grid;place-items:center;
  box-shadow:0 6px 16px -8px var(--shadow);transition:transform .15s}
.pl-play:hover{transform:scale(1.06)}
.pl-play svg{margin-left:2px} .player.playing .pl-play svg{margin-left:0}
.pl-nav{flex:none;width:32px;height:32px;border-radius:50%;border:1px solid var(--line);background:var(--surface);color:var(--ink);padding:0;display:grid;place-items:center}
.pl-track{display:flex;gap:4px;flex:none}
.pl-seg{width:34px;height:20px;padding:0;border:0;background:none;color:var(--ink)}
.pl-seg.c1{color:var(--c1)} .pl-seg.c2{color:var(--c2)} .pl-seg.c3{color:var(--c3)} .pl-seg.c4{color:var(--c4)} .pl-seg.c5{color:var(--c5)}
.pl-seg i{display:block;height:6px;border-radius:3px;background:var(--line);overflow:hidden}
.pl-seg s{display:block;height:100%;width:0;background:currentColor;text-decoration:none}
.pl-seg.done s,.pl-seg.active s{width:100%}
.player.playing .pl-seg.active s{animation:pl-fill var(--dur,4s) linear}
@keyframes pl-fill{from{width:0}to{width:100%}}
.pl-cap{flex:1 1 300px;margin:0;font-size:15px;line-height:1.45;color:var(--muted);min-height:44px;display:flex;flex-wrap:wrap;align-items:center;gap:0 6px}
.pl-cap b{color:var(--ink)}
.pl-n{font:700 12px/1 var(--font);letter-spacing:.06em;text-transform:uppercase;color:var(--surface);background:var(--muted);padding:4px 7px;border-radius:999px}
@media print{.player{display:none}}

/* ===== Reading guide: numbered steps that match the badges ===== */
.steps{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(auto-fit,minmax(176px,1fr));gap:12px;counter-reset:s}
.steps li{counter-increment:s;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px 16px 16px 54px;position:relative;
  cursor:default;transition:transform .2s,box-shadow .2s,border-color .2s;outline:none}
.steps li::before{content:counter(s);position:absolute;left:14px;top:15px;width:26px;height:26px;border-radius:50%;
  background:var(--ink);color:var(--surface);font:800 13px/26px var(--font);text-align:center}
.steps li.c1::before{background:var(--c1)} .steps li.c2::before{background:var(--c2)} .steps li.c3::before{background:var(--c3)}
.steps li.c4::before{background:var(--c4)} .steps li.c5::before{background:var(--c5)}
.steps li.on,.steps li:hover,.steps li:focus-visible{transform:translateY(-2px);border-color:var(--muted);box-shadow:0 10px 24px -14px var(--shadow)}
.steps b{display:block;margin-bottom:2px}
.steps span{color:var(--muted);font-size:15px}

/* ===== Takeaways ===== */
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:12px}
.card{position:relative;overflow:hidden;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px 16px 16px 60px}
.card::before{content:"";position:absolute;inset:0 auto 0 0;width:4px;background:var(--c1)}
.card svg{position:absolute;left:18px;top:17px;width:26px;height:26px;color:var(--c1)}
.card.c2::before{background:var(--c2)} .card.c3::before{background:var(--c3)} .card.c4::before{background:var(--c4)} .card.c5::before{background:var(--c5)}
.card.c2 svg{color:var(--c2)} .card.c3 svg{color:var(--c3)} .card.c4 svg{color:var(--c4)} .card.c5 svg{color:var(--c5)}
.card b{display:block;margin-bottom:2px}
.card p{margin:0;color:var(--muted)}

/* ===== Legend ===== */
.legend{display:flex;flex-wrap:wrap;gap:8px 20px;margin:14px 0 0;padding:0;list-style:none;font-size:14px;color:var(--muted)}
.legend li{display:flex;align-items:center;gap:8px}
.sw{width:14px;height:14px;border-radius:4px;border:1.5px solid var(--line);background:var(--surface)}
.sw.c1{background:var(--c1-soft);border-color:var(--c1)} .sw.c2{background:var(--c2-soft);border-color:var(--c2)}
.sw.c3{background:var(--c3-soft);border-color:var(--c3)} .sw.c4{background:var(--c4-soft);border-color:var(--c4)}
.sw.c5{background:var(--c5-soft);border-color:var(--c5)}
.sw.line{height:3px;border:0;border-radius:2px;background:var(--muted)}
.sw.line.c1{background:var(--c1)} .sw.line.c2{background:var(--c2)} .sw.line.c3{background:var(--c3)}
.sw.line.c4{background:var(--c4)} .sw.line.c5{background:var(--c5)}

/* ===== Footnote ===== */
.note{margin-top:32px;padding-top:14px;border-top:1px solid var(--line);font-size:14px;color:var(--muted)}
code{font-family:var(--mono);font-size:.92em;background:var(--zone);padding:1px 5px;border-radius:5px}

@media print{body{background:#fff}body::before{display:none}.stage,.steps li,.card{break-inside:avoid;box-shadow:none}}

/* ===== Cheat sheet (sections are plain HTML; the script below wires search, copy, density, print) ===== */
[hidden]{display:none!important}
:root{--rp:6px;--fs:14.5px;--math:"Cambria Math","STIX Two Math","Latin Modern Math",Cambria,"Times New Roman",serif}
:root[data-density="compact"]{--rp:2.5px;--fs:13px}
.page{max-width:1240px}
.page h1{margin-bottom:8px}

/* toolbar: search, most-used filter, density, print */
.cs-bar{display:flex;flex-wrap:wrap;align-items:center;gap:10px;margin:20px 0 0}
.cs-search{position:relative;flex:1 1 280px;max-width:460px}
.cs-search svg{position:absolute;left:12px;top:50%;width:18px;height:18px;margin-top:-9px;color:var(--muted);pointer-events:none}
.cs-search input{width:100%;font:inherit;font-size:15px;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:999px;
  padding:9px 40px 9px 38px;outline:none;-webkit-appearance:none;appearance:none}
.cs-search input::placeholder{color:var(--muted);opacity:1}
.cs-search input:focus{border-color:var(--c1);box-shadow:0 0 0 3px var(--c1-soft)}
.cs-search input::-webkit-search-cancel-button{display:none}
.cs-search kbd{position:absolute;right:12px;top:50%;transform:translateY(-50%);pointer-events:none}
.cs-search input:focus ~ kbd,.cs-search input:not(:placeholder-shown) ~ kbd{display:none}
kbd{font:600 12px/1 var(--mono);color:var(--muted);background:var(--zone);border:1px solid var(--line);border-bottom-width:2px;border-radius:6px;padding:3px 6px}
.cs-btn{display:inline-flex;align-items:center;gap:7px;font:600 14px var(--font);color:var(--ink);background:var(--surface);
  border:1px solid var(--line);border-radius:999px;padding:8px 14px;cursor:pointer;transition:border-color .2s,background .2s}
.cs-btn:hover{border-color:var(--muted)}
.cs-btn:focus-visible,.copy:focus-visible,.sheet pre:focus-visible{outline:2px solid var(--c1);outline-offset:2px}
.cs-btn[aria-pressed="true"]{border-color:var(--c3);background:var(--c3-soft)}
.cs-btn svg{width:16px;height:16px;flex:none}
.cs-count{font-size:14px;color:var(--muted);margin-left:auto}
.cs-empty{margin:28px 0 0;padding:26px 18px;text-align:center;border:1.5px dashed var(--line);border-radius:var(--r);color:var(--muted);font-size:16px}
.cs-empty b{color:var(--ink)}
.cs-empty button{margin-left:8px;font:inherit;font-weight:600;color:var(--c1);background:none;border:0;cursor:pointer;text-decoration:underline}
mark.hit{background:var(--c3);color:var(--on-accent);border-radius:3px;padding:0 2px;font-weight:inherit}

/* the grid: columns, so cards of different heights pack like masonry; a section never splits */
.sheet{column-width:300px;column-gap:16px;margin-top:18px}
.sec{--ac:var(--c1);--ac-soft:var(--c1-soft);display:block;break-inside:avoid;page-break-inside:avoid;margin:0 0 16px;
  background:var(--surface);border:1px solid var(--line);border-top:3px solid var(--ac);border-radius:14px;font-size:var(--fs);line-height:1.45;
  box-shadow:0 1px 2px var(--shadow),0 14px 30px -22px var(--shadow)}
.sec.c2{--ac:var(--c2);--ac-soft:var(--c2-soft)} .sec.c3{--ac:var(--c3);--ac-soft:var(--c3-soft)}
.sec.c4{--ac:var(--c4);--ac-soft:var(--c4-soft)} .sec.c5{--ac:var(--c5);--ac-soft:var(--c5-soft)}
.sec .sh{display:flex;align-items:center;gap:9px;margin:0;padding:9px 12px;border-radius:11px 11px 0 0;background:var(--ac-soft);
  font:800 15.5px/1.2 var(--font);letter-spacing:-.005em}
.sec .sh::after{display:none}
.sec .sh svg{flex:none;width:20px;height:20px;color:var(--ac)}
.sec .sh small{margin-left:auto;white-space:nowrap;font:600 11.5px/1.2 var(--font);color:var(--muted);text-align:right}
.sb{padding:6px 12px 12px}
.sb > :first-child{margin-top:4px}
.sb h3{margin:10px 0 2px;font:800 11.5px/1.2 var(--font);letter-spacing:.07em;text-transform:uppercase;color:var(--muted)}
.sb p{margin:6px 0}
.sb code{overflow-wrap:anywhere}
.sb ul.list{margin:4px 0;padding:0;list-style:none}
.sb ul.list li{position:relative;padding:var(--rp) 0 var(--rp) 16px;border-bottom:1px dashed var(--line)}
.sb ul.list li::before{content:"";position:absolute;left:3px;top:calc(var(--rp) + .62em);width:6px;height:6px;border-radius:50%;background:var(--ac)}
.sb ul.list li:last-child{border-bottom:0}

/* key -> value rows */
dl.kv{margin:0 -6px}
.r{display:grid;grid-template-columns:var(--kcol,42%) minmax(0,1fr);gap:2px 10px;padding:var(--rp) 6px;border-bottom:1px dashed var(--line)}
.r:last-child{border-bottom:0}
.r.wide{grid-template-columns:minmax(0,1fr)}
.r dt{margin:0;font-weight:600;overflow-wrap:anywhere}
.r dd{margin:0;color:var(--muted);overflow-wrap:anywhere}
.r dt code{background:none;padding:0;color:var(--ink);font-weight:600}
.r.star,.tbl tr.star{background:var(--ac-soft)}
.r.star{border-radius:8px;border-bottom-color:transparent}
.r.star dt::after,.tbl tr.star td:first-child::after{content:" \2605";color:var(--c3);font-size:.85em}
.r.star dd{color:var(--ink)}
.tag{display:inline-block;margin-left:4px;padding:0 6px;border:1px solid var(--ac);border-radius:999px;font:700 10.5px/1.5 var(--font);color:var(--ink);white-space:nowrap;vertical-align:1px}

/* tables */
.tbl{width:100%;border-collapse:collapse;margin:6px 0 2px;font-size:.96em}
.tbl th{font:800 11px/1.2 var(--font);letter-spacing:.05em;text-transform:uppercase;color:var(--muted);text-align:left;padding:4px 6px;border-bottom:2px solid var(--ac)}
.tbl td{padding:var(--rp) 6px;border-bottom:1px dashed var(--line);vertical-align:top;overflow-wrap:anywhere}
.tbl tr:last-child td{border-bottom:0}
.tbl td:first-child{font-weight:600}
.tbl.center th,.tbl.center td{text-align:center;padding-left:3px;padding-right:3px}
.tbl.center th:first-child,.tbl.center td:first-child{text-align:left}
.tbl.grid td,.tbl.grid th{border:1px solid var(--line)}
.tbl.grid tr:last-child td{border-bottom:1px solid var(--line)}
.tbl code{background:none;padding:0;color:var(--ink)}

/* code snippets (copy button is added by the script) */
.code{margin:8px 0;border:1px solid var(--line);border-radius:10px;background:var(--zone);overflow:hidden}
.code .ch{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:3px 4px 3px 10px;border-bottom:1px solid var(--line)}
.code .ch span{font:700 10.5px/1 var(--font);letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.copy{margin-left:auto;font:600 11.5px/1 var(--font);color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:7px;padding:5px 9px;cursor:pointer;min-width:58px}
.copy:hover{border-color:var(--muted)}
.copy.ok{border-color:var(--c2);background:var(--c2-soft)}
.code pre{margin:0;padding:8px 11px;overflow-x:auto;font:12.5px/1.6 var(--mono);color:var(--ink);tab-size:2}
.code pre code{background:none;padding:0;font:inherit;overflow-wrap:normal}
.code .cm{color:var(--muted)}

/* formulas */
.formula{margin:7px 0;padding:6px 10px 7px;border-radius:10px;background:var(--ac-soft);border-left:3px solid var(--ac)}
.formula .fl{display:block;font:700 10.5px/1.5 var(--font);letter-spacing:.07em;text-transform:uppercase;color:var(--muted)}
.formula .eq{display:block;font:1.14em/1.7 var(--math);color:var(--ink);overflow-wrap:anywhere}
.formula .eq + .eq{margin-top:1px}
.formula small{display:block;font-size:.86em;color:var(--muted)}
.formula.star .fl::after{content:" \2605";color:var(--c3)}
.tbl.math td{font-family:var(--math);font-size:1.06em}
.tbl.math td:first-child{font-weight:600}
.nb{white-space:nowrap}
.eq i,.tbl.math i,.sb p i,.sh i{font-style:italic}
.frac{display:inline-flex;flex-direction:column;vertical-align:middle;text-align:center;line-height:1.25;margin:0 .15em}
.sheet .frac > i{font-style:normal;padding:0 .25em}
.frac > i:first-child{border-bottom:1.4px solid currentColor}
.rt{border-top:1.4px solid currentColor;padding:0 .1em}

/* callouts, examples, mnemonic */
.callout{display:grid;grid-template-columns:18px minmax(0,1fr);gap:8px;margin:8px 0;padding:8px 10px;border:1px solid var(--line);border-radius:10px}
.callout svg{width:18px;height:18px;margin-top:1px}
.callout.warn{border-color:var(--c4);background:var(--c4-soft)} .callout.warn svg{color:var(--c4)}
.callout.tip{border-color:var(--c2);background:var(--c2-soft)} .callout.tip svg{color:var(--c2)}
.callout b{color:var(--ink)}
.eg,.mnemo{margin:8px 0;padding:7px 10px;border-radius:10px;overflow-wrap:anywhere}
.eg{border:1px dashed var(--muted)}
.mnemo{border:1.5px solid var(--c3);background:var(--c3-soft)}
.mnemo b{display:block;font-size:1.1em;letter-spacing:.02em}
.mnemo span b{display:inline;font-size:1em;letter-spacing:0}
.lbl{display:block;font:800 10.5px/1.5 var(--font);letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.fine{font-size:.88em;color:var(--muted)}

.sheet + .note,.cs-foot{margin-top:18px}

/* ===== PRINT: always the light palette, compact columns, no controls ===== */
@page{size:landscape;margin:7mm}
@media print{
  :root:root:root:not(.hand){
    --bg:#ffffff; --surface:#ffffff; --ink:#15151a; --muted:#4b4e57; --line:#c9c6bd; --zone:#f1efe9;
    --c1:#1d4ed8; --c1-soft:#dbe6fd; --c2:#0b7a58; --c2-soft:#d3eee3; --c3:#b45f00; --c3-soft:#fde6c8;
    --c4:#b91c5c; --c4-soft:#fadbe7; --c5:#5b34c4; --c5-soft:#e7defb; --on-accent:#ffffff; --shadow:transparent;
    color-scheme:light;
  }
  html{-webkit-print-color-adjust:exact;print-color-adjust:exact}
  body{background:#fff;font-size:8pt;line-height:1.28}
  .page,.hand .page{max-width:none;margin:0;padding:0;box-shadow:none;background:none}
  .theme-toggle,.cs-bar,.cs-empty,.code .ch,.cs-search{display:none!important}
  .eyebrow{display:none}
  h1{font-size:17pt;margin:0 0 1pt}
  h1 .accent{background:none;-webkit-text-fill-color:currentcolor;color:var(--c1)}
  .lede{font-size:8.6pt;max-width:none}
  .chips{margin:4pt 0 0;gap:4pt}.chips li{font-size:7.5pt;padding:2pt 7pt}
  .sheet{column-width:auto;column-count:4;column-gap:8pt;margin-top:6pt}
  .sec{margin:0 0 7pt;box-shadow:none;border-radius:6pt;font-size:8pt;line-height:1.28;--rp:1.3pt}
  .sec .sh{padding:4pt 7pt;font-size:9.5pt;border-radius:4pt 4pt 0 0}
  .sec .sh svg{width:12pt;height:12pt}
  .sb{padding:2pt 7pt 6pt}
  .r{gap:1pt 6pt}
  .code{margin:4pt 0}
  .code pre{padding:4pt 6pt;font-size:7.6pt;line-height:1.45;white-space:pre-wrap;overflow:visible;overflow-wrap:anywhere}
  .formula{margin:4pt 0;padding:3pt 6pt 4pt}
  .formula .eq{font-size:9.4pt;line-height:1.55}
  .callout,.eg,.mnemo{margin:4pt 0;padding:3pt 6pt;border-radius:5pt}
  .callout{grid-template-columns:11pt minmax(0,1fr);gap:5pt}.callout svg{width:11pt;height:11pt}
  .tbl{font-size:8pt}
  .sb h3{margin:6pt 0 1pt;font-size:7pt}
  .note{margin-top:6pt;padding-top:5pt;font-size:7.3pt}
  mark.hit{background:none;color:inherit}
}

/* ===== Handwritten notebook style — <div class="sheet" data-style="handwritten"> (only when the user asks) ===== */
:root.hand.hand{
  --bg:#e9e4d8; --surface:#fdfbf4; --ink:#1f3a93; --muted:#4a5a8a; --line:#9fb7d6; --zone:#f3eedf;
  --c1:#1f3a93; --c1-soft:rgba(64,196,255,.30);  --c2:#1e8449; --c2-soft:rgba(118,255,3,.32);
  --c3:#b9770e; --c3-soft:rgba(255,235,59,.60);  --c4:#c0392b; --c4-soft:rgba(255,128,171,.40);
  --c5:#7d3c98; --c5-soft:rgba(206,147,216,.40); --on-accent:#222; --shadow:rgba(0,0,0,.16);
  --font:'Kalam','Patrick Hand','Segoe Print','Comic Sans MS',cursive;
  --title:'Caveat','Kalam','Segoe Print','Bradley Hand',cursive;
  color-scheme:light;
}
.hand body::before{display:none}
.hand .page{margin:24px auto;padding:40px 28px 48px 88px;box-shadow:0 2px 6px rgba(0,0,0,.15),0 12px 28px rgba(0,0,0,.12);
  background:linear-gradient(90deg,transparent 62px,#e8a0a0 62px,#e8a0a0 64px,transparent 64px),
             repeating-linear-gradient(var(--surface) 0,var(--surface) 31px,#c9dcef 31px,#c9dcef 32px)}
@media (max-width:600px){.hand .page{margin:0;padding:24px 14px 40px 44px;
  background:linear-gradient(90deg,transparent 30px,#e8a0a0 30px,#e8a0a0 32px,transparent 32px),
             repeating-linear-gradient(var(--surface) 0,var(--surface) 31px,#c9dcef 31px,#c9dcef 32px)}}
.hand .eyebrow{background:none;border:0;padding:0;font:700 22px/1 var(--title);letter-spacing:0;text-transform:none;color:var(--c4)}
.hand .eyebrow::before{display:none}
.hand h1{font-family:var(--title);font-size:clamp(42px,6vw,60px);font-weight:700;letter-spacing:0;color:#222;transform:rotate(-1deg);transform-origin:left}
.hand h1 .accent{color:inherit;-webkit-background-clip:border-box;background-clip:border-box;
  background:linear-gradient(transparent 58%,var(--c3-soft) 58%,var(--c3-soft) 92%,transparent 92%)}
.hand .lede,.hand .note{color:var(--ink)}
.hand .chips li{background:var(--c3-soft);border:0;border-radius:3px 8px 4px 9px;color:var(--ink)}
.hand .chips b{color:#222}
.hand .cs-search input{background:var(--surface);border:2px solid #222;border-radius:6px 14px 8px 16px}
.hand .cs-search input:focus{border-color:var(--c4);box-shadow:none}
.hand .cs-btn{background:var(--surface);border:2px solid #222;border-radius:6px 14px 8px 16px;font-family:var(--font)}
.hand .cs-btn[aria-pressed="true"]{background:var(--c3-soft)}
.hand .cs-count,.hand .cs-empty{color:var(--ink)}
.hand .cs-empty{border-color:#222;font-family:var(--title);font-size:24px}
.hand .sec{--ac:var(--c1);background:var(--surface);border:2px solid #222;border-radius:4px 12px 6px 14px;box-shadow:2px 3px 0 rgba(0,0,0,.14);font-size:calc(var(--fs) + 1px)}
.hand .sec.c2{--ac:var(--c2)} .hand .sec.c3{--ac:var(--c3)} .hand .sec.c4{--ac:var(--c4)} .hand .sec.c5{--ac:var(--c5)}
.hand .sec .sh{font-family:var(--title);font-size:25px;font-weight:700;letter-spacing:0;color:#222;border-radius:2px 10px 0 0;border-bottom:2px solid #222}
.hand .sec .sh small{font-family:var(--font);font-size:13px;font-weight:400;color:#333}
.hand .sb h3{font-family:var(--title);font-size:19px;letter-spacing:0;text-transform:none;color:var(--c4)}
.hand .r dt code,.hand .tbl code{color:#222}
.hand .r dd{color:var(--ink)}
.hand .tbl th{font-family:var(--title);font-size:18px;letter-spacing:0;text-transform:none;color:#222}
.hand .tbl td:first-child{font-family:var(--font)}
.hand .tag{font-family:var(--font);background:var(--surface)}
.hand .code{border:2px dashed var(--line);background:var(--zone)}
.hand .code .ch span{font-family:var(--font)}
.hand .copy{font-family:var(--font);border:2px solid #222}
.hand .formula{border-left-width:4px;border-radius:3px 10px 4px 12px}
.hand .formula .fl{font-family:var(--title);font-size:17px;letter-spacing:0;text-transform:none;color:#222}
.hand .formula .eq{color:#1f2a5e}
.hand .lbl{font-family:var(--title);font-size:17px;letter-spacing:0;text-transform:none;color:#222}
.hand .callout{border-width:2px;border-radius:3px 10px 4px 11px}
.hand .callout.warn{background:var(--c4-soft)} .hand .callout.tip{background:var(--c2-soft)}
.hand .callout b{font-family:var(--title);font-size:21px;font-weight:700}
.hand .mnemo{background:#fff59d;border:0;border-radius:2px;box-shadow:2px 4px 8px rgba(0,0,0,.18)}
.hand .mnemo b{font-family:var(--title);font-size:26px;color:var(--c4)}
.hand .eg{border:2px dashed var(--c4);background:transparent}
.hand mark.hit{background:var(--c3-soft);color:#222;box-shadow:0 0 0 1px var(--c3)}
.hand .r.star,.hand .tbl tr.star{background:var(--c3-soft)}
@media print{
  .hand body{background:#fff}
  .hand .page{background:none;box-shadow:none;margin:0;padding:0}
  .hand .sec{box-shadow:none;border-width:1.2pt;font-size:7.8pt;line-height:1.25}
  .hand .sec .sh{font-size:12.5pt;border-bottom-width:1pt;padding:1pt 6pt}
  .hand .formula{margin:3pt 0;padding:2pt 5pt 3pt}
  .hand .formula .eq{font-size:8.8pt;line-height:1.45}
  .hand .formula .fl,.hand .lbl{font-size:9pt;line-height:1.2}
  .hand .mnemo b{font-size:11.5pt}
  .hand .callout b{font-size:9.5pt}
  .hand .tbl th{font-size:9pt}
  .hand .sb h3{font-size:10pt}
  .hand .sb{padding:1pt 6pt 4pt}
  .hand .callout.warn,.hand .callout.tip{background:none}
  .hand h1{font-size:24pt;transform:none}
}
</style>

  <linearGradient id="g-c2" x1="0" y1="0" x2="0" y2="1"><stop offset="0" style="stop-color:var(--surface)"/><stop offset="1" style="stop-color:var(--c2-soft)"/></linearGradient>

  <linearGradient id="fade-c1" x1="0" y1="0" x2="0" y2="1"><stop offset="0" style="stop-color:var(--c1-soft)"/><stop offset="1" style="stop-color:var(--c1-soft);stop-opacity:0"/></linearGradient>

  <linearGradient id="rise-c4" x1="0" y1="1" x2="0" y2="0"><stop offset="0" style="stop-color:var(--c4-soft)"/><stop offset="1" style="stop-color:var(--c4-soft);stop-opacity:.2"/></linearGradient>

  <!-- arrowheads: one per colour (markers don't inherit the path colour) -->

<button class="theme-toggle" type="button" aria-label="Switch to light theme">☀</button>
<main class="page">
  <p class="eyebrow">{{FORM}}</p>
  <h1>{{HEADLINE}}</h1>
  <p class="lede">{{LEDE}}</p>
  <!-- CONTENT GOES HERE -->
</main>
<script>
/* ===== Cheat sheet script =====
   Wires up what the content markup already contains (nothing is drawn from data):
   - search box #cs-q: live filter of rows / table rows / snippets / callouts, hides empty sections, highlights matches,
     shows a "no results" message; "/" focuses it, Esc clears it;
   - "Most used" button (#cs-star): shows only the .star rows;
   - density button (#cs-density): comfortable <-> compact, remembered in localStorage ("cs-density");
   - print button (#cs-print): window.print();
   - every .code block gets a header with its language label (data-lang) and a Copy button;
   - <div class="sheet" data-style="handwritten"> turns on the notebook look and loads the two handwriting fonts.
   Exposes window.__csReady / __csErrors for the validator. No dependencies. */
(() => {
  const errors = window.__csErrors = [];
  const root = document.documentElement, flag = document.querySelector('.sheet[data-style]');
  const hand = !!flag && /hand/i.test(flag.dataset.style || '');
  if (hand) root.classList.add('hand');
  const fontsReady = !hand ? Promise.resolve() : new Promise(res => {
    const l = document.createElement('link'); l.rel = 'stylesheet';
    l.href = 'https://fonts.googleapis.com/css2?family=Caveat:wght@400;700&family=Kalam:wght@400;700&display=swap';
    l.onload = () => Promise.all(['400 16px Kalam', '700 16px Kalam', '700 32px Caveat'].map(f => document.fonts.load(f))).catch(() => {}).then(res);
    l.onerror = res; document.head.appendChild(l);
    setTimeout(res, 2500);                      // offline: carry on with the fallback font
  });
  window.__csReady = fontsReady;

  const sheet = document.querySelector('.sheet');
  if (!sheet) { errors.push('no .sheet container found'); return; }
  const $ = id => document.getElementById(id);
  const q = $('cs-q'), starBtn = $('cs-star'), denBtn = $('cs-density'), printBtn = $('cs-print'), count = $('cs-count');
  const secs = [...sheet.querySelectorAll(':scope > .sec')];
  const UNIT = '.r, tbody tr, .code, .formula, .callout, .eg, .mnemo, ul.list > li';
  const unitsOf = s => [...s.querySelectorAll(UNIT)].filter(u => !u.parentElement.closest(UNIT));
  const data = secs.map(s => ({ s, title: s.querySelector('.sh'), units: unitsOf(s) }));
  const total = data.reduce((n, d) => n + d.units.length, 0);

  /* ---- code blocks: language label + Copy button ---- */
  const copyText = async text => {
    try { await navigator.clipboard.writeText(text); return true; } catch (e) {}
    try {
      const ta = document.createElement('textarea'); ta.value = text; ta.style.cssText = 'position:fixed;left:-9999px;top:0';
      document.body.appendChild(ta); ta.select(); const ok = document.execCommand('copy'); ta.remove(); return ok;
    } catch (e) { return false; }
  };
  sheet.querySelectorAll('.code').forEach(c => {
    const pre = c.querySelector('pre'); if (!pre) return;
    pre.tabIndex = 0; pre.setAttribute('role', 'region'); pre.setAttribute('aria-label', (c.dataset.lang || 'Code') + ' snippet');
    const head = document.createElement('div'); head.className = 'ch';
    head.innerHTML = '<span></span><button class="copy" type="button" aria-label="Copy this snippet">Copy</button>';
    head.firstChild.textContent = c.dataset.lang || '';
    c.insertBefore(head, pre);
    const b = head.querySelector('.copy'); let t;
    b.addEventListener('click', async () => {
      const ok = await copyText(pre.textContent.replace(/\n+$/, ''));
      b.textContent = ok ? 'Copied ✓' : 'Press Ctrl+C'; b.classList.toggle('ok', ok);
      b.setAttribute('aria-label', ok ? 'Copied to clipboard' : 'Copy failed; select the text and press Ctrl+C');
      clearTimeout(t); t = setTimeout(() => { b.textContent = 'Copy'; b.classList.remove('ok'); b.setAttribute('aria-label', 'Copy this snippet'); }, 1600);
    });
  });

  /* ---- search + most-used filter ---- */
  const empty = document.createElement('p'); empty.className = 'cs-empty'; empty.hidden = true; empty.setAttribute('role', 'status');
  sheet.after(empty);
  const esc = s => s.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
  const clearMarks = () => {
    sheet.querySelectorAll('mark.hit').forEach(m => { const p = m.parentNode; p.replaceChild(document.createTextNode(m.textContent), m); p.normalize(); });
  };
  const markIn = (el, re) => {
    const w = document.createTreeWalker(el, NodeFilter.SHOW_TEXT, { acceptNode: n =>
      n.nodeValue.trim() && !n.parentElement.closest('button, svg, mark, script, style, .ch') ? NodeFilter.FILTER_ACCEPT : NodeFilter.FILTER_REJECT });
    const nodes = []; while (w.nextNode()) nodes.push(w.currentNode);
    nodes.forEach(n => {
      re.lastIndex = 0; if (!re.test(n.nodeValue)) return;
      const frag = document.createDocumentFragment(); let last = 0; re.lastIndex = 0; let m;
      while ((m = re.exec(n.nodeValue))) {
        if (m.index > last) frag.appendChild(document.createTextNode(n.nodeValue.slice(last, m.index)));
        const k = document.createElement('mark'); k.className = 'hit'; k.textContent = m[0]; frag.appendChild(k); last = m.index + m[0].length;
        if (m[0].length === 0) re.lastIndex++;
      }
      if (last < n.nodeValue.length) frag.appendChild(document.createTextNode(n.nodeValue.slice(last)));
      n.parentNode.replaceChild(frag, n);
    });
  };
  const starOnly = () => !!starBtn && starBtn.getAttribute('aria-pressed') === 'true';
  const apply = () => {
    clearMarks();
    const raw = q ? q.value.trim() : '', terms = raw.toLowerCase().split(/\s+/).filter(Boolean), star = starOnly();
    const filtering = terms.length > 0 || star;
    const re = terms.length ? new RegExp(terms.slice().sort((a, b) => b.length - a.length).map(esc).join('|'), 'gi') : null;
    let shown = 0, shownSecs = 0;
    data.forEach(d => {
      const title = d.title ? d.title.textContent.toLowerCase() : '';
      let any = false;
      if (d.units.length) {
        d.units.forEach(u => {
          const hay = (title + ' ' + u.textContent + ' ' + (u.dataset.kw || '')).toLowerCase();
          const ok = terms.every(t => hay.includes(t)) && (!star || u.classList.contains('star'));
          u.hidden = !ok; if (ok) { any = true; shown++; if (re) markIn(u, re); }
        });
      } else {
        any = terms.every(t => d.s.textContent.toLowerCase().includes(t)) && !star;
      }
      d.s.hidden = !any; if (any) { shownSecs++; if (re && d.title) markIn(d.title, re); }
    });
    sheet.hidden = filtering && shownSecs === 0;
    empty.hidden = !(filtering && shownSecs === 0);
    if (!empty.hidden) {
      empty.textContent = '';
      const msg = document.createElement('span');
      msg.innerHTML = star && !terms.length ? 'No rows are marked as most used here.' : 'Nothing matches <b></b>. Try fewer or shorter words.';
      const bold = msg.querySelector('b'); if (bold) bold.textContent = '“' + raw + '”' + (star ? ' in the most-used rows' : '');
      const clr = document.createElement('button'); clr.type = 'button'; clr.textContent = 'Clear search';
      clr.addEventListener('click', () => reset(true));
      empty.append(msg, clr);
    }
    if (count) count.textContent = filtering ? `${shown} of ${total} entries match` : `${total} entries · ${secs.length} sections`;
  };
  const reset = focus => {
    if (q) q.value = '';
    if (starBtn) starBtn.setAttribute('aria-pressed', 'false');
    apply(); if (focus && q) q.focus();
  };
  if (q) q.addEventListener('input', apply);
  if (starBtn) starBtn.addEventListener('click', () => { starBtn.setAttribute('aria-pressed', String(!starOnly())); apply(); });
  apply();

  /* ---- density ---- */
  const setDensity = d => {
    if (d === 'compact') root.setAttribute('data-density', 'compact'); else root.removeAttribute('data-density');
    if (denBtn) denBtn.setAttribute('aria-pressed', String(d === 'compact'));
  };
  try { setDensity(localStorage.getItem('cs-density') === 'compact' ? 'compact' : 'comfortable'); } catch (e) { setDensity('comfortable'); }
  if (denBtn) denBtn.addEventListener('click', () => {
    const next = root.getAttribute('data-density') === 'compact' ? 'comfortable' : 'compact';
    setDensity(next); try { localStorage.setItem('cs-density', next); } catch (e) {}
  });
  if (printBtn) printBtn.addEventListener('click', () => window.print());

  /* ---- keyboard: "/" focuses the search box, Esc clears it ---- */
  document.addEventListener('keydown', e => {
    const t = e.target, typing = t && (t.tagName === 'INPUT' || t.tagName === 'TEXTAREA' || t.isContentEditable);
    if (e.key === '/' && !typing && !e.ctrlKey && !e.metaKey && !e.altKey && q) { e.preventDefault(); q.focus(); q.select(); }
    else if (e.key === 'Escape' && (q && (q.value || document.activeElement === q) || starOnly())) { reset(false); if (q) q.blur(); }
  });
})();
</script>
