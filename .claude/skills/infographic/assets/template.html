<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>{{TITLE}}</title>
<script>
/* Theme: opens in Deep dark; the ☀/☾ button switches to light and remembers it (the device's dark mode is ignored). */
(function () {
  var d = document.documentElement;
  try { var t = localStorage.getItem('vs-theme'); if (t === 'light' || t === 'dark') d.setAttribute('data-theme', t); } catch (e) {}
  document.addEventListener('DOMContentLoaded', function () {
    var b = document.querySelector('.theme-toggle'); if (!b) return;
    var sync = function () {
      var light = d.getAttribute('data-theme') === 'light';
      b.textContent = light ? '☾' : '☀';
      b.setAttribute('aria-label', light ? 'Switch to dark theme' : 'Switch to light theme');
      b.title = light ? 'Dark theme' : 'Light theme';
    };
    sync();
    b.addEventListener('click', function () {
      var next = d.getAttribute('data-theme') === 'light' ? 'dark' : 'light';
      d.setAttribute('data-theme', next);
      try { localStorage.setItem('vs-theme', next); } catch (e) {}
      sync();
    });
  });
})();
</script>
<style>
/* ===== Tokens — default theme: Deep dark. Colours carry meaning: c1..c5 are the only accent families ===== */
:root{
  --bg:#0f1013; --surface:#1a1b20; --ink:#ededf1; --muted:#a4a6b0; --line:#34363e; --zone:#202228;
  --c1:#7aa7ff; --c1-soft:#1b2846;   /* blue   */
  --c2:#40d0a0; --c2-soft:#13332a;   /* green  */
  --c3:#f4a94e; --c3-soft:#3a2912;   /* amber  */
  --c4:#f472a8; --c4-soft:#3d1729;   /* rose   */
  --c5:#ab8dff; --c5-soft:#291f47;   /* violet */
  --on-accent:#0f1013;
  --shadow:rgba(0,0,0,.55); --mass:#555b69; --mass-shade:#383c46;
  --font:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  --mono:ui-monospace,"Cascadia Code",Consolas,Menlo,monospace;
  --r:18px;
  color-scheme:dark;
}
/* ===== Light theme (Warm paper) — via the ☀ button ===== */
:root[data-theme="light"]{
  --bg:#f4f2ec; --surface:#ffffff; --ink:#18181b; --muted:#5b5e66; --line:#d9d5cb; --zone:#ece9e1;
  --c1:#2563eb; --c1-soft:#dce7fe; --c2:#0b8a64; --c2-soft:#d2f0e4; --c3:#c76a00; --c3-soft:#fde8cc;
  --c4:#c8246b; --c4-soft:#fcdfea; --c5:#6c3fd8; --c5-soft:#e9e1fd; --on-accent:#ffffff;
  --shadow:rgba(30,25,15,.16); --mass:#ffffff; --mass-shade:#d6d2c8;
  color-scheme:light;
}
.theme-toggle{position:fixed;top:14px;right:14px;z-index:20;width:42px;height:42px;border-radius:50%;
  border:1px solid var(--line);background:var(--surface);color:var(--ink);font-size:19px;line-height:1;cursor:pointer;
  box-shadow:0 6px 16px -8px var(--shadow);transition:transform .15s}
.theme-toggle:hover{transform:scale(1.07)}
.theme-toggle:focus-visible{outline:2px solid var(--c1);outline-offset:2px}
.hand .theme-toggle{display:none}   /* handwritten style is always paper */
@media print{.theme-toggle{display:none}}

*,*::before,*::after{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.55 var(--font);-webkit-font-smoothing:antialiased}
body::before{ /* soft colour glow behind the header */
  content:"";position:fixed;inset:0 0 auto 0;height:520px;z-index:-1;pointer-events:none;
  background:radial-gradient(60% 80% at 15% 0%,var(--c1-soft),transparent 70%),
             radial-gradient(50% 70% at 90% 10%,var(--c5-soft),transparent 70%);
  opacity:.9}
.page{max-width:1040px;margin:0 auto;padding:44px 24px 56px}
@media (max-width:600px){.page{padding:24px 16px 40px}}

/* ===== Header ===== */
.eyebrow{display:inline-flex;align-items:center;gap:8px;margin:0 0 14px;padding:6px 12px 6px 10px;border-radius:999px;
  background:var(--surface);border:1px solid var(--line);font:600 12px/1 var(--font);letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.eyebrow::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--c1);box-shadow:0 0 0 3px var(--c1-soft)}
h1{font-size:clamp(30px,5vw,48px);line-height:1.08;letter-spacing:-.025em;margin:0 0 12px;font-weight:800}
h1 .accent{background:linear-gradient(90deg,var(--c1),var(--c5));-webkit-background-clip:text;background-clip:text;color:transparent}
.lede{font-size:18px;color:var(--muted);max-width:66ch;margin:0}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin:18px 0 0;padding:0;list-style:none}
.chips li{background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:5px 12px;font-size:14px;color:var(--muted)}
.chips b{color:var(--ink);font-weight:700}
h2{font-size:20px;letter-spacing:-.01em;margin:44px 0 14px;display:flex;align-items:center;gap:10px}
h2::after{content:"";flex:1;height:1px;background:var(--line)}

/* ===== Main visual ===== */
.stage{position:relative;margin:28px 0 0;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);
  padding:18px;overflow-x:auto;box-shadow:0 1px 2px var(--shadow),0 18px 40px -24px var(--shadow)}
.stage::before{ /* faint dot grid */
  content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;opacity:.55;
  background:radial-gradient(circle,var(--line) 1px,transparent 1.4px) 0 0/22px 22px}
.stage > svg{position:relative;display:block;width:100%;height:auto;overflow:visible}
.stage figcaption{position:relative;font-size:14px;color:var(--muted);margin-top:12px}
@media (max-width:600px){.stage{padding:12px}.stage > svg{min-width:640px}.stage figcaption{position:sticky;left:0}}
.scroll-hint{display:none;font-size:13px;color:var(--muted);margin:8px 0 0}
@media (max-width:600px){.scroll-hint{display:block}}

/* --- SVG vocabulary: use these classes, never hard-coded colours --- */
.node{fill:var(--surface);stroke:var(--line);stroke-width:1.5}
.node.c1{fill:url(#g-c1);stroke:var(--c1)} .node.c2{fill:url(#g-c2);stroke:var(--c2)}
.node.c3{fill:url(#g-c3);stroke:var(--c3)} .node.c4{fill:url(#g-c4);stroke:var(--c4)}
.node.c5{fill:url(#g-c5);stroke:var(--c5)}
.node.solid.c1{fill:var(--c1)} .node.solid.c2{fill:var(--c2)} .node.solid.c3{fill:var(--c3)}
.node.solid.c4{fill:var(--c4)} .node.solid.c5{fill:var(--c5)}
.lift{filter:url(#shadow)}                          /* soft drop shadow: put on a <g> or shape */
.chip{stroke:none} .chip.c1{fill:var(--c1)} .chip.c2{fill:var(--c2)} .chip.c3{fill:var(--c3)} .chip.c4{fill:var(--c4)} .chip.c5{fill:var(--c5)}
.ico{color:var(--ink)} .ico.on{color:var(--on-accent)}
.ico.c1{color:var(--c1)} .ico.c2{color:var(--c2)} .ico.c3{color:var(--c3)} .ico.c4{color:var(--c4)} .ico.c5{color:var(--c5)} .ico.muted{color:var(--muted)}
.zone{fill:var(--zone);stroke:var(--line);stroke-width:1;stroke-dasharray:5 5;fill-opacity:.7}
/* scene shapes (sky, ground, sea, body outline …): soft fills that fade */
.wash{stroke:none} .wash.c1{fill:url(#fade-c1)} .wash.c2{fill:url(#fade-c2)} .wash.c3{fill:url(#fade-c3)}
.wash.c4{fill:url(#fade-c4)} .wash.c5{fill:url(#fade-c5)} .wash.up.c1{fill:url(#rise-c1)} .wash.up.c2{fill:url(#rise-c2)}
.wash.up.c3{fill:url(#rise-c3)} .wash.up.c4{fill:url(#rise-c4)} .wash.up.c5{fill:url(#rise-c5)}
.wash.line{stroke-width:2} .wash.line.c1{stroke:var(--c1)} .wash.line.c2{stroke:var(--c2)} .wash.line.c3{stroke:var(--c3)}
.mass{fill:var(--mass);stroke:none} .mass.shade{fill:var(--mass-shade)}   /* solid soft blobs: clouds, organs, objects */
.edge{fill:none;stroke:var(--muted);stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.edge.c1{stroke:var(--c1)} .edge.c2{stroke:var(--c2)} .edge.c3{stroke:var(--c3)} .edge.c4{stroke:var(--c4)} .edge.c5{stroke:var(--c5)}
.edge.dash{stroke-dasharray:6 7}
.edge.thick{stroke-width:3.5}
.edge.flow{stroke-dasharray:7 9;animation:march 1.1s linear infinite}   /* marching dashes = something is moving */
@keyframes march{to{stroke-dashoffset:-16}}
.particle{stroke:var(--surface);stroke-width:1.5} .particle.c1{fill:var(--c1)} .particle.c2{fill:var(--c2)}
.particle.c3{fill:var(--c3)} .particle.c4{fill:var(--c4)} .particle.c5{fill:var(--c5)}
.spin{transform-box:fill-box;transform-origin:center;animation:spin 24s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.pulse{transform-box:fill-box;transform-origin:center;animation:pulse 2.4s ease-in-out infinite}
@keyframes pulse{50%{transform:scale(1.06)}}
.leader{fill:none;stroke:var(--muted);stroke-width:1.2}
.dot{fill:var(--muted)}
.t{font:600 16px var(--font);fill:var(--ink)}
.t.sub{font-weight:400;font-size:14px;fill:var(--muted)}
.t.big{font-size:20px;font-weight:800}
.t.small{font-size:13px;font-weight:600;fill:var(--muted)}
.t.on{fill:var(--on-accent)}
.t.c1{fill:var(--c1)} .t.c2{fill:var(--c2)} .t.c3{fill:var(--c3)} .t.c4{fill:var(--c4)} .t.c5{fill:var(--c5)}
.t.mono{font-family:var(--mono)}
.t.halo{paint-order:stroke;stroke:var(--surface);stroke-width:5px;stroke-linejoin:round}  /* readable over scenes/lines */
.badge circle{fill:var(--ink);stroke:var(--surface);stroke-width:2.5} .badge text{font:800 13px var(--font);fill:var(--surface)}
.badge.c1 circle{fill:var(--c1)} .badge.c2 circle{fill:var(--c2)} .badge.c3 circle{fill:var(--c3)}
.badge.c4 circle{fill:var(--c4)} .badge.c5 circle{fill:var(--c5)}
/* step focus (wired up by the script at the bottom) */
[data-step]{transition:opacity .25s}
svg.focusing [data-step]:not(.on){opacity:.18}
@media (prefers-reduced-motion:reduce){.edge.flow,.spin,.pulse{animation:none}.particle{display:none}}

/* ===== Walkthrough player (inserted by the script; no markup needed) ===== */
.player{position:relative;display:flex;flex-wrap:wrap;align-items:center;gap:10px 12px;margin-top:14px;padding:10px 14px 10px 10px;
  border:1px solid var(--line);border-radius:14px;background:var(--bg)}
@media (max-width:600px){.player{position:sticky;left:0}}
.player button{font:inherit;cursor:pointer}
.player button:focus-visible{outline:2px solid var(--c1);outline-offset:2px}
.pl-play{flex:none;width:42px;height:42px;border-radius:50%;border:0;background:var(--ink);color:var(--surface);display:grid;place-items:center;
  box-shadow:0 6px 16px -8px var(--shadow);transition:transform .15s}
.pl-play:hover{transform:scale(1.06)}
.pl-play svg{margin-left:2px} .player.playing .pl-play svg{margin-left:0}
.pl-nav{flex:none;width:32px;height:32px;border-radius:50%;border:1px solid var(--line);background:var(--surface);color:var(--ink);padding:0;display:grid;place-items:center}
.pl-track{display:flex;gap:4px;flex:none}
.pl-seg{width:34px;height:20px;padding:0;border:0;background:none;color:var(--ink)}
.pl-seg.c1{color:var(--c1)} .pl-seg.c2{color:var(--c2)} .pl-seg.c3{color:var(--c3)} .pl-seg.c4{color:var(--c4)} .pl-seg.c5{color:var(--c5)}
.pl-seg i{display:block;height:6px;border-radius:3px;background:var(--line);overflow:hidden}
.pl-seg s{display:block;height:100%;width:0;background:currentColor;text-decoration:none}
.pl-seg.done s,.pl-seg.active s{width:100%}
.player.playing .pl-seg.active s{animation:pl-fill var(--dur,4s) linear}
@keyframes pl-fill{from{width:0}to{width:100%}}
.pl-cap{flex:1 1 300px;margin:0;font-size:15px;line-height:1.45;color:var(--muted);min-height:44px;display:flex;flex-wrap:wrap;align-items:center;gap:0 6px}
.pl-cap b{color:var(--ink)}
.pl-n{font:700 12px/1 var(--font);letter-spacing:.06em;text-transform:uppercase;color:var(--surface);background:var(--muted);padding:4px 7px;border-radius:999px}
@media print{.player{display:none}}

/* ===== Reading guide: numbered steps that match the badges ===== */
.steps{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(auto-fit,minmax(176px,1fr));gap:12px;counter-reset:s}
.steps li{counter-increment:s;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px 16px 16px 54px;position:relative;
  cursor:default;transition:transform .2s,box-shadow .2s,border-color .2s;outline:none}
.steps li::before{content:counter(s);position:absolute;left:14px;top:15px;width:26px;height:26px;border-radius:50%;
  background:var(--ink);color:var(--surface);font:800 13px/26px var(--font);text-align:center}
.steps li.c1::before{background:var(--c1)} .steps li.c2::before{background:var(--c2)} .steps li.c3::before{background:var(--c3)}
.steps li.c4::before{background:var(--c4)} .steps li.c5::before{background:var(--c5)}
.steps li.on,.steps li:hover,.steps li:focus-visible{transform:translateY(-2px);border-color:var(--muted);box-shadow:0 10px 24px -14px var(--shadow)}
.steps b{display:block;margin-bottom:2px}
.steps span{color:var(--muted);font-size:15px}

/* ===== Takeaways ===== */
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:12px}
.card{position:relative;overflow:hidden;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px 16px 16px 60px}
.card::before{content:"";position:absolute;inset:0 auto 0 0;width:4px;background:var(--c1)}
.card svg{position:absolute;left:18px;top:17px;width:26px;height:26px;color:var(--c1)}
.card.c2::before{background:var(--c2)} .card.c3::before{background:var(--c3)} .card.c4::before{background:var(--c4)} .card.c5::before{background:var(--c5)}
.card.c2 svg{color:var(--c2)} .card.c3 svg{color:var(--c3)} .card.c4 svg{color:var(--c4)} .card.c5 svg{color:var(--c5)}
.card b{display:block;margin-bottom:2px}
.card p{margin:0;color:var(--muted)}

/* ===== Legend ===== */
.legend{display:flex;flex-wrap:wrap;gap:8px 20px;margin:14px 0 0;padding:0;list-style:none;font-size:14px;color:var(--muted)}
.legend li{display:flex;align-items:center;gap:8px}
.sw{width:14px;height:14px;border-radius:4px;border:1.5px solid var(--line);background:var(--surface)}
.sw.c1{background:var(--c1-soft);border-color:var(--c1)} .sw.c2{background:var(--c2-soft);border-color:var(--c2)}
.sw.c3{background:var(--c3-soft);border-color:var(--c3)} .sw.c4{background:var(--c4-soft);border-color:var(--c4)}
.sw.c5{background:var(--c5-soft);border-color:var(--c5)}
.sw.line{height:3px;border:0;border-radius:2px;background:var(--muted)}
.sw.line.c1{background:var(--c1)} .sw.line.c2{background:var(--c2)} .sw.line.c3{background:var(--c3)}
.sw.line.c4{background:var(--c4)} .sw.line.c5{background:var(--c5)}

/* ===== Footnote ===== */
.note{margin-top:32px;padding-top:14px;border-top:1px solid var(--line);font-size:14px;color:var(--muted)}
code{font-family:var(--mono);font-size:.92em;background:var(--zone);padding:1px 5px;border-radius:5px}

@media print{body{background:#fff}body::before{display:none}.stage,.steps li,.card{break-inside:avoid;box-shadow:none}}

/* ===== Infographic: stacked poster panels. Charts are drawn by the script below from data-* attributes ===== */
[hidden]{display:none!important}
.page{max-width:880px}
.page h1{font-size:clamp(34px,6.6vw,60px);line-height:1.04;margin-bottom:10px}
.page .lede{font-size:19px}
.vh{position:absolute!important;width:1px;height:1px;margin:-1px;padding:0;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap;border:0}

/* colour meaning: one accent per category. --k = solid, --ks = soft tint */
.ig .c1{--k:var(--c1);--ks:var(--c1-soft)} .ig .c2{--k:var(--c2);--ks:var(--c2-soft)} .ig .c3{--k:var(--c3);--ks:var(--c3-soft)}
.ig .c4{--k:var(--c4);--ks:var(--c4-soft)} .ig .c5{--k:var(--c5);--ks:var(--c5-soft)} .ig .muted{--k:var(--muted);--ks:var(--zone)}

/* the poster: a column of panels; two .half panels sit side by side on wide screens */
.ig{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px;margin-top:26px}
.ig > *{grid-column:1/-1;min-width:0}
.ig > .half{grid-column:span 1}
@media (max-width:640px){.ig{grid-template-columns:minmax(0,1fr)}.ig > .half{grid-column:1/-1}}
.pn{--k:var(--c1);--ks:var(--c1-soft);position:relative;overflow:hidden;background:var(--surface);border:1px solid var(--line);
  border-top:4px solid var(--k);border-radius:22px;padding:20px 22px 22px;box-shadow:0 1px 2px var(--shadow),0 18px 40px -26px var(--shadow)}
@media (max-width:600px){.pn{padding:16px 14px 18px;border-radius:18px}}
.pn > h2.ph{display:flex;align-items:center;gap:10px;margin:0 0 14px;font:800 clamp(19px,3.4vw,24px)/1.15 var(--font);letter-spacing:-.015em}
.pn > h2.ph::after{display:none}
.pn > h2.ph svg{flex:none;width:34px;height:34px;padding:6px;border-radius:11px;background:var(--ks);color:var(--k)}
.pn > h2.ph small{margin-left:auto;font:600 13px/1.2 var(--font);color:var(--muted);text-align:right}
.pn p{margin:0}
.pn .fig{margin:0}
.pn .mt{margin-top:16px}
.pn .sub{margin:-6px 0 12px;font-size:15px;color:var(--muted)}
.ig-n{font-variant-numeric:tabular-nums}
sup.src{margin-left:2px;font:800 .62em/1 var(--font);vertical-align:super;white-space:nowrap}
sup.src a{color:var(--k,var(--c1));text-decoration:none;padding:0 1px}
sup.src a:hover,sup.src a:focus-visible{text-decoration:underline}
.srcline,.fg{margin-top:8px;font-size:12.5px;line-height:1.4;color:var(--muted)}
.srcline sup.src,.fg sup.src,.tc sup.src,.hs sup.src{font-size:.78em;vertical-align:baseline;margin:0 0 0 3px}

/* hero: headline stat */
.pn.hero{background:linear-gradient(140deg,var(--ks),var(--surface) 72%);padding:30px 24px 26px;text-align:center}
.hero .deco{position:absolute;right:-26px;top:-18px;width:210px;height:210px;color:var(--k);opacity:.13;pointer-events:none}
.hero .hn{position:relative;font:900 clamp(78px,19vw,156px)/.92 var(--font);letter-spacing:-.05em;color:var(--k)}
.hero .hn .u{display:block;margin-top:6px;font:800 clamp(20px,4.4vw,32px)/1.1 var(--font);letter-spacing:-.01em;color:var(--ink)}
.hero .hl{position:relative;max-width:32ch;margin:12px auto 0;font:600 clamp(18px,3.2vw,22px)/1.3 var(--font)}
.hero .hs{position:relative;margin-top:10px;font-size:13px;color:var(--muted)}

/* stat tiles */
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(168px,1fr));gap:12px}
.tile{position:relative;background:var(--ks);border:1px solid var(--line);border-top:4px solid var(--k);border-radius:16px;padding:14px 14px 12px}
.tile > svg{width:30px;height:30px;color:var(--k)}
.tile .tn{margin:6px 0 0;font:800 clamp(36px,6.4vw,50px)/1 var(--font);letter-spacing:-.035em;color:var(--ink)}
.tile .tn .u{display:block;margin-top:3px;font:700 .34em/1 var(--font);letter-spacing:0;color:var(--ink)}
.tile .tl{margin-top:6px;font:700 15px/1.25 var(--font)}
.tile .tc{margin-top:5px;font-size:13px;line-height:1.35;color:var(--muted)}

/* bars */
.ig-bars{display:grid;gap:10px}
.b-row{display:grid;grid-template-columns:minmax(78px,28%) minmax(0,1fr) auto;gap:6px 10px;align-items:center}
.b-l{font:600 15px/1.2 var(--font);overflow-wrap:anywhere}
.b-t{height:18px;border-radius:99px;background:var(--zone);overflow:hidden}
.b-t i{display:block;height:100%;width:var(--w);min-width:4px;border-radius:99px;background:var(--k)}
.b-v{min-width:4.6em;text-align:right;font:800 15px/1 var(--font);font-variant-numeric:tabular-nums;white-space:nowrap}
@media (max-width:480px){.b-row{grid-template-columns:minmax(0,1fr) auto}.b-t{grid-column:1/-1;grid-row:2}}

/* stacked bar */
.stk{display:flex;height:40px;border-radius:12px;overflow:hidden;gap:2px;background:var(--line)}
.stk i{flex:0 1 calc(var(--w) * 1%);min-width:4px;display:flex;align-items:center;justify-content:center;background:var(--k);color:var(--on-accent);font:800 14px var(--font);font-style:normal;white-space:nowrap;overflow:hidden}
.lg{display:flex;flex-wrap:wrap;gap:6px 18px;margin:12px 0 0;padding:0;list-style:none;font-size:14.5px}
.lg li{display:flex;align-items:center;gap:7px}
.lg .sw2{flex:none;width:14px;height:14px;border-radius:4px;background:var(--k)}
.lg b{font-variant-numeric:tabular-nums}

/* donut / ring */
.dn{display:flex;flex-wrap:wrap;align-items:center;gap:14px 24px}
.ig-ring .dn{justify-content:center}
.dn-fig{position:relative;flex:none;width:176px;height:176px}
.dn-fig svg{display:block;width:100%;height:100%;transform:rotate(-90deg)}
.dn-fig circle{fill:none;stroke-width:15}
.dn-fig .trk{stroke:var(--zone)}
.dn-fig .seg{stroke:var(--k)}
.dn-c{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:30px}
.dn-c b{font:900 34px/1 var(--font);letter-spacing:-.03em}
.dn-c small{margin-top:3px;font:600 12.5px/1.15 var(--font);color:var(--muted)}
.dn .lg{flex:1 1 180px;flex-direction:column;margin:0;gap:8px}
.dn .lg li{align-items:flex-start}
.dn .lg .sw2{margin-top:3px}

/* pictogram */
.pic{display:flex;flex-wrap:wrap;align-items:center;gap:10px 14px}
.pic-g{display:grid;grid-template-columns:repeat(var(--cols,10),minmax(0,var(--ps,34px)));gap:var(--pg,6px);flex:0 1 auto;max-width:100%}
.pic-g svg{width:100%;max-width:var(--ps,34px);height:auto;aspect-ratio:1;color:var(--line);stroke-width:2}
.pic-g svg.on{color:var(--k)}
.pic-g svg.on use{fill:var(--ks)}
.pic-l{flex:1 1 160px;font:700 clamp(20px,3.6vw,26px)/1.15 var(--font);letter-spacing:-.01em}
.pic-l small{display:block;margin-top:4px;font:400 14px/1.35 var(--font);color:var(--muted)}

/* comparison */
.cmp{display:grid;grid-template-columns:minmax(0,1fr) auto minmax(0,1fr);gap:12px;align-items:stretch}
.cmp .side{display:flex;flex-direction:column;align-items:center;text-align:center;gap:4px;padding:16px 12px;border-radius:16px;background:var(--ks);border:1.5px solid var(--k)}
.cmp .side > svg{width:34px;height:34px;color:var(--k)}
.cmp .side .cn{font:900 clamp(34px,6vw,48px)/1 var(--font);letter-spacing:-.035em}
.cmp .side .cl{font:700 15px/1.25 var(--font)}
.cmp .side .cc{font-size:13px;color:var(--muted)}
.cmp .vs{align-self:center;display:grid;place-items:center;width:38px;height:38px;border-radius:50%;background:var(--ink);color:var(--surface);font:800 13px var(--font);text-transform:uppercase}
@media (max-width:520px){.cmp{grid-template-columns:minmax(0,1fr)}.cmp .vs{justify-self:center}}

/* step strip / funnel */
.strip{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(0,1fr);gap:26px;margin:0;padding:0;list-style:none}
.strip li{position:relative;display:flex;flex-direction:column;align-items:center;text-align:center;gap:4px;padding:12px 8px;border-radius:14px;background:var(--ks);border:1px solid var(--line)}
.strip li + li::before{content:"→";position:absolute;left:-22px;top:50%;margin-top:-12px;width:18px;text-align:center;font:800 18px/24px system-ui,"Segoe UI Symbol",sans-serif;color:var(--muted)}
.strip li > svg{width:28px;height:28px;color:var(--k)}
.strip li b{font:900 clamp(22px,4vw,30px)/1.05 var(--font);letter-spacing:-.025em;color:var(--ink)}
.strip li span{font-size:13.5px;line-height:1.3;color:var(--muted)}
@media (max-width:600px){.strip{grid-auto-flow:row;gap:24px}.strip li + li::before{content:"\2193";left:50%;top:-23px;margin:0 0 0 -9px}}

/* did you know + quote */
.dyk{display:grid;grid-template-columns:44px minmax(0,1fr);gap:14px;align-items:start;padding:16px 18px;border-radius:18px;border:2px dashed var(--k);background:var(--ks)}
.dyk > svg{width:44px;height:44px;padding:9px;border-radius:50%;background:var(--k);color:var(--on-accent)}
.dyk b{display:block;margin-bottom:2px;font:800 13px/1.3 var(--font);letter-spacing:.08em;text-transform:uppercase;color:var(--k)}
.dyk p{font:600 18px/1.35 var(--font)}
.dyk p .ig-n{font-weight:900}
.quote{margin:0;padding:6px 6px 6px 20px;border-left:5px solid var(--k);font:700 clamp(19px,3.4vw,24px)/1.3 var(--font);letter-spacing:-.01em}
.quote cite{display:block;margin-top:6px;font:400 14px/1.3 var(--font);color:var(--muted);font-style:normal}

/* sources */
.pn.sources{--k:var(--muted);--ks:var(--zone);background:var(--bg);border-top-color:var(--muted);box-shadow:none}
.src-list{margin:0;padding:0 0 0 24px;font-size:14px;line-height:1.45;color:var(--muted)}
.src-list li{margin:6px 0;padding-left:2px}
.src-list li:target{background:var(--c3-soft);border-radius:6px}
.src-list b{color:var(--ink)}
.src-list a{color:var(--c1);overflow-wrap:anywhere}
.pn.sources .note{margin:14px 0 0;padding-top:12px;font-size:13.5px}
.ig-err{padding:10px 12px;border:1.5px dashed var(--c4);border-radius:10px;color:var(--c4);font-weight:700}

/* motion: only when the script says a panel scrolled into view; never for print or reduced motion */
@keyframes grow{from{width:0}}
@keyframes flex-in{from{flex-grow:0;flex-basis:0}}
@keyframes seg{from{stroke-dasharray:0 var(--C)}}
@keyframes pop{from{opacity:0;transform:scale(.4)}}
.go .b-t i{animation:grow .9s cubic-bezier(.2,.7,.2,1) both}
.go .stk i{animation:flex-in .9s cubic-bezier(.2,.7,.2,1) both}
.go .dn-fig .seg{animation:seg 1s cubic-bezier(.2,.7,.2,1) both}
.go .pic-g svg{transform-origin:center;animation:pop .35s ease-out both;animation-delay:calc(var(--i) * 28ms)}
@media (prefers-reduced-motion:reduce){.go *{animation:none!important}}

/* ===== Handwritten notebook style: <div class="ig" data-style="handwritten"> (only when the user asks) ===== */
:root.hand.hand{
  --bg:#e9e4d8; --surface:#fdfbf4; --ink:#1f3a93; --muted:#4a5a8a; --line:#9fb7d6; --zone:#f3eedf;
  --c1:#1f3a93; --c1-soft:rgba(64,196,255,.30);  --c2:#1e8449; --c2-soft:rgba(118,255,3,.32);
  --c3:#b9770e; --c3-soft:rgba(255,235,59,.60);  --c4:#c0392b; --c4-soft:rgba(255,128,171,.40);

}
.hand body::before{display:none}

  background:linear-gradient(90deg,transparent 62px,#e8a0a0 62px,#e8a0a0 64px,transparent 64px),

.hand .eyebrow{background:none;border:0;padding:0;font:700 22px/1 var(--title);letter-spacing:0;text-transform:none;color:var(--c4)}
.hand .eyebrow::before{display:none}
.hand h1{font-family:var(--title);font-size:clamp(44px,7vw,68px);font-weight:700;letter-spacing:0;color:#222;transform:rotate(-1deg);transform-origin:left}
.hand h1 .accent{color:inherit;-webkit-background-clip:border-box;background-clip:border-box;
  background:linear-gradient(transparent 58%,var(--c3-soft) 58%,var(--c3-soft) 92%,transparent 92%)}

.hand .pn.hero{background:var(--surface)}

.hand .hero .hn .u{font-family:var(--title);font-size:clamp(28px,5vw,40px);background:none}

@media print{
  .hand body{background:#fff}

  .hand .b-t{height:10pt;border-width:1pt}
  .hand .dn-c b{font-size:22pt}
  .hand .pic-l{font-size:14pt}
  .hand .quote{font-size:14pt}
  .hand .dyk{box-shadow:none;transform:none;background:none}
  .hand .dyk b{font-size:13pt}
  .hand .vs{font-size:11pt}
}

<!-- Shared defs: gradients, shadow, arrowheads, icon library. Icons: a use element pointing at an i-* symbol id, e.g. i-sun (see SKILL.md) -->

  <linearGradient id="rise-c1" x1="0" y1="1" x2="0" y2="0"><stop offset="0" style="stop-color:var(--c1-soft)"/><stop offset="1" style="stop-color:var(--c1-soft);stop-opacity:.2"/></linearGradient>
  <linearGradient id="rise-c2" x1="0" y1="1" x2="0" y2="0"><stop offset="0" style="stop-color:var(--c2-soft)"/><stop offset="1" style="stop-color:var(--c2-soft);stop-opacity:.2"/></linearGradient>
  <linearGradient id="rise-c3" x1="0" y1="1" x2="0" y2="0"><stop offset="0" style="stop-color:var(--c3-soft)"/><stop offset="1" style="stop-color:var(--c3-soft);stop-opacity:.2"/></linearGradient>
  <linearGradient id="rise-c4" x1="0" y1="1" x2="0" y2="0"><stop offset="0" style="stop-color:var(--c4-soft)"/><stop offset="1" style="stop-color:var(--c4-soft);stop-opacity:.2"/></linearGradient>
  <linearGradient id="rise-c5" x1="0" y1="1" x2="0" y2="0"><stop offset="0" style="stop-color:var(--c5-soft)"/><stop offset="1" style="stop-color:var(--c5-soft);stop-opacity:.2"/></linearGradient>
  <!-- arrowheads: one per colour (markers don't inherit the path colour) -->
  <marker id="arr"    viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1 L9 5 L1 9 z" style="fill:var(--muted)"/></marker>
  <marker id="arr-c1" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1 L9 5 L1 9 z" style="fill:var(--c1)"/></marker>
  <marker id="arr-c2" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1 L9 5 L1 9 z" style="fill:var(--c2)"/></marker>
  <marker id="arr-c3" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1 L9 5 L1 9 z" style="fill:var(--c3)"/></marker>
  <marker id="arr-c4" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1 L9 5 L1 9 z" style="fill:var(--c4)"/></marker>
  <marker id="arr-c5" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1 L9 5 L1 9 z" style="fill:var(--c5)"/></marker>

<script>
/* ===== Infographic script =====
   Draws the charts from data attributes (agents write data, not SVG) and counts the big numbers up when a panel scrolls into view.
   - .ig-bars    data-values='[["Asia",2.9],["Europe",0.7,"c2"]]'  data-unit=" bn"  [data-pre="$"] [data-dec=1] [data-max=5] [data-color=c1]
   - .ig-stack   data-values='[["Ice",68.7,"c1"],["Ground",30.1,"c2"]]' data-unit="%" [data-total=100]   (one bar split in parts + legend)
   - .ig-donut   data-values='[["Farming",71,"c2"],["Industry",15,"c3"]]' data-unit="%" data-center="71%" data-center-label="farming"
   - .ig-ring    data-value="96.5" data-total="100" data-unit="%" data-label="in the oceans" [data-color=c1]   (one share)
   - .ig-picto   data-total="10" data-filled="7" data-icon="drop" data-label="7 in 10 ..." [data-color=c1] [data-size=small|big]
   - .ig-n       data-count="2.1" [data-dec=1] [data-pre="~"] [data-suf="%"]  — the written text IS the final value; it counts up from 0.
   Every chart also gets a visually hidden table. Nothing is animated for reduced-motion or print.
   <div class="ig" data-style="handwritten"> turns on the notebook look and loads the two handwriting fonts.
   Exposes window.__igReady / __igErrors for the validator. No dependencies. */
(() => {
  const errors = window.__igErrors = [];
  const root = document.documentElement, ig = document.querySelector('.ig');
  const hand = !!ig && /hand/i.test(ig.dataset.style || '');
  if (hand) root.classList.add('hand');
  const fontsReady = !hand ? Promise.resolve() : new Promise(res => {
    const l = document.createElement('link'); l.rel = 'stylesheet';
    l.href = 'https://fonts.googleapis.com/css2?family=Caveat:wght@400;700&family=Kalam:wght@400;700&display=swap';
    l.onload = () => Promise.all(['400 16px Kalam', '700 16px Kalam', '700 32px Caveat'].map(f => document.fonts.load(f))).catch(() => {}).then(res);
    l.onerror = res; document.head.appendChild(l);
    setTimeout(res, 2500);                      // offline: carry on with the fallback font
  });
  window.__igReady = fontsReady;
  if (!ig) { errors.push('no .ig container found'); return; }

  const NS = 'http://www.w3.org/2000/svg', COLORS = ['c1', 'c2', 'c3', 'c4', 'c5', 'muted'];
  const el = (tag, cls, text) => { const e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = text; return e; };
  const decOf = n => (String(n).split('.')[1] || '').length;
  const fmt = (v, dec, pre = '', suf = '') => pre + v.toLocaleString('en-US', { minimumFractionDigits: dec, maximumFractionDigits: dec }) + suf;
  const fail = (box, msg) => { errors.push(msg); box.textContent = ''; box.appendChild(el('p', 'ig-err', 'Chart problem: ' + msg)); };
  const colorOf = (c, i, dflt) => COLORS.includes(c) ? c : (dflt || COLORS[i % 5]);
  const parseVals = (box, need) => {
    let v;
    try { v = JSON.parse(box.dataset.values); } catch (e) { fail(box, 'data-values is not valid JSON (' + e.message + ')'); return null; }
    if (!Array.isArray(v) || !v.length || v.some(r => !Array.isArray(r) || typeof r[0] !== 'string' || typeof r[1] !== 'number' || !isFinite(r[1]) || r[1] < 0)) {
      fail(box, 'data-values must be a list of [label, number] pairs (numbers 0 or more)'); return null;
    }
    if (need && v.length > need) { fail(box, 'too many values (' + v.length + ', max ' + need + ')'); return null; }
    return v;
  };
  const hiddenTable = (box, title, rows) => {
    const t = el('table', 'vh'); t.appendChild(el('caption', null, title));
    rows.forEach(r => { const tr = el('tr'); tr.appendChild(el('th', null, r[0])); tr.appendChild(el('td', null, r[1])); t.appendChild(tr); });
    box.appendChild(t);
  };
  const countEl = (cls, v, dec, pre, suf) => { const b = el('b', 'ig-n ' + cls, fmt(v, dec, pre, suf)); b.dataset.count = v; b.dataset.dec = dec; if (pre) b.dataset.pre = pre; if (suf) b.dataset.suf = suf; return b; };
  const legend = (items, unit, dec, pre) => {
    const ul = el('ul', 'lg');
    items.forEach(it => { const li = el('li', it.c); li.appendChild(el('span', 'sw2')); const s = el('span'); s.appendChild(document.createTextNode(it.l + ' ')); s.appendChild(el('b', null, fmt(it.v, dec, pre, unit))); li.appendChild(s); ul.appendChild(li); });
    return ul;
  };

  /* ---- bars ---- */
  document.querySelectorAll('.ig-bars').forEach(box => {
    const v = parseVals(box, 14); if (!v) return;
    const unit = box.dataset.unit || '', pre = box.dataset.pre || '';
    const dec = box.dataset.dec != null ? +box.dataset.dec : Math.max(...v.map(r => decOf(r[1])));
    const max = +box.dataset.max || Math.max(...v.map(r => r[1])) || 1, base = colorOf(box.dataset.color, 0, 'c1');
    const vis = el('div', 'ig-bars-v'); vis.setAttribute('aria-hidden', 'true'); vis.style.display = 'grid'; vis.style.gap = 'inherit';
    v.forEach(r => {
      const row = el('div', 'b-row ' + colorOf(r[2], 0, base)); row.appendChild(el('span', 'b-l', r[0]));
      const t = el('span', 'b-t'), i = el('i'); i.style.setProperty('--w', Math.max(0, Math.min(100, r[1] / max * 100)).toFixed(2) + '%'); t.appendChild(i); row.appendChild(t);
      row.appendChild(el('span', 'b-v', fmt(r[1], dec, pre, unit))); vis.appendChild(row);
    });
    box.textContent = ''; box.setAttribute('role', 'group'); box.setAttribute('aria-label', box.dataset.title || 'Bar chart');
    box.append(vis); hiddenTable(box, box.dataset.title || 'Bar chart', v.map(r => [r[0], fmt(r[1], dec, pre, unit)]));
  });

  /* ---- stacked bar ---- */
  document.querySelectorAll('.ig-stack').forEach(box => {
    const v = parseVals(box, 8); if (!v) return;
    const unit = box.dataset.unit || '', pre = box.dataset.pre || '', dec = Math.max(...v.map(r => decOf(r[1])));
    const sum = v.reduce((s, r) => s + r[1], 0), total = +box.dataset.total || sum;
    if (sum > total * 1.005) { fail(box, 'the parts add up to ' + sum + ', more than the total ' + total); return; }
    const bar = el('div', 'stk'); bar.setAttribute('aria-hidden', 'true');
    const items = v.map((r, i) => ({ l: r[0], v: r[1], c: colorOf(r[2], i) }));
    items.forEach(it => { const s = el('i', it.c); s.style.setProperty('--w', (it.v / total * 100).toFixed(3)); if (it.v / total >= 0.12) s.textContent = fmt(it.v, dec, pre, unit); bar.appendChild(s); });
    const lg = legend(items, unit, dec, pre); lg.setAttribute('aria-hidden', 'true');
    box.textContent = ''; box.setAttribute('role', 'group'); box.setAttribute('aria-label', box.dataset.title || 'Stacked bar');
    box.append(bar, lg); hiddenTable(box, box.dataset.title || 'Stacked bar', v.map(r => [r[0], fmt(r[1], dec, pre, unit)]));
  });

  /* ---- donut and ring ---- */
  const donut = (box, items, total, center, centerLabel, unit, dec, pre, withLegend, title) => {
    const R = 48, C = 2 * Math.PI * R, fig = el('div', 'dn-fig'); fig.setAttribute('aria-hidden', 'true');
    const svg = document.createElementNS(NS, 'svg'); svg.setAttribute('viewBox', '0 0 120 120');
    const trk = document.createElementNS(NS, 'circle'); trk.setAttribute('class', 'trk'); trk.setAttribute('cx', 60); trk.setAttribute('cy', 60); trk.setAttribute('r', R); svg.appendChild(trk);
    let acc = 0;
    items.forEach(it => {
      const len = Math.max(0, it.v / total * C), c = document.createElementNS(NS, 'circle');
      c.setAttribute('class', 'seg ' + it.c); c.setAttribute('cx', 60); c.setAttribute('cy', 60); c.setAttribute('r', R);
      c.setAttribute('stroke-dasharray', len.toFixed(2) + ' ' + (C - len).toFixed(2)); c.setAttribute('stroke-dashoffset', (-acc).toFixed(2)); c.style.setProperty('--C', C.toFixed(2));
      svg.appendChild(c); acc += len;
    });
    fig.appendChild(svg);
    const cen = el('div', 'dn-c');
    if (center) {
      const m = String(center).match(/^(\D*)(-?[\d,]*\.?\d+)(\D*)$/);
      if (m) cen.appendChild(countEl(items[0].c, parseFloat(m[2].replace(/,/g, '')), decOf(m[2]), m[1], m[3])); else cen.appendChild(el('b', null, center));
      if (centerLabel) cen.appendChild(el('small', null, centerLabel));
    }
    fig.appendChild(cen);
    const wrap = el('div', 'dn'); wrap.appendChild(fig);
    if (withLegend) { const lg = legend(items, unit, dec, pre); lg.setAttribute('aria-hidden', 'true'); wrap.appendChild(lg); }
    box.textContent = ''; box.setAttribute('role', 'group'); box.setAttribute('aria-label', title);
    box.appendChild(wrap);
    hiddenTable(box, title, items.map(it => [it.l, fmt(it.v, dec, pre, unit)]));
  };
  document.querySelectorAll('.ig-donut').forEach(box => {
    const v = parseVals(box, 6); if (!v) return;
    const unit = box.dataset.unit || '', pre = box.dataset.pre || '', dec = Math.max(...v.map(r => decOf(r[1])));
    const sum = v.reduce((s, r) => s + r[1], 0), total = +box.dataset.total || sum;
    if (sum > total * 1.005) { fail(box, 'the parts add up to ' + sum + ', more than the total ' + total); return; }
    donut(box, v.map((r, i) => ({ l: r[0], v: r[1], c: colorOf(r[2], i) })), total, box.dataset.center, box.dataset.centerLabel, unit, dec, pre, true, box.dataset.title || 'Donut chart');
  });
  document.querySelectorAll('.ig-ring').forEach(box => {
    const val = parseFloat(box.dataset.value), total = parseFloat(box.dataset.total || '100');
    if (!isFinite(val) || val < 0 || !isFinite(total) || total <= 0 || val > total) { fail(box, 'data-value must be a number between 0 and data-total'); return; }
    const unit = box.dataset.unit || '', pre = box.dataset.pre || '', dec = decOf(box.dataset.value), label = box.dataset.label || '';
    donut(box, [{ l: label || 'Share', v: val, c: colorOf(box.dataset.color, 0, 'c1') }], total, fmt(val, dec, pre, unit), label, unit, dec, pre, false, (box.dataset.title || label || 'Share') + ': ' + fmt(val, dec, pre, unit));
  });

  /* ---- pictogram ---- */
  document.querySelectorAll('.ig-picto').forEach(box => {
    const total = parseInt(box.dataset.total, 10), filled = parseFloat(box.dataset.filled), icon = box.dataset.icon || 'user';
    if (!(total >= 1 && total <= 100) || !(filled >= 0 && filled <= total) || filled !== Math.floor(filled)) { fail(box, 'data-total must be 1-100 and data-filled a whole number from 0 to data-total'); return; }
    if (!document.getElementById('i-' + icon)) { fail(box, 'unknown icon "' + icon + '"'); return; }
    const c = colorOf(box.dataset.color, 0, 'c1'), size = box.dataset.size || (total > 40 ? 'small' : total > 12 ? '' : 'big');
    const g = el('div', 'pic-g ' + size + ' ' + c); g.setAttribute('aria-hidden', 'true');
    g.style.setProperty('--cols', box.dataset.cols || (total <= 12 ? total : total <= 20 ? 10 : 10));
    if (size === 'small') { g.style.setProperty('--ps', '20px'); g.style.setProperty('--pg', '4px'); } else if (size === 'big') { g.style.setProperty('--ps', '42px'); g.style.setProperty('--pg', '8px'); }
    for (let i = 0; i < total; i++) {
      const s = document.createElementNS(NS, 'svg'); s.setAttribute('viewBox', '0 0 24 24'); if (i < filled) s.setAttribute('class', 'on');
      s.style.setProperty('--i', i);
      const u = document.createElementNS(NS, 'use'); u.setAttribute('href', '#i-' + icon); s.appendChild(u); g.appendChild(s);
    }
    const lab = el('p', 'pic-l ' + c); const main = box.dataset.label || (filled + ' in ' + total);
    lab.appendChild(document.createTextNode(main)); if (box.dataset.note) lab.appendChild(el('small', null, box.dataset.note));
    const wrap = el('div', 'pic'); wrap.append(g, lab);
    box.textContent = ''; box.setAttribute('role', 'img'); box.setAttribute('aria-label', filled + ' of ' + total + ' highlighted: ' + main);
    box.appendChild(wrap);
  });

  /* ---- count-up + motion when a panel scrolls into view ---- */
  const reduce = window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches;
  const countUp = n => {
    const to = parseFloat(n.dataset.count), dec = +n.dataset.dec || 0, pre = n.dataset.pre || '', suf = n.dataset.suf || '';
    if (!isFinite(to)) return;
    const t0 = performance.now(), D = 1100;
    n.textContent = fmt(0, dec, pre, suf);
    const step = t => {
      const p = Math.min(1, (t - t0) / D), e = 1 - Math.pow(1 - p, 3);
      n.textContent = p < 1 ? fmt(to * e, dec, pre, suf) : fmt(to, dec, pre, suf);
      if (p < 1) requestAnimationFrame(step);
    };
    requestAnimationFrame(step);
  };
  const start = p => { p.classList.add('go'); p.querySelectorAll('.ig-n[data-count]').forEach(countUp); };
  const panels = [...ig.querySelectorAll('.pn')];
  if (!reduce && 'IntersectionObserver' in window) {
    const io = new IntersectionObserver(es => es.forEach(e => { if (e.isIntersecting) { io.unobserve(e.target); start(e.target); } }), { threshold: 0.2 });
    panels.forEach(p => io.observe(p));
  }
})();
</script>
</body>
</html>
